ed volatility has usually exceeded the implied volatility priced into options","Implied volatility has tended to exceed subsequently realized volatility (volatility risk premium)","Options are always underpriced by the market, so option sellers receive an excess premium","Delta hedging is free of transaction costs, so the hedged option seller bears no risk"],"a":1,"e":"Option sellers earn the volatility risk premium on average, but face large losses when volatility spikes, giving negatively skewed returns."},{"id":"HF032","t":"HF","r":"6.4.5","k":"c","q":"A variance swap pays the holder of the long position:","o":["The difference between realized variance and the strike variance, times a notional","A fixed coupon set at inception, regardless of how volatile the underlying asset turns out to be","The dividend yield of the underlying asset over the life of the swap, times a notional","A payment only if the underlying stock falls below the strike level at maturity"],"a":0,"e":"A long variance swap pays (realized variance − strike variance) × variance notional, providing pure exposure to realized volatility."},{"id":"HF033","t":"HF","r":"6.4.6","k":"c","q":"Fixed-income arbitrage trades often involve:","o":["Directional bets on equity indices using futures, with little exposure to interest rates","Leveraged bets on small mispricings between related instruments, e.g. on-the-run vs off-the-run Treasuries","Buying physical gold and shorting gold mining equities to capture the commodity basis","Investing in early-stage startups through convertible notes issued by venture capital funds"],"a":1,"e":"Examples include on-the-run/off-the-run trades, yield curve trades, swap spread trades and basis trades, generally leveraged convergence bets."},{"id":"HF034","t":"HF","r":"6.4.6","k":"c","q":"In an on-the-run versus off-the-run Treasury trade, the arbitrageur typically:","o":["Buys the more expensive on-the-run bond and shorts the cheaper off-the-run bond, expecting the spread to widen","Buys the cheaper off-the-run bond and shorts the more expensive on-the-run bond, expecting the liquidity premium to converge","Buys both bonds outright, expecting yields on all Treasuries to fall over the holding period","Shorts both bonds, expecting a rise in Treasury yields after the next auction"],"a":1,"e":"On-the-run bonds are more liquid and trade at a premium; the trade bets that the spread narrows as the on-the-run issue ages."},{"id":"HF035","t":"HF","r":"6.4.7","k":"c","q":"What is a major risk for relative value funds during market crises?","o":["Spreads tend to narrow quickly in crises, so convergence trades realize their profits early","Liquidity shocks and widening spreads can force deleveraging and large losses","Volatility usually falls in crises, reducing the hedging costs of relative value positions","Funds accumulate excess cash in crises because lenders increase the leverage available to them"],"a":1,"e":"When liquidity dries up, spreads can widen sharply and lenders cut leverage, forcing sales at the worst time (e.g., LTCM in 1998)."},{"id":"HF036","t":"HF","r":"6.5.1","k":"c","q":"What do equity hedge fund strategies have in common?","o":["They hold only long positions in equities and rely on cash to reduce market exposure","They take long and short positions primarily in equities, with varying net exposures","They never use leverage and always keep net market exposure at exactly zero","They invest primarily in fixed income and use equities only for hedging purposes"],"a":1,"e":"Equity hedge strategies (short bias, long/short, market neutral) are distinguished largely by their net market exposure and use of short selling."},{"id":"HF037","t":"HF","r":"6.5.2","k":"c","q":"The return of an equity long/short fund can be decomposed into:","o":["Only market beta, since stock selection effects cancel out between long and short positions","A beta component from net market exposure plus alpha from stock selection on longs and shorts","Only interest income earned on the cash proceeds from short sales","Only dividends received on long positions minus dividends paid on short positions"],"a":1,"e":"Long/short funds earn returns from net market exposure (beta) and from security selection (alpha), plus interest on short proceeds."},{"id":"HF038","t":"HF","r":"6.5.3","k":"c","q":"Which is an example of a well-documented equity market anomaly exploited by hedge funds?","o":["The risk-free rate earned on cash collateral held against short positions","Momentum, value, or post-earnings-announcement drift","Put-call parity between listed options and the underlying stock","The time value of money reflected in discounting future cash flows"],"a":1,"e":"Anomalies such as value, momentum, size, accruals and post-earnings-announcement drift have been documented and used by quantitative equity managers."},{"id":"HF039","t":"HF","r":"6.5.4","k":"c","q":"A key challenge when implementing anomaly-based strategies is that:","o":["Anomalies never persist beyond a few days, so they can only be traded at high frequency","Returns may decline after publication and trading costs, crowding and shorting constraints can erode profits","Anomaly strategies require no data or models, so many managers can implement them cheaply","Anomaly strategies are risk-free once published, since their returns are fully explained by beta"],"a":1,"e":"Published anomalies often weaken as capital arrives; costs, capacity and short-sale constraints further reduce implementable returns."},{"id":"HF040","t":"HF","r":"6.5.5","k":"c","q":"Why might equity hedge funds short stocks in addition to hedging market exposure?","o":["To increase the fund's beta and leverage its exposure to rising equity markets","To express negative views on overvalued companies and earn alpha from identifying losers","Because short positions offer unlimited upside while their potential losses are capped","To avoid paying borrowing costs, since short sellers receive interest from stock lenders"],"a":1,"e":"Shorts serve both as hedges and as alpha sources by targeting overvalued firms, accounting problems or deteriorating fundamentals."},{"id":"HF041","t":"HF","r":"6.5.6","k":"c","q":"Which are the three major types of equity hedge funds discussed in the curriculum?","o":["Short-bias, equity long/short, and equity market neutral","Merger arbitrage, activist, distressed","Global macro, CTA, volatility","Convertible, fixed income, volatility arbitrage"],"a":0,"e":"The three equity strategies are short-bias funds, equity long/short funds and equity market-neutral funds, framed in the CAPM context."},{"id":"HF042","t":"HF","r":"6.5.6","k":"c","q":"An equity market-neutral fund that targets 'beta neutrality' aims to:","o":["Hold equal dollar amounts long and short regardless of the betas of the positions","Set the portfolio's overall beta to approximately zero so returns are independent of market moves","Maintain a beta of about one so that the fund tracks the market with lower volatility","Avoid any short selling, using only cash to reduce the portfolio's market exposure"],"a":1,"e":"Market-neutral funds aim for zero beta (and sometimes dollar, sector or factor neutrality) so that performance comes from stock selection."},{"id":"HF043","t":"HF","r":"6.5.6","k":"c","q":"Historically, short-bias hedge funds have tended to:","o":["Earn high returns in bull markets, because their long positions are levered several times","Have negative beta, performing well in bear markets but generally poorly over long periods with rising markets","Have zero correlation with equities, since their returns come only from interest on cash","Show positive beta, rising with the market but with lower volatility than long-only funds"],"a":1,"e":"Short-bias funds provide negative equity exposure; they can hedge crashes but have struggled over long periods given the positive equity risk premium."},{"id":"HF044","t":"HF","r":"6.5.6","k":"c","q":"The 'uptick rule' restricts:","o":["Buying stocks after a price decrease, to prevent investors from accelerating market rebounds","Short selling unless the last price change was an increase (or under certain price decline conditions)","Margin borrowing by investors whose accounts fall below the maintenance requirement","Dividend payments by companies whose share price has fallen for several consecutive days"],"a":1,"e":"Uptick rules limit short selling in falling markets, intended to reduce downward price pressure from short sellers."},{"id":"HF045","t":"HF","r":"6.5.6","k":"n","q":"A long/short equity fund is long $150 million of stocks with an average beta of 1.2 and short $100 million with an average beta of 1.0, with $100 million of capital. What is the fund's approximate net beta?","o":["0.20","0.50","0.80","1.80"],"a":2,"e":"Beta-weighted exposure = (150 × 1.2 − 100 × 1.0) / 100 = (180 − 100) / 100 = 0.80."},{"id":"HF046","t":"HF","r":"6.1.6","k":"c","q":"Research on hedge funds' impact on financial markets generally suggests they:","o":["Have no measurable effect on prices, because their trades are too small relative to market volume","Can improve price discovery and liquidity, but can also amplify stress when they deleverage","Always destabilize markets, since their short selling consistently drives prices below fair value","Only trade in private markets, so they have no impact on public price discovery or liquidity"],"a":1,"e":"Hedge funds often provide liquidity and correct mispricing, but crowded trades and forced deleveraging can exacerbate stress."},{"id":"HF047","t":"HF","r":"6.2.6","k":"c","q":"Which is a core dimension along which managed futures strategies differ?","o":["Data used (price vs fundamental), trading horizon, and degree of systematization","Whether they hold real estate assets directly or through listed REIT shares","Whether they pay dividends to investors or reinvest trading profits in the fund","Their tax status as REITs, MLPs or C corporations under US law"],"a":0,"e":"Strategies differ in data inputs (technical vs fundamental), time horizon (short to long-term), discretionary versus systematic implementation and markets traded."},{"id":"HF048","t":"HF","r":"6.2.9","k":"c","q":"Empirical evidence on managed futures returns has generally shown:","o":["Very high correlation with equities, so they add little diversification to a stock portfolio","Low correlation with stocks and bonds and relatively strong performance in some extended equity drawdowns","Consistently negative returns after fees in every decade since the 1980s","Returns identical to those of long-only commodity indices such as the S&P GSCI"],"a":1,"e":"Managed futures have historically offered diversification, though returns vary substantially over time and across managers."},{"id":"HF049","t":"HF","r":"6.1.3","k":"c","q":"Arbitrage-free pricing models are useful to hedge fund managers mainly because they:","o":["They predict the future direction of markets, allowing managers to time their exposure","Identify relative mispricings between related securities that should be eliminated by arbitrage","They guarantee riskless profits regardless of transaction costs, funding or margin constraints","They replace the need for risk management, since arbitrage positions carry no risk"],"a":1,"e":"No-arbitrage relationships (e.g., put-call parity, cost of carry) define relative values; deviations signal trading opportunities, subject to costs and limits to arbitrage."},{"id":"HF050","t":"HF","r":"6.4.4","k":"c","q":"Implied volatility is:","o":["The historical standard deviation of the underlying asset's returns over the past year","The volatility that, when entered into an option pricing model, gives the observed market price","A volatility level that is always lower than subsequently realized volatility","A single volatility that is constant across all strikes and maturities for a given asset"],"a":1,"e":"Implied volatility is backed out from option prices. It often varies across strikes (skew/smile) and maturities."},{"id":"HF051","t":"HF","r":"6.1.4","k":"c","q":"Which statement about hedge fund return distributions is generally correct?","o":["They are normally distributed, so standard deviation fully captures their risk","Many show negative skew and excess kurtosis, so standard deviation may understate risk","They always have positive skewness, because managers cut losses quickly","They show no autocorrelation, even for strategies holding illiquid assets"],"a":1,"e":"Strategies like merger arbitrage, credit and relative value often show negative skew and fat tails; illiquid strategies show autocorrelation."},{"id":"HF052","t":"HF","r":"6.3.5","k":"c","q":"A distressed fund that buys the bonds of a company expected to emerge from Chapter 11 and receive new equity is betting mainly on:","o":["A decline in interest rates that raises the value of all fixed-rate bonds","The outcome of the restructuring and the post-reorganization value of the company","Favorable currency movements that increase the value of foreign-denominated claims","A rally in broad equity indices, independent of the company's restructuring"],"a":1,"e":"Returns depend on the recovery value and the terms of reorganization; the bonds may be converted into equity of the reorganized company."},{"id":"DA001","t":"DA","r":"7.1.1","k":"c","q":"What is the main property that blockchains provide on a decentralized network?","o":["Centralized control by a trusted operator who can reverse transactions when needed","Trustless immutability, where no single entity can take full control of the system","Guaranteed price stability of the native token through algorithmic monetary policy","Anonymous central banking, where a hidden authority sets interest rates for users"],"a":1,"e":"Blockchains provide trustless immutability on decentralized networks of nodes, so records cannot be altered by a single party."},{"id":"DA002","t":"DA","r":"7.1.1","k":"c","q":"A permissioned blockchain differs from a public blockchain in that:","o":["Anyone can join, read the ledger and validate transactions without permission","Participation rights are granted or revoked by a central party or consortium","It has no shared ledger, as each participant keeps an independent private database","It cannot run smart contracts, since code execution requires a public network"],"a":1,"e":"Permissioned blockchains restrict participation and are mainly used in enterprise settings where operators require more control."},{"id":"DA003","t":"DA","r":"7.1.1","k":"c","q":"Bitcoin's Proof of Work consensus mechanism secures the network by requiring miners to:","o":["Lock up tokens as collateral, which can be slashed if they validate invalid blocks","Expend computational effort to find a valid hash for a new block","Obtain approval from a central bank before adding each new block of transactions","Vote on each transaction, with the majority of registered users deciding which block is valid"],"a":1,"e":"In PoW, miners compete to solve a computationally costly hashing puzzle (SHA-256 for Bitcoin); the winner adds the block and earns the reward."},{"id":"DA004","t":"DA","r":"7.1.2","k":"c","q":"A smart contract is best described as:","o":["A legal contract signed electronically and enforced by courts in the event of a dispute","Self-executing code on a blockchain that runs automatically when predefined conditions are met","A paper contract stored by a bank that holds the assets until both parties perform","A futures contract on a cryptocurrency traded on a regulated derivatives exchange"],"a":1,"e":"Smart contracts are programs deployed on blockchains (e.g., Ethereum) that execute automatically, enabling DeFi applications without intermediaries."},{"id":"DA005","t":"DA","r":"7.1.3","k":"c","q":"What is the maximum supply of bitcoin?","o":["Unlimited","18 million","21 million","100 million"],"a":2,"e":"Bitcoin's monetary policy fixes total supply at 21 million coins, released gradually through block rewards."},{"id":"DA006","t":"DA","r":"7.1.3","k":"c","q":"How often does the Bitcoin block reward halve?","o":["Every year, on the anniversary of the Bitcoin network's launch in January","Every 210,000 blocks, approximately every four years","Every 1 million blocks, approximately every nineteen years","Whenever miners vote to reduce issuance by a majority of hash power"],"a":1,"e":"The reward halves every 210,000 blocks (~4 years at ~10 minutes per block): 50 → 25 (2012) → 12.5 (2016) → 6.25 (2020) → 3.125 (2024)."},{"id":"DA007","t":"DA","r":"7.1.4","k":"c","q":"Ether (ETH) is the native token of Ethereum. Tokens such as ERC-20 stablecoins are called 'non-native' because they:","o":["Exist on another blockchain and are bridged to Ethereum only when they are traded","Are deployed as smart contracts, with balances stored in the contract's data","Have no market value, since only native tokens can be used as a medium of exchange","Cannot be transferred between wallets without the approval of the Ethereum Foundation"],"a":1,"e":"Native tokens are built into the protocol (used, e.g., to pay gas). Non-native tokens are created by smart contracts on top of the chain (ERC-20, ERC-721)."},{"id":"DA008","t":"DA","r":"7.1.4","k":"c","q":"ERC-20 and ERC-721 are standards for, respectively:","o":["Non-fungible and fungible tokens","Fungible tokens and non-fungible tokens (NFTs)","Stablecoins and Bitcoin","Mining and staking"],"a":1,"e":"ERC-20 defines fungible tokens (each unit identical); ERC-721 defines non-fungible tokens with unique identifiers."},{"id":"DA009","t":"DA","r":"7.1.4","k":"c","q":"In Ethereum's Proof of Stake consensus mechanism, blocks are validated by:","o":["Miners who solve computational hash puzzles and earn newly issued ETH as a block reward","Validators who stake ETH as collateral and can be penalized (slashed) for misbehavior","The Ethereum Foundation, which approves each block before it is added to the chain","Bitcoin miners, who validate Ethereum blocks through a cross-chain merged mining agreement"],"a":1,"e":"Ethereum moved from PoW to PoS (2022). Validators stake ETH, propose and attest to blocks, earn rewards, and risk slashing, greatly reducing energy use."},{"id":"DA010","t":"DA","r":"7.1.4","k":"c","q":"On Ethereum, 'gas' refers to:","o":["A commodity-backed token whose value is pegged to the price of natural gas","The fee, paid in ETH (quoted in gwei), for computation needed to execute transactions","The fixed block reward paid to validators for each new block that they propose","A stablecoin issued by the Ethereum Foundation to pay for network services"],"a":1,"e":"Gas measures computational effort; users pay gas fees in ETH (denominated in gwei) to have transactions processed."},{"id":"DA011","t":"DA","r":"7.1.5","k":"c","q":"Stablecoins are tokens designed to:","o":["Maximize volatility in order to attract speculative traders to decentralized exchanges","Maintain a stable value, typically pegged to a fiat currency such as the US dollar","Replace all other blockchains by becoming the native token of every network","Pay mining rewards to Bitcoin miners in place of newly issued bitcoins"],"a":1,"e":"Stablecoins peg to assets like the USD, either backed by fiat reserves, by crypto collateral (overcollateralized) or via algorithmic mechanisms."},{"id":"DA012","t":"DA","r":"7.1.6","k":"c","q":"In DeFi, oracles are used to:","o":["Mine new tokens by solving hash puzzles on behalf of decentralized applications","Bring off-chain data (e.g., asset prices) onto the blockchain for smart contracts","Store users' private keys so that lost wallets can be recovered by the protocol","Replace consensus mechanisms by deciding which blocks are added to the chain"],"a":1,"e":"Smart contracts cannot access external data directly; oracle networks feed off-chain information such as prices on-chain."},{"id":"DA013","t":"DA","r":"7.1.6","k":"c","q":"In a DeFi lending protocol, a borrower's position that falls below the required collateralization is typically:","o":["Ignored until the loan matures, at which point the borrower must repay in full","Subject to automatic liquidation, similar to a margin call in traditional finance","Converted automatically into a stablecoin so that the borrower's position becomes riskless","Guaranteed by a central bank, which posts additional collateral on the borrower's behalf"],"a":1,"e":"DeFi loans are overcollateralized; if collateral value falls below a threshold, the position is liquidated by the protocol."},{"id":"DA014","t":"DA","r":"7.2.1","k":"c","q":"Which feature of bitcoin has historically made it potentially attractive for diversified institutional portfolios?","o":["Low volatility and stable returns comparable to those of investment-grade bonds","High returns (with high risk) combined with low correlation to public equities historically","A guaranteed income stream from staking rewards paid by the Bitcoin protocol","Government backing that protects holders against losses in market crises"],"a":1,"e":"Bitcoin has historically delivered high but volatile returns with low correlation to equities, though correlations can rise in stress periods."},{"id":"DA015","t":"DA","r":"7.2.2","k":"c","q":"According to the analysis discussed in the curriculum, what crypto allocation could help maximize risk-adjusted returns for an investor otherwise holding a balanced stock/bond portfolio?","o":["About 0.1%","About 5%","About 25%","About 50%"],"a":1,"e":"The analysis suggests an allocation of roughly 5% could help maximize risk-adjusted returns, while also increasing total portfolio risk."},{"id":"DA016","t":"DA","r":"7.2.2","k":"c","q":"A Monte Carlo approach to modeling a bitcoin allocation within a 60/40 portfolio involves:","o":["Using a single historical scenario, such as the 2020–2021 period, to project returns","Simulating many return paths from assumed distributions to see the range of outcomes","Ignoring volatility and focusing only on average historical returns of bitcoin","Assuming bitcoin returns are constant each year and equal to their historical mean"],"a":1,"e":"Monte Carlo simulation generates many randomized scenarios to evaluate the distribution of outcomes (returns, drawdowns) for different allocations."},{"id":"DA017","t":"DA","r":"7.2.3","k":"c","q":"Which is a key risk specific to digital asset investing?","o":["An absence of volatility, which makes digital assets unsuitable as diversifiers","Custody risk (loss or theft of private keys), smart contract bugs, and regulatory uncertainty","Government deposit insurance, which removes the incentive to monitor custodians","Low technology risk, since blockchain software cannot contain coding errors"],"a":1,"e":"Digital asset investors face custody/key management risk, hacks and smart contract vulnerabilities, regulatory changes, high volatility and market integrity concerns."},{"id":"DA018","t":"DA","r":"7.2.3","k":"c","q":"Why is safekeeping of private keys critical in digital assets?","o":["Private keys can be reset by the blockchain if the owner proves their identity to the network","Whoever controls the private key controls the assets, and lost or stolen keys usually cannot be recovered","Private keys are publicly visible on the blockchain, so safekeeping them is not necessary","Banks hold all private keys on behalf of users and reimburse any assets that are stolen"],"a":1,"e":"Control of the private key equals control of the asset. Institutional investors therefore use qualified custodians, multi-signature or MPC solutions."}];

<script>
"use strict";
/* ---------------- Constants ---------------- */
const TOPICS = [
  {id:'ETH', name:'CAIA Ethical Principles', w:10},
  {id:'ALT', name:'Intro to Alternative Investments', w:24},
  {id:'RA',  name:'Real Assets', w:19},
  {id:'PE',  name:'Private Equity', w:11},
  {id:'PD',  name:'Private Debt', w:13},
  {id:'HF',  name:'Hedge Funds', w:18},
  {id:'DA',  name:'Digital Assets', w:6},
];
const TNAME = Object.fromEntries(TOPICS.map(t=>[t.id,t.name]));
const QTIME = {c:75, a:100, n:150};          // seconds per question by type
const KLABEL = {c:'Concept', a:'Application', n:'Calcul'};
const REVEAL_MS = 8000;                       // reveal pause in synchronized mode
const BYID = Object.fromEntries(BANK.map(q=>[q.id,q]));
const LETTERS = ['A','B','C','D'];

/* ---------------- Utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function perm(seed,qid,n){return shuffle([...Array(n).keys()], mulberry32(seed ^ hashStr(qid)))}
function fmtT(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0')}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ssGet(k,d){try{const v=sessionStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function ssSet(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',ms)}
function rid(n=10){const c='abcdefghijkmnopqrstuvwxyz23456789';let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function points(ok,remainFrac){return ok?Math.round(500+500*Math.max(0,Math.min(1,remainFrac))):0}

/* Build an exam of ~minutes, weighted by CAIA topic weights, grouped by topic like the real exam */
function buildExam(topicIds,minutes,seed){
  const rng=mulberry32(seed), target=minutes*60;
  const sel=TOPICS.filter(t=>topicIds.includes(t.id));
  const wsum=sel.reduce((s,t)=>s+t.w,0);
  const pools={}; sel.forEach(t=>pools[t.id]=shuffle(BANK.filter(q=>q.t===t.id),rng));
  const used={}; sel.forEach(t=>used[t.id]=0);
  const picked=[]; let total=0;
  for(let guard=0;guard<400;guard++){
    let best=null,bestDef=-Infinity;
    for(const t of sel){ if(!pools[t.id].length) continue;
      const def=(t.w/wsum)*(total+90)-used[t.id]; if(def>bestDef){bestDef=def;best=t} }
    if(!best) break;
    const q=pools[best.id][0], d=QTIME[q.k];
    if(total+d>target+20){ // try a shorter question from any topic before stopping
      if(total>=target-40) break;
      const alt=sel.map(t=>pools[t.id].findIndex(x=>total+QTIME[x.k]<=target+20)).findIndex(i=>i>=0);
      if(alt<0) break;
      const t=sel[alt], idx=pools[t.id].findIndex(x=>total+QTIME[x.k]<=target+20);
      const q2=pools[t.id].splice(idx,1)[0]; picked.push(q2); used[t.id]+=QTIME[q2.k]; total+=QTIME[q2.k]; continue;
    }
    pools[best.id].shift(); picked.push(q); used[best.id]+=d; total+=d;
  }
  const order=Object.fromEntries(TOPICS.map((t,i)=>[t.id,i]));
  picked.sort((a,b)=>order[a.t]-order[b.t]);
  return {qids:picked.map(q=>q.id), durs:picked.map(q=>QTIME[q.k]), total};
}

/* ---------------- Realtime backend (Firebase Realtime Database) ---------------- */
const P = {db:null,fb:null,ready:false,off:0};
function NOW(){ return Date.now()+(P.off||0); }
const pid = ssGet('pid',null) || (()=>{const v=rid(12);ssSet('pid',v);return v})();
// encode numeric object keys (Firebase would turn them into arrays)
function enc(v){ if(Array.isArray(v)) return v.map(enc); if(v&&typeof v==='object'){const o={};for(const k in v){ if(v[k]===undefined) continue; o[/^\d+$/.test(k)?'_'+k:k]=enc(v[k]);} return o;} return v; }
function dec(v){ if(Array.isArray(v)) return v.map(dec); if(v&&typeof v==='object'){const o={};for(const k in v){o[/^_\d+$/.test(k)?k.slice(1):k]=dec(v[k]);} return o;} return v; }
function flat(o,pre,out){ out=out||{}; for(const k in o){ const v=o[k], p=pre?pre+'/'+k:k; if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length) flat(v,p,out); else out[p]=v; } return out; }
function makeDb(fdb){
  const snapOf=(id,s)=>({id,exists:s.exists(),data:()=>s.exists()?dec(s.val()):undefined});
  return {
    doc(path){ const id=path.split('/').pop(), ref=fdb.ref(path+'/_d');
      return {
        get:async()=>snapOf(id,await ref.get()),
        set:d=>ref.set(enc(d)),
        update:d=>ref.update(flat(enc(d))),
        onSnapshot(next,err){ const h=s=>next(snapOf(id,s)); ref.on('value',h,e=>err&&err(e)); return ()=>ref.off('value',h); },
        ref
      }; },
    collection(path){ const ref=fdb.ref(path);
      return { onSnapshot(next,err){ const h=s=>{ const docs=[]; s.forEach(c=>{ if(c.child('_d').exists()) docs.push({id:c.key,exists:true,data:()=>dec(c.child('_d').val())}); }); next({docs,size:docs.length,empty:!docs.length}); };
        ref.on('value',h,e=>err&&err(e)); return ()=>ref.off('value',h); } }; }
  };
}
function initPlatform(){
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(window.firebase && cfg && cfg.apiKey && cfg.databaseURL){
      firebase.initializeApp(cfg);
      P.fb=firebase.database(); P.db=makeDb(P.fb);
      P.fb.ref('.info/serverTimeOffset').on('value',s=>{P.off=s.val()||0});
    }
  }catch(e){ console.warn('firebase',e); }
  P.ready=true;
  return Promise.resolve();
}
/* ---------------- App state ---------------- */
const S = {
  view:'home', name:lsGet('caia_name',''),
  // config
  cfg:{mode:'exam', minutes:30, topics:TOPICS.map(t=>t.id), pace:'sync', hostPlays:true},
  // solo
  solo:null,
  // multiplayer
  mp:null,
  bank:{topic:'ALL', q:'', show:{}},
};

function setView(v){S.view=v;render();window.scrollTo(0,0)}
$('#homeLink').onclick=()=>{ if(S.mp && S.mp.code && !confirm2()) return; leaveMp(); S.solo=null; setView('home') };
function confirm2(){ return true }

/* ---------------- Rendering ---------------- */
function render(){
  $('#who').innerHTML = S.name ? `<span class="pill">👤 ${esc(S.name)}</span>` : '';
  const v=S.view, app=$('#app');
  if(v==='home') app.innerHTML=viewHome();
  else if(v==='setup') app.innerHTML=viewSetup();
  else if(v==='join') app.innerHTML=viewJoin();
  else if(v==='solo') app.innerHTML=viewSolo();
  else if(v==='soloResult') app.innerHTML=viewSoloResult();
  else if(v==='lobby') app.innerHTML=viewLobby();
  else if(v==='game') app.innerHTML=viewGame();
  else if(v==='final') app.innerHTML=viewFinal();
  else if(v==='bank') app.innerHTML=viewBank();
  bind();
  tick();
}

function nameField(){
  return `<div class="field"><label>Ton nom</label><input class="inp" id="nameInp" maxlength="24" placeholder="Ex. Nicolas" value="${esc(S.name)}"></div>`;
}

function viewHome(){
  const nQ=BANK.length;
  return `<div class="hero">
    <span class="pill">📚 ${nQ} questions · curriculum 2027 · 7 thèmes</span>
    <h1>Entraîne-toi au CAIA Level I,<br>seul ou à plusieurs.</h1>
    <p>Examens blancs de 30 minutes pondérés comme le vrai examen, chrono adapté à chaque question (75 s pour un concept, jusqu'à 2 min 30 pour un calcul), et classement en direct quand vous jouez à plusieurs.</p>
  </div>
  <div class="card mb" style="max-width:460px">${nameField()}<div class="hint">Ton nom s'affiche dans le classement des parties multijoueur.</div></div>
  <div class="grid3">
    <div class="card mode" data-go="solo"><div class="ic">🎯</div><h3>Jouer en solo</h3><p>Examen blanc chronométré ou mode entraînement avec la correction après chaque question.</p></div>
    <div class="card mode" data-go="host"><div class="ic">🎮</div><h3>Créer une partie</h3><p>Lance une session multijoueur avec un code, choisis le rythme et suis les résultats en direct.</p></div>
    <div class="card mode" data-go="join"><div class="ic">🔑</div><h3>Rejoindre une partie</h3><p>Entre le code donné par l'hôte et ton nom pour rejoindre la salle d'attente.</p></div>
  </div>
  <div class="row mt"><button class="btn ghost sm" data-go="bank">📖 Parcourir la banque de questions</button></div>
  <div id="nameErr" class="err"></div>`;

function topicChips(){

function qCard({q,order,idx,n,remain,dur,chosen,locked,reveal,dist,topicTag=true,extra=''}){
  // order: displayed index -> original option index
  const opts=order.map((oi,di)=>{
    let cls=`opt o${di%4}`;
    if(reveal){ if(oi===q.a) cls+=' right'; else if(chosen===oi) cls+=' wrong'; else cls+=' dim'; }
    else if(chosen!=null){ cls+= chosen===oi?' sel':' dim'; }
    const d=dist?`<span class="dist">${dist[oi]||0}</span>`:'';
    return `<button class="${cls}" data-opt="${oi}" ${locked||reveal?'disabled':''}><span class="sh">${LETTERS[di]}</span><span>${esc(q.o[oi])}</span>${d}</button>`;
  }).join('');
  return `<div class="card">
    <div class="qhead"><div class="qmeta"><span class="pill">Question ${idx+1} / ${n}</span>${topicTag?`<span class="pill">${esc(TNAME[q.t])}</span>`:''}<span class="pill">${KLABEL[q.k]} · ${QTIME[q.k]} s</span><span class="pill">LO ${esc(q.r)}</span></div>
    ${reveal?'':`<div class="tnum" id="tnum">${fmtT(remain)}</div>`}</div>
    ${reveal?'':`<div class="timer" id="tbar"><div style="width:${Math.max(0,remain/dur*100)}%"></div></div>`}
    <div class="qtext">${esc(q.q)}</div>

    ${extra}
  </div>`;
}

}
function soloAnswer(choice){
  const s=S.solo; if(!s||s.feedback||s.answers[s.i]) return;
  const q=BYID[s.qids[s.i]], dur=s.durs[s.i]*1000, el=NOW()-s.qStart;

function soloNext(){

  else render();
}
function viewSolo(){
  const s=S.solo, q=BYID[s.qids[s.i]], dur=s.durs[s.i];
  const remain=dur-(NOW()-s.qStart)/1000, a=s.answers[s.i];

  if(s.feedback){
    extra=`<div class="verdict ${a&&a.ok?'ok':'bad'}">${a? (a.ok?'✓ Bonne réponse':'✗ Mauvaise réponse') : '⏱ Temps écoulé'}</div>
      <div class="expl">${esc(q.e)}</div>
      <div class="row mt"><button class="btn" id="nextBtn">${s.i+1<s.qids.length?'Question suivante →':'Voir mes résultats'}</button></div>`;

  return `<div class="two"><div>${qCard({q,order,idx:s.i,n:s.qids.length,remain,dur,chosen:a?a.c:null,locked:!!a,reveal:s.feedback,extra})}</div>
    <div class="card lb"><h3>🎯 Ta session</h3><div class="sub">${s.mode==='exam'?'Examen blanc':'Entraînement'} · ${s.qids.length} questions</div>
      <div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${s.score}</b><span>points</span></div><div class="stat"><b>${s.mode==='exam'?answered:ok+'/'+answered}</b><span>${s.mode==='exam'?'répondues':'bonnes réponses'}</span></div></div>
      <div class="strip">${s.qids.map((_,i)=>{const x=s.answers[i];return `<i class="${i===s.i?'c ':''}${x&&s.mode==='practice'?(x.ok?'g':'r'):(x?'g':'')}"></i>`}).join('')}</div>

function viewSoloResult(){
  const s=S.solo; const res=summarize(s.qids,s.answers);
  return resultsBlock({title:'🏁 Résultats de ta session',score:s.score,res,qids:s.qids,answers:s.answers,seed:s.seed})+
   `<div class="row mt"><button class="btn" id="againSolo">Nouvelle session</button><button class="btn ghost" data-go="home">Accueil</button></div>`;
}
function summarize(qids,answers){
  const by={}; let ok=0;
  qids.forEach((id,i)=>{const q=BYID[id];by[q.t]=by[q.t]||{n:0,ok:0};by[q.t].n++; if(answers[i]&&answers[i].ok){by[q.t].ok++;ok++}});
  return {n:qids.length,ok,pct:qids.length?Math.round(ok/qids.length*100):0,by};
}
function resultsBlock({title,score,res,qids,answers,seed,dists}){
  const tb=TOPICS.filter(t=>res.by[t.id]).map(t=>{const b=res.by[t.id],p=Math.round(b.ok/b.n*100);return `<div class="tbar"><span>${esc(t.name)}</span><div class="bar"><div style="width:${p}%;background:${p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--bad)'}"></div></div><b>${b.ok}/${b.n}</b></div>`}).join('');
  const rev=qids.map((id,i)=>{const q=BYID[id],a0=answers[i],a=(a0&&a0.c>=0)?a0:null;const order=perm(seed,q.id,q.o.length);
    return `<div class="rev"><div class="hint">Q${i+1} · ${esc(TNAME[q.t])} · LO ${esc(q.r)} · ${a?(a.ok?'<span style="color:var(--ok)">✓ correct</span>':'<span style="color:var(--bad)">✗ incorrect</span>'):'<span style="color:var(--warn)">— sans réponse</span>'}</div>
    <div class="q">${esc(q.q)}</div>
    ${order.map((oi,di)=>`<div class="o ${oi===q.a?'c':(a&&a.c===oi?'x':'')}">${LETTERS[di]}. ${esc(q.o[oi])}${dists?` <span class="hint">(${dists[i]?.[oi]||0})</span>`:''}</div>`).join('')}
    <div class="expl" style="margin-top:8px">${esc(q.e)}</div></div>`}).join('');
  return `<div class="card"><h2 style="margin-top:0">${title}</h2>
    <div class="stats"><div class="stat"><b>${res.pct}%</b><span>bonnes réponses</span></div><div class="stat"><b>${res.ok}/${res.n}</b><span>questions</span></div><div class="stat"><b>${score}</b><span>points</span></div><div class="stat"><b>${res.pct>=70?'🟢':res.pct>=60?'🟠':'🔴'}</b><span>${res.pct>=70?'Solide':res.pct>=60?'Limite':'À retravailler'}</span></div></div>
    <h3>Par thème</h3>${tb}
    <p class="hint">Repère indicatif : CAIA ne publie pas de note de passage fixe. Viser au moins 70 % en examen blanc est un bon objectif.</p>
    <details class="mt"><summary style="cursor:pointer;font-weight:600">Voir la correction détaillée (${qids.length} questions)</summary>${rev}</details></div>`;
}

function newCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function needDb(errEl){
  if(!P.ready){errEl.textContent='Connexion en cours… réessaie dans une seconde.';return false}
  if(!P.db){errEl.textContent="Le multijoueur n'est pas encore configuré (base Firebase manquante). Le mode solo fonctionne.";return false}
  return true;
}
async function createSession(){

}
async function joinSession(){

  if(!saveName()){err.textContent='Entre ton nom.';return}

async function joinAsPlayer(){
  const m=S.mp; const ref=P.db.doc(`sessions/${m.code}/players/${pid}`);
  const ex=await ref.get().catch(()=>null);
  if(ex&&ex.exists){ const d=ex.data(); m.local={answers:d.answers||{},score:d.score||0}; m.writeMode='db'; queueWrite(()=>ref.update({name:S.name,online:true})); setOnline(); return; }
  const doc={name:S.name,pid,joinedAt:NOW(),answers:{},score:0,nCorrect:0,nAnswered:0,done:false,online:true};
  m.local={answers:{},score:0};
  try{ await ref.set(doc); m.writeMode='db'; }
  catch(e){ m.writeMode='none'; toast("Impossible d'enregistrer ta participation. Vérifie ta connexion.",4500); }
  setOnline();
}
let wq=Promise.resolve();
function queueWrite(fn){wq=wq.then(fn).catch(e=>{ if(S.mp&&e&&e.code==='invalid_argument'){S.mp.writeMode='presence'} console.warn('write',e)});return wq}
let unsubs=[], roomH=null;
async function subscribeMp(code){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[];
  const m=S.mp;
  unsubs.push(P.db.doc('sessions/'+code).onSnapshot(s=>{ if(!s.exists||!S.mp) return; const prev=m.session&&m.session.status; m.session=s.data();
      if(prev!=='running'&&m.session.status==='running'&&S.view==='lobby'){ m.selfStart=NOW(); setView('game'); }
      else if(m.session.status==='finished'&&S.view!=='final'){ setView('final'); }
      else if(S.view==='game'||S.view==='lobby') softRender(); },e=>console.warn(e)));
  unsubs.push(P.db.collection(`sessions/${code}/players`).onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); m.players=o; onPlayersChanged(); },e=>console.warn(e)));
}
function pushPresence(){}
function setOnline(){ const m=S.mp; if(!m||!P.fb) return; try{ const r=P.fb.ref(`sessions/${m.code}/players/${pid}/_d/online`); r.onDisconnect().set(false); r.set(true); }catch(e){} }
function leaveMp(){ unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; const m=S.mp; if(m&&m.plays&&P.fb){ try{ const r=P.fb.ref(`sessions/${m.code}/players/${pid}/_d/online`); r.onDisconnect().cancel(); r.set(false);}catch(e){} } S.mp=null; ssDel('caia_mp'); }
function allPlayers(){
  const m=S.mp; if(!m) return [];
  const o={...m.players};
  return Object.entries(o).map(([id,v])=>({id,...v}));
}
function onPlayersChanged(){
  if(S.view==='lobby') renderLobbyList();
  else if(S.view==='game'){ renderLB(); hostAutoCut(); if(S.mp.session.pace==='sync') updateDist(); maybeFinish(); }
  else if(S.view==='final') render();
}

/* Timeline for synchronized mode */
function timeline(s){
  const out=[]; let t=s.startedAt;
  for(let i=0;i<s.qids.length;i++){
    let end=t+s.durs[i]*1000; const c=s.cuts&&s.cuts[i]; if(c&&c>t&&c<end) end=c;
    out.push({start:t,end,rev:end+REVEAL_MS}); t=end+REVEAL_MS;
  }
  return out;
}
function syncPhase(){
  const s=S.mp.session, now=NOW(), tl=timeline(s);
  for(let i=0;i<tl.length;i++){ if(now<tl[i].start) return {i,phase:'wait',tl}; if(now<tl[i].end) return {i,phase:'q',tl}; if(now<tl[i].rev) return {i,phase:'rev',tl}; }
  return {i:tl.length,phase:'done',tl};
}
/* Self-paced */
function selfIdx(){ const a=S.mp.local.answers||{}; let i=0; while(a[i]) i++; return i; }
function selfDeadline(){ const s=S.mp.session; return s.startedAt+s.durs.reduce((x,y)=>x+y,0)*1000+15000; }

async function startGame(){
  const m=S.mp; $('#goBtn').disabled=true;
  try{ await P.db.doc('sessions/'+m.code).update({status:'running',startedAt:NOW()+4000}); }
  catch(e){ toast('Erreur au démarrage'); $('#goBtn').disabled=false; }
}
async function endGame(){ const m=S.mp; if(!m) return; try{ await P.db.doc('sessions/'+m.code).update({status:'finished',endedAt:NOW()}) }catch(e){} }

function mpAnswer(choice){
  const m=S.mp, s=m.session; let i, start, dur;
  if(s.pace==='sync'){ const ph=syncPhase(); if(ph.phase!=='q') return; i=ph.i; start=ph.tl[i].start; dur=ph.tl[i].end-start; dur=s.durs[i]*1000; }
  else { i=selfIdx(); if(i>=s.qids.length) return; start=m.qStart||NOW(); dur=s.durs[i]*1000; }
  if(m.local.answers[i]) return;
  const q=BYID[s.qids[i]], el=NOW()-start, ok=choice===q.a, pts=points(ok,1-el/dur);
  recordAnswer(i,{c:choice,ok,ms:el,pts});
  if(s.pace==='self'){ m.qStart=NOW(); }
  render();
}
function recordAnswer(i,ans){
  const m=S.mp; m.local.answers={...m.local.answers,[i]:ans}; m.local.score=(m.local.score||0)+ans.pts;
  const vals=Object.values(m.local.answers); const done=vals.length>=m.session.qids.length; m.local.done=done;
  const patch={answers:{[i]:ans},score:m.local.score,nCorrect:vals.filter(x=>x.ok).length,nAnswered:vals.length,done,cur:i+1};
  if(m.writeMode==='db') queueWrite(()=>P.db.doc(`sessions/${m.code}/players/${pid}`).update(patch));
  pushPresence();
}
function hostAutoCut(){
  const m=S.mp; if(!m||m.role!=='host'||m.session.pace!=='sync'||m.session.status!=='running') return;
  const ph=syncPhase(); if(ph.phase!=='q') return; const i=ph.i;
  if(m.cutDone[i]||(m.session.cuts&&m.session.cuts[i])) return;
  const ps=allPlayers().filter(p=>p.online!==false); if(!ps.length) return;
  if(NOW()-ph.tl[i].start<1500) return;
  if(ps.every(p=>p.answers&&p.answers[i])){ m.cutDone[i]=true; P.db.doc('sessions/'+m.code).update({cuts:{[i]:NOW()}}).catch(()=>{m.cutDone[i]=false}); }
}
function maybeFinish(){
  const m=S.mp; if(!m||m.role!=='host'||m.session.status!=='running'||m.finishing) return;
  const s=m.session; let over=false;
  if(s.pace==='sync'){ over=syncPhase().phase==='done'; }
  else { const ps=allPlayers().filter(p=>p.online!==false); over=NOW()>selfDeadline() || (ps.length>0 && ps.every(p=>p.done)); }
  if(over){ m.finishing=true; endGame(); }
}

/* Game */
function viewGame(){
  const m=S.mp, s=m.session;
  if(!s.startedAt) return `<div class="card waitbox">Chargement…</div>`;
  const left = m.plays ? gameMain() : hostBoard();
  return `<div class="two"><div id="gmain">${left}</div><div class="card lb" id="lbBox">${lbHtml()}</div></div>`;

function gameMain(){
  const m=S.mp, s=m.session, now=NOW();
  if(now<s.startedAt) return `<div class="card waitbox"><div class="bigcode" id="cd">${Math.ceil((s.startedAt-now)/1000)}</div><p>Prépare-toi… (et ta calculatrice !)</p></div>`;
  if(s.pace==='sync'){
    const ph=syncPhase();
    if(ph.phase==='done') return `<div class="card waitbox">🏁 Partie terminée, calcul du classement…</div>`;
    const i=ph.i, q=BYID[s.qids[i]], order=perm(s.seed,q.id,q.o.length), a=m.local.answers[i];
    const dur=s.durs[i], remain=(ph.tl[i].end-now)/1000;
    if(ph.phase==='q'){
      const extra=a?`<div class="waitbox">✅ Réponse enregistrée, en attente des autres joueurs…</div>`:'';
      return qCard({q,order,idx:i,n:s.qids.length,remain,dur,chosen:a?a.c:null,locked:!!a,reveal:false,extra});
    }
    const dist=distFor(i);
    const extra=`<div class="verdict ${a&&a.ok?'ok':'bad'}">${a?(a.ok?`✓ Bonne réponse ! +${a.pts} pts`:'✗ Mauvaise réponse'):'⏱ Pas de réponse'}</div><div class="expl">${esc(q.e)}</div><div class="hint mt" id="nextIn"></div>`;
    return qCard({q,order,idx:i,n:s.qids.length,remain:0,dur,chosen:a?a.c:null,locked:true,reveal:true,dist,extra});
  }
  // self-paced
  const i=selfIdx();
  if(i>=s.qids.length || now>selfDeadline()) return `<div class="card waitbox"><h2>🎉 Tu as terminé !</h2><p>Ton score : <b>${m.local.score||0}</b> points. Suis la progression des autres à droite. Le classement final s'affichera quand tout le monde aura fini.</p></div>`;
  if(m.qIdx!==i){ m.qIdx=i; m.qStart=Math.max(NOW(), s.startedAt); }
  const q=BYID[s.qids[i]], order=perm(s.seed,q.id,q.o.length), dur=s.durs[i];
  const remain=dur-(now-m.qStart)/1000;
  return qCard({q,order,idx:i,n:s.qids.length,remain,dur,chosen:null,locked:false,reveal:false,extra:`<div class="hint mt" id="globalLeft"></div>`});
}
function hostBoard(){
  const m=S.mp, s=m.session, now=NOW();
  if(now<s.startedAt) return `<div class="card waitbox"><div class="bigcode" id="cd">${Math.ceil((s.startedAt-now)/1000)}</div><p>Démarrage…</p></div>`;
  let head='';
  if(s.pace==='sync'){ const ph=syncPhase(); if(ph.phase!=='done'){ const i=ph.i,q=BYID[s.qids[i]],order=perm(s.seed,q.id,q.o.length);
      const dist=distFor(i); head=qCard({q,order,idx:i,n:s.qids.length,remain:(ph.tl[i].end-now)/1000,dur:s.durs[i],chosen:null,locked:true,reveal:ph.phase==='rev',dist,extra:ph.phase==='rev'?`<div class="expl">${esc(q.e)}</div>`:`<div class="hint mt">Les réponses s'affichent quand tous les joueurs ont répondu ou à la fin du chrono.</div>`}); } }
  else head=`<div class="card"><h3 style="margin-top:0">📝 Examen en cours</h3><div class="hint" id="globalLeft"></div></div>`;
  return head+`<div class="card mt"><h3 style="margin-top:0">Tableau de bord</h3><div class="heat" id="heat">${heatHtml()}</div><div class="row mt"><button class="btn bad sm" id="endBtn">Terminer la partie</button></div></div>`;
}
function distFor(i){ const d={}; allPlayers().forEach(p=>{const a=p.answers&&p.answers[i]; if(a) d[a.c]=(d[a.c]||0)+1}); return d; }
function updateDist(){ /* re-render reveal counts if in reveal */ const ph=syncPhase(); if(ph.phase==='rev'||!S.mp.plays) softRender(); }
function ranked(){ return allPlayers().sort((a,b)=>(b.score||0)-(a.score||0)||(b.nCorrect||0)-(a.nCorrect||0)); }
function lbHtml(){
  const m=S.mp, s=m.session, n=s.qids.length, ps=ranked();
  const cur = s.pace==='sync' && s.startedAt ? syncPhase().i : -1;
  const rows=ps.map((p,k)=>{
    const a=p.answers||{}; const strip=[...Array(n).keys()].map(i=>{const x=a[i];return `<i class="${x?(x.ok?'g':'r'):''}${i===cur?' c':''}"></i>`}).join('');
    const answeredNow = cur>=0 && a[cur] ? '<span class="ans">a répondu</span>':'';
    return `<div class="lbrow ${p.id===pid?'me':''}"><div class="rk">${k+1}</div><div style="min-width:0"><div class="nm">${esc(p.name)}${p.id===pid?' (toi)':''}${answeredNow}</div>
      <div class="sub">${p.nCorrect||0} bonnes · ${p.nAnswered||0}/${n} répondues${p.done?' · ✅ fini':''}${p.online===false?' · ⚪ hors ligne':''}</div><div class="strip">${strip}</div></div><div class="sc">${p.score||0}</div></div>`}).join('');
  return `<h3><span class="live"></span> Classement en direct</h3><div class="sub" style="margin-bottom:6px">${ps.length} joueur${ps.length>1?'s':''} · code ${esc(m.code)}</div>${rows||'<div class="hint">Aucun joueur</div>'}`;
}
function renderLB(){ const el=$('#lbBox'); if(el) el.innerHTML=lbHtml(); const h=$('#heat'); if(h) h.innerHTML=heatHtml(); }
function heatHtml(){
  const s=S.mp.session, ps=ranked(); if(!ps.length) return '<div class="hint">Aucun joueur.</div>';
  const head=s.qids.map((_,i)=>`<th>${i+1}</th>`).join('');
  const rows=ps.map(p=>`<tr><td class="n">${esc(p.name)}</td>${s.qids.map((_,i)=>{const x=p.answers&&p.answers[i];return `<td><span class="dot ${x?(x.ok?'g':'r'):''}"></span></td>`}).join('')}<td><b>${p.nCorrect||0}</b></td></tr>`).join('');
  const pct=s.qids.map((_,i)=>{let a=0,ok=0;ps.forEach(p=>{const x=p.answers&&p.answers[i];if(x){a++;if(x.ok)ok++}});return `<td class="hint">${a?Math.round(ok/a*100)+'%':''}</td>`}).join('');
  return `<table><tr><th></th>${head}<th>✓</th></tr>${rows}<tr><td class="n hint">% juste</td>${pct}<td></td></tr></table>`;
}
let lastKey='';
function softRender(){ // re-render main game area only when the phase/question changes
  if(S.view!=='game'&&S.view!=='lobby'){ return }
  if(S.view==='lobby'){ renderLobbyList(); return }
  const m=S.mp, s=m.session; let key='';
  if(NOW()<s.startedAt) key='cd'; else if(s.pace==='sync'){const ph=syncPhase();key=ph.i+ph.phase+(ph.phase==='rev'||!m.plays?JSON.stringify(distFor(ph.i)):'')+(m.local.answers[ph.i]?'a':'');} else key='s'+selfIdx()+(NOW()>selfDeadline());
  if(key!==lastKey){ lastKey=key; const g=$('#gmain'); if(g){ g.innerHTML=m.plays?gameMain():hostBoard(); bindGame(); } renderLB(); }
}

/* Final */
function viewFinal(){
  const m=S.mp; if(!m) return viewHome();
  const s=m.session, ps=ranked(), top=ps.slice(0,3);
  const pod=[1,0,2].filter(k=>top[k]).map(k=>`<div class="pod"><div style="font-weight:700">${esc(top[k].name)}</div><div class="hint">${top[k].score||0} pts</div><div class="blk p${k+1}">${k+1}</div></div>`).join('');
  const table=ps.map((p,k)=>`<div class="lbrow ${p.id===pid?'me':''}"><div class="rk">${k+1}</div><div><div class="nm">${esc(p.name)}</div><div class="sub">${p.nCorrect||0}/${s.qids.length} bonnes réponses · ${Math.round((p.nCorrect||0)/s.qids.length*100)}%</div></div><div class="sc">${p.score||0}</div></div>`).join('');
  const dists=s.qids.map((_,i)=>distFor(i));
  const mine=m.plays?resultsBlock({title:'📋 Ta correction',score:m.local.score||0,res:summarize(s.qids,m.local.answers||{}),qids:s.qids,answers:m.local.answers||{},seed:s.seed,dists}):'';
  return `<div class="card center"><h1 style="margin:0">🏆 Classement final</h1><div class="podium">${pod}</div></div>
   <div class="two mt"><div>${mine||`<div class="card"><h3 style="margin-top:0">Résultats par question</h3><div class="heat">${heatHtml()}</div></div>`}</div><div class="card lb"><h3 style="margin-top:0">Tous les joueurs</h3>${table}</div></div>
   <div class="row mt"><button class="btn" id="homeBtn">Retour à l'accueil</button></div>`;
}

/* Bank browser */
function viewBank(){
  const b=S.bank; const ql=b.q.trim().toLowerCase();
  const list=BANK.filter(q=>(b.topic==='ALL'||q.t===b.topic)&&(!ql||(q.q+' '+q.o.join(' ')+' '+q.r).toLowerCase().includes(ql)));
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">📖 Banque de questions</h2><button class="btn ghost sm" data-go="home">Retour</button></div>
   <div class="row mt">${seg('bankSeg',[['ALL','Tout'],...TOPICS.map(t=>[t.id,t.id])],b.topic)}</div>
   <input class="inp mt" id="bankSearch" placeholder="Rechercher (ex. carried interest, contango, Sharpe)…" value="${esc(b.q)}">
   <div class="hint mt">${list.length} questions</div>
   ${list.slice(0,150).map(q=>`<div class="bank-q"><div class="hint">${esc(q.id)} · ${esc(TNAME[q.t])} · LO ${esc(q.r)} · ${KLABEL[q.k]}</div><div style="margin:6px 0;line-height:1.45">${esc(q.q)}</div>
     ${b.show[q.id]?q.o.map((o,i)=>`<div class="rev"><div class="o ${i===q.a?'c':''}" style="margin:2px 0">${LETTERS[i]}. ${esc(o)}</div></div>`).join('')+`<div class="expl">${esc(q.e)}</div>`:`<button class="btn ghost sm" data-show="${q.id}">Voir la réponse</button>`}</div>`).join('')}
   ${list.length>150?'<div class="hint mt">Affine la recherche pour voir plus de questions.</div>':''}</div>`;
}

/* ---------------- Events ---------------- */
function saveName(){ const i=$('#nameInp'); if(i){ S.name=i.value.trim().slice(0,24); lsSet('caia_name',S.name);} return !!S.name; }
function bindSeg(id,fn){ const el=$('#'+id); if(!el) return; el.querySelectorAll('button').forEach(b=>b.onclick=()=>{saveName();fn(b.dataset.v);render()}); }
function bind(){
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const g=el.dataset.go; saveName();
    if((g==='solo'||g==='host')&&!S.name){ const e=$('#nameErr'); if(e) e.textContent='Entre ton nom avant de commencer.'; $('#nameInp')&&$('#nameInp').focus(); return; }
    if(g==='solo'){S.setupKind='solo';setView('setup')} else if(g==='host'){S.setupKind='host';setView('setup')} else setView(g);
  });
  const ni=$('#nameInp'); if(ni){ ni.oninput=()=>{S.name=ni.value.trim().slice(0,24);lsSet('caia_name',S.name);$('#who').innerHTML=S.name?`<span class="pill">👤 ${esc(S.name)}</span>`:''} }
  bindSeg('paceSeg',v=>S.cfg.pace=v); bindSeg('modeSeg',v=>S.cfg.mode=v); bindSeg('minSeg',v=>S.cfg.minutes=+v); bindSeg('hpSeg',v=>S.cfg.hostPlays=v==='1');
  bindSeg('bankSeg',v=>S.bank.topic=v);
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{saveName();const t=b.dataset.topic,a=S.cfg.topics;S.cfg.topics=a.includes(t)?a.filter(x=>x!==t):[...a,t];render()});
  const allT=$('#allT'); if(allT) allT.onclick=()=>{saveName();S.cfg.topics=TOPICS.map(t=>t.id);render()};
  const sb=$('#startBtn'); if(sb) sb.onclick=()=>{ if(!saveName()){$('#setupErr').textContent='Entre ton nom.';return} S.setupKind==='host'?createSession():startSolo(); };
  const jb=$('#joinBtn'); if(jb) jb.onclick=joinSession;
  const ci=$('#codeInp'); if(ci){ ci.oninput=()=>{ci.value=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,'')}; ci.onkeydown=e=>{if(e.key==='Enter')joinSession()} }
  const nb=$('#nextBtn'); if(nb) nb.onclick=soloNext;
  const qs=$('#quitSolo'); if(qs) qs.onclick=()=>{S.solo.endedAt=NOW();setView('soloResult')};
  const as=$('#againSolo'); if(as) as.onclick=()=>{S.setupKind='solo';setView('setup')};
  const go=$('#goBtn'); if(go) go.onclick=startGame;
  const ci2=$('#copyInv'); if(ci2) ci2.onclick=async()=>{ const url=location.href.split('#')[0]+'#join-'+S.mp.code; try{ await navigator.clipboard.writeText(url); toast('Lien copié : '+url,4000);}catch(e){ toast(url,8000);} };
  const cb=$('#cancelBtn'); if(cb) cb.onclick=async()=>{await endGame();leaveMp();setView('home')};
  const hb=$('#homeBtn'); if(hb) hb.onclick=()=>{leaveMp();setView('home')};
  const bs=$('#bankSearch'); if(bs){ bs.oninput=()=>{S.bank.q=bs.value; const pos=bs.selectionStart; render(); const n=$('#bankSearch'); n.focus(); n.setSelectionRange(pos,pos);} }
  document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{S.bank.show[b.dataset.show]=true;render()});
  if(S.view==='lobby') renderLobbyList();
  if(S.view==='game'){ lastKey=''; bindGame(); }
  if(S.view==='solo') document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>soloAnswer(+b.dataset.opt));
}
function bindGame(){
  document.querySelectorAll('#gmain [data-opt]').forEach(b=>b.onclick=()=>mpAnswer(+b.dataset.opt));
  const eb=$('#endBtn'); if(eb) eb.onclick=()=>{ eb.disabled=true; endGame(); };
}

/* ---------------- Clock ---------------- */
function setTimer(remain,dur){
  const n=$('#tnum'), b=$('#tbar'); if(n) n.textContent=fmtT(remain);
  if(b){ b.firstElementChild.style.width=Math.max(0,remain/dur*100)+'%'; b.classList.toggle('low',remain<=10); }
}
function tick(){
  const now=NOW();
  if(S.view==='solo'&&S.solo){
    const s=S.solo; if(s.feedback) return; const dur=s.durs[s.i], remain=dur-(now-s.qStart)/1000;
    setTimer(remain,dur);
    if(remain<=0){ if(s.mode==='practice'){ s.feedback=true; render(); } else soloNext(); }
  }
  if(S.view==='game'&&S.mp&&S.mp.session&&S.mp.session.startedAt){
    const m=S.mp, s=m.session;
    const cd=$('#cd'); if(cd && now<s.startedAt) cd.textContent=Math.ceil((s.startedAt-now)/1000);
    if(s.pace==='sync'){
      const ph=syncPhase();
      if(ph.phase==='q') setTimer((ph.tl[ph.i].end-now)/1000, s.durs[ph.i]);
      if(ph.phase==='rev'){ const n=$('#nextIn'); if(n) n.textContent=ph.i+1<s.qids.length?`Question suivante dans ${Math.ceil((ph.tl[ph.i].rev-now)/1000)} s`:'Classement final dans un instant…'; }
      hostAutoCut();
    } else {
      const i=selfIdx();
      if(m.plays && i<s.qids.length && now>=s.startedAt && m.qIdx===i){
        const dur=s.durs[i], remain=dur-(now-m.qStart)/1000; setTimer(remain,dur);
        if(remain<=0 && !m.local.answers[i]){ recordAnswer(i,{c:-1,ok:false,ms:dur*1000,pts:0}); m.qStart=NOW(); }
      }
      const gl=$('#globalLeft'); if(gl) gl.textContent='Temps total restant : '+fmtT((selfDeadline()-now)/1000);
      if(m.plays && now>selfDeadline() && !m.local.done){ m.local.done=true; if(m.writeMode==='db') queueWrite(()=>P.db.doc(`sessions/${m.code}/players/${pid}`).update({done:true})); pushPresence(); }
    }
    maybeFinish();
    softRender();
  }
}
setInterval(tick,250);

/* ---------------- Resume after reload ---------------- */
async function tryResume(){
  const r=ssGet('caia_mp',null); if(!r||!P.db) return;
  try{
    const snap=await P.db.doc('sessions/'+r.code).get(); if(!snap.exists){ssDel('caia_mp');return}
    const sess=snap.data(); if(sess.status==='finished'){ssDel('caia_mp');return}
    S.mp={code:r.code,role:r.role,plays:r.plays,session:sess,players:{},peers:{},local:{answers:{},score:0},cutDone:{}};
    await subscribeMp(r.code); if(r.plays) await joinAsPlayer();
    setView(sess.status==='running'?'game':'lobby');
  }catch(e){}
}
(function(){ const h=(location.hash||'').match(/^#join-([A-Z0-9]{5})$/i); if(h){ S.joinCode=h[1].toUpperCase(); S.view='join'; } })();
render();
initPlatform().then(tryResume);
</script>
