itive."},{"id":"RA014","t":"RA","r":"3.2.5","k":"c","q":"The total return on a fully collateralized long commodity futures position can be decomposed into:","o":["Spot return, roll return, and collateral yield","Dividend yield and capital gain","Coupon and accrual","Convenience yield only"],"a":0,"e":"Total return = spot return (change in spot) + roll return (from the term structure) + collateral return (interest on collateral)."},{"id":"RA015","t":"RA","r":"3.2.6","k":"c","q":"Keynes's theory of normal backwardation argues that futures prices tend to be below expected future spot prices because:","o":["Speculators are risk-seeking and willing to pay a premium to take the short side of futures","Producers who hedge by shorting futures pay a risk premium to speculators who take the long side","Storage costs are always zero for commodities that are traded on futures exchanges","Interest rates are negative, so carrying the physical commodity has a negative cost"],"a":1,"e":"Hedging producers (short) must induce speculators (long) to bear price risk, so futures are set below the expected spot price, giving longs a positive expected return."},{"id":"RA016","t":"RA","r":"3.2.6","k":"c","q":"In contrast with normal backwardation, normal contango refers to futures prices that are:","o":["Above the current spot price","Above the expected future spot price","Below the current spot price","Equal to the expected spot price"],"a":1,"e":"Normal backwardation/contango compare the futures price with the EXPECTED future spot price, whereas backwardation/contango compare futures prices across maturities (or with the current spot)."},{"id":"RA017","t":"RA","r":"3.2.7","k":"c","q":"Commodities are often considered a hedge against which risk in a diversified portfolio?","o":["Deflation","Unexpected inflation","Low interest rates","Currency appreciation"],"a":1,"e":"Commodity prices tend to rise with unexpected inflation, when stocks and bonds often perform poorly, which supports their role as an inflation hedge and diversifier."},{"id":"RA018","t":"RA","r":"3.2.9","k":"c","q":"The S&P GSCI is primarily weighted by:","o":["Equal weights across all commodities, rebalanced monthly","World production quantities, leading to a heavy energy weighting","Market capitalization of the largest commodity producers","Inverse volatility, so that each sector contributes equal risk"],"a":1,"e":"The S&P GSCI is production-weighted, which results in a large weight in energy. BCOM uses liquidity and production with diversification caps."},{"id":"RA019","t":"RA","r":"3.2.9","k":"c","q":"Compared with the S&P GSCI, the Bloomberg Commodity Index (BCOM) is designed to be:","o":["More concentrated in energy, since it uses only production data to set its weights","More diversified, using liquidity and production data with caps on sectors and single commodities","An equity index tracking the shares of commodity producers rather than futures","Rebalanced daily to equal weights across all the commodities it includes"],"a":1,"e":"BCOM combines liquidity and production in its weights and caps sector exposure, making it more diversified than the production-weighted S&P GSCI."},{"id":"RA020","t":"RA","r":"3.2.9","k":"c","q":"An investable commodity index is one whose returns:","o":["Are based only on spot prices, which cannot be traded in a centralized market","Can be matched in practice by holding the positions that constitute the index","Are reported with a one-year lag, once all physical deliveries have been completed","Include leverage of at least two times the cash invested in the index"],"a":1,"e":"An investable index's returns can be replicated by investors maintaining the same positions; commodity futures indices are usually unleveraged and fully collateralized."},{"id":"RA021","t":"RA","r":"3.3.2","k":"c","q":"Which characteristic is typical of core infrastructure assets?","o":["High exposure to development risk, since most core assets are still under construction","Quasi-monopoly position, long lives and stable, often inflation-linked cash flows","Short asset lives and volatile cash flows that depend on commodity prices","An absence of regulatory oversight, which allows owners to set prices freely"],"a":1,"e":"Infrastructure assets typically have high barriers to entry, inelastic demand, long lives and contracted or regulated cash flows that are often linked to inflation."},{"id":"RA022","t":"RA","r":"3.3.4","k":"c","q":"A greenfield infrastructure asset is one that:","o":["Is already operating with a long track record","Is to be newly built, carrying construction and ramp-up risk","Has been fully depreciated","Is located in a park"],"a":1,"e":"Greenfield assets are new projects to be built; brownfield assets are existing, operating assets with established cash flows."},{"id":"RA023","t":"RA","r":"3.3.4","k":"c","q":"Schools, hospitals and prisons are examples of:","o":["Economic infrastructure","Social infrastructure","Digital infrastructure","Transmission infrastructure"],"a":1,"e":"Social infrastructure provides public services (education, health, justice), often via availability payments. Economic infrastructure includes transport, energy, utilities and communications."},{"id":"RA024","t":"RA","r":"3.3.5","k":"c","q":"Which infrastructure investment style is described as fully constructed, operational assets providing essential services, often with contracted or regulated cash flows and long-term inflation-protected income?","o":["Core","Value-added","Opportunistic","Greenfield-only"],"a":0,"e":"Core infrastructure: fully operational, essential, contracted/regulated cash flows, minimal maintenance capex, resilient and inflation-correlated income (e.g., systemically important toll roads, PPPs, regulated utilities)."},{"id":"RA025","t":"RA","r":"3.3.5","k":"c","q":"Which is an example of core-plus infrastructure given in the curriculum?","o":["A systemically important national airport with regulated cash flows","Midstream oil and gas pipelines with shorter-duration customer contracts","Greenfield development in an emerging market with no contracts","A distressed toll road requiring restructuring"],"a":1,"e":"Core-plus assets resemble core but with more cash-flow variability or some development needs, e.g., regional transport, renewable energy construction, midstream pipelines with shorter contracts."},{"id":"RA026","t":"RA","r":"3.3.6","k":"c","q":"In project finance, debt is typically repaid from:","o":["The general credit of the sponsor company, which guarantees all project debt","The cash flows of the specific project, with limited or no recourse to the sponsor","Government tax revenues in all cases, since infrastructure projects are public","Personal guarantees provided by the project's equity investors"],"a":1,"e":"Project finance uses a special purpose vehicle whose debt is serviced by the project's cash flows, typically non-recourse or limited-recourse to sponsors."},{"id":"RA027","t":"RA","r":"3.3.6","k":"c","q":"In a public-private partnership (PPP) using availability payments, the private operator's revenue depends mainly on:","o":["Traffic volumes and user demand for the asset","Keeping the asset available and meeting performance standards","Commodity prices linked to the asset's operations","The sponsor's stock price and credit rating"],"a":1,"e":"Availability-based PPPs pay the operator for making the asset available to required standards, removing demand risk from the operator."},{"id":"RA028","t":"RA","r":"3.3.9","k":"c","q":"Which type of infrastructure asset is generally most sensitive to GDP growth?","o":["Regulated water utilities","Availability-based social infrastructure","Demand-based transport assets such as airports and toll roads","Contracted power transmission"],"a":2,"e":"Assets whose revenues depend on usage (passengers, traffic, volumes) are more cyclical than regulated or availability-based assets."},{"id":"RA029","t":"RA","r":"3.4.1","k":"c","q":"Which of the following is generally considered the riskiest real estate investment style?","o":["Core","Value-added","Opportunistic","Core-plus"],"a":2,"e":"Opportunistic real estate involves development, redevelopment, high leverage and emerging markets, offering the highest expected returns and risk. Core is the lowest risk."},{"id":"RA030","t":"RA","r":"3.4.2","k":"c","q":"Which is a disadvantage of direct private commercial real estate investment?","o":["High liquidity, which exposes investors to frequent price changes and redemptions","Large lot sizes, high transaction costs and illiquidity","Daily price transparency, which increases the measured volatility of returns","No management requirements, which limits the ability to add value through leasing"],"a":1,"e":"Private real estate is lumpy, illiquid, costly to transact and manage, and valued by appraisals, though it may provide diversification and inflation protection."},{"id":"RA031","t":"RA","r":"3.4.3","k":"n","q":"A real estate portfolio is 50% core (−95 bps relative return, 20% LTV), 30% value-add (+100 bps, 60% LTV) and 20% opportunistic (+300 bps, 70% LTV). What are its expected relative return and LTV?","o":["+42.5 bps; 42%","+42.5 bps; 40%","+68 bps; 50%","−20 bps; 42%"],"a":0,"e":"Return = 0.5(−95) + 0.3(100) + 0.2(300) = −47.5 + 30 + 60 = +42.5 bps. LTV = 0.5(20%) + 0.3(60%) + 0.2(70%) = 10% + 18% + 14% = 42%."},{"id":"RA032","t":"RA","r":"3.4.3","k":"c","q":"An allocator who mainly wants real estate beta for diversification would typically emphasize which style?","o":["Opportunistic","Value-add","Core","Development"],"a":2,"e":"For diversification (real estate beta), core is the dominant style. Current income: core equity and real estate debt. Total return: tilt toward value-add and opportunistic."},{"id":"RA033","t":"RA","r":"3.4.4","k":"c","q":"Compared with apartments, office properties typically have:","o":["Shorter leases, typically renewed every month","Longer lease terms and higher tenant improvement and leasing costs","No sensitivity to employment levels in the local economy","Nightly pricing that adjusts quickly to economic conditions"],"a":1,"e":"Office leases are typically multi-year, with significant tenant improvements and leasing commissions; demand depends on office employment. Hotels have the shortest 'leases'."},{"id":"RA034","t":"RA","r":"3.4.6","k":"c","q":"Which property sector has the shortest effective lease duration and therefore the most immediate exposure to economic conditions?","o":["Industrial","Office","Hotels (hospitality)","Retail anchored by grocery stores"],"a":2,"e":"Hotel room rates reset nightly, so revenues respond immediately to economic conditions, making hospitality one of the most cyclical sectors."},{"id":"RA035","t":"RA","r":"3.5.1","k":"n","q":"A property worth $10 million is financed with a $7 million mortgage. What is the loan-to-value (LTV) ratio?","o":["30%","43%","70%","143%"],"a":2,"e":"LTV = loan / property value = $7m / $10m = 70%."},{"id":"RA036","t":"RA","r":"3.5.2","k":"c","q":"In a triple-net (NNN) lease, who generally pays property taxes, insurance and maintenance?","o":["The landlord","The tenant","The lender","The government"],"a":1,"e":"Under a triple-net lease, the tenant pays the three 'nets' (taxes, insurance, maintenance) in addition to rent, giving the landlord more stable net income."},{"id":"RA037","t":"RA","r":"3.5.3","k":"n","q":"A property generates net operating income of $1.5 million and annual debt service is $1.2 million. What is the debt service coverage ratio (DSCR)?","o":["0.80","1.20","1.25","1.50"],"a":2,"e":"DSCR = NOI / debt service = $1.5m / $1.2m = 1.25. Lenders often require a minimum DSCR (e.g., 1.2x–1.3x)."},{"id":"RA038","t":"RA","r":"3.5.4","k":"c","q":"A commercial mortgage with interest-only payments and the entire principal due at maturity exposes the lender mainly to:","o":["Prepayment risk only, since the borrower pays no principal","Balloon (refinancing) risk at maturity","Negative amortization of the outstanding balance","Currency risk on the final principal payment"],"a":1,"e":"Interest-only or partially amortizing loans leave a large balloon payment, creating refinancing risk if values fall or credit tightens at maturity."},{"id":"RA039","t":"RA","r":"3.5.4","k":"c","q":"Yield maintenance and defeasance provisions in commercial mortgages are designed to:","o":["Lower the interest rate paid by the borrower over the term of the loan","Protect lenders against the loss of expected interest income when borrowers prepay","Allow borrowers to skip payments when the property's income temporarily falls","Increase the loan-to-value ratio that lenders can offer at origination"],"a":1,"e":"Commercial mortgages often restrict prepayment through lockouts, yield maintenance penalties or defeasance (substituting Treasuries for the collateral)."},{"id":"RA040","t":"RA","r":"3.5.6","k":"c","q":"Which statement best describes an open-end private real estate fund compared with a closed-end fund?","o":["It has a fixed life of about ten years, with no redemptions until the fund is liquidated","It has an indefinite life with periodic contributions and redemptions, usually core","It always uses high leverage to finance development and redevelopment projects","It invests only in development projects, selling properties once they are stabilized"],"a":1,"e":"Open-end funds (often core) have indefinite lives with periodic entry and exit at appraised NAV. Closed-end funds (often value-add/opportunistic) have fixed lives and commitments."},{"id":"RA041","t":"RA","r":"3.5.7","k":"c","q":"What is a key advantage of listed real estate (REITs) over private real estate?","o":["Lower correlation with equities in the short term","Daily liquidity, smaller investment sizes and transparent market pricing","No exposure to interest rates","Returns free of volatility"],"a":1,"e":"REITs offer liquidity, divisibility and market pricing, but their short-term returns are more correlated with equities and more volatile than appraisal-based private indices."},{"id":"RA042","t":"RA","r":"3.6.1","k":"c","q":"Which risk is most specific to real estate development compared with investing in stabilized properties?","o":["Inflation risk","Construction, entitlement and lease-up risk","Currency risk","Rollover of existing tenants only"],"a":1,"e":"Development involves obtaining approvals (entitlements), construction cost and timing risks, and leasing risk before stabilization."},{"id":"RA043","t":"RA","r":"3.6.2","k":"c","q":"Which are the three classic approaches to commercial real estate valuation?","o":["Income, sales comparison, and cost approaches","CAPM, APT, and DCF","NAV, P/E, and EV/EBITDA","Book, liquidation, and replacement only"],"a":0,"e":"Appraisers use the income approach (direct capitalization or DCF), the sales comparison approach (comparable transactions) and the cost approach (replacement cost less depreciation plus land)."},{"id":"RA044","t":"RA","r":"3.6.3","k":"n","q":"A property produces stabilized NOI of $5 million. Comparable properties trade at a 6.25% cap rate. What is the estimated value using direct capitalization?","o":["$31.25 million","$62.5 million","$80 million","$312.5 million"],"a":2,"e":"Value = NOI / cap rate = $5m / 0.0625 = $80m."},{"id":"RA045","t":"RA","r":"3.6.3","k":"c","q":"Holding NOI constant, a rise in market cap rates will:","o":["Increase property values","Decrease property values","Have no effect on value","Increase NOI"],"a":1,"e":"Since value = NOI / cap rate, a higher cap rate lowers value. Cap rates tend to rise with interest rates and perceived risk."},{"id":"RA046","t":"RA","r":"3.6.3","k":"c","q":"Net operating income (NOI) is calculated before deducting:","o":["Vacancy and collection losses on rents","Property taxes and property insurance","Debt service and income taxes","Routine repairs and operating expenses"],"a":2,"e":"NOI = effective gross income − operating expenses. It excludes financing costs (debt service), depreciation and income taxes, so it reflects the property's unlevered operating performance."},{"id":"RA047","t":"RA","r":"4.3.6","k":"c","q":"To avoid corporate income taxes, business development companies (BDCs), like REITs, must generally:","o":["Retain all of their earnings to finance new investments in portfolio companies","Distribute at least 90% of their income and meet diversification requirements","Be privately held by fewer than 100 institutional investors","Invest only in publicly traded companies with investment-grade ratings"],"a":1,"e":"BDCs (listed vehicles giving liquid access to private companies) must use moderate leverage, distribute at least 90% of income and meet diversification requirements to avoid corporate income tax, similar to REITs."},{"id":"RA048","t":"RA","r":"3.6.4","k":"c","q":"Mortgage REITs differ from equity REITs because they:","o":["Own and operate income-producing properties, earning rental income from tenants","Mainly hold mortgages and MBS, earning a spread with rate and credit risk","Are not allowed to use leverage, so they hold only unlevered mortgage portfolios","Are always non-traded, so their shares cannot be bought on a stock exchange"],"a":1,"e":"Equity REITs own properties; mortgage REITs invest in mortgages and mortgage securities, so they are more exposed to interest rate and credit spread risk."},{"id":"RA049","t":"RA","r":"3.6.5","k":"c","q":"Why do public REIT indices typically show higher volatility than the NCREIF Property Index (NPI)?","o":["REITs systematically own riskier and lower-quality properties than those included in the NPI","The NPI is appraisal-based and unlevered (smoothed), while REITs are levered and market-priced","The NPI includes high leverage at the property level, while REITs are required to be unlevered","REITs are valued by appraisers only once a year, which exaggerates their measured volatility"],"a":1,"e":"NCREIF NPI uses unlevered appraisals that smooth returns. REITs are leveraged and priced daily in equity markets, showing higher measured volatility and equity correlation."},{"id":"RA050","t":"RA","r":"3.3.7","k":"c","q":"In a typical infrastructure capital structure, which layer bears losses first?","o":["Senior secured debt","Mezzanine debt","Equity","Government guarantees"],"a":2,"e":"Equity is the first-loss position, followed by mezzanine and then senior debt. Infrastructure often supports relatively high leverage due to stable cash flows."},{"id":"RA051","t":"RA","r":"3.3.3","k":"c","q":"Which is a primary risk specific to infrastructure assets that rely on government concessions or regulation?","o":["Short-selling risk, since infrastructure assets are frequently shorted by hedge funds","Regulatory and political risk, such as changes in allowed returns or tariffs","Prepayment risk, as users can prepay their tolls and tariffs years in advance","Biological risk, because the assets depend on natural growth processes"],"a":1,"e":"Regulated and concession-based assets depend on government decisions about tariffs and allowed returns, exposing investors to regulatory and political risk."},{"id":"RA052","t":"RA","r":"3.3.11","k":"c","q":"When underwriting a demand-based toll road, which factor is generally most critical to forecast?","o":["The sponsor's stock price and its ability to issue new equity","Traffic volumes and the ability to raise tolls over the concession period","The convenience yield of oil and the shape of the futures curve","Prepayment speeds on the concession's underlying mortgages"],"a":1,"e":"For demand-risk assets, revenue depends on usage and pricing power, so traffic forecasts and toll escalation terms drive valuations."},{"id":"RA053","t":"RA","r":"3.2.8","k":"c","q":"Which statement about expected returns on commodity futures is most consistent with the curriculum?","o":["They always equal the riskless rate, since futures require no initial investment","They reflect risk premiums and the term structure (roll), not just spot changes","They are always negative, because rolling futures always generates a negative yield","They are identical across commodities, since all commodities share the same risk premium"],"a":1,"e":"Futures returns differ from spot returns because of roll yield and collateral, and any risk premium depends on who is hedging and the term structure."},{"id":"RA054","t":"RA","r":"3.2.10","k":"c","q":"Which statement about the historical behavior of commodity returns is generally correct?","o":["Commodities have had very high correlations with equities, offering little diversification","Low correlation with stocks and bonds, positive correlation with inflation, high volatility","Commodities are free of tail risk, since physical demand puts a floor under prices","Commodity returns are always positively skewed and have low volatility"],"a":1,"e":"Commodities have historically offered diversification and inflation-hedging properties, but with high volatility and long periods of poor performance."},{"id":"RA055","t":"RA","r":"3.1.6","k":"c","q":"When interpreting historical timberland index returns, a key caveat is that:","o":["They are based on daily traded prices, so they overstate the volatility of timberland","They are appraisal-based, so reported volatility and correlations are likely understated","They include leverage, which inflates both the reported returns and volatility","They exclude income from harvesting, so they understate total returns"],"a":1,"e":"Timberland indices rely on appraisals, which smooth returns; unsmoothing is needed to estimate true risk."},{"id":"RA056","t":"RA","r":"3.4.5","k":"c","q":"Which trend has most supported demand for industrial (logistics/warehouse) real estate?","o":["Decline of e-commerce","Growth of e-commerce and supply chain needs","Reduced consumer spending","Increased office employment"],"a":1,"e":"E-commerce and supply chain reconfiguration increased demand for distribution and fulfillment space, while traditional retail faced pressure."},{"id":"RA057","t":"RA","r":"3.5.5","k":"c","q":"Which financing alternative sits between senior mortgage debt and common equity in the CRE capital stack?","o":["A ground lease on the land under the property","Mezzanine debt or preferred equity","A REIT dividend reinvestment plan","A sale-leaseback of the property"],"a":1,"e":"Mezzanine loans and preferred equity fill the gap between senior debt and common equity, earning higher returns for subordinated risk."},{"id":"PE001","t":"PE","r":"4.1.1","k":"c","q":"Which of the following is NOT generally considered a major category of private equity?","o":["Venture capital","Growth equity","Leveraged buyouts","Exchange-traded index funds"],"a":3,"e":"The main PE categories are venture capital, growth equity and buyouts (plus related strategies). Index ETFs are traditional liquid investments."},{"id":"PE002","t":"PE","r":"4.1.2","k":"c","q":"In a typical PE fund, the GP's own commitment to the fund is commonly around:","o":["0%","1%–2% (or more) of committed capital","25% of committed capital","50% of committed capital"],"a":1,"e":"GPs commonly commit around 1%–2% (sometimes more) of fund capital, aligning their interests with LPs."},{"id":"PE003","t":"PE","r":"4.1.3","k":"c","q":"Why do institutional investors often commit more than their target PE allocation (over-commitment)?","o":["To pay higher management fees, since fees are charged on committed rather than invested capital","Because capital is called gradually and returned over time, so invested capital stays below commitments","To avoid capital calls, because over-committed investors are allowed to skip some drawdowns","Because PE funds offer daily liquidity, so any excess exposure can be sold at any time"],"a":1,"e":"Since capital is called over time and returned through distributions, an LP must over-commit to keep its actual invested exposure near target, while managing the liquidity risk of capital calls."},{"id":"PE004","t":"PE","r":"4.1.4","k":"c","q":"A subscription line of credit in a PE fund is secured by:","o":["The portfolio companies' assets","The LPs' unfunded capital commitments","The GP's management company","Government guarantees"],"a":1,"e":"A SLOC is a short-term credit facility used for interim financing and secured by LPs' unfunded commitments."},{"id":"PE005","t":"PE","r":"4.1.4","k":"a","q":"How does using a subscription line to delay capital calls typically affect a fund's reported IRR?","o":["It lowers the reported IRR because interest on the credit line reduces the fund's cash returns","It raises IRR by shortening the time LP capital is outstanding, though the multiple may dip","It has no effect on IRR, since IRR is measured from the dates of the fund's investments","It converts the fund's IRR into a TVPI, which is then reported to LPs instead of the IRR"],"a":1,"e":"Delaying calls shortens the investment period measured from LPs' perspective, boosting IRR. Interest costs reduce the net multiple, so LPs should look at both measures."},{"id":"PE006","t":"PE","r":"4.1.5","k":"c","q":"Which stage of the LP–GP relationship life cycle comes first?","o":["Harvesting and distributions","Fundraising and due diligence leading to commitment","Capital calls for follow-on investments","Fund liquidation"],"a":1,"e":"The life cycle runs from fundraising/due diligence and commitment, through the investment period (capital calls), value creation and harvesting (exits and distributions), to liquidation."},{"id":"PE007","t":"PE","r":"4.1.6","k":"c","q":"Investing in the shares of a publicly traded PE firm (GP) provides exposure mainly to:","o":["The returns of a single fund's portfolio companies","The firm's fee-related earnings and carried interest from managing funds","Government bonds","Commodity prices"],"a":1,"e":"Listed GPs earn management fees and performance fees across funds; their equity reflects the asset management business rather than direct fund returns."},{"id":"PE008","t":"PE","r":"4.1.7","k":"c","q":"Historically, a direct listing differs from an IPO mainly because it:","o":["Requires underwriters to buy all newly issued shares and resell them to institutional investors","Lists existing shares without (originally) raising new capital, letting existing holders sell in the market","Is available only to SPACs that have completed a business combination within two years","Must raise a minimum amount of new capital from investors before the shares can trade"],"a":1,"e":"Direct listings historically listed existing shares without raising new capital (more recent ones can raise capital). They have mostly been used by VC- and growth-backed firms."},{"id":"PE009","t":"PE","r":"4.1.7","k":"c","q":"Which exit route for a PE-backed company involves selling it to a corporation in the same industry?","o":["Initial public offering (IPO)","Trade sale (strategic sale)","Secondary buyout to another sponsor","Leveraged recapitalization"],"a":1,"e":"A trade sale (strategic sale) sells the company to a strategic buyer, often able to pay for synergies. A secondary buyout is a sale to another financial sponsor."},{"id":"PE010","t":"PE","r":"4.1.8","k":"c","q":"After a SPAC's IPO, how long does the sponsor typically have to complete a business combination?","o":["About six months","About two years","Ten years","There is no deadline"],"a":1,"e":"The sponsor typically has about two years to identify a target and complete the business combination, otherwise cash is returned to shareholders."},{"id":"PE011","t":"PE","r":"4.1.8","k":"c","q":"Why can SPAC shares before a deal is announced be described as having a default-free floor?","o":["Their value is guaranteed by the underwriter, who must buy back shares at the IPO price","IPO proceeds (typically $10 per share) sit in escrow and can be returned to shareholders","They are senior secured bonds that rank ahead of the target company's creditors","The sponsor must buy back all shares at $18 if no business combination is completed"],"a":1,"e":"The cash held in escrow (typically $10 per share) provides downside protection, while warrants and potential deal upside create positively skewed returns, attractive to event-driven hedge funds."},{"id":"PE012","t":"PE","r":"4.1.8","k":"c","q":"In a typical SPAC, warrants have a strike price of $11.50. What happens when they are exercised?","o":["Existing shares are transferred from other investors","New shares are issued, diluting existing shareholders","The SPAC is liquidated","The escrow is returned"],"a":1,"e":"Warrants are exercised by paying cash to the issuer for newly issued shares, which dilutes holders who do not exercise."},{"id":"PE013","t":"PE","r":"4.2.2","k":"c","q":"Which venture capital stage typically finances a company that has a product and revenues and needs capital to scale production and sales?","o":["Angel/seed stage","Early stage","Late (expansion) stage","Pre-formation stage"],"a":2,"e":"Seed/angel funds ideas and prototypes; early stage funds initial commercialization; late/expansion stage funds scaling a company with revenues; mezzanine/pre-IPO prepares for exit."},{"id":"PE014","t":"PE","r":"4.2.3","k":"c","q":"Venture capital returns across individual investments are typically characterized by:","o":["Low dispersion and negative skew, with frequent small gains and occasional large losses","High dispersion, many failures and a few very large winners (positive skew)","Returns close to the risk-free rate, because diversification removes company-specific risk","Normally distributed returns with low volatility, similar to investment-grade bonds"],"a":1,"e":"VC outcomes are highly skewed: many companies fail or return little, while a few 'home runs' drive fund returns."},{"id":"PE015","t":"PE","r":"4.2.4","k":"c","q":"Research on VC fund performance generally finds that:","o":["Performance shows little dispersion across managers, so manager selection adds little value","Manager returns show more persistence than in many other asset classes, making manager selection important","Index funds can easily replicate VC returns using listed technology stocks","VC returns are uncorrelated with the economy and with public equity markets"],"a":1,"e":"VC performance is highly dispersed across managers and has shown notable persistence, so access to top-quartile managers matters greatly."},{"id":"PE016","t":"PE","r":"4.2.5","k":"n","q":"Using the VC method, a startup is expected to be worth $100 million in 5 years. The VC requires a 40% annual return and invests $5 million today. What ownership stake should the VC require (ignoring future dilution)?","o":["5.0%","18.6%","26.9%","36.8%"],"a":2,"e":"Post-money value = $100m / 1.40^5 = $18.59m. Ownership = $5m / $18.59m ≈ 26.9%. Pre-money = $18.59m − $5m ≈ $13.59m."},{"id":"PE017","t":"PE","r":"4.2.5","k":"c","q":"Pre-money valuation is equal to:","o":["Post-money valuation plus the new investment","Post-money valuation minus the new investment","The terminal value","The book value of equity"],"a":1,"e":"Post-money = pre-money + new investment, so pre-money = post-money − new investment."},{"id":"PE018","t":"PE","r":"4.2.6","k":"c","q":"Why do VC investors stage their financing over multiple rounds?","o":["To increase fees, since management fees are charged on each new financing round","To limit capital at risk and retain the option to abandon or continue based on milestones","Because regulations require venture capital to be invested in at least three rounds","To avoid due diligence, since later rounds rely on the work done by earlier investors"],"a":1,"e":"Staged financing provides an option to abandon underperforming ventures and to invest more as uncertainty is resolved, reducing agency problems."},{"id":"PE019","t":"PE","r":"4.2.7","k":"c","q":"Which security is most commonly used by VC investors in startups?","o":["Common stock","Convertible preferred stock","Senior secured bonds","Treasury bills"],"a":1,"e":"Convertible preferred gives liquidation preference and downside protection while allowing conversion to common to share in upside."},{"id":"PE020","t":"PE","r":"4.2.9","k":"c","q":"Growth equity investments are typically:","o":["Majority control positions financed with heavy leverage in mature, slow-growing companies","Minority positions in established, growing, often profitable companies with little or no leverage","Seed-stage investments in pre-revenue companies that are still developing a prototype","Investments in the distressed debt of companies seeking to restructure their balance sheets"],"a":1,"e":"Growth equity sits between VC and buyouts: minority stakes in companies with proven business models seeking capital to expand, using little leverage and relying on protective provisions."},{"id":"PE021","t":"PE","r":"4.2.11","k":"c","q":"Since growth equity investors usually hold minority stakes, how do they protect their interests?","o":["Through majority board control, which allows them to replace management at any time","Through protective provisions such as preferred terms, veto rights and liquidation preferences","By using high leverage at the company level to discipline management through debt payments","Through daily liquidity, which lets them sell their stake whenever they disagree with management"],"a":1,"e":"Minority growth investors rely on contractual protections: preferred securities, veto rights on major decisions, board seats, and liquidation preferences."},{"id":"PE022","t":"PE","r":"4.3.1","k":"c","q":"Which of the following is a key source of value creation in leveraged buyouts?","o":["Diversification across thousands of firms, which reduces the risk of each individual buyout","Operational improvements, financial engineering (leverage) and better alignment of management incentives","Holding large cash balances in portfolio companies to protect them against downturns","Avoiding changes to governance and management in order to preserve the existing culture"],"a":1,"e":"Buyouts create value through operational improvements, efficient capital structures, improved governance and management incentives, and multiple expansion."},{"id":"PE023","t":"PE","r":"4.3.2","k":"c","q":"A management buy-in (MBI) differs from a management buyout (MBO) because:","o":["MBIs are carried out only by public companies, whereas MBOs are carried out by PE funds","In an MBI an external management team acquires the company, whereas in an MBO current management buys it","MBIs do not use leverage, whereas MBOs are always financed mainly with debt","MBOs require an IPO of the company within five years, whereas MBIs do not"],"a":1,"e":"In an MBO, existing managers acquire the firm (usually with a sponsor). In an MBI, an outside management team buys in and replaces incumbents."},{"id":"PE024","t":"PE","r":"4.3.3","k":"c","q":"Compared with VC funds, buyout funds generally:","o":["Are smaller and invest in early-stage companies that are not yet profitable","Are larger, use more leverage, and target mature companies with stable cash flows","Invest only in technology startups, using convertible preferred stock","Never charge carried interest, relying only on management fees"],"a":1,"e":"Buyout funds are typically larger, invest in mature companies capable of supporting debt, and rely more on leverage and operational improvements."},{"id":"PE025","t":"PE","r":"4.3.4","k":"c","q":"Which company is the best candidate for a leveraged buyout?","o":["A pre-revenue biotech startup with promising patents but no cash flows","A mature firm with stable cash flows, low existing debt and room for efficiency gains","A highly cyclical firm with volatile cash flows and significant existing debt","A bank with high regulatory capital requirements and leverage limits"],"a":1,"e":"LBO targets need stable cash flows to service debt, low existing leverage, tangible assets and opportunities for operational improvement."},{"id":"PE026","t":"PE","r":"4.3.5","k":"c","q":"A PIPE (private investment in public equity) involves:","o":["Buying shares of a public company on the open market, through a broker, at the market price","Privately negotiated purchase of securities directly from a public company, often at a discount","Taking a public company private through a leveraged buyout financed by a PE sponsor","Investing in a non-traded private REIT that holds stakes in public real estate companies"],"a":1,"e":"PIPEs are private placements of equity or convertibles by public companies, often smaller firms needing capital quickly, typically priced at a discount."},{"id":"PE027","t":"PE","r":"4.3.6","k":"c","q":"Which is an example of a liquid alternative providing private equity exposure?","o":["A closed-end limited partnership fund with a ten-year life and capital calls","Listed PE vehicles, such as listed GPs or listed PE investment companies","A direct co-investment alongside a GP in a single portfolio company","A secondary fund that buys existing LP interests from other investors"],"a":1,"e":"Listed PE vehicles (listed GPs, BDCs, listed fund-of-funds or investment companies) offer daily liquidity but trade with equity market volatility and premiums/discounts to NAV."},{"id":"PE028","t":"PE","r":"4.3.7","k":"c","q":"A key motivation for long-hold buyout funds is that traditional PE funds:","o":["Cannot use leverage, which limits the returns they can earn on mature companies","Must sometimes sell companies because the fund term ends, not for business reasons","Charge no management fees, which makes them unattractive to GPs","Offer daily liquidity, which forces them to hold large cash balances"],"a":1,"e":"Long-hold funds address forced exits driven by fund life, allowing longer ownership of compounding businesses and reducing transaction costs."},{"id":"PE029","t":"PE","r":"4.1.2","k":"c","q":"Co-investments alongside a PE fund typically offer LPs:","o":["Higher fees than the main fund, in exchange for greater diversification across deals","Reduced or no fees and carry on the co-invested capital, with more concentrated exposure","Guaranteed minimum returns, since the GP commits to cover any losses on co-investments","Automatic daily liquidity, as co-investments are traded on secondary exchanges"],"a":1,"e":"Co-investments let LPs invest directly in specific deals with low or no fees, but they increase concentration and require the ability to evaluate deals quickly."},{"id":"PE030","t":"PE","r":"4.1.3","k":"c","q":"The main benefit of a fund-of-funds approach to PE for a smaller investor is:","o":["Lower total fees than investing directly in primary funds, since there is only one fee layer","Diversification, access to managers and professional selection, at the cost of an additional fee layer","Higher liquidity, because fund-of-funds interests can be redeemed monthly at NAV","Control over portfolio companies, through board seats held by the fund-of-funds manager"],"a":1,"e":"Funds of funds provide diversification, manager access and due diligence expertise, but add a second layer of fees."},{"id":"PE031","t":"PE","r":"4.1.1","k":"c","q":"In the secondary market for private equity, investors typically:","o":["Buy newly issued shares of PE-backed companies in their initial public offerings","Purchase existing LP interests in funds, often at a discount to NAV, mitigating the J-curve","Provide loans to portfolio companies to finance dividend recapitalizations","Short sell the shares of PE funds to hedge their primary commitments"],"a":1,"e":"Secondary buyers acquire existing fund interests from LPs seeking liquidity, often at discounts, gaining exposure to more mature portfolios."},{"id":"PE032","t":"PE","r":"4.2.8","k":"c","q":"Which factor tends to increase competition and valuations in venture capital?","o":["Fewer funds raised","Large inflows of capital into VC and the entry of non-traditional investors","Rising interest rates and reduced risk appetite","A lack of exits"],"a":1,"e":"Abundant capital and new entrants (crossover funds, corporates) increase competition for deals and push up valuations."},{"id":"PE033","t":"PE","r":"4.2.10","k":"c","q":"Compared with buyouts, a key risk of growth equity is:","o":["High leverage at the portfolio company, which makes it vulnerable to rising rates","Execution risk of the growth plan and limited control as a minority holder","Interest rate risk on the floating-rate debt that finances most growth deals","Commodity price risk, since growth equity targets are mainly resource companies"],"a":1,"e":"Growth equity relies on companies executing expansion plans, while minority investors have limited control; leverage is usually low."},{"id":"PD001","t":"PD","r":"5.1.1","k":"c","q":"Direct lending funds most commonly provide:","o":["Unsecured fixed-rate bonds to investment-grade issuers","Senior secured, floating-rate loans to middle-market companies, often sponsor-backed","Equity stakes in startups","Mortgage loans to homeowners"],"a":1,"e":"Direct lenders typically originate senior secured, floating-rate loans to middle-market borrowers that are often owned by PE sponsors, replacing bank lending."},{"id":"PD002","t":"PD","r":"5.1.2","k":"c","q":"Under a US Chapter 11 bankruptcy, the firm:","o":["Is always liquidated and its assets sold by a trustee to repay creditors","Usually keeps operating while it reorganizes under court supervision","Pays all creditors in full immediately using a government guarantee","Cannot negotiate with creditors until the court has sold its assets"],"a":1,"e":"Chapter 11 is reorganization (the firm continues operating, often as debtor-in-possession). Chapter 7 is liquidation."},{"id":"PD003","t":"PD","r":"5.1.2","k":"c","q":"The absolute priority rule states that:","o":["Equity holders are paid before bondholders because they bear residual risk","Senior claims must be paid in full before junior claims receive anything","All creditors share losses equally, regardless of the seniority of their claims","Secured creditors are paid last because they can seize their collateral"],"a":1,"e":"Under absolute priority, distributions follow seniority: senior secured, then senior unsecured, subordinated debt and finally equity. In practice, negotiated deviations occur."},{"id":"PD004","t":"PD","r":"5.1.2","k":"c","q":"In Altman's Z-score model, a lower Z-score indicates:","o":["Higher profitability","Higher probability of bankruptcy","Lower leverage","Higher market valuation"],"a":1,"e":"The Z-score combines financial ratios (working capital, retained earnings, EBIT, market value of equity to liabilities, sales, each scaled appropriately). Low scores signal a higher risk of distress."},{"id":"PD005","t":"PD","r":"5.1.3","k":"c","q":"Compared with high-yield bonds, leveraged loans typically:","o":["Are unsecured and fixed rate","Are senior secured, floating rate and prepayable","Have no covenants at all","Rank below equity in bankruptcy"],"a":1,"e":"Leveraged loans are usually senior secured floating-rate obligations that can be prepaid, while high-yield bonds are often unsecured fixed-rate instruments with call protection."},{"id":"PD006","t":"PD","r":"5.1.4","k":"c","q":"A unitranche loan:","o":["Combines senior and subordinated debt into a single loan with one blended interest rate","Is a type of preferred equity that converts into common stock at the lender's option","Is a sovereign bond issued in a single tranche to institutional investors","Has no seniority, ranking equally with the borrower's common equity in bankruptcy"],"a":0,"e":"Unitranche facilities blend senior and junior debt into one instrument and one document, simplifying financing for borrowers, typically provided by direct lenders."},{"id":"PD007","t":"PD","r":"5.1.5","k":"c","q":"Mezzanine debt typically includes which feature to compensate lenders for subordination?","o":["A lower coupon than senior debt, offset by stronger collateral protection","Equity kickers such as warrants, and sometimes PIK interest","First-lien security on all assets, ranking ahead of the senior lenders","Daily liquidity, since mezzanine loans trade on organized exchanges"],"a":1,"e":"Mezzanine debt is subordinated to senior debt and compensates lenders through higher coupons, payment-in-kind (PIK) features and equity participation via warrants or conversion rights."},{"id":"PD008","t":"PD","r":"5.1.6","k":"c","q":"Payment-in-kind (PIK) interest means that:","o":["Interest is paid in commodities delivered by the borrower","Interest is added to the principal balance instead of being paid in cash","Interest is waived for the first years of the loan","Interest is paid in advance at origination"],"a":1,"e":"PIK interest accrues to principal, preserving the borrower's cash flow but increasing the lender's exposure over time."},{"id":"PD009","t":"PD","r":"5.1.7","k":"c","q":"Venture debt is typically provided to:","o":["Mature, investment-grade corporations seeking to refinance their public bonds","VC-backed startups, often between equity rounds, frequently with warrants attached","Governments financing infrastructure projects through public-private partnerships","Real estate developers financing construction of income-producing properties"],"a":1,"e":"Venture debt lends to VC-backed companies, extending runway between equity rounds with less dilution; lenders rely on VC sponsors' support and often receive warrants."},{"id":"PD010","t":"PD","r":"5.1.8","k":"c","q":"In distressed debt investing, the 'fulcrum security' is:","o":["The most senior secured claim, which is always repaid in full in a reorganization","The class most likely to be converted into control of the reorganized company","The common stock of the bankrupt company, which is always cancelled in Chapter 11","A credit default swap used to hedge the distressed investor's bond positions"],"a":1,"e":"The fulcrum security is the most senior class that is not fully covered by enterprise value; it typically receives the new equity in reorganization, offering control."},{"id":"PD011","t":"PD","r":"5.1.8","k":"c","q":"Which distressed debt strategy aims to influence the reorganization process and potentially gain control of the company?","o":["Passive buy-and-hold of liquid bonds","Active control-oriented distressed investing","Short selling equity only","Index tracking"],"a":1,"e":"Active (control) distressed investors buy significant positions, often in the fulcrum security, to shape the restructuring and gain control."},{"id":"PD012","t":"PD","r":"5.1.9","k":"c","q":"Infrastructure debt is generally attractive to long-term investors because it offers:","o":["High correlation with equities, which increases expected returns in bull markets","Long maturities and stable cash flows from essential assets, with low historical defaults","Short maturities only, which reduce interest rate risk for liability-driven investors","No exposure to regulation, since the underlying assets are privately owned"],"a":1,"e":"Infrastructure debt finances essential, often regulated or contracted assets, offering long-duration, stable cash flows and relatively favorable credit performance."},{"id":"PD013","t":"PD","r":"5.2.1","k":"n","q":"A lender's borrowing base allows 80% of eligible receivables and 50% of eligible inventory. The borrower has $10 million of eligible receivables and $6 million of eligible inventory. What is the maximum borrowing?","o":["$8 million","$11 million","$12.8 million","$16 million"],"a":1,"e":"Borrowing base = 0.80 × $10m + 0.50 × $6m = $8m + $3m = $11m."},{"id":"PD014","t":"PD","r":"5.2.2","k":"c","q":"A key risk of asset-based loans is:","o":["The collateral's liquidation value may fall short of the loan (e.g., obsolete inventory)","They have no collateral, so lenders rely only on the borrower's credit rating","They are always fixed-rate, exposing lenders to rising interest rates","They cannot be monitored, since borrowers report collateral only once a year"],"a":0,"e":"ABL relies on collateral values; risks include collateral deterioration, valuation errors, fraud and difficulties in liquidation."},{"id":"PD015","t":"PD","r":"5.2.3","k":"c","q":"Asset-backed securities (ABS) are typically backed by pools of:","o":["Corporate equities held by special purpose vehicles and their dividends","Consumer and commercial receivables such as auto loans and credit cards","Sovereign bonds issued by developed-market governments and their coupons","Commodity futures held in a fully collateralized trust structure"],"a":1,"e":"ABS securitize non-mortgage receivables (auto loans, credit cards, student loans, equipment leases) via SPVs."},{"id":"PD016","t":"PD","r":"5.2.4","k":"c","q":"Why do mortgage-backed securities exhibit negative convexity?","o":["Because they pay no coupons, so all of their value comes from the final principal payment","Because borrowers prepay when rates fall, limiting price appreciation, and slow prepayments when rates rise","Because they pay floating-rate coupons that reset monthly to market interest rates","Because they are equity securities whose value depends on house prices"],"a":1,"e":"The borrower's prepayment option caps upside when rates fall and extends duration when rates rise, producing negative convexity."},{"id":"PD017","t":"PD","r":"5.2.3","k":"c","q":"The conditional prepayment rate (CPR) is used to measure:","o":["The probability that borrowers in a pool will default over the next year","The speed of prepayments on a pool of loans, as an annualized rate","The interest rate at which borrowers can refinance their mortgages","The share of a pool's principal that is guaranteed by a government agency"],"a":1,"e":"Investors in securitized loan pools must consider the speed of prepayments, measured by the conditional prepayment rate (CPR), an annualized percentage of the outstanding balance prepaid."},{"id":"PD018","t":"PD","r":"5.2.5","k":"n","q":"What is the monthly payment on a $300,000, 30-year fixed-rate mortgage at 6% annual interest (monthly compounding)?","o":["$1,500.00","$1,798.65","$1,833.33","$2,531.57"],"a":1,"e":"PMT = P × r / (1 − (1+r)^−n) with r = 0.5%, n = 360: ≈ $1,798.65."},{"id":"PD019","t":"PD","r":"5.2.5","k":"c","q":"In a fully amortizing fixed-rate mortgage, as time passes:","o":["The interest portion of each payment increases while principal decreases","The principal portion of each payment increases while the interest portion decreases","Payments rise each month to keep pace with inflation","The outstanding balance grows over the first half of the loan"],"a":1,"e":"With level payments, early payments are mostly interest; as the balance declines, more of each payment goes to principal."},{"id":"PD020","t":"PD","r":"5.2.5","k":"c","q":"A negative amortization mortgage is one where:","o":["The balance declines faster than scheduled because of extra principal payments","Payments are less than interest due, so unpaid interest is added to the balance","Payments cover interest only, so the balance stays constant until maturity","The interest rate is always fixed, but payments decline over time"],"a":1,"e":"When payments do not cover accrued interest, the shortfall is capitalized and the loan balance grows."},{"id":"PD021","t":"PD","r":"5.3.1","k":"c","q":"Catastrophe bonds allow insurers to:","o":["Increase their exposure to natural disasters by buying catastrophe risk from investors","Transfer catastrophe risk to capital market investors, who lose principal if a specified event occurs","Borrow at the risk-free rate, using catastrophe bonds as collateral with central banks","Avoid paying claims to policyholders when a natural disaster occurs"],"a":1,"e":"Cat bonds transfer insurance risk to investors via SPVs. Investors earn a spread but may lose principal if a qualifying catastrophe occurs."},{"id":"PD022","t":"PD","r":"5.3.2","k":"c","q":"Which cat bond trigger pays out based on the issuer's actual losses, minimizing basis risk for the issuer but creating moral hazard?","o":["Parametric","Industry index","Indemnity","Modeled loss"],"a":2,"e":"Indemnity triggers reference the sponsor's actual losses (low basis risk for the sponsor, but less transparent for investors). Parametric triggers use physical event parameters (e.g., wind speed)."},{"id":"PD023","t":"PD","r":"5.3.2","k":"c","q":"A parametric trigger is based on:","o":["The sponsor's actual claims paid after the event","Physical event parameters such as wind speed or magnitude","An industry-wide loss index compiled by a third party","The insurer's stock price on the day after the event"],"a":1,"e":"Parametric triggers are transparent and quick to settle but create basis risk because payouts may not match the sponsor's actual losses."},{"id":"PD024","t":"PD","r":"5.3.3","k":"c","q":"Cat bonds are attractive to diversified investors mainly because:","o":["Their returns are highly correlated with equities","Natural catastrophe risk is largely uncorrelated with financial market risk","They have no default risk","They pay no spread"],"a":1,"e":"Catastrophe losses are driven by natural events, giving low correlation with stocks and bonds, though losses can be large and sudden."},{"id":"PD025","t":"PD","r":"5.4.1","k":"c","q":"Financial structuring (tranching) creates securities that:","o":["All have the same risk and return as the underlying pool of assets, in smaller units","Reallocate the pool's cash flows and risks into tranches of different seniority","Eliminate the credit risk of the underlying pool for all investors in the structure","Are always rated AAA, regardless of the quality of the underlying collateral"],"a":1,"e":"Tranching reallocates risk: senior tranches have priority and lower risk, while junior/equity tranches absorb first losses for higher expected returns. Total risk of the pool remains."},{"id":"PD026","t":"PD","r":"5.4.2","k":"c","q":"In a sequential-pay CMO, principal payments are allocated:","o":["Pro rata to all tranches according to their original size","Entirely to the first tranche until it is retired, then to the next","Only to the equity tranche, until it is fully retired","Randomly among tranches, by lottery each month"],"a":1,"e":"Sequential-pay structures direct all principal to tranche A until paid off, then to B, and so on, creating tranches with different average lives."},{"id":"PD027","t":"PD","r":"5.4.2","k":"c","q":"In a CMO with a planned amortization class (PAC) tranche, the companion (support) tranche:","o":["Has the most stable cash flows of all tranches in the CMO","Absorbs prepayment variability so the PAC can stay on its schedule","Is senior to all other tranches with respect to credit losses","Receives only interest payments and never any principal"],"a":1,"e":"Companion tranches take excess or insufficient prepayments, protecting the PAC's schedule; they therefore bear more contraction and extension risk."},{"id":"PD028","t":"PD","r":"5.4.2","k":"c","q":"How does a principal-only (PO) strip typically respond to falling interest rates?","o":["Its value falls, because slower prepayments delay principal","Its value rises, as faster prepayments return principal sooner","It is unaffected, since principal is always repaid at par","It defaults, because the strip no longer receives interest"],"a":1,"e":"PO holders benefit from faster prepayments when rates fall. Interest-only (IO) strips lose value because interest stops on prepaid principal."},{"id":"PD029","t":"PD","r":"5.4.3","k":"c","q":"An arbitrage CDO is created mainly to:","o":["Remove assets from a bank's balance sheet for regulatory capital relief","Capture the spread between collateral yields and tranche funding costs","Hedge currency risk","Fund a single company"],"a":1,"e":"Arbitrage CDOs seek to profit from the difference between collateral yields and tranche funding costs. Balance sheet CDOs transfer assets off a bank's balance sheet."},{"id":"PD030","t":"PD","r":"5.4.4","k":"c","q":"A synthetic CDO gains credit exposure primarily through:","o":["Buying a portfolio of physical corporate bonds funded with tranches","Selling credit default swaps on a reference portfolio","Buying equities of the reference entities in the portfolio","Holding commodity futures as collateral for the tranches"],"a":1,"e":"Synthetic CDOs obtain credit exposure via CDS rather than owning the underlying debt (cash CDOs)."},{"id":"PD031","t":"PD","r":"5.4.5","k":"c","q":"In a market value CDO, compared with a cash flow CDO:","o":["Tranche payments depend only on collateral cash flows and defaults","Coverage tests depend on the collateral's market value, which is actively traded","Collateral can never be sold","There are no tranches"],"a":1,"e":"Market value CDOs are managed based on collateral market values (with forced sales if values fall below thresholds). Cash flow CDOs focus on collateral cash flows and defaults."},{"id":"PD032","t":"PD","r":"5.5.1","k":"c","q":"Which tranche of a CDO is most exposed to default correlation increasing?","o":["The equity tranche only, since it absorbs the first losses on the pool","Senior tranches, which become more likely to suffer losses when defaults cluster","No tranche is affected, since correlation does not change expected losses","Only the mezzanine tranche, which benefits from higher default correlation"],"a":1,"e":"Higher default correlation increases the probability of many joint defaults, raising risk for senior tranches. Equity tranches can actually benefit from higher correlation (more chance of few defaults)."},{"id":"PD033","t":"PD","r":"5.5.2","k":"c","q":"Which of the following is an internal credit enhancement?","o":["A bank letter of credit","Overcollateralization, subordination and excess spread","Bond insurance from a monoline insurer","A parent company guarantee"],"a":1,"e":"Internal enhancements come from the structure itself: subordination, overcollateralization, excess spread and reserve accounts. External enhancements come from third parties (insurance, letters of credit, guarantees)."},{"id":"PD034","t":"PD","r":"5.5.3","k":"c","q":"In a credit default swap, the protection buyer:","o":["Receives periodic premiums and pays on default","Pays periodic premiums and receives compensation if a credit event occurs","Owns the reference bond by definition","Takes on credit risk"],"a":1,"e":"The protection buyer pays the CDS spread (premium) and is compensated for losses after a credit event; the seller takes on the credit risk."},{"id":"PD035","t":"PD","r":"5.5.4","k":"n","q":"An investor buys $10 million of CDS protection at a 200 bp annual spread. The reference entity defaults with a 40% recovery rate. What is the annual premium paid and the payout on default?","o":["$200,000 premium; $4 million payout","$200,000 premium; $6 million payout","$2 million premium; $6 million payout","$20,000 premium; $10 million payout"],"a":1,"e":"Annual premium = 2% × $10m = $200,000. Payout = notional × (1 − recovery) = $10m × 60% = $6m."},{"id":"PD036","t":"PD","r":"5.5.5","k":"c","q":"CDX and iTraxx are:","o":["Equity indices tracking the share prices of the largest banks in North America and Europe","Credit default swap indices referencing baskets of corporate entities in North America and Europe/Asia","Real estate indices based on appraisals of commercial properties in the US and Europe","Commodity indices weighted by production in North America and Europe/Asia"],"a":1,"e":"CDX (North America, emerging markets) and iTraxx (Europe, Asia) are standardized CDS indices on baskets of reference entities, used to trade broad credit exposure."},{"id":"PD037","t":"PD","r":"5.5.6","k":"c","q":"In a total return swap, the total return receiver:","o":["Receives the asset's income and price changes and pays a floating rate plus spread","Pays the asset's total return and receives a floating rate plus spread","Only receives credit protection in exchange for a periodic premium","Legally owns the reference asset and lends it to the payer"],"a":0,"e":"The receiver gets synthetic exposure to the reference asset's coupons and price changes without owning it, and pays a floating rate plus spread to the payer."},{"id":"PD038","t":"PD","r":"5.5.6","k":"c","q":"A credit-linked note (CLN) is best described as:","o":["A funded note whose repayment depends on a reference entity's credit (investor is short a CDS)","An equity option whose payoff depends on the share price of a reference entity","A Treasury bond whose coupon is indexed to a credit spread index","An uncollateralized swap in which the investor receives credit protection on a reference entity"],"a":0,"e":"A CLN is a funded instrument: the investor pays principal and earns a coupon including the CDS spread, but principal is reduced if the reference entity suffers a credit event."},{"id":"PD039","t":"PD","r":"5.2.6","k":"c","q":"Historically, which risk has been a key driver of returns on agency mortgage-backed securities?","o":["Default risk on the underlying mortgages, since agencies do not guarantee principal","Prepayment (and interest rate) risk, since agency guarantees largely remove credit risk","Equity market risk, since agency MBS prices closely track the S&P 500","Commodity price risk, through the effect of energy prices on homeowners"],"a":1,"e":"Agency MBS carry an agency guarantee, so their returns are driven mainly by interest rate and prepayment risk."},{"id":"HF001","t":"HF","r":"6.1.1","k":"c","q":"Compared with traditional mutual funds, hedge funds are generally distinguished by:","o":["Stricter disclosure rules, daily liquidity and caps on leverage imposed by securities regulators","Less regulation, use of short selling and leverage, performance fees and less transparency","A prohibition on derivatives and short sales, with fees based only on assets under management","Benchmark-relative mandates with tight tracking error limits and full portfolio transparency"],"a":1,"e":"Hedge funds use their lighter regulatory status to employ shorting, leverage and derivatives, typically charge incentive fees, offer limited liquidity and less transparency."},{"id":"HF002","t":"HF","r":"6.1.1","k":"c","q":"Hedge fund lockup periods and redemption notice periods mainly serve to:","o":["Raise the management fee base by preventing investors from withdrawing capital during the year","Give managers stable capital to pursue less liquid strategies and avoid forced selling","Allow investors to trade fund units daily on an exchange at a price close to NAV","Increase portfolio transparency by forcing the manager to publish holdings during the lockup"],"a":1,"e":"Lockups, notice periods and gates match the fund's liquidity terms to the liquidity of its assets, protecting remaining investors from fire sales."},{"id":"HF003","t":"HF","r":"6.1.2","k":"c","q":"A long/short equity manager is long $100 of stock A, posted as collateral, and short $100 of stock B. Both move 10% against the manager in one day. What problem arises?","o":["No problem arises because the gain on one position exactly offsets the loss on the other","A collateral shortfall: the short needs $110 of collateral but the long is worth only $90","The manager receives excess collateral back from the lender because the long position fell","The short position closes automatically at a profit once the stock rises by 10%"],"a":1,"e":"Adverse moves on both legs create a $20 collateral gap, illustrating the liquidity risk of short selling, especially for leveraged managers."},{"id":"HF004","t":"HF","r":"6.1.2","k":"c","q":"A short squeeze occurs when:","o":["Short sellers profit as a falling price lets them cover at lower levels than their sale price","A rising price forces short sellers to buy back shares, pushing the price even higher","Securities lenders cut borrowing fees, encouraging more investors to open short positions","A heavily shorted stock is delisted, so short sellers no longer need to return the shares"],"a":1,"e":"When a heavily shorted stock rises or shares are recalled, short sellers rush to cover, adding buying pressure and intensifying the rise."},{"id":"HF005","t":"HF","r":"6.1.4","k":"c","q":"Why do many investors allocate to hedge funds?","o":["To obtain returns that are contractually guaranteed by the fund manager in all market conditions","To seek diversification and absolute returns with lower correlation to traditional assets","To access daily liquidity and low fees comparable to those of passive index funds","To replicate equity index returns with lower tracking error than traditional managers"],"a":1,"e":"Hedge funds are used for diversification, absolute return objectives and access to skill-based strategies, though fees, liquidity and transparency are trade-offs."},{"id":"HF006","t":"HF","r":"6.1.5","k":"c","q":"A key disadvantage of funds of hedge funds relative to multistrategy funds is:","o":["Less diversification across managers, since a fund of funds can only hold two or three funds","An extra fee layer, with incentive fees paid to winning managers even if the total loses","No professional manager selection or monitoring, which leaves due diligence to the end investor","Lower liquidity than the underlying funds, as funds of funds impose longer lockups than all hedge funds"],"a":1,"e":"Funds of funds charge a second fee layer, and incentive fees to winning underlying managers are not netted against losers. Multistrategy funds can net performance across strategies."},{"id":"HF007","t":"HF","r":"6.1.5","k":"c","q":"Which is an advantage of multistrategy funds over funds of funds?","o":["Greater diversification across independent firms, which removes operational and business risk","Lower fee drag through a single fee layer, netting of incentive fees across strategies, and faster capital reallocation","Higher transparency, as all multistrategy funds publish their full holdings to investors daily","Lower minimum investments, since multistrategy funds are registered mutual funds with daily liquidity"],"a":1,"e":"Multistrategy funds have one fee layer with netting, central risk management and can reallocate quickly, but concentrate operational and business risk in one firm."},{"id":"HF008","t":"HF","r":"6.1.7","k":"c","q":"Backfill bias in hedge fund databases arises when:","o":["Funds that stop reporting after poor performance are removed from the historical record","Funds join a database and their favorable past returns are added retroactively","Reported returns are smoothed because illiquid assets are valued using stale or model prices","Indices give equal weight to small and large funds, overstating the influence of small funds"],"a":1,"e":"Managers tend to start reporting after a good track record; adding that history inflates database averages (instant history bias)."},{"id":"HF009","t":"HF","r":"6.1.7","k":"c","q":"Which is a known limitation of hedge fund indices?","o":["They are always investable and include every hedge fund, so they match investors' achievable returns","They suffer from biases such as survivorship, backfill and self-selection, and may not be investable","They are required by regulation to include all registered hedge funds with audited returns","They are free of fees, so reported returns overstate what investors in actual funds would earn"],"a":1,"e":"Since reporting is voluntary, indices are subject to self-selection, survivorship and backfill biases; investable indices may also differ from non-investable ones."},{"id":"HF010","t":"HF","r":"6.2.2","k":"c","q":"Global macro hedge funds primarily:","o":["Concentrate on bottom-up stock picking in small-cap equities, avoiding currencies and rates","Take directional positions across asset classes (currencies, rates, equities, commodities) based on macroeconomic views","Invest mainly in the bonds of companies in or near bankruptcy, aiming to influence restructurings","Use only high-frequency statistical arbitrage models, holding positions for a few seconds"],"a":1,"e":"Global macro managers take top-down views on economies and policies, expressed through liquid instruments across asset classes, discretionary or systematic."},{"id":"HF011","t":"HF","r":"6.2.3","k":"c","q":"Managed futures funds are typically run by:","o":["Commodity trading advisors (CTAs) trading futures and forwards, often systematically","Private equity general partners who buy controlling stakes in companies and hold them for years","REIT managers who acquire income-producing properties and distribute most of their taxable income","Mortgage servicers who collect payments on pools of residential loans on behalf of investors"],"a":0,"e":"Managed futures are managed by CTAs/CPOs trading listed futures, options and forwards, frequently with systematic trend-following models."},{"id":"HF012","t":"HF","r":"6.2.4","k":"c","q":"In a simple moving-average crossover system, a buy signal occurs when:","o":["The short-term moving average crosses above the long-term moving average","The price falls below the long-term average","Volatility rises","The long-term average crosses above the short-term average"],"a":0,"e":"Trend followers buy when the faster (short-term) average crosses above the slower average, signaling an uptrend, and sell on the opposite crossover."},{"id":"HF013","t":"HF","r":"6.2.4","k":"c","q":"A key difference between trend-following and mean-reversion (countertrend) systems is that:","o":["Trend followers bet that price moves will continue, while countertrend systems bet on reversals","Both systems assume that recent price moves will continue, but they use different data frequencies","Countertrend systems assume trends continue, whereas trend followers bet that prices revert to fair value","Trend following works only in equity markets, while countertrend systems work only in commodities"],"a":0,"e":"Trend followers buy rising markets and sell falling ones; countertrend strategies sell after rises and buy after declines, expecting reversion."},{"id":"HF014","t":"HF","r":"6.2.5","k":"c","q":"Trend-following returns are often compared to:","o":["Short volatility positions, with negative skew and steady gains that are lost in market crises","Long option (long volatility) positions, with positive skew and strong performance during prolonged market declines","Riskless bonds, with stable returns that are largely unaffected by trends in financial markets","Short put positions, earning a premium in calm markets but suffering large losses in sharp sell-offs"],"a":1,"e":"Trend following can profit from large sustained moves in either direction, resembling a long straddle (lookback) payoff, often described as offering 'crisis alpha'."},{"id":"HF015","t":"HF","r":"6.2.7","k":"c","q":"In systematic futures portfolio construction, positions are often sized using:","o":["Equal notional amounts in every market, so that each contract has the same face value in the portfolio","Volatility scaling so that each market contributes a similar amount of risk","The market capitalization of each underlying market, so that larger markets receive more capital","Each market's past return, so that capital is concentrated in the best-performing markets last year"],"a":1,"e":"CTAs commonly scale positions inversely to volatility (risk parity–like) so that a volatile market like crude oil does not dominate the portfolio's risk."},{"id":"HF016","t":"HF","r":"6.2.8","k":"c","q":"A core benefit of managed futures for investors is:","o":["High correlation with equities during crises, which magnifies portfolio gains in bull markets","Diversification, liquidity, transparency and potential gains in equity bear markets","A contractual guaranteed income stream similar to that of investment-grade bonds","An illiquidity premium earned by holding long-dated private assets that are rarely traded"],"a":1,"e":"Managed futures offer liquid, transparent exposure that has historically diversified equity risk, often performing well during extended crises."},{"id":"HF017","t":"HF","r":"6.3.1","k":"c","q":"Event-driven strategies are often described as similar to:","o":["Buying insurance: paying small premiums in normal times and earning large gains when events fail","Selling insurance: small gains when events succeed, large losses when they fail","Holding cash: earning the riskless rate with no exposure to the outcome of corporate events","A long straddle: profiting from large price moves in either direction around corporate events"],"a":1,"e":"Event strategies collect a premium for bearing event risk; returns resemble short options with negative skewness."},{"id":"HF018","t":"HF","r":"6.3.2","k":"c","q":"Activist investors typically seek to:","o":["Remain passive shareholders, voting with management on all proposals to avoid conflicts with boards","Influence management and boards (e.g., strategy, capital allocation, governance) to unlock value","Short sell the company's bonds while holding its equity, profiting from widening credit spreads","Invest only in private companies, where they can gain full control without engaging boards"],"a":1,"e":"Activists take significant stakes and push for changes such as board seats, buybacks, divestitures or governance reforms."},{"id":"HF019","t":"HF","r":"6.3.3","k":"c","q":"Which is a common goal of shareholder activism?","o":["Increasing executive pay unconditionally to retain management, regardless of performance","Returning excess cash, improving governance, or a divestiture or sale","Delisting the company to reduce disclosure, even if it lowers value for minority shareholders","Increasing leverage as much as possible, regardless of the effect on the company's credit risk"],"a":1,"e":"Activist demands often include capital returns, cost reductions, board changes, spinoffs or sale of the company."},{"id":"HF020","t":"HF","r":"6.3.4","k":"n","q":"In an all-cash deal, an acquirer offers $50 per share for a target that trades at $48 after the announcement. What is the gross merger arbitrage spread (return if the deal closes)?","o":["2.00%","4.00%","4.17%","4.35%"],"a":2,"e":"Spread = (50 − 48) / 48 = 4.17%. The arbitrageur bears the risk that the deal fails and the target falls."},{"id":"HF021","t":"HF","r":"6.3.4","k":"c","q":"In a stock-for-stock merger, a typical merger arbitrage position is:","o":["Long the acquirer and short the target in proportion to the exchange ratio","Long the target and short the acquirer in proportion to the exchange ratio","Long both the target and the acquirer, to benefit from expected synergies after the merger","Short both the target and the acquirer, expecting both stocks to fall when the deal closes"],"a":1,"e":"The arbitrageur buys the target and shorts the acquirer per the exchange ratio, locking in the spread and hedging the acquirer's price risk."},{"id":"HF022","t":"HF","r":"6.3.4","k":"c","q":"The largest risk in merger arbitrage is typically:","o":["Interest rate risk: rising rates reduce the present value of the deal consideration","Deal (event) risk: the merger fails or terms change","Currency risk: exchange rate moves change the value of the consideration in cross-border deals","Inflation risk: higher inflation erodes the real value of the fixed cash offer price"],"a":1,"e":"If a deal breaks, the target usually falls sharply, producing large losses relative to the small spread, hence negative skewness."},{"id":"HF023","t":"HF","r":"6.3.5","k":"c","q":"Distressed securities funds tend to have returns that are:","o":["Highly liquid and low risk, since distressed securities trade on major exchanges in large volumes","Exposed to credit and liquidity risk, with performance tied to the credit cycle","Largely uncorrelated with the economy, because bankruptcy outcomes depend only on court decisions","Negatively correlated with high-yield bonds, as distressed debt rallies when credit spreads widen"],"a":1,"e":"Distressed investing earns compensation for illiquidity, complexity and credit risk; returns are cyclical and suffer in credit crises."},{"id":"HF024","t":"HF","r":"6.3.6","k":"c","q":"Event-driven multistrategy funds:","o":["Invest only in merger arbitrage, holding long positions in targets and short positions in acquirers","Combine several event strategies (merger arb, distressed, activism, special situations) and allocate dynamically among them","Avoid all corporate events, trading only index futures to keep market exposure close to zero","Are always market neutral, with zero beta and no exposure to credit or equity markets"],"a":1,"e":"They diversify across event types and shift capital toward the most attractive opportunities as the cycle evolves."},{"id":"HF025","t":"HF","r":"6.4.1","k":"c","q":"Why do relative value hedge funds typically use substantial leverage?","o":["Because their spreads are typically large, so leverage further increases already high returns","Because the return from convergence trades is typically small, so leverage is needed to reach acceptable returns","Because leverage increases market beta, which is the main source of relative value returns","Because regulation requires relative value funds to hold leveraged positions in government bonds"],"a":1,"e":"Convergence returns are small, so leverage amplifies them, exposing funds to forced deleveraging in crises when spreads widen."},{"id":"HF026","t":"HF","r":"6.4.2","k":"c","q":"A classic convertible bond arbitrage position consists of:","o":["Short the convertible bond and long the underlying stock in a delta-hedged ratio","Long the convertible bond and short the underlying stock in a delta-hedged ratio","Long the underlying stock only, using the convertible as collateral for margin borrowing","Long a put option on the issuer's stock and short the issuer's straight bonds"],"a":1,"e":"Convertible arbitrageurs buy cheap convertibles and short the stock (delta hedge), profiting from undervaluation, volatility (gamma) and carry."},{"id":"HF027","t":"HF","r":"6.4.2","k":"n","q":"A convertible bond can be converted into 20 shares. The stock trades at $40. What is the conversion value?","o":["$40","$500","$800","$1,000"],"a":2,"e":"Conversion value = conversion ratio × stock price = 20 × $40 = $800."},{"id":"HF028","t":"HF","r":"6.4.3","k":"n","q":"A convertible bond converts into 20 shares and has a delta of 0.6. How many shares should a convertible arbitrageur short per bond to be delta neutral?","o":["6","12","20","33"],"a":1,"e":"Shares to short = delta × conversion ratio = 0.6 × 20 = 12 shares."},{"id":"HF029","t":"HF","r":"6.4.3","k":"c","q":"Which is a major source of return for a delta-hedged long convertible position?","o":["Short volatility: the position gains when the stock is stable and loses when it moves sharply","Long gamma: rebalancing the hedge gains from large stock moves, plus carry from coupon and short rebate","Short interest rate exposure: the position gains mainly when government bond yields rise","Dividends received on the shorted stock, which are paid to the arbitrageur by the stock lender"],"a":1,"e":"Long convertible + short stock is long gamma/volatility: rehedging after moves locks in gains. Carry comes from the coupon and interest on short proceeds, less dividends on the shorted stock."},{"id":"HF030","t":"HF","r":"6.4.4","k":"c","q":"Volatility arbitrage strategies generally attempt to profit from:","o":["Directional moves in stock prices, buying calls before rallies and puts before declines","Gaps between implied and expected realized volatility, or relative volatility mispricing","Dividend capture, buying stocks just before ex-dividend dates and selling them just after","Changes in credit spreads only, trading CDS on companies whose ratings are expected to change"],"a":1,"e":"Volatility arbitrageurs trade the spread between implied and realized volatility, often delta-hedging options so that the position is mainly a bet on volatility."},{"id":"HF031","t":"HF","r":"6.4.5","k":"c","q":"Selling options and delta hedging has historically tended to earn a positive return because:","o":["Realiz
