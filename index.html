async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
function bindShare(){
  const f=$('#shareFab'); if(f) f.onclick=()=>{ S.shareOpen=!S.shareOpen; refreshShare(); };
  const n=$('#shNative'); if(n) n.onclick=async()=>{ try{ await navigator.share({title:'CAIA Arena',text:`Rejoins ma partie CAIA Arena ! Code ${S.mp.code}`,url:inviteUrl()}); }catch(e){} };
  const c=$('#shCopy'); if(c) c.onclick=async()=>{ const ok=await copyText(inviteUrl()); if(ok){ c.textContent='✅ Copié !'; toast('Lien copié, colle-le où tu veux'); } else { const l=$('#shareLink'); l&&l.select(); toast('Sélectionne le lien et copie-le'); } };
  const l=$('#shareLink'); if(l) l.onclick=()=>l.select();
}
function refreshShare(){ const w=$('#shareWrap'); if(w){ w.innerHTML=shareFab(); bindShare(); } }

/* Lobby */
function viewLobby(){
  const m=S.mp, s=m.session, host=m.role==='host';
  return `<div class="two"><div class="card center">
      <div class="hint">Code de la partie</div><div class="bigcode">${esc(m.code)}</div>
      <p class="hint">Envoie ce code aux participants, ou directement le lien d'invitation.</p><div class="row" style="justify-content:center"><button class="btn sm" id="copyInv">📤 Inviter des joueurs</button></div><div id="shareWrap">${shareFab()}</div>
      <div class="row" style="justify-content:center"><span class="pill">${s.pace==='sync'?'⚡ Synchronisé':'📝 Chacun son rythme'}</span><span class="pill">${s.qids.length} questions</span><span class="pill">≈ ${s.minutes} min</span></div>
      <h3 class="mt">Joueurs connectés <span id="pcount"></span></h3><div class="plist" id="plist"></div>
      ${host?`<div class="row mt" style="justify-content:center"><button class="btn" id="goBtn">🚀 Lancer la partie</button><button class="btn ghost" id="cancelBtn">Annuler</button></div>`:`<div class="waitbox">⏳ En attente du lancement par ${esc(s.hostName||"l'hôte")}…</div>`}
    </div>
    <div class="card"><h3 style="margin-top:0">Comment ça marche</h3><p class="hint">• Chaque question a son propre chrono : 75 s pour un concept, 100 s pour une application et 150 s pour un calcul, +20 s pour les questions difficiles (la calculatrice financière est autorisée, comme à l'examen).<br>• Une bonne réponse rapporte entre 500 et 1 000 points selon ta rapidité.<br>• Le classement se met à jour en direct pour tout le monde.<br>• Les questions sont en anglais, comme le jour de l'examen.</p></div></div>`;
}
function renderLobbyList(){
  const el=$('#plist'); if(!el) return; const ps=allPlayers().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
  const seen=renderLobbyList.seen||(renderLobbyList.seen=new Set());
  el.innerHTML=ps.length?ps.map(p=>{ const isNew=!seen.has(p.id); seen.add(p.id); return `<div class="pchip ${isNew?'new':''}">${avHtml(p,'md')}<span>${esc(p.name)}${p.id===pid?' ⭐':''}</span></div>`}).join(''):'<span class="hint">Personne pour l\'instant…</span>';
  const c=$('#pcount'); if(c) c.textContent='('+ps.length+')';
}

/* Game */
function viewGame(){
  const m=S.mp, s=m.session;
  if(!s.startedAt) return `<div class="card waitbox">Chargement…</div>`;
  const left = m.plays ? gameMain() : hostBoard();
  return `<div class="two"><div id="gmain">${left}</div><div class="card lb" id="lbBox">${lbHtml()}</div></div>`;
}
function gameMain(){
  const m=S.mp, s=m.session, now=NOW();
  if(now<s.startedAt) return `<div class="card waitbox"><div class="bigcode" id="cd">${Math.ceil((s.startedAt-now)/1000)}</div><p>Prépare-toi… (et ta calculatrice !)</p></div>`;
  if(s.pace==='sync'){
    const ph=syncPhase();
    if(ph.phase==='done') return `<div class="card waitbox">🏁 Partie terminée, calcul du classement…</div>`;
    const i=ph.i, q=BYID[s.qids[i]], order=perm(s.seed,q.id,q.o.length), a=m.local.answers[i];
    const dur=s.durs[i], remain=(ph.tl[i].end-now)/1000;
    if(ph.phase==='q'){
      const extra=a?`<div class="waitbox">✅ Réponse enregistrée, en attente des autres joueurs…</div>`:'';
      return qCard({q,order,idx:i,n:s.qids.length,remain,dur,chosen:a?a.c:null,locked:!!a,reveal:false,extra});
    }
    const dist=distFor(i);
    const extra=`<div class="verdict ${a&&a.ok?'ok':'bad'}">${a?(a.ok?`✓ Bonne réponse !<span class="ptsfly">+${a.pts} pts</span>`:'✗ Mauvaise réponse'):'⏱ Pas de réponse'}</div><div class="expl">${esc(q.e)}</div><div class="hint mt" id="nextIn"></div>`;
    return qCard({q,order,idx:i,n:s.qids.length,remain:0,dur,chosen:a?a.c:null,locked:true,reveal:true,dist,extra});
  }
  // self-paced
  const i=selfIdx();
  if(i>=s.qids.length || now>selfDeadline()) return `<div class="card waitbox"><h2>🎉 Tu as terminé !</h2><p>Ton score : <b>${m.local.score||0}</b> points. Suis la progression des autres à droite. Le classement final s'affichera quand tout le monde aura fini.</p></div>`;
  if(m.qIdx!==i){ m.qIdx=i; m.qStart=Math.max(NOW(), s.startedAt); }
  const q=BYID[s.qids[i]], order=perm(s.seed,q.id,q.o.length), dur=s.durs[i];
  const remain=dur-(now-m.qStart)/1000;
  return qCard({q,order,idx:i,n:s.qids.length,remain,dur,chosen:null,locked:false,reveal:false,extra:`<div class="hint mt" id="globalLeft"></div>`});
}
function hostBoard(){
  const m=S.mp, s=m.session, now=NOW();
  if(now<s.startedAt) return `<div class="card waitbox"><div class="bigcode" id="cd">${Math.ceil((s.startedAt-now)/1000)}</div><p>Démarrage…</p></div>`;
  let head='';
  if(s.pace==='sync'){ const ph=syncPhase(); if(ph.phase!=='done'){ const i=ph.i,q=BYID[s.qids[i]],order=perm(s.seed,q.id,q.o.length);
      const dist=distFor(i); head=qCard({q,order,idx:i,n:s.qids.length,remain:(ph.tl[i].end-now)/1000,dur:s.durs[i],chosen:null,locked:true,reveal:ph.phase==='rev',dist,extra:ph.phase==='rev'?`<div class="expl">${esc(q.e)}</div>`:`<div class="hint mt">Les réponses s'affichent quand tous les joueurs ont répondu ou à la fin du chrono.</div>`}); } }
  else head=`<div class="card"><h3 style="margin-top:0">📝 Examen en cours</h3><div class="hint" id="globalLeft"></div></div>`;
  return head+`<div class="card mt"><h3 style="margin-top:0">Tableau de bord</h3><div class="heat" id="heat">${heatHtml()}</div><div class="row mt"><button class="btn bad sm" id="endBtn">Terminer la partie</button></div></div>`;
}
function distFor(i){ const d={}; allPlayers().forEach(p=>{const a=p.answers&&p.answers[i]; if(a) d[a.c]=(d[a.c]||0)+1}); return d; }
function updateDist(){ /* re-render reveal counts if in reveal */ const ph=syncPhase(); if(ph.phase==='rev'||!S.mp.plays) softRender(); }
function ranked(){ return allPlayers().sort((a,b)=>(b.score||0)-(a.score||0)||(b.nCorrect||0)-(a.nCorrect||0)); }
function lbHtml(){
  const m=S.mp, s=m.session, n=s.qids.length, ps=ranked();
  const cur = s.pace==='sync' && s.startedAt ? syncPhase().i : -1;
  const rows=ps.map((p,k)=>{
    const a=p.answers||{}; const strip=[...Array(n).keys()].map(i=>{const x=a[i];return `<i class="${x?(x.ok?'g':'r'):''}${i===cur?' c':''}"></i>`}).join('');
    const answeredNow = cur>=0 && a[cur] ? '<span class="ans">a répondu</span>':'';
    return `<div class="lbrow ${p.id===pid?'me':''}" data-id="${esc(p.id)}" data-sc="${p.score||0}"><div class="rk">${k+1}</div>${avHtml(p)}<div style="min-width:0"><div class="nm">${esc(p.name)}${p.id===pid?' (toi)':''}${answeredNow}</div>
      <div class="sub">${p.nCorrect||0} bonnes · ${p.nAnswered||0}/${n} répondues${p.done?' · ✅ fini':''}${p.online===false?' · ⚪ hors ligne':''}</div><div class="strip">${strip}</div></div><div class="sc">${p.score||0}</div></div>`}).join('');
  return `<h3><span class="live"></span> Classement en direct</h3><div class="sub" style="margin-bottom:6px">${ps.length} joueur${ps.length>1?'s':''} · code ${esc(m.code)}</div>${rows||'<div class="hint">Aucun joueur</div>'}`;
}
function renderLB(){
  const el=$('#lbBox');
  if(el){
    const old={}, oldSc={}; el.querySelectorAll('[data-id]').forEach(r=>{old[r.dataset.id]=r.getBoundingClientRect().top; oldSc[r.dataset.id]=r.dataset.sc;});
    const had=Object.keys(old).length>0;
    el.innerHTML=lbHtml();
    el.querySelectorAll('[data-id]').forEach(r=>{ const id=r.dataset.id;
      try{
        if(old[id]!=null){ const d=old[id]-r.getBoundingClientRect().top; if(Math.abs(d)>1) r.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'});
          if(oldSc[id]!==r.dataset.sc){ const s=r.querySelector('.sc'); s&&s.animate([{transform:'scale(1.5)',color:'#21c07a'},{transform:'none'}],{duration:800,easing:'ease-out'}); } }
        else if(had) r.animate([{opacity:0,transform:'translateX(24px)'},{opacity:1,transform:'none'}],{duration:450});
      }catch(e){}
    });
  }
  const h=$('#heat'); if(h) h.innerHTML=heatHtml();
}
function heatHtml(){
  const s=S.mp.session, ps=ranked(); if(!ps.length) return '<div class="hint">Aucun joueur.</div>';
  const head=s.qids.map((_,i)=>`<th>${i+1}</th>`).join('');
  const rows=ps.map(p=>`<tr><td class="n">${esc(p.avatar||'')} ${esc(p.name)}</td>${s.qids.map((_,i)=>{const x=p.answers&&p.answers[i];return `<td><span class="dot ${x?(x.ok?'g':'r'):''}"></span></td>`}).join('')}<td><b>${p.nCorrect||0}</b></td></tr>`).join('');
  const pct=s.qids.map((_,i)=>{let a=0,ok=0;ps.forEach(p=>{const x=p.answers&&p.answers[i];if(x){a++;if(x.ok)ok++}});return `<td class="hint">${a?Math.round(ok/a*100)+'%':''}</td>`}).join('');
  return `<table><tr><th></th>${head}<th>✓</th></tr>${rows}<tr><td class="n hint">% juste</td>${pct}<td></td></tr></table>`;
}
let lastKey='';
function softRender(){ // re-render main game area only when the phase/question changes
  if(S.view!=='game'&&S.view!=='lobby'){ return }
  if(S.view==='lobby'){ renderLobbyList(); return }
  const m=S.mp, s=m.session; let key='';
  if(NOW()<s.startedAt) key='cd'; else if(s.pace==='sync'){const ph=syncPhase();key=ph.i+ph.phase+(ph.phase==='rev'||!m.plays?JSON.stringify(distFor(ph.i)):'')+(m.local.answers[ph.i]?'a':'');} else key='s'+selfIdx()+(NOW()>selfDeadline());
  if(key!==lastKey){ lastKey=key; const g=$('#gmain'); if(g){ g.innerHTML=m.plays?gameMain():hostBoard(); bindGame(); } renderLB(); }
}

/* Final */
function finalTableHtml(){
  const s=S.mp.session, ps=ranked();
  return ps.map((p,k)=>`<div class="lbrow ${p.id===pid?'me':''}"><div class="rk">${k+1}</div>${avHtml(p)}<div><div class="nm">${esc(p.name)}</div><div class="sub">${p.nCorrect||0}/${s.qids.length} bonnes réponses · ${Math.round((p.nCorrect||0)/s.qids.length*100)}%</div></div><div class="sc">${p.score||0}</div></div>`).join('');
}
function viewFinal(){
  const m=S.mp; if(!m) return viewHome();
  const s=m.session, ps=ranked(), top=ps.slice(0,3);
  const delays={2:0.6,1:1.9,0:3.3};
  const heights={0:150,1:110,2:80};
  const pod=[1,0,2].filter(k=>top[k]).map(k=>`<div class="pod ${k===0?'first':''}" style="--d:${delays[k]}s"><div class="pwho">${avHtml(top[k],'big')}<div style="font-weight:700">${esc(top[k].name)}</div><div class="hint">${top[k].score||0} pts</div></div><div class="blk p${k+1}" style="height:${heights[k]}px">${k+1}</div></div>`).join('');
  const dists=s.qids.map((_,i)=>distFor(i));
  const mine=m.plays?resultsBlock({title:'📋 Ta correction',score:m.local.score||0,res:summarize(s.qids,m.local.answers||{}),qids:s.qids,answers:m.local.answers||{},seed:s.seed,dists}):'';
  return `<div class="card center"><h1 style="margin:0">🏆 Classement final</h1><div class="drum" id="drum">Roulement de tambour… 🥁</div><div class="podium">${pod}</div></div>
   <div class="two mt reveal-late" style="--d:4.4s"><div>${mine||`<div class="card"><h3 style="margin-top:0">Résultats par question</h3><div class="heat">${heatHtml()}</div></div>`}</div><div class="card lb"><h3 style="margin-top:0">Tous les joueurs</h3><div id="finalTable">${finalTableHtml()}</div></div></div>
   <div class="row mt reveal-late" style="--d:4.6s"><button class="btn" id="homeBtn">Retour à l'accueil</button></div>`;
}
function playFinale(){
  const m=S.mp; if(!m) return; const key='fin-'+m.code; if(playFinale.done===key) return; playFinale.done=key;
  const n=ranked().length;
  const msgs=[[600,n>=3?'À la 3e place…':''],[1900,n>=2?'À la 2e place…':''],[3100,'Et le grand gagnant est…'],[3900,'🎉 Bravo à tous !']];
  msgs.forEach(([ms,txt])=>setTimeout(()=>{ const d=$('#drum'); if(d&&txt) d.textContent=txt; },ms));
  setTimeout(()=>confetti(4500),3900);
}

/* Bank browser */
function viewBank(){
  const b=S.bank; const ql=b.q.trim().toLowerCase();
  const list=BANK.filter(q=>(b.topic==='ALL'||q.t===b.topic)&&lvlOk(q,b.lvl)&&(!ql||(q.q+' '+q.o.join(' ')+' '+q.r).toLowerCase().includes(ql)));
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">📖 Banque de questions</h2><button class="btn ghost sm" data-go="home">Retour</button></div>
   <div class="row mt">${seg('bankSeg',[['ALL','Tout'],...TOPICS.map(t=>[t.id,t.id])],b.topic)}</div>
   <div class="row mt">${seg('bankLvl',[['all','Tous niveaux'],['1','★'],['2','★★'],['3','★★★']],b.lvl||'all')}</div>
   <input class="inp mt" id="bankSearch" placeholder="Rechercher (ex. carried interest, contango, Sharpe)…" value="${esc(b.q)}">
   <div class="hint mt">${list.length} questions</div>
   ${list.slice(0,150).map(q=>`<div class="bank-q"><div class="hint">${esc(q.id)} · ${esc(TNAME[q.t])} · LO ${esc(q.r)} · ${KLABEL[q.k]} · ${DSTARS(q.d)}</div><div style="margin:6px 0;line-height:1.45">${esc(q.q)}</div>
     ${b.show[q.id]?q.o.map((o,i)=>`<div class="rev"><div class="o ${i===q.a?'c':''}" style="margin:2px 0">${LETTERS[i]}. ${esc(o)}</div></div>`).join('')+`<div class="expl">${esc(q.e)}</div>`:`<button class="btn ghost sm" data-show="${q.id}">Voir la réponse</button>`}</div>`).join('')}
   ${list.length>150?'<div class="hint mt">Affine la recherche pour voir plus de questions.</div>':''}</div>`;
}

/* ---------------- Events ---------------- */
function saveName(){ const i=$('#nameInp'); if(i){ S.name=i.value.trim().slice(0,24); lsSet('caia_name',S.name);} return !!S.name; }
function bindSeg(id,fn){ const el=$('#'+id); if(!el) return; el.querySelectorAll('button').forEach(b=>b.onclick=()=>{saveName();fn(b.dataset.v);render()}); }
function bind(){
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const g=el.dataset.go; saveName();
    if((g==='solo'||g==='host')&&!S.name){ const e=$('#nameErr'); if(e) e.textContent='Entre ton nom avant de commencer.'; $('#nameInp')&&$('#nameInp').focus(); return; }
    if(g==='solo'){S.setupKind='solo';setView('setup')} else if(g==='host'){S.setupKind='host';setView('setup')} else setView(g);
  });
  document.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{ S.avatar=b.dataset.av; lsSet('caia_avatar',S.avatar); document.querySelectorAll('[data-av]').forEach(x=>x.classList.toggle('on',x===b)); $('#who').innerHTML=S.name?`<span class="pill">${esc(S.avatar)} ${esc(S.name)}</span>`:''; });
  const ni=$('#nameInp'); if(ni){ ni.oninput=()=>{S.name=ni.value.trim().slice(0,24);lsSet('caia_name',S.name);$('#who').innerHTML=S.name?`<span class="pill">${esc(S.avatar)} ${esc(S.name)}</span>`:''} }
  bindSeg('paceSeg',v=>S.cfg.pace=v); bindSeg('modeSeg',v=>S.cfg.mode=v); bindSeg('minSeg',v=>S.cfg.minutes=+v); bindSeg('hpSeg',v=>S.cfg.hostPlays=v==='1');
  bindSeg('bankSeg',v=>S.bank.topic=v); bindSeg('bankLvl',v=>S.bank.lvl=v); bindSeg('lvlSeg',v=>S.cfg.level=v);
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{saveName();const t=b.dataset.topic,a=S.cfg.topics;S.cfg.topics=a.includes(t)?a.filter(x=>x!==t):[...a,t];render()});
  const allT=$('#allT'); if(allT) allT.onclick=()=>{saveName();S.cfg.topics=TOPICS.map(t=>t.id);render()};
  const sb=$('#startBtn'); if(sb) sb.onclick=()=>{ if(!saveName()){$('#setupErr').textContent='Entre ton nom.';return} S.setupKind==='host'?createSession():startSolo(); };
  const jb=$('#joinBtn'); if(jb) jb.onclick=joinSession;
  const ci=$('#codeInp'); if(ci){ ci.oninput=()=>{ci.value=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,'')}; ci.onkeydown=e=>{if(e.key==='Enter')joinSession()} }
  const nb=$('#nextBtn'); if(nb) nb.onclick=soloNext;
  const qs=$('#quitSolo'); if(qs) qs.onclick=()=>{S.solo.endedAt=NOW();setView('soloResult')};
  const as=$('#againSolo'); if(as) as.onclick=()=>{S.setupKind='solo';setView('setup')};
  const go=$('#goBtn'); if(go) go.onclick=startGame;
  const ci2=$('#copyInv'); if(ci2) ci2.onclick=()=>{ S.shareOpen=true; refreshShare(); }; bindShare();
  const cb=$('#cancelBtn'); if(cb) cb.onclick=async()=>{await endGame();leaveMp();setView('home')};
  const hb=$('#homeBtn'); if(hb) hb.onclick=()=>{leaveMp();setView('home')};
  const bs=$('#bankSearch'); if(bs){ bs.oninput=()=>{S.bank.q=bs.value; const pos=bs.selectionStart; render(); const n=$('#bankSearch'); n.focus(); n.setSelectionRange(pos,pos);} }
  document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{S.bank.show[b.dataset.show]=true;render()});
  if(S.view==='lobby') renderLobbyList();
  if(S.view==='final') playFinale();
  if(S.view==='soloResult' && S.solo && !S.solo.celebrated){ S.solo.celebrated=true; if(summarize(S.solo.qids,S.solo.answers).pct>=70) setTimeout(()=>confetti(3500),300); }
  if(S.view==='game'){ lastKey=''; bindGame(); }
  if(S.view==='solo') document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>soloAnswer(+b.dataset.opt));
}
function bindGame(){
  document.querySelectorAll('#gmain [data-opt]').forEach(b=>b.onclick=()=>mpAnswer(+b.dataset.opt));
  const eb=$('#endBtn'); if(eb) eb.onclick=()=>{ eb.disabled=true; endGame(); };
}

/* ---------------- Clock ---------------- */
function setTimer(remain,dur){
  const n=$('#tnum'), b=$('#tbar'); if(n) n.textContent=fmtT(remain);
  if(b){ b.firstElementChild.style.width=Math.max(0,remain/dur*100)+'%'; b.classList.toggle('low',remain<=10); }
}
function tick(){
  const now=NOW();
  if(S.view==='solo'&&S.solo){
    const s=S.solo; if(s.feedback) return; const dur=s.durs[s.i], remain=dur-(now-s.qStart)/1000;
    setTimer(remain,dur);
    if(remain<=0){ if(s.mode==='practice'){ s.feedback=true; render(); } else soloNext(); }
  }
  if(S.view==='game'&&S.mp&&S.mp.session&&S.mp.session.startedAt){
    const m=S.mp, s=m.session;
    const cd=$('#cd'); if(cd && now<s.startedAt) cd.textContent=Math.ceil((s.startedAt-now)/1000);
    if(s.pace==='sync'){
      const ph=syncPhase();
      if(ph.phase==='q') setTimer((ph.tl[ph.i].end-now)/1000, s.durs[ph.i]);
      if(ph.phase==='rev'){ const n=$('#nextIn'); if(n) n.textContent=ph.i+1<s.qids.length?`Question suivante dans ${Math.ceil((ph.tl[ph.i].rev-now)/1000)} s`:'Classement final dans un instant…'; }
      hostAutoCut();
    } else {
      const i=selfIdx();
      if(m.plays && i<s.qids.length && now>=s.startedAt && m.qIdx===i){
        const dur=s.durs[i], remain=dur-(now-m.qStart)/1000; setTimer(remain,dur);
        if(remain<=0 && !m.local.answers[i]){ recordAnswer(i,{c:-1,ok:false,ms:dur*1000,pts:0}); m.qStart=NOW(); }
      }
      const gl=$('#globalLeft'); if(gl) gl.textContent='Temps total restant : '+fmtT((selfDeadline()-now)/1000);
      if(m.plays && now>selfDeadline() && !m.local.done){ m.local.done=true; if(m.writeMode==='db') queueWrite(()=>P.db.doc(`sessions/${m.code}/players/${pid}`).update({done:true})); pushPresence(); }
    }
    maybeFinish();
    softRender();
  }
}
setInterval(tick,250);

/* ---------------- Resume after reload ---------------- */
async function tryResume(){
  const r=ssGet('caia_mp',null); if(!r||!P.db) return;
  try{
    const snap=await P.db.doc('sessions/'+r.code).get(); if(!snap.exists){ssDel('caia_mp');return}
    const sess=snap.data(); if(sess.status==='finished'){ssDel('caia_mp');return}
    S.mp={code:r.code,role:r.role,plays:r.plays,session:sess,players:{},peers:{},local:{answers:{},score:0},cutDone:{}};
    await subscribeMp(r.code); if(r.plays) await joinAsPlayer();
    setView(sess.status==='running'?'game':'lobby');
  }catch(e){}
}
(function(){ const h=(location.hash||'').match(/^#join-([A-Z0-9]{5})$/i); if(h){ S.joinCode=h[1].toUpperCase(); S.view='join'; } })();
render();
initPlatform().then(tryResume);
