 structure, the B-piece investor holds:","o":["The most subordinated, first-loss tranches","The AAA-rated senior tranche of the deal","Only interest-only strips from the pool","The servicing rights but no securities"],"a":0,"e":"B-piece buyers hold first-loss positions and often have influence over special servicing."},{"id":"RA136","t":"RA","r":"3.5.5","k":"c","d":2,"q":"Open-end real estate funds generally:","o":["Allow periodic subscriptions and redemptions at appraised NAV","Have a fixed life of ten years with no redemptions","Never value their assets until they are sold","Pursue only opportunistic, high-leverage strategies"],"a":0,"e":"Open-end core funds offer periodic liquidity at appraisal-based NAV, though redemptions can be gated."},{"id":"RA137","t":"RA","r":"3.5.5","k":"c","d":2,"q":"Closed-end real estate funds are most often used for:","o":["Value-added and opportunistic strategies","Daily-liquid index tracking","Money market investing","Only core strategies with daily liquidity"],"a":0,"e":"Closed-end funds with fixed lives suit higher-risk strategies requiring time to execute."},{"id":"RA138","t":"RA","r":"3.5.6","k":"c","d":2,"q":"Why can REITs trade at a premium or discount to NAV?","o":["Market prices reflect investor sentiment and forward-looking views, while NAV relies on appraisals","REITs are not allowed to report NAV, so investors must estimate it","NAV is set by regulators and does not change between filings","REITs hold no real estate directly, only mortgages and cash, so NAV is not meaningful"],"a":0,"e":"Public prices incorporate information faster than appraisal-based NAVs."},{"id":"RA139","t":"RA","r":"3.5.6","k":"c","d":2,"q":"US equity REITs must generally distribute at least what share of taxable income?","o":["90%","50%","25%","100% of gross revenue"],"a":0,"e":"REITs must pay out at least 90% of taxable income to avoid corporate-level tax."},{"id":"RA140","t":"RA","r":"3.5.7","k":"c","d":2,"q":"Over long horizons, research comparing listed REITs and private real estate finds that:","o":["Returns converge once leverage and appraisal smoothing are adjusted","REITs always outperform by 5% per year","Private real estate has no correlation with REITs","They are unrelated asset classes with different risks"],"a":0,"e":"After adjusting for leverage, sector mix and smoothing, long-run returns are similar."},{"id":"RA141","t":"RA","r":"3.6.1","k":"c","d":2,"q":"The income approach to valuing real estate estimates value by:","o":["Capitalizing or discounting expected net operating income","Adding land value and replacement cost","Averaging recent sale prices of comparables","Using book value adjusted for inflation"],"a":0,"e":"The income approach uses direct capitalization (NOI / cap rate) or DCF."},{"id":"RA142","t":"RA","r":"3.6.1","k":"c","d":2,"q":"The cost approach is most useful for valuing:","o":["New or special-purpose properties with few comparables","Stabilized apartment buildings in active markets","Listed REITs","Mortgage pools"],"a":0,"e":"Cost approach = land value + replacement cost − depreciation; useful when comparables are scarce."},{"id":"RA143","t":"RA","r":"3.6.2","k":"n","d":1,"q":"A building has NOI of $4.2 million and the market cap rate is 6%. What is its estimated value?","o":["$70 million","$25.2 million","$42 million","$60 million"],"a":0,"e":"Value = NOI / cap rate = 4.2 / 0.06 = $70 million."},{"id":"RA144","t":"RA","r":"3.6.2","k":"n","d":2,"q":"A property sold for $50 million with NOI of $3 million. What is the implied cap rate?","o":["6.0%","16.7%","3.0%","5.0%"],"a":0,"e":"Cap rate = 3 / 50 = 6.0%."},{"id":"RA145","t":"RA","r":"3.6.2","k":"n","d":3,"q":"NOI is $5 million and cap rates rise from 5.0% to 5.5%. By approximately how much does value fall?","o":["About 9.1%","About 0.5%","About 10%","About 5%"],"a":0,"e":"Value goes from 100m to 90.9m: a 9.1% decline."},{"id":"RA146","t":"RA","r":"3.6.3","k":"c","d":2,"q":"Using the Gordon model, the cap rate can be approximated as:","o":["Discount rate minus expected NOI growth","Discount rate plus expected NOI growth","NOI multiplied by expected NOI growth","Risk-free rate only, with no risk premium"],"a":0,"e":"c ≈ r − g, so higher expected growth implies lower cap rates."},{"id":"RA147","t":"RA","r":"3.6.3","k":"n","d":2,"q":"An investor requires 8% and expects NOI to grow 2% annually forever. Next year's NOI is $1.8 million. What is the property value?","o":["$30 million","$22.5 million","$18 million","$90 million"],"a":0,"e":"V = NOI₁ / (r − g) = 1.8 / 0.06 = $30 million."},{"id":"RA148","t":"RA","r":"3.6.4","k":"n","d":3,"q":"A 5-year DCF uses year-6 NOI of $2.2 million and a terminal (reversion) cap rate of 5.5%. What is the reversion value at end of year 5?","o":["$40 million","$12.1 million","$44 million","$36.7 million"],"a":0,"e":"Reversion value = NOI₆ / terminal cap = 2.2 / 0.055 = $40 million."},{"id":"RA149","t":"RA","r":"3.6.4","k":"c","d":2,"q":"Why do analysts usually set the terminal cap rate slightly above the going-in cap rate?","o":["To reflect building aging and uncertainty about future conditions","Because regulators require a higher exit cap rate in appraisals","To increase the valuation and the expected return of the deal","Because NOI always falls each year over the holding period"],"a":0,"e":"A higher exit cap rate conservatively accounts for depreciation and future uncertainty."},{"id":"RA150","t":"RA","r":"3.6.5","k":"c","d":2,"q":"Appraisal smoothing in private real estate indices causes reported returns to show:","o":["Lower volatility and positive autocorrelation","Higher volatility than listed REITs","Negative autocorrelation over time","No relation with true market values"],"a":0,"e":"Appraisals anchor on previous values, smoothing returns and creating serial correlation."},{"id":"RA151","t":"RA","r":"3.6.5","k":"c","d":3,"q":"Why does appraisal smoothing understate correlations between private real estate and equities?","o":["Appraisal values lag market moves, so contemporaneous co-movement looks weaker","Equities are smoothed in the same way, which cancels out lags","Real estate has no economic exposure to the business cycle","Appraisals are performed daily using live transaction data"],"a":0,"e":"Lagged valuations reduce measured correlation; lagged-regression or unsmoothing reveals higher true correlation."},{"id":"RA152","t":"RA","r":"3.4.2","k":"c","d":2,"q":"The NCREIF Property Index (NPI) reports returns on:","o":["Unlevered, institutionally owned US commercial properties","Listed REITs, including their leverage and fees","Residential homes based on repeat-sales data","Mortgage REITs and commercial mortgage pools"],"a":0,"e":"The NPI tracks unlevered property-level returns based on appraisals."},{"id":"RA153","t":"RA","r":"3.4.2","k":"c","d":2,"q":"The NFI-ODCE index tracks:","o":["Open-end diversified core equity real estate funds, including leverage","Closed-end opportunistic funds with high leverage","Listed REITs weighted by market capitalization","Farmland and timberland held by pension funds through separate accounts"],"a":0,"e":"ODCE is a fund-level index of core open-end funds and reflects their leverage."},{"id":"RA154","t":"RA","r":"3.4.1","k":"n","d":3,"q":"A portfolio is 60% core (expected 6%), 30% value-added (9%) and 10% opportunistic (14%). What is the expected portfolio return?","o":["7.7%","9.7%","6.9%","8.3%"],"a":0,"e":"0.6×6 + 0.3×9 + 0.1×14 = 3.6 + 2.7 + 1.4 = 7.7%."},{"id":"RA155","t":"RA","r":"3.4.3","k":"c","d":2,"q":"Development projects carry which risk that stabilized properties largely avoid?","o":["Construction and lease-up risk","Interest rate risk","Inflation risk on operating costs","Tenant credit risk"],"a":0,"e":"Development entails cost overruns, delays and the risk of not leasing up."},{"id":"RA156","t":"RA","r":"3.4.3","k":"n","d":3,"q":"A development costs $60 million and is expected to produce stabilized NOI of $4.5 million. Market cap rates are 6%. What is the development yield and value created?","o":["7.5% yield; about $15 million of value","6.0% yield; no value created","7.5% yield; $4.5 million of value","13.3% yield; $60 million of value"],"a":0,"e":"Development yield = 4.5 / 60 = 7.5%; value = 4.5 / 0.06 = $75m, so ~$15m created."},{"id":"RA157","t":"RA","r":"3.4.4","k":"c","d":2,"q":"Growth in e-commerce has most benefited demand for:","o":["Industrial and logistics properties","Regional malls and department stores","Suburban office parks","Hotels and resorts"],"a":0,"e":"Warehouses and distribution centers benefit from online retail and supply chain needs."},{"id":"RA158","t":"RA","r":"3.4.4","k":"c","d":2,"q":"Which is considered an 'alternative' or niche property sector?","o":["Data centers","Office","Retail","Multifamily"],"a":0,"e":"Data centers, life science, self-storage, senior housing and cell towers are niche sectors with growing institutional interest."},{"id":"RA159","t":"RA","r":"3.4.6","k":"c","d":2,"q":"Net operating income (NOI) equals:","o":["Effective gross income minus operating expenses","Gross rent minus debt service","Cash flow after capex and taxes","Revenue minus depreciation and interest"],"a":0,"e":"NOI = effective gross income − operating expenses, before debt service, capex and income taxes."},{"id":"RA160","t":"RA","r":"3.4.6","k":"n","d":2,"q":"Potential gross income is $10 million, vacancy and credit loss is 8% and operating expenses are $3.5 million. What is NOI?","o":["$5.7 million","$6.5 million","$9.2 million","$6.0 million"],"a":0,"e":"EGI = 10 × 0.92 = 9.2; NOI = 9.2 − 3.5 = $5.7 million."},{"id":"RA161","t":"RA","r":"3.5.1","k":"c","d":2,"q":"Defeasance in commercial mortgages allows a borrower to:","o":["Replace the loan collateral with Treasury securities that replicate the remaining payments","Default on the loan without any prepayment penalty or recourse","Extend the loan's maturity indefinitely at the original contract rate without lender consent","Avoid all interest payments by posting extra equity in the property"],"a":0,"e":"Defeasance substitutes government securities for the property, protecting the lender's cash flows."},{"id":"RA162","t":"RA","r":"3.5.1","k":"c","d":2,"q":"A recourse loan differs from a non-recourse loan because the lender can:","o":["Pursue the borrower's other assets beyond the property","Only seize the property and nothing else","Never foreclose on the property, even after default","Not charge interest until maturity"],"a":0,"e":"Recourse allows claims beyond the collateral; most CRE loans are non-recourse with carve-outs."},{"id":"RA163","t":"RA","r":"3.5.2","k":"n","d":2,"q":"A property worth $100 million has a $60 million senior loan and a $15 million mezzanine loan. What is the combined LTV?","o":["75%","60%","15%","85%"],"a":0,"e":"(60 + 15) / 100 = 75%."},{"id":"RA164","t":"RA","r":"3.5.3","k":"c","d":2,"q":"The 'loss to lease' or mark-to-market of rents refers to:","o":["The gap between in-place rents and current market rents","Losses from tenant defaults on rent","Depreciation of the building over time","Losses on interest rate hedges used to fix the mortgage rate"],"a":0,"e":"Below-market in-place rents offer upside when leases roll to market."},{"id":"RA165","t":"RA","r":"3.5.5","k":"c","d":3,"q":"During market stress, an open-end core fund may 'gate' redemptions. This means it:","o":["Limits or delays withdrawals to avoid forced property sales","Doubles management fees to discourage withdrawals","Converts into a listed REIT to provide liquidity","Lists its units on an exchange to meet redemptions"],"a":0,"e":"Gates protect remaining investors when redemption requests exceed available liquidity."},{"id":"RA166","t":"RA","r":"3.5.6","k":"c","d":2,"q":"Funds from operations (FFO) for REITs adds back which item to net income?","o":["Real estate depreciation and amortization","Interest expense on mortgage debt","Property taxes paid during the year","Dividends paid to REIT shareholders"],"a":0,"e":"FFO adds back real estate depreciation (and excludes gains on sales) because buildings often hold value."},{"id":"RA167","t":"RA","r":"3.5.6","k":"c","d":3,"q":"Adjusted funds from operations (AFFO) differs from FFO by deducting:","o":["Recurring capital expenditures and straight-line rent adjustments","Real estate depreciation and amortization","Dividends paid to common shareholders","Interest income on cash balances and short-term securities"],"a":0,"e":"AFFO is a closer proxy for distributable cash flow, subtracting maintenance capex, leasing costs and non-cash rents."},{"id":"RA168","t":"RA","r":"3.5.7","k":"c","d":2,"q":"Non-traded REITs are criticized mainly for:","o":["High fees and limited liquidity with appraisal-based valuations","Being too liquid, causing frequent price swings","Having no real estate assets in their portfolios","Being legally barred from paying any dividends to their shareholders"],"a":0,"e":"Non-traded REITs carry high upfront fees, limited redemptions and stale valuations."},{"id":"RA169","t":"RA","r":"3.6.1","k":"c","d":2,"q":"The sales comparison approach estimates value using:","o":["Recent transaction prices of similar properties, adjusted for differences","The replacement cost of the building less depreciation","Discounted dividends paid by listed property companies","The book value reported in the owner's financial statements"],"a":0,"e":"Comparable sales are adjusted for size, location, age and condition."},{"id":"RA170","t":"RA","r":"3.6.3","k":"c","d":2,"q":"Holding the discount rate constant, higher expected NOI growth implies:","o":["A lower cap rate","A higher cap rate","No change in cap rate","A negative cap rate"],"a":0,"e":"Since c ≈ r − g, higher growth lowers the cap rate."},{"id":"RA171","t":"RA","r":"3.6.4","k":"c","d":2,"q":"Which inputs drive a real estate DCF valuation?","o":["Projected NOI, capex, holding period, reversion value and discount rate","Only last year's NOI and the current mortgage rate","Only the market cap rate for similar properties in the same city","Only the replacement cost of the building and land"],"a":0,"e":"DCF discounts projected cash flows and the reversion value at an appropriate rate."},{"id":"RA172","t":"RA","r":"3.6.5","k":"c","d":3,"q":"Transaction-based indices differ from appraisal-based indices in that they:","o":["Use actual sale prices, often via repeat-sales or hedonic models, and respond faster","Are always smoother than appraisal-based indices","Exclude actual transactions and rely on surveys","Are produced only once a year by regulators using tax assessments"],"a":0,"e":"Transaction-based indices capture market changes earlier but may be noisier."},{"id":"RA173","t":"RA","r":"3.4.5","k":"c","d":2,"q":"Positive leverage occurs in real estate when:","o":["The property's unlevered return exceeds the cost of debt","The cost of debt exceeds the property return","LTV is zero","Cap rates rise"],"a":0,"e":"When r_A > r_D, borrowing increases expected equity returns."},{"id":"RA174","t":"RA","r":"3.4.1","k":"c","d":2,"q":"Core real estate returns typically come mostly from:","o":["Stable rental income","Development profits","Speculative land gains","Leverage-driven appreciation"],"a":0,"e":"Core properties are well leased, low leverage and income-driven."},{"id":"RA175","t":"RA","r":"3.4.3","k":"c","d":2,"q":"Which statement about real estate's diversification benefits is most accurate?","o":["Real estate has moderate correlations with stocks and bonds and can hedge some inflation","Real estate is perfectly correlated with bonds and offers no diversification","Real estate cannot lose value because land supply is fixed","Real estate is completely uncorrelated with the economy and inflation"],"a":0,"e":"Real estate offers diversification and partial inflation protection, though it is tied to economic cycles."},{"id":"RA176","t":"RA","r":"3.6.2","k":"c","d":2,"q":"Which factor tends to increase cap rates?","o":["Higher interest rates and perceived risk","Stronger expected NOI growth","Lower required returns","Falling risk premiums and stronger NOI growth"],"a":0,"e":"Cap rates rise with higher discount rates (rates and risk premiums) and lower expected growth."},{"id":"RA177","t":"RA","r":"3.5.4","k":"c","d":2,"q":"Which entity takes over CMBS loans that become delinquent?","o":["The special servicer","The master servicer only","The rating agency","The trustee's auditor"],"a":0,"e":"The special servicer handles workouts, modifications and foreclosures of troubled loans."},{"id":"PE034","t":"PE","r":"4.1.1","k":"c","d":1,"q":"Private equity typically refers to:","o":["Equity investments in companies not traded on public exchanges","Listed small-cap stocks held for long periods by active funds","Government and agency bonds held to maturity by pension funds","Money market funds investing in short-term private paper"],"a":0,"e":"PE covers investments in private companies: venture capital, growth equity and buyouts."},{"id":"PE035","t":"PE","r":"4.1.1","k":"c","d":2,"q":"In a typical PE fund, limited partners (LPs):","o":["Provide most of the capital and have limited liability and limited control","Make the investment decisions and sit on portfolio company boards","Have unlimited liability for the fund's debts and obligations","Manage portfolio companies and set the fund's strategy"],"a":0,"e":"LPs commit capital; the GP manages the fund and bears unlimited liability (usually via an entity)."},{"id":"PE036","t":"PE","r":"4.1.2","k":"c","d":2,"q":"The 'J-curve' in private equity describes:","o":["Early negative returns from fees and costs followed by later gains as investments mature","A steady rise in returns from the first year to the last, as fees decline each year","A sharp fall in returns as the fund approaches its final year","The shape of the yield curve used to discount fund cash flows"],"a":0,"e":"Fees and early write-downs create negative early IRRs; value creation later lifts returns."},{"id":"PE037","t":"PE","r":"4.1.2","k":"c","d":2,"q":"A capital call in a PE fund is:","o":["A request by the GP for LPs to fund part of their commitment","A distribution of realized proceeds from the GP to its LPs","A rebate of management fees paid in the prior fiscal year","A request by an LP to redeem its interest from the fund"],"a":0,"e":"Capital is drawn down over the investment period as deals are made."},{"id":"PE038","t":"PE","r":"4.1.3","k":"c","d":2,"q":"Management fees in PE funds are typically charged on:","o":["Committed capital during the investment period, then invested capital","Only realized profits after the hurdle rate has been met","Distributions paid to LPs during the harvesting period","The public market value of comparable listed companies"],"a":0,"e":"Fees (often ~1.5–2%) are on commitments early, often stepping down to invested capital later."},{"id":"PE039","t":"PE","r":"4.1.3","k":"a","d":2,"q":"A fund has a 20% carried interest and an 8% hurdle with full catch-up. Over its life it earns profits well above the hurdle. What share of total profits does the GP ultimately receive?","o":["20%","8%","28%","12%"],"a":0,"e":"With a full catch-up, the GP ends up with 20% of all profits once the catch-up is complete."},{"id":"PE040","t":"PE","r":"4.1.3","k":"c","d":2,"q":"A clawback provision allows LPs to:","o":["Recover excess carried interest previously paid to the GP","Withdraw their capital at any time without penalty","Skip capital calls when markets are falling sharply","Replace the GP without a vote of other investors"],"a":0,"e":"If early carry exceeds what the GP is entitled to over the fund's life, clawback requires repayment."},{"id":"PE041","t":"PE","r":"4.1.3","k":"c","d":3,"q":"Compared with a deal-by-deal (American) waterfall, a whole-fund (European) waterfall:","o":["Pays carry only after LPs receive all contributed capital plus the hurdle","Pays carry earlier, as soon as each individual deal is profitable","Removes the hurdle so the GP earns carry on all profits","Gives LPs no priority over the GP in the distribution order"],"a":0,"e":"European waterfalls are more LP-friendly, delaying carry until total capital and preferred return are returned."},{"id":"PE042","t":"PE","r":"4.1.4","k":"n","d":2,"q":"A fund has paid-in capital of $100m, distributions of $90m and residual NAV of $60m. What is the TVPI?","o":["1.50x","0.90x","0.60x","1.90x"],"a":0,"e":"TVPI = (90 + 60) / 100 = 1.50x."},{"id":"PE043","t":"PE","r":"4.1.4","k":"n","d":2,"q":"Using the same fund (paid-in $100m, distributions $90m, NAV $60m), what is the DPI?","o":["0.90x","1.50x","0.60x","0.40x"],"a":0,"e":"DPI = distributions / paid-in = 0.90x."},{"id":"PE044","t":"PE","r":"4.1.4","k":"c","d":2,"q":"RVPI measures:","o":["Residual value (NAV) relative to paid-in capital","Realized distributions relative to committed capital","The fund's internal rate of return since inception","Management fees paid relative to invested capital"],"a":0,"e":"RVPI = NAV / paid-in; TVPI = DPI + RVPI."},{"id":"PE045","t":"PE","r":"4.1.4","k":"c","d":3,"q":"A drawback of IRR as a PE performance measure is that it:","o":["Can be boosted by early distributions or subscription lines and assumes reinvestment at the IRR","Ignores the timing of cash flows into and out of the fund","Cannot be calculated for funds with irregular cash flows, such as those with several capital calls","Always equals the fund's total value to paid-in multiple"],"a":0,"e":"IRR is sensitive to timing; subscription credit lines and quick flips can inflate it."},{"id":"PE046","t":"PE","r":"4.1.5","k":"c","d":2,"q":"The public market equivalent (PME) approach compares PE returns with:","o":["A public index invested with the same cash flow timing","The fund's own IRR measured over its full life","The risk-free rate compounded over the fund's life","A median of peer funds from the same vintage year"],"a":0,"e":"PME mimics PE cash flows in a public index to assess outperformance."},{"id":"PE047","t":"PE","r":"4.1.5","k":"c","d":2,"q":"A Kaplan–Schoar PME greater than 1 indicates:","o":["The PE fund outperformed the public index","The PE fund underperformed the public index","The fund exactly broke even on invested capital","The fund had no distributions during its life"],"a":0,"e":"KS-PME > 1 means LPs did better in PE than in the public benchmark."},{"id":"PE048","t":"PE","r":"4.1.6","k":"c","d":2,"q":"Vintage year diversification in private equity helps reduce:","o":["The risk of committing all capital at a market peak","Management fees charged on committed capital","Carried interest paid to GPs on early exits","The liquidity of public stocks in the portfolio"],"a":0,"e":"Committing steadily across vintages smooths exposure to entry valuations and cycles."},{"id":"PE049","t":"PE","r":"4.1.7","k":"c","d":2,"q":"Subscription credit lines used by PE funds can:","o":["Delay capital calls and inflate reported IRRs","Reduce leverage to zero","Eliminate the J-curve risk entirely","Lower all fees"],"a":0,"e":"Bridging capital calls shortens LP holding periods, raising IRR without improving multiples."},{"id":"PE050","t":"PE","r":"4.1.8","k":"c","d":2,"q":"In a GP-led continuation fund transaction, the GP:","o":["Moves one or more assets into a new vehicle, offering existing LPs liquidity or rollover","Liquidates the fund and distributes all assets to LPs in kind","Converts the fund into an open-ended hedge fund structure","Buys LP interests on a public exchange at quoted prices and cancels the old fund"],"a":0,"e":"Continuation vehicles extend holding of strong assets; conflicts of interest require fairness opinions and LP choice."},{"id":"PE051","t":"PE","r":"4.1.8","k":"c","d":2,"q":"LP-led secondary transactions involve:","o":["An LP selling its fund interest to another investor","A GP selling a portfolio company to a strategic buyer","An IPO of the fund","A capital call"],"a":0,"e":"LPs sell interests (and unfunded commitments) to secondary buyers, often at a discount to NAV."},{"id":"PE052","t":"PE","r":"4.1.8","k":"c","d":2,"q":"Why do LPs value co-investment opportunities?","o":["They provide additional exposure with reduced or no fees and carry","They carry no risk because the GP guarantees co-investments","They guarantee returns above the main fund's hurdle rate","They are always more diversified than the main fund"],"a":0,"e":"Co-investments lower average fees but require due diligence capacity and may cause concentration."},{"id":"PE053","t":"PE","r":"4.1.8","k":"c","d":3,"q":"Long-hold PE funds, discussed in the CAIA 2027 curriculum, typically have terms of about:","o":["15 years or more","3 years","6 months","Exactly 10 years"],"a":0,"e":"Long-dated funds hold companies 15+ years, reducing transaction costs and suiting long-horizon LPs."},{"id":"PE054","t":"PE","r":"4.2.2","k":"c","d":1,"q":"Which is the earliest stage of venture capital financing?","o":["Pre-seed","Series C","Mezzanine","Buyout"],"a":0,"e":"Pre-seed precedes seed; then Series A, B, C and later stages."},{"id":"PE055","t":"PE","r":"4.2.2","k":"c","d":2,"q":"Seed-stage financing is typically used to:","o":["Develop a prototype, test product–market fit and build the team","Fund an IPO and pay underwriters' fees and listing costs","Refinance existing debt at a lower interest rate","Acquire competitors in a consolidating market"],"a":0,"e":"Seed rounds fund early product development and validation, often from angels and seed funds."},{"id":"PE056","t":"PE","r":"4.2.2","k":"c","d":2,"q":"Angel investors are typically:","o":["Wealthy individuals investing their own money in early-stage startups","Large pension funds investing through fund-of-funds","Central banks providing liquidity to new companies","Hedge funds trading futures on technology indices to hedge their portfolios"],"a":0,"e":"Angels provide early capital and mentoring, often at pre-seed and seed stages."},{"id":"PE057","t":"PE","r":"4.2.3","k":"c","d":2,"q":"Which feature makes venture capital returns highly skewed?","o":["A few big winners generate most of a fund's returns","Most investments return exactly their cost","Losses are capped at 10%","All investments are diversified"],"a":0,"e":"VC follows a power law: most startups fail while a few deliver very large multiples."},{"id":"PE058","t":"PE","r":"4.2.3","k":"n","d":3,"q":"A VC invests $5m for 25% of a startup post-money. What is the post-money and pre-money valuation?","o":["$20m post-money and $15m pre-money","$25m post-money and $20m pre-money","$5m post-money and $0 pre-money","$20m post-money and $20m pre-money"],"a":0,"e":"Post-money = 5 / 0.25 = $20m; pre-money = 20 − 5 = $15m."},{"id":"PE059","t":"PE","r":"4.2.3","k":"n","d":3,"q":"A VC owns 20% after Series A. A later round sells 25% of the company to new investors. Absent anti-dilution, what is the VC's stake?","o":["15%","20%","5%","25%"],"a":0,"e":"Ownership = 20% × (1 − 0.25) = 15%."},{"id":"PE060","t":"PE","r":"4.2.4","k":"n","d":3,"q":"A VC expects an exit value of $200m in 5 years and requires a 40% return. It invests $8m. What ownership must it hold at exit?","o":["About 21.5%","About 4%","About 8%","About 40%"],"a":0,"e":"Required FV = 8 × 1.4⁵ ≈ 8 × 5.378 ≈ $43.0m; 43.0 / 200 ≈ 21.5%."},{"id":"PE061","t":"PE","r":"4.2.4","k":"c","d":2,"q":"A liquidation preference gives preferred stockholders:","o":["Priority to receive a specified amount before common shareholders in an exit","Voting control of the board in all circumstances","A guaranteed IPO within a fixed number of years after the investment is made","Higher dividends than the company's senior debt"],"a":0,"e":"Liquidation preferences protect VCs in downside exits."},{"id":"PE062","t":"PE","r":"4.2.4","k":"c","d":3,"q":"Compared with weighted-average anti-dilution, full-ratchet anti-dilution:","o":["Resets the conversion price to the new lower price, giving more protection to the investor","Gives less protection because it uses a weighted average of prices","Ignores down rounds and only applies when valuations rise in later financing rounds","Only applies to common stock held by the company's founders"],"a":0,"e":"Full ratchet is the most investor-friendly, repricing to the down-round price regardless of round size."},{"id":"PE063","t":"PE","r":"4.2.5","k":"c","d":2,"q":"Growth equity typically involves:","o":["Minority investments in established, growing companies with little or no leverage","Majority leveraged buyouts of mature, cash-generating firms","Pre-revenue startups that are still building a prototype","Distressed debt of companies in Chapter 11 bankruptcy bought at deep discounts"],"a":0,"e":"Growth equity funds expansion of profitable or revenue-generating companies, usually minority, low leverage."},{"id":"PE064","t":"PE","r":"4.2.5","k":"c","d":3,"q":"Because growth equity investors usually hold minority stakes, they rely on protective provisions such as:","o":["Redemption rights, board seats, veto rights and liquidation preferences","Full operational control and the right to replace the CEO","Unlimited leverage placed on the portfolio company","Guaranteed dividends paid by government agencies"],"a":0,"e":"Contractual protections compensate for lack of control."},{"id":"PE065","t":"PE","r":"4.2.5","k":"c","d":2,"q":"Compared with venture capital, growth equity generally has:","o":["Lower loss rates and less dispersion of outcomes","Higher failure rates and more technology risk","More technology risk","No revenue in portfolio companies"],"a":0,"e":"Growth companies have proven business models, so failure risk is lower than early-stage VC."},{"id":"PE066","t":"PE","r":"4.2.6","k":"c","d":2,"q":"Corporate venture capital (CVC) differs from traditional VC in that it often pursues:","o":["Strategic objectives alongside financial returns","Purely financial returns with no strategic aims","Only buyouts of mature competitors","Only listed equities in related industries"],"a":0,"e":"Corporations invest for strategic insight, partnerships or future acquisitions."},{"id":"PE067","t":"PE","r":"4.2.8","k":"c","d":2,"q":"Which exit route is most common for venture-backed companies?","o":["Trade sale (acquisition by a strategic buyer)","Bankruptcy reorganization under Chapter 11","Dividend recapitalization","Perpetual holding by the VC"],"a":0,"e":"Acquisitions outnumber IPOs as VC exits."},{"id":"PE068","t":"PE","r":"4.2.9","k":"c","d":2,"q":"A unicorn is a private startup valued at:","o":["$1 billion or more","$100 million","$10 million","Exactly its book value"],"a":0,"e":"Unicorns are privately held startups valued at over $1 billion."},{"id":"PE069","t":"PE","r":"4.2.10","k":"c","d":3,"q":"Why can reported unicorn valuations overstate the value of common stock?","o":["Post-money valuations apply the latest preferred price to all shares, ignoring preferences","Common stock has more rights than preferred, so it is worth more","Valuations are audited daily, so they lag market movements and understate value","Liquidation preferences reduce the protection of investors"],"a":0,"e":"Latest-round preferred terms (liquidation preferences, ratchets) make common shares worth less than the headline price."},{"id":"PE070","t":"PE","r":"4.2.11","k":"c","d":2,"q":"In a down round:","o":["New shares are sold at a lower price than the previous round","Shares are sold at a higher price than the prior round","No new shares are issued and the valuation is unchanged","Outstanding debt is converted into cash for investors"],"a":0,"e":"Down rounds trigger anti-dilution provisions and dilute existing holders."},{"id":"PE071","t":"PE","r":"4.3.1","k":"c","d":1,"q":"A leveraged buyout (LBO) uses:","o":["A significant amount of debt to acquire a company","Only equity provided by the sponsor and management","Government grants and subsidies to fund the purchase","Only venture debt with warrants attached"],"a":0,"e":"LBOs finance acquisitions with substantial debt secured by the target's assets and cash flows."},{"id":"PE072","t":"PE","r":"4.3.1","k":"c","d":2,"q":"Which company profile is most suitable for an LBO?","o":["Stable cash flows, low capex needs and low existing debt","Early-stage, cash-burning startup","Highly cyclical with heavy capex and existing debt","Company with no tangible assets and losses"],"a":0,"e":"Predictable cash flows support debt service."},{"id":"PE073","t":"PE","r":"4.3.2","k":"n","d":3,"q":"A sponsor buys a firm for $100m with $60m debt and $40m equity. After 5 years it sells for $130m with $20m debt remaining. What is the equity multiple?","o":["2.75x","1.30x","3.25x","2.00x"],"a":0,"e":"Exit equity = 130 − 20 = $110m; 110 / 40 = 2.75x."},{"id":"PE074","t":"PE","r":"4.3.2","k":"n","d":3,"q":"Using the previous LBO (2.75x over 5 years, no interim cash flows), what is the approximate IRR?","o":["About 22.4%","About 35%","About 11%","About 55%"],"a":0,"e":"2.75^(1/5) − 1 ≈ 22.4%."},{"id":"PE075","t":"PE","r":"4.3.2","k":"c","d":2,"q":"Sources of value creation in buyouts include:","o":["EBITDA growth, multiple expansion and debt paydown","Only multiple expansion at exit","Only management fees charged to LPs","Only tax refunds from interest deductions"],"a":0,"e":"Value comes from operational improvement, buying low/selling high, and deleveraging."},{"id":"PE076","t":"PE","r":"4.3.3","k":"c","d":2,"q":"In LBO theory, the 'free cash flow' or agency cost argument claims that high debt:","o":["Disciplines managers by forcing cash to service debt instead of wasteful projects","Encourages empire building by giving managers more cash","Has no effect on management incentives or behavior","Increases idle cash held on the balance sheet, reducing the need for monitoring"],"a":0,"e":"Jensen's argument: debt reduces agency costs of free cash flow."},{"id":"PE077","t":"PE","r":"4.3.4","k":"c","d":2,"q":"A dividend recapitalization in a buyout:","o":["Raises new debt to pay a dividend to the PE sponsor","Issues new equity to repay existing debt","Converts preferred stock into common stock","Sells the company to a SPAC at a premium"],"a":0,"e":"It returns capital early to the sponsor, increasing leverage and risk."},{"id":"PE078","t":"PE","r":"4.3.4","k":"c","d":2,"q":"A secondary buyout is:","o":["A sale of a portfolio company by one PE sponsor to another","An IPO of the company on a stock exchange","A sale of the company to a strategic buyer","An LP selling its fund interest to another LP"],"a":0,"e":"Sponsor-to-sponsor deals are a common exit route."},{"id":"PE079","t":"PE","r":"4.3.5","k":"c","d":2,"q":"Covenant-lite loans used in buyouts:","o":["Lack maintenance covenants, giving borrowers more flexibility and lenders less early warning","Have more covenants than standard leveraged loans","Are always rated investment grade by agencies because sponsors guarantee them","Cannot be traded once the loan has been funded"],"a":0,"e":"Cov-lite loans remove maintenance tests, increasing lender risk."},{"id":"PE080","t":"PE","r":"4.3.6","k":"c","d":2,"q":"Why are many buyouts concentrated in mid-market companies?","o":["Less competition and more room for operational improvement","Only mid-market firms are allowed to borrow","Large companies are prohibited from LBOs by antitrust rules","Small companies trade at higher valuations"],"a":0,"e":"Mid-market deals often have lower entry multiples and more improvement potential."},{"id":"PE081","t":"PE","r":"4.3.7","k":"c","d":2,"q":"In a SPAC, IPO proceeds are typically held in:","o":["A trust account invested in Treasuries until a merger","The operating accounts of the target company","The sponsor's personal brokerage account","Cryptocurrency held in a cold wallet"],"a":0,"e":"Proceeds sit in trust (usually ≥90% of gross proceeds) pending a business combination."},{"id":"PE082","t":"PE","r":"4.3.7","k":"c","d":2,"q":"SPAC units are typically issued at what price per unit?","o":["$10","$1","$100","$25"],"a":0,"e":"Units are typically issued at $10, consisting of shares and fractional warrants."},{"id":"PE083","t":"PE","r":"4.3.7","k":"c","d":3,"q":"SPAC warrants typically have an exercise price of:","o":["$11.50","$10.00","$5.00","$20.00"],"a":0,"e":"Warrants are usually exercisable at $11.50 per share."},{"id":"PE084","t":"PE","r":"4.3.7","k":"c","d":2,"q":"If a SPAC fails to complete a merger within its deadline (often about 2 years):","o":["It must liquidate and return trust funds to shareholders","The sponsors keep the trust as compensation","It automatically converts into a REIT and keeps the cash in trust","Shareholders lose their entire investment"],"a":0,"e":"Unsuccessful SPACs liquidate and redeem shareholders from the trust."},{"id":"PE085","t":"PE","r":"4.3.7","k":"c","d":3,"q":"SPAC sponsors typically receive a 'promote' equal to about what share of post-IPO shares?","o":["20%","2%","50%","90%"],"a":0,"e":"Founder shares usually represent ~20% of the SPAC, creating dilution for public shareholders."},{"id":"PE086","t":"PE","r":"4.3.7","k":"n","d":3,"q":"A SPAC warrant has a $11.50 strike. After the merger the stock trades at $14. What is the warrant's intrinsic value per share?","o":["$2.50","$4.00","$11.50","$0"],"a":0,"e":"Intrinsic value = 14 − 11.50 = $2.50."},{"id":"PE087","t":"PE","r":"4.3.7","k":"c","d":2,"q":"A PIPE in a SPAC merger refers to:","o":["Private investment in public equity, providing extra capital at closing","A pension plan that sponsors the SPAC and receives founder shares","A type of warrant issued to the sponsor","A debt covenant in the merger agreement"],"a":0,"e":"PIPEs supply additional funding and validate the valuation."},{"id":"PE088","t":"PE","r":"4.1.6","k":"c","d":2,"q":"Interval funds give investors exposure to private assets with:","o":["Periodic repurchase offers (e.g., quarterly) for a portion of shares","Daily redemptions at NAV with no limits on the amount withdrawn","No liquidity at all until the fund is wound up","Exchange trading at market prices throughout the day"],"a":0,"e":"Interval funds offer limited periodic liquidity, typically 5–25% of shares per interval."},{"id":"PE089","t":"PE","r":"4.1.6","k":"c","d":3,"q":"Evergreen semi-liquid private equity vehicles differ from closed-end funds in that they:","o":["Have no fixed term and reinvest proceeds, offering periodic limited liquidity","Must liquidate within ten years and return all capital","Never accept new investors once the first close has passed","Charge no management or performance fees to investors who stay more than five years"],"a":0,"e":"Evergreen funds are perpetual, accept ongoing subscriptions and provide limited redemptions."},{"id":"PE090","t":"PE","r":"4.1.7","k":"c","d":2,"q":"Fund-of-funds in private equity provide:","o":["Diversification and access, at the cost of an extra layer of fees","Lower fees than investing directly in funds, thanks to bulk discounts","Daily liquidity on underlying fund interests","Guaranteed top-quartile returns across vintages"],"a":0,"e":"FoFs diversify across managers and vintages but add fees."},{"id":"PE091","t":"PE","r":"4.1.5","k":"c","d":3,"q":"Persistence of performance in private equity buyout funds has:","o":["Weakened over time compared with earlier evidence","Grown stronger every year since the 1990s","Never existed in any study of PE returns","Been guaranteed by regulation for top managers"],"a":0,"e":"Recent studies show reduced persistence, especially for buyouts."},{"id":"PE092","t":"PE","r":"4.1.2","k":"c","d":2,"q":"The investment period of a typical PE fund lasts about:","o":["3–5 years","1 month","20 years","Indefinitely"],"a":0,"e":"Capital is invested over the first ~5 years of a ~10-year fund life."},{"id":"PE093","t":"PE","r":"4.1.2","k":"c","d":2,"q":"Unfunded commitments in PE create which risk for LPs?","o":["Liquidity risk from unpredictable capital calls","Currency risk only on non-US funds","Prepayment risk on fund-level loans","No risk, as calls are fully predictable"],"a":0,"e":"LPs must hold liquidity to meet calls, which may cluster in stress periods."},{"id":"PE094","t":"PE","r":"4.3.2","k":"n","d":2,"q":"A company is bought at 8x EBITDA of $25m and sold at 10x EBITDA of $30m. What is the enterprise value increase?","o":["$100m","$50m","$80m","$300m"],"a":0,"e":"Entry EV = 200; exit EV = 300; increase = $100m."},{"id":"PE095","t":"PE","r":"4.3.2","k":"n","d":3,"q":"In the previous deal (entry 8x×$25m, exit 10x×$30m), how much of the EV gain came from EBITDA growth at the entry multiple?","o":["$40m","$60m","$100m","$50m"],"a":0,"e":"EBITDA growth: (30 − 25) × 8 = $40m; multiple expansion: 2 × 30 = $60m."},{"id":"PE096","t":"PE","r":"4.2.3","k":"c","d":2,"q":"VC investors use staged financing mainly to:","o":["Limit capital at risk and retain the option to abandon","Increase upfront commitments to each startup","Avoid due diligence on later financing rounds","Guarantee that follow-on rounds will occur"],"a":0,"e":"Staging creates real options to continue or stop funding based on milestones."},{"id":"PE097","t":"PE","r":"4.2.2","k":"c","d":2,"q":"Convertible notes and SAFEs are often used at which stage?","o":["Pre-seed and seed","Late-stage buyouts","IPOs","Distressed restructurings"],"a":0,"e":"They defer valuation until a priced round, converting at a discount or cap."},{"id":"PE098","t":"PE","r":"4.2.4","k":"a","d":3,"q":"A SAFE of $1m converts with a $10m valuation cap. The next round is priced at a $20m pre-money valuation. At what effective valuation does the SAFE convert?","o":["$10m","$20m","$15m","$1m"],"a":0,"e":"The cap applies: conversion occurs at the lower $10m valuation, roughly doubling shares received."},{"id":"PE099","t":"PE","r":"4.3.5","k":"c","d":2,"q":"Leveraged loans used in buyouts are typically:","o":["Senior secured floating-rate loans","Fixed-rate unsecured bonds","Unsecured fixed-rate bonds","Government guaranteed"],"a":0,"e":"Leveraged loans are senior secured with floating rates, often syndicated to CLOs."},{"id":"PD040","t":"PD","r":"5.1.1","k":"c","d":1,"q":"Private credit refers to:","o":["Loans and debt instruments originated or held by non-bank lenders and not publicly traded","Listed high-yield bonds bought and traded daily by mutual funds","Government bonds issued through competitive public auctions and traded by primary dealers","Bank deposits and certificates of deposit insured by regulators"],"a":0,"e":"Private credit covers privately negotiated debt from funds and other non-bank lenders."},{"id":"PD041","t":"PD","r":"5.1.1","k":"c","d":2,"q":"Which development most fueled the growth of private credit after 2008?","o":["Tighter bank regulation reducing bank lending to middle-market firms","Looser bank capital rules that pushed banks to lend more to small firms","A collapse in demand for loans from middle-market companies","The prohibition of private funds by most securities regulators"],"a":0,"e":"Basel III and other rules pushed banks to retreat, letting non-bank lenders fill the gap."},{"id":"PD042","t":"PD","r":"5.1.2","k":"c","d":2,"q":"Direct lending typically involves:","o":["Senior secured floating-rate loans to middle-market companies, often sponsor-backed","Purchases of listed high-yield bonds in the secondary market","Short-term commercial paper issued by investment-grade firms","Loans to sovereign governments syndicated by large banks and traded on exchanges"],"a":0,"e":"Direct lenders originate and hold senior loans to mid-sized companies."},{"id":"PD043","t":"PD","r":"5.1.2","k":"c","d":2,"q":"A unitranche loan combines:","o":["Senior and subordinated debt into a single facility with one blended rate","Common equity and preferred stock into one share class","A bank loan and a credit default swap on the same borrower","Two separate bonds issued by unrelated borrowers"],"a":0,"e":"Unitranche simplifies the capital structure; lenders may split it internally via an agreement among lenders."},{"id":"PD044","t":"PD","r":"5.1.2","k":"c","d":3,"q":"Compared with broadly syndicated loans, direct loans usually offer:","o":["A yield premium for illiquidity and complexity, with tighter covenants","A lower yield in exchange for daily liquidity and no covenants","Identical spreads but with fixed rates instead of floating","Higher liquidity because they trade on public exchanges"],"a":0,"e":"Direct lending earns an illiquidity premium and typically includes stronger covenants."},{"id":"PD045","t":"PD","r":"5.1.3","k":"c","d":2,"q":"Mezzanine debt typically ranks:","o":["Below senior secured debt and above equity","Above senior secured debt and below trade creditors","Equal with common equity in liquidation","Above all other liabilities, including DIP loans"],"a":0,"e":"Mezzanine is subordinated debt, often with warrants or PIK interest."},{"id":"PD046","t":"PD","r":"5.1.3","k":"c","d":2,"q":"Payment-in-kind (PIK) interest is:","o":["Interest paid by adding to the principal rather than in cash","Interest paid in commodities rather than in currency","A penalty paid when the borrower prepays the loan","Interest paid in full in cash at the loan's origination"],"a":0,"e":"PIK conserves borrower cash but increases the debt balance."},{"id":"PD047","t":"PD","r":"5.1.3","k":"n","d":3,"q":"A $10m mezzanine loan carries 12% PIK interest compounded annually. What is the balance after 3 years with no cash payments?","o":["About $14.05m","$13.60m","$12.00m","$10.36m"],"a":0,"e":"10 × 1.12³ = 10 × 1.4049 ≈ $14.05m."},{"id":"PD048","t":"PD","r":"5.1.4","k":"c","d":2,"q":"Equity kickers in mezzanine financing, such as warrants, are intended to:","o":["Give lenders upside participation to compensate for subordination","Provide the lender with first-lien collateral on all assets","Reduce the loan's interest rate to zero for the borrower","Guarantee repayment of principal by the equity sponsor"],"a":0,"e":"Warrants let mezzanine lenders share in equity upside."},{"id":"PD049","t":"PD","r":"5.1.5","k":"c","d":2,"q":"Asset-based lending (ABL) bases loan availability on:","o":["A borrowing base of eligible collateral such as receivables and inventory","The borrower's share price and market capitalization","Projected EBITDA multiplied by a fixed leverage multiple","Government guarantees provided to small businesses through public lending programs"],"a":0,"e":"ABL limits credit to advance rates applied to eligible collateral."},{"id":"PD050","t":"PD","r":"5.1.5","k":"n","d":2,"q":"Eligible receivables are $20m (85% advance rate) and eligible inventory $10m (50% advance rate). What is the borrowing base?","o":["$22m","$30m","$17m","$25.5m"],"a":0,"e":"0.85 × 20 + 0.50 × 10 = 17 + 5 = $22m."},{"id":"PD051","t":"PD","r":"5.1.6","k":"c","d":2,"q":"Maintenance covenants require a borrower to:","o":["Meet financial tests (e.g., leverage, coverage) regularly, such as quarterly","Comply with financial tests only when they issue new debt","Maintain a minimum share price on a public exchange throughout the life of the loan","Report financial statements only at the loan's maturity"],"a":0,"e":"Maintenance covenants are tested periodically; incurrence covenants only when certain actions occur."},{"id":"PD052","t":"PD","r":"5.1.6","k":"n","d":2,"q":"A borrower has EBITDA of $50m, fixed charges (interest + scheduled principal + leases) of $25m. What is the fixed charge coverage ratio?","o":["2.0x","0.5x","1.25x","25x"],"a":0,"e":"FCCR = 50 / 25 = 2.0x."},{"id":"PD053","t":"PD","r":"5.1.7","k":"c","d":2,"q":"Business development companies (BDCs) in the US must generally distribute at least what share of taxable income?","o":["90%","50%","10%","100% of gross revenue"],"a":0,"e":"Like REITs, BDCs distribute ≥90% to avoid entity-level tax."},{"id":"PD054","t":"PD","r":"5.1.8","k":"c","d":2,"q":"Which risk is most associated with the rapid growth of private credit according to critics?","o":["Opaque valuations and potential loosening of underwriting standards","Excessive transparency that discourages new lenders","Too much daily liquidity offered to fund investors","Default risk that has fallen permanently to zero thanks to sponsor support"],"a":0,"e":"Concerns include limited price discovery, rising leverage and weaker covenants."},{"id":"PD055","t":"PD","r":"5.1.9","k":"c","d":2,"q":"Private credit loans are mostly floating rate. In a rising rate environment, this means:","o":["Lender income rises, but borrower interest coverage deteriorates","Lenders suffer large duration losses on their loan books","Lender income falls as coupons reset to lower levels","Defaults disappear because borrowers refinance cheaply"],"a":0,"e":"Floating coupons benefit lenders but strain borrowers, raising credit risk."},{"id":"PD056","t":"PD","r":"5.2.1","k":"c","d":2,"q":"Distressed debt investing involves buying:","o":["Debt of companies in or near default, usually at deep discounts","AAA-rated bonds of companies with stable earnings","Government Treasury bills ahead of debt-ceiling deadlines","Equity of early-stage growth startups in venture rounds"],"a":0,"e":"Distressed investors buy securities of troubled firms trading at steep discounts."},{"id":"PD057","t":"PD","r":"5.2.2","k":"c","d":2,"q":"In a US Chapter 11 bankruptcy, the company:","o":["Reorganizes while continuing operations under court protection","Is liquidated immediately with assets sold by a trustee","Cannot negotiate with creditors until the case is closed","Must repay all debts in full before emerging from court"],"a":0,"e":"Chapter 11 is reorganization; Chapter 7 is liquidation."},{"id":"PD058","t":"PD","r":"5.2.3","k":"c","d":2,"q":"Debtor-in-possession (DIP) financing:","o":["Is new financing during bankruptcy that typically receives super-priority","Is equity issued to creditors once the company exits bankruptcy","Is always unsecured and ranks behind all existing claims","Is provided only by the government to failing companies"],"a":0,"e":"DIP loans keep the company running and rank ahead of existing claims."},{"id":"PD059","t":"PD","r":"5.2.3","k":"c","d":3,"q":"A 'loan-to-own' distressed strategy aims to:","o":["Acquire debt expected to convert into controlling equity after restructuring","Collect coupons passively while avoiding any role in negotiations","Short the company's stock ahead of a bankruptcy announcement","Lend to healthy companies at low spreads with strong covenants"],"a":0,"e":"Investors buy the fulcrum security to gain control in reorganization."},{"id":"PD060","t":"PD","r":"5.2.4","k":"c","d":3,"q":"The 'fulcrum security' in a restructuring is:","o":["The most senior class that is not fully covered by enterprise value and likely receives equity","The most senior secured debt, which is always repaid in full","The common stock, which receives any residual value first","Any trade claim owed to suppliers at the time of filing, which ranks ahead of secured debt"],"a":0,"e":"The fulcrum class is where value runs out; it typically converts into ownership."},{"id":"PD061","t":"PD","r":"5.2.4","k":"n","d":3,"q":"A firm in restructuring has EV of $300m, senior debt of $200m and junior bonds of $250m. Which is the fulcrum security and what recovery does it get?","o":["Junior bonds, recovering 40%","Senior debt, recovering 60%","Equity, recovering 100%","Junior bonds, recovering 100%"],"a":0,"e":"Senior is fully covered ($200m); $100m remains for $250m junior bonds = 40% recovery."},{"id":"PD062","t":"PD","r":"5.2.5","k":"c","d":2,"q":"A prepackaged bankruptcy is one in which:","o":["Creditors agree to a reorganization plan before filing, speeding the process","The company liquidates immediately without a reorganization plan","No court is involved at any stage of the restructuring process","Equity holders write the plan and creditors cannot vote on it"],"a":0,"e":"Prepacks shorten time in bankruptcy and reduce costs."},{"id":"PD063","t":"PD","r":"5.2.5","k":"c","d":2,"q":"Distressed debt returns depend heavily on:","o":["Legal process, recovery values and the investor's role in negotiations","Daily interest rate changes and central bank decisions only","Mechanical index rebalancing in high-yield bond benchmarks","The company's dividend policy before it entered distress"],"a":0,"e":"Event-driven nature makes legal outcomes and recoveries key."},{"id":"PD064","t":"PD","r":"5.2.6","k":"c","d":2,"q":"An out-of-court restructuring is often preferred to bankruptcy because:","o":["It is faster and cheaper","It provides an automatic stay","It always pays creditors in full","It eliminates all debt"],"a":0,"e":"Out-of-court exchanges avoid legal costs but may face holdout problems."},{"id":"PD065","t":"PD","r":"5.3.1","k":"c","d":2,"q":"A credit default swap (CDS) buyer:","o":["Pays a periodic premium and receives compensation if a credit event occurs","Receives a periodic premium and pays if a credit event occurs","Must own the reference bond to be able to buy protection","Bears the default risk of the reference entity"],"a":0,"e":"CDS buyers buy protection; sellers take credit risk for premiums."},{"id":"PD066","t":"PD","r":"5.3.1","k":"n","d":2,"q":"An investor buys $10m of CDS protection at a spread of 200 bps per year, paid quarterly. What is the quarterly premium?","o":["$50,000","$200,000","$20,000","$500,000"],"a":0,"e":"10m × 2% / 4 = $50,000."},{"id":"PD067","t":"PD","r":"5.3.1","k":"n","d":3,"q":"After a credit event, the reference bond recovers 35%. What does the seller pay on $10m notional of protection?","o":["$6.5m","$3.5m","$10m","$0.35m"],"a":0,"e":"Payment = notional × (1 − recovery) = 10 × 0.65 = $6.5m."},{"id":"PD068","t":"PD","r":"5.3.2","k":"c","d":2,"q":"Approximately, a CDS spread equals:","o":["Probability of default × loss given default","Risk-free rate × maturity of the contract","Recovery rate × notional amount","Equity volatility × leverage ratio"],"a":0,"e":"Spread ≈ PD × (1 − recovery)."},{"id":"PD069","t":"PD","r":"5.3.2","k":"n","d":3,"q":"Annual default probability is 3% and recovery is 40%. What is the approximate fair CDS spread?","o":["180 bps","300 bps","120 bps","40 bps"],"a":0,"e":"Spread ≈ 3% × 60% = 1.8% = 180 bps."},{"id":"PD070","t":"PD","r":"5.3.3","k":"c","d":2,"q":"In a collateralized loan obligation (CLO), equity tranche investors:","o":["Receive residual cash flows and bear first losses","Are paid before AAA noteholders in every period","Earn a fixed coupon guaranteed by the manager","Bear no credit risk because of overcollateralization"],"a":0,"e":"Equity is the most subordinated tranche; senior notes are protected by subordination."},{"id":"PD071","t":"PD","r":"5.3.3","k":"n","d":3,"q":"A CLO tranche attaches at 8% and detaches at 12% of a $500m pool. If pool losses reach 10%, what loss does the tranche suffer as a % of its size?","o":["50%","10%","100%","25%"],"a":0,"e":"Tranche size = 4% ($20m). Losses above 8%: 2% ($10m) → 10/20 = 50%."},{"id":"PD072","t":"PD","r":"5.3.3","k":"c","d":2,"q":"CLO overcollateralization (OC) tests, if breached, typically:","o":["Divert cash from junior tranches to pay down senior notes","Increase distributions to equity tranche holders","Terminate the CLO and sell all loans immediately","Release collateral back to the CLO manager"],"a":0,"e":"Coverage test failures redirect cash flows to protect senior noteholders."},{"id":"PD073","t":"PD","r":"5.4.1","k":"c","d":2,"q":"Specialty finance includes lending such as:","o":["Equipment leasing, royalties, litigation finance and trade finance","Treasury auctions and repo of government securities","Index investing in listed equities and bonds","Currency carry trades in emerging markets"],"a":0,"e":"Specialty finance spans niche asset-backed or cash-flow-based lending strategies."},{"id":"PD074","t":"PD","r":"5.4.2","k":"c","d":2,"q":"Litigation finance returns are mainly driven by:","o":["Outcomes of legal cases, largely uncorrelated with markets","Equity market beta of the funded law firms","Changes in interest rates set by central banks","Commodity prices linked to the cases' sectors"],"a":0,"e":"Case results are idiosyncratic, though duration and binary risk are significant."},{"id":"PD075","t":"PD","r":"5.4.2","k":"c","d":2,"q":"Royalty financing provides investors with:","o":["A share of revenues from a product, such as music or pharmaceuticals","Ownership of the company's common equity and voting rights","A fixed coupon paid by a government agency","Control of the company's board and management"],"a":0,"e":"Royalty investors receive payments tied to sales, avoiding operating costs."},{"id":"PD076","t":"PD","r":"5.4.3","k":"c","d":2,"q":"Insurance-linked securities (ILS) are attractive to investors mainly because they:","o":["Offer returns driven by natural catastrophes, with low correlation to financial markets","Guarantee principal through government reinsurance programs","Track equity indices through catastrophe-linked swaps that pay a fixed premium each year","Carry no risk because catastrophes are fully diversifiable"],"a":0,"e":"Catastrophe risk is largely independent of economic cycles."},{"id":"PD077","t":"PD","r":"5.4.3","k":"n","d":3,"q":"A cat bond covers losses between $1.0bn (attachment) and $1.5bn (exhaustion). Industry losses reach $1.2bn. What share of principal is lost?","o":["40%","20%","80%","0%"],"a":0,"e":"(1.2 − 1.0) / (1.5 − 1.0) = 0.2 / 0.5 = 40%."},{"id":"PD078","t":"PD","r":"5.4.4","k":"c","d":2,"q":"An indemnity trigger in a cat bond pays based on:","o":["The sponsor's actual losses","An industry loss index","A parametric measure like wind speed","Stock market returns"],"a":0,"e":"Indemnity triggers reduce basis risk for the sponsor but add moral hazard and complexity for investors."},{"id":"PD079","t":"PD","r":"5.4.4","k":"c","d":3,"q":"A parametric trigger in a cat bond:","o":["Pays based on physical event parameters, reducing moral hazard but adding basis risk for the sponsor","Pays only on the sponsor's audited losses after claims are settled","Never pays out because physical parameters such as wind speed cannot be measured reliably","Is linked to equity index returns rather than to any physical event"],"a":0,"e":"Parametric triggers are transparent and fast but may not match actual losses."},{"id":"PD080","t":"PD","r":"5.4.5","k":"c","d":2,"q":"Life settlements involve investors:","o":["Buying life insurance policies from policyholders and paying premiums until maturity","Selling new life insurance policies to individual policyholders","Buying annuities from insurers to lock in guaranteed income","Investing in the listed shares of health and life insurers that sell policies to retirees"],"a":0,"e":"Returns depend on longevity; the key risk is policyholders living longer than expected."},{"id":"PD081","t":"PD","r":"5.5.1","k":"c","d":2,"q":"Peer-to-peer or marketplace lending platforms:","o":["Connect borrowers directly with investors, often via online platforms","Act as central banks for small businesses in their regions","Trade only listed equities on behalf of retail investors","Lend exclusively to governments through public auctions"],"a":0,"e":"Marketplace lending disintermediates banks for consumer and small business loans."},{"id":"PD082","t":"PD","r":"5.5.2","k":"c","d":2,"q":"Net asset value (NAV) lending provides loans to:","o":["Private funds secured by their portfolio's NAV","Individual homeowners against residential property","Governments against future tax receipts","Listed corporations against their share price"],"a":0,"e":"NAV loans let funds borrow against portfolio holdings, often for liquidity or distributions."},{"id":"PD083","t":"PD","r":"5.5.3","k":"c","d":3,"q":"Why are private credit valuations often stickier than public bond prices?","o":["They rely on models and infrequent marks rather than observable trades","They are audited daily by independent valuation agents","They are fixed by regulators at the loan's origination","Private loans never default, so prices never change"],"a":0,"e":"Mark-to-model valuations smooth reported volatility."},{"id":"PD084","t":"PD","r":"5.5.4","k":"c","d":2,"q":"An 'amend and extend' transaction in leveraged lending:","o":["Pushes out loan maturities, often in exchange for higher spreads or fees","Accelerates repayment by requiring larger amortization","Converts all outstanding loans into equity immediately","Cancels all covenants permanently at no cost to borrowers"],"a":0,"e":"It defers maturities for stressed or refinancing-constrained borrowers."},{"id":"PD085","t":"PD","r":"5.5.5","k":"c","d":2,"q":"Liability management exercises (LMEs) such as uptiers can harm:","o":["Non-participating lenders who get subordinated","The borrower's equity holders only","Senior participating lenders","Regulators overseeing the leveraged loan market"],"a":0,"e":"Uptiers let some lenders exchange into priority debt, leaving others behind."},{"id":"PD086","t":"PD","r":"5.5.6","k":"c","d":2,"q":"Which statement about private credit default and recovery rates is generally accurate?","o":["Senior secured loans tend to have higher recoveries than unsecured bonds","Unsecured bonds generally recover more than secured loans","Recovery rates on all private loans are close to 100%","Default rates on private loans have always been zero"],"a":0,"e":"Collateral and seniority improve recoveries for senior secured loans."},{"id":"PD087","t":"PD","r":"5.1.2","k":"c","d":2,"q":"Sponsor-backed direct loans benefit lenders because:","o":["PE sponsors provide equity cushions and may support the company in stress","Sponsors are required by law to guarantee portfolio company loans","Sponsors personally repay loans when companies run out of cash","Sponsor ownership eliminates business risk at portfolio companies"],"a":0,"e":"Sponsor equity sits below the loan, and sponsors often inject capital to protect investments."},{"id":"PD088","t":"PD","r":"5.1.2","k":"n","d":2,"q":"A direct loan pays SOFR + 600 bps with a 1% OID amortized over 4 years. SOFR is 4%. What is the approximate yield?","o":["10.25%","10.00%","6.25%","11.00%"],"a":0,"e":"Coupon 10% plus OID ~1% / 4 = 0.25% per year → ≈10.25%."},{"id":"PD089","t":"PD","r":"5.1.4","k":"c","d":2,"q":"Second-lien loans differ from first-lien loans in that they:","o":["Have a junior claim on the same collateral","Are always unsecured and rank with trade creditors","Rank ahead of first-lien loans","Have no collateral claim"],"a":0,"e":"Second-lien lenders are paid from collateral only after first-lien lenders."},{"id":"PD090","t":"PD","r":"5.1.6","k":"n","d":2,"q":"A borrower has total debt of $240m and EBITDA of $48m. What is its leverage ratio?","o":["5.0x","0.2x","4.0x","2.4x"],"a":0,"e":"Debt / EBITDA = 240 / 48 = 5.0x."},{"id":"PD091","t":"PD","r":"5.1.6","k":"c","d":2,"q":"Incurrence covenants are triggered:","o":["Only when the borrower takes a specified action like issuing more debt","Every quarter based on leverage and coverage tests","Only at the loan's maturity when principal is due","Never, as they are informational only and carry no consequences for the borrower"],"a":0,"e":"They restrict actions; common in high-yield bonds."},{"id":"PD092","t":"PD","r":"5.1.7","k":"c","d":2,"q":"Non-traded BDCs and private credit interval funds offer retail investors:","o":["Access to private loans with limited periodic liquidity","Daily trading on exchanges at NAV with no limits","Guaranteed principal protection backed by banks","Exposure to listed equities with no credit risk"],"a":0,"e":"Semi-liquid structures democratize access but have redemption limits."},{"id":"PD093","t":"PD","r":"5.1.8","k":"c","d":3,"q":"EBITDA 'add-backs' in private credit underwriting are a concern because:","o":["They may inflate earnings and understate true leverage","They reduce reported EBITDA and overstate leverage","They are banned under most loan agreements","They increase the collateral value of the loans"],"a":0,"e":"Aggressive add-backs make leverage appear lower than it really is."},{"id":"PD094","t":"PD","r":"5.2.1","k":"c","d":2,"q":"Why do distressed securities often trade below fundamental value?","o":["Forced selling by investors with restrictions on holding defaulted or low-rated debt","Distressed bonds offer guaranteed recoveries that investors ignore","Distressed securities are exempt from taxes, depressing demand","Rules require all investors to hold them until maturity"],"a":0,"e":"Investment-grade mandates and regulations force sales, creating opportunities."},{"id":"PD095","t":"PD","r":"5.2.2","k":"c","d":2,"q":"The automatic stay in Chapter 11:","o":["Halts creditor collection actions once a bankruptcy petition is filed","Allows creditors to seize collateral as soon as a petition is filed","Terminates all executory contracts of the debtor immediately","Requires the company to liquidate within a fixed time frame"],"a":0,"e":"The stay protects the debtor while a plan is negotiated."},{"id":"PD096","t":"PD","r":"5.2.3","k":"c","d":2,"q":"In a 'cramdown', the bankruptcy court:","o":["Confirms a reorganization plan over the objection of some creditor classes","Orders the company liquidated over management's objection","Rejects all plans that lack unanimous creditor approval","Reduces the size of DIP financing to protect old creditors"],"a":0,"e":"Cramdown requires the plan to be fair and equitable to dissenting classes."},{"id":"PD097","t":"PD","r":"5.2.4","k":"n","d":2,"q":"A distressed bond is bought at 45 and the expected recovery in 1 year is 60. What is the expected return?","o":["About 33%","About 15%","About 60%","About 25%"],"a":0,"e":"(60 − 45) / 45 ≈ 33%."},{"id":"PD098","t":"PD","r":"5.3.1","k":"c","d":2,"q":"Which event usually counts as a credit event under standard CDS contracts?","o":["Bankruptcy or failure to pay","A rating upgrade","A dividend increase","An IPO by the issuer"],"a":0,"e":"Credit events include bankruptcy, failure to pay and (for some contracts) restructuring."},{"id":"PD099","t":"PD","r":"5.3.2","k":"c","d":2,"q":"A negative CDS–bond basis means:","o":["The CDS spread is below the bond's credit spread","The CDS spread is above the bond spread","Both are zero","The bond has defaulted"],"a":0,"e":"Basis = CDS spread − bond spread; negative basis trades buy the bond and buy protection."},{"id":"PD100","t":"PD","r":"5.3.3","k":"c","d":2,"q":"CLOs are mainly backed by:","o":["Broadly syndicated leveraged loans","Residential mortgages","Credit card receivables","Government bonds and agency debt"],"a":0,"e":"Middle-market CLOs hold direct loans; BSL CLOs hold syndicated loans."},{"id":"PD101","t":"PD","r":"5.3.3","k":"c","d":2,"q":"A CLO reinvestment period allows the manager to:","o":["Trade and reinvest principal into new loans","Close the CLO early without votes","Issue equity daily","Avoid all coverage tests during the period"],"a":0,"e":"Active management during reinvestment (often ~4–5 years) differentiates CLOs from static pools."},{"id":"PD102","t":"PD","r":"5.4.1","k":"c","d":2,"q":"Aircraft leasing as a specialty finance strategy exposes investors to:","o":["Residual value risk of the aircraft and lessee credit risk","Only interest rate risk on fixed-rate lease payments","Equity market beta of airline shares and nothing else","No collateral risk because aircraft never lose value"],"a":0,"e":"Returns depend on lease payments and resale/re-lease value."},{"id":"PD103","t":"PD","r":"5.4.2","k":"c","d":2,"q":"Why do pharmaceutical royalties appeal to investors?","o":["Cash flows tied to drug sales with limited correlation to markets","They are guaranteed by governments that pay for the drugs","Their payments are linked directly to oil and gas prices","Patent expiry and competition do not affect their value"],"a":0,"e":"Risks include patent expiry and competition, but returns are largely idiosyncratic."},{"id":"PD104","t":"PD","r":"5.4.3","k":"c","d":2,"q":"Sidecars in reinsurance allow investors to:","o":["Share in a reinsurer's underwriting profits and losses on a portfolio","Buy listed shares of reinsurance companies at a discount","Avoid catastrophe risk while earning reinsurance premiums","Lend money to insurers at fixed rates with no underwriting risk"],"a":0,"e":"Sidecars are special vehicles to quota-share reinsurance risks."},{"id":"PD105","t":"PD","r":"5.4.4","k":"c","d":2,"q":"Industry loss warranties (ILWs) pay when:","o":["Industry-wide insured losses exceed a threshold","The buyer's stock falls below a set level","Interest rates rise above a set threshold","A specified borrower defaults on its loan"],"a":0,"e":"ILWs use industry indices as triggers."},{"id":"PD106","t":"PD","r":"5.4.5","k":"c","d":2,"q":"Longevity risk in life settlements means:","o":["Insured individuals live longer than expected, delaying payouts and increasing premiums paid","Insured individuals die sooner than expected, accelerating payouts","Insurers pay benefits early, reducing the investor's holding period","Policies lapse because premiums are no longer required after the insured reaches a certain age"],"a":0,"e":"Longer lives reduce IRRs for life settlement investors."},{"id":"PD107","t":"PD","r":"5.5.1","k":"c","d":2,"q":"Trade finance typically involves:","o":["Short-term financing of goods in transit or receivables","Long-term bonds financing large infrastructure projects","Equity stakes in exporters and importers","Construction loans for real estate developments"],"a":0,"e":"Trade finance is short-duration, self-liquidating and often low-loss."},{"id":"PD108","t":"PD","r":"5.5.2","k":"c","d":2,"q":"Fund finance includes subscription lines, which are secured by:","o":["LPs' unfunded capital commitments","Portfolio company assets","The GP's personal assets","Government bonds held by the fund's custodian"],"a":0,"e":"Subscription lines rely on LP creditworthiness; NAV loans rely on portfolio value."},{"id":"PD109","t":"PD","r":"5.5.3","k":"c","d":2,"q":"Which risk is especially relevant for semi-liquid private credit funds?","o":["Liquidity mismatch between redemptions and illiquid assets","High daily price volatility from exchange trading","Absence of credit risk in senior secured loans","Unlimited redemption rights offered to investors"],"a":0,"e":"Gates and redemption limits manage this mismatch."},{"id":"PD110","t":"PD","r":"5.5.4","k":"c","d":2,"q":"Covenant-lite loans have become more common in:","o":["Broadly syndicated leveraged loans","Small direct loans to non-sponsored firms","Government bonds","Trade finance"],"a":0,"e":"Strong investor demand allowed borrowers to remove maintenance covenants in BSLs."},{"id":"PD111","t":"PD","r":"5.5.6","k":"c","d":3,"q":"Historical loss rates on senior direct loans have been relatively low mainly because of:","o":["Seniority, collateral, covenants and sponsor support","Government guarantees on mid-market loans","Fixed rates that protect borrowers from rate rises","Daily mark-to-market by independent dealers"],"a":0,"e":"Structural protections support recoveries and early intervention."},{"id":"PD112","t":"PD","r":"5.5.6","k":"c","d":2,"q":"In a rising default environment, the expected loss on a loan portfolio equals:","o":["Probability of default × loss given default × exposure","Coupon × maturity × spread over the risk-free rate","Recovery rate × credit spread × duration","Leverage × EBITDA × interest coverage"],"a":0,"e":"EL = PD × LGD × EAD."},{"id":"PD113","t":"PD","r":"5.5.6","k":"n","d":2,"q":"A portfolio has PD of 2%, LGD of 40% and exposure of $500m. What is expected loss?","o":["$4m","$10m","$200m","$8m"],"a":0,"e":"0.02 × 0.40 × 500 = $4m."},{"id":"PD114","t":"PD","r":"5.1.9","k":"c","d":3,"q":"Which statement about private credit and bank partnerships is consistent with recent trends?","o":["Banks increasingly partner with private credit managers to originate and share loans","Banks have exited all corporate lending and sold their loan books","Regulators prohibit banks from working with private credit funds","Banks now invest only in equities and leave lending to others"],"a":0,"e":"Forward-flow and joint ventures between banks and asset managers have grown."},{"id":"PD115","t":"PD","r":"5.2.6","k":"c","d":2,"q":"A distressed exchange offer allows a company to:","o":["Swap existing debt for new securities with lower value or longer maturity","Issue new equity at a premium to existing shareholders","Default on its obligations without any rating consequence","Buy back stock using cash raised from new senior loans"],"a":0,"e":"Exchanges reduce debt burden outside court; rating agencies treat them as defaults."},{"id":"PD116","t":"PD","r":"5.3.1","k":"c","d":3,"q":"A CDS protection seller with no position in the bond is effectively:","o":["Long the reference entity's credit risk","Short the reference entity's credit risk","Hedged","Long equity volatility"],"a":0,"e":"Selling protection is economically similar to owning the bond funded at the risk-free rate."},{"id":"PD117","t":"PD","r":"5.4.3","k":"c","d":2,"q":"Cat bond collateral is typically invested in:","o":["High-quality short-term securities such as Treasury money market funds","The sponsor's own corporate bonds and loans","Listed equities of insurers and reinsurers that sponsored the catastrophe bond","Commercial real estate in exposed coastal regions"],"a":0,"e":"Low-risk collateral ensures principal is available to pay losses or return to investors."},{"id":"HF053","t":"HF","r":"6.1.1","k":"c","d":1,"q":"Hedge funds are typically characterized by:","o":["Flexible strategies, use of leverage and shorting, and performance fees","Long-only equity holdings, daily liquidity and fixed management fees only","Strict leverage limits, full public disclosure and retail distribution","Index replication with low turnover and no performance-based fees"],"a":0,"e":"Hedge funds are lightly regulated pools using diverse strategies, often with incentive fees."},{"id":"HF054","t":"HF","r":"6.1.1","k":"c","d":2,"q":"A hedge fund's high-water mark ensures that:","o":["Incentive fees are paid only on gains above the previous peak NAV","Incentive fees are paid on any positive return, even after prior losses","Management fees are suspended until the fund beats its benchmark","Investors can redeem without notice when the NAV falls below the peak"],"a":0,"e":"After losses, the manager must recover them before earning incentive fees again."},{"id":"HF055","t":"HF","r":"6.1.2","k":"n","d":2,"q":"A fund charges 2% management and 20% incentive fees (calculated after management fees, no hurdle). Gross return is 15% on $100m. What is the net return?","o":["10.4%","13.0%","11.0%","12.0%"],"a":0,"e":"Mgmt fee $2m; gain after mgmt fee $13m; incentive 20% = $2.6m; net = 15 − 2 − 2.6 = 10.4%."},{"id":"HF056","t":"HF","r":"6.1.2","k":"n","d":3,"q":"A fund with 1.5/20 fees and a 5% hard hurdle earns 12% gross (incentive based on return after management fee). What is the net return?","o":["9.4%","8.4%","10.5%","7.6%"],"a":0,"e":"After the 1.5% management fee: 10.5%. Excess over the 5% hard hurdle = 5.5%; incentive = 20% × 5.5% = 1.1%. Net = 10.5% − 1.1% = 9.4%."},{"id":"HF057","t":"HF","r":"6.1.3","k":"c","d":2,"q":"The incentive fee in a hedge fund resembles which option position from the manager's perspective?","o":["A call option on fund performance","A put option sold to investors","A forward contract","A short straddle"],"a":0,"e":"The manager participates in gains but not losses, like a call option; this may encourage risk taking."},{"id":"HF058","t":"HF","r":"6.1.3","k":"c","d":2,"q":"Lock-up periods in hedge funds:","o":["Restrict investors from redeeming for an initial period","Prevent the manager from trading during the first year of the fund","Cap the amount of leverage the fund may use in its first year","Guarantee that investors can redeem at the initial NAV per share"],"a":0,"e":"Hard lock-ups prohibit redemptions; soft lock-ups allow them with a fee."},{"id":"HF059","t":"HF","r":"6.1.4","k":"c","d":2,"q":"Side pockets are used to:","o":["Separate illiquid assets so that redeeming and new investors are treated fairly","Hold excess cash so the fund can meet large redemption requests quickly","Report illiquid positions at cost to reduce volatility of the fund's NAV","Pay incentive fees early on unrealized gains from private positions"],"a":0,"e":"Illiquid holdings are carved out until they can be realized."},{"id":"HF060","t":"HF","r":"6.1.4","k":"c","d":2,"q":"A redemption gate allows a hedge fund to:","o":["Limit the share of assets that can be withdrawn in a period","Charge an extra fee on all redemptions made during the lock-up","Suspend subscriptions from new investors during market stress","Convert redeeming investors' shares into side pocket interests"],"a":0,"e":"Gates (e.g., 10–25% per quarter) prevent fire sales during heavy redemptions."},{"id":"HF061","t":"HF","r":"6.1.5","k":"c","d":2,"q":"Survivorship bias in hedge fund databases tends to:","o":["Overstate average returns because failed funds drop out","Understate average returns because new funds enter the database","Increase measured volatility because failed funds remain in the data","Have no effect because databases keep the full history of dead funds"],"a":0,"e":"Removing dead funds leaves only survivors, inflating historical averages."},{"id":"HF062","t":"HF","r":"6.1.5","k":"c","d":2,"q":"Backfill (instant history) bias occurs when:","o":["Funds report past returns upon joining a database, usually after good performance","Funds stop reporting returns just before liquidating after heavy losses","Index providers include only funds above a minimum size in the database","Funds report returns gross of fees rather than net of all fees"],"a":0,"e":"Managers add strong histories when they start reporting, inflating database returns."},{"id":"HF063","t":"HF","r":"6.1.5","k":"c","d":3,"q":"Self-selection bias in hedge fund databases arises because:","o":["Reporting is voluntary, so funds choose whether and when to report","Regulators require all funds to report, but only audited returns count","Index providers select only the best-performing funds each year","Funds must report monthly returns for at least ten years before inclusion"],"a":0,"e":"Voluntary reporting means the database may not represent the full universe."},{"id":"HF064","t":"HF","r":"6.1.6","k":"c","d":2,"q":"Smoothed returns in illiquid hedge fund strategies lead to:","o":["Understated volatility and inflated Sharpe ratios","Overstated volatility and depressed Sharpe ratios versus true risk","Negative autocorrelation and overstated correlations with equities","Accurate risk estimates because appraisals capture market prices"],"a":0,"e":"Stale pricing creates positive autocorrelation and understates risk."},{"id":"HF065","t":"HF","r":"6.1.7","k":"c","d":2,"q":"Hedge fund replication products aim to:","o":["Reproduce hedge fund index returns using liquid instruments at lower cost","Copy a single star manager's trades exactly with a short reporting lag","Deliver hedge fund alpha with lower risk and guaranteed downside protection","Invest in private hedge fund shares and offer them with daily liquidity"],"a":0,"e":"Factor-based or distribution-based replication captures alternative beta."},{"id":"HF066","t":"HF","r":"6.1.7","k":"c","d":2,"q":"Factor-based hedge fund replication works best for strategies whose returns:","o":["Are largely explained by liquid risk factors","Depend on idiosyncratic deal outcomes","Are fully uncorrelated with markets","Come from illiquid assets only"],"a":0,"e":"Replication captures systematic exposures; true alpha cannot be replicated."},{"id":"HF067","t":"HF","r":"6.2.2","k":"c","d":2,"q":"Global macro managers typically:","o":["Take positions across asset classes based on macroeconomic views","Pick individual stocks bottom-up within a single sector or region","Invest only in distressed debt of companies undergoing restructuring","Hold long-only portfolios of emerging market equities and bonds"],"a":0,"e":"Macro funds trade currencies, rates, equities and commodities using top-down analysis."},{"id":"HF068","t":"HF","r":"6.2.2","k":"
