c","d":2,"q":"Discretionary macro differs from systematic macro in that:","o":["Decisions rely on managers' judgment rather than rules-based models","It trades only currencies, while systematic macro trades all assets","It never uses leverage, while systematic macro uses very high leverage","It follows trend signals mechanically, unlike systematic macro managers"],"a":0,"e":"Systematic macro follows quantitative rules; discretionary relies on judgment."},{"id":"HF069","t":"HF","r":"6.2.3","k":"c","d":2,"q":"Managed futures funds are run by:","o":["Commodity trading advisors (CTAs)","Real estate investment trusts (REITs)","Business development companies","Introducing brokers (IBs)"],"a":0,"e":"CTAs trade futures and forwards across asset classes, often using trend following."},{"id":"HF070","t":"HF","r":"6.2.3","k":"c","d":2,"q":"Trend-following strategies tend to perform well:","o":["During prolonged market moves, including sustained crises","In choppy, range-bound markets with frequent reversals","When volatility is very low and prices barely change","Only during steady equity bull markets with low rates"],"a":0,"e":"Trend following captures persistent moves and offered 'crisis alpha' in events like 2008."},{"id":"HF071","t":"HF","r":"6.2.4","k":"c","d":3,"q":"The payoff profile of trend-following strategies is often compared to:","o":["A long straddle (long volatility)","A short straddle (short volatility)","A covered call written on an index","A long position in a zero-coupon bond"],"a":0,"e":"Trend followers profit from large moves in either direction, resembling long options exposure."},{"id":"HF072","t":"HF","r":"6.2.4","k":"a","d":2,"q":"A 50-day moving average crosses above a 200-day moving average. A trend-following model would most likely:","o":["Go long","Go short","Exit all positions","Do nothing"],"a":0,"e":"A short-term average rising above a long-term one signals an uptrend (a 'golden cross')."},{"id":"HF073","t":"HF","r":"6.2.5","k":"n","d":3,"q":"An equity index future has a multiplier of $250 and the index's daily volatility is 15 points. How many contracts should a CTA hold to target daily risk of about $75,000?","o":["20","10","5","50"],"a":0,"e":"Daily risk per contract = 15 × $250 = $3,750; 75,000 / 3,750 = 20 contracts."},{"id":"HF074","t":"HF","r":"6.2.5","k":"c","d":2,"q":"Managed futures generally have which liquidity characteristic?","o":["High liquidity because they trade exchange-listed futures","Low liquidity because CTAs require multi-year lock-ups","Annual liquidity because futures are priced only once a year","No liquidity because positions are held in side pockets"],"a":0,"e":"Futures markets are deep, so managed futures often offer good liquidity and transparency."},{"id":"HF075","t":"HF","r":"6.2.6","k":"c","d":2,"q":"Carry trades in currencies involve:","o":["Borrowing in low-yielding currencies to invest in high-yielding currencies","Borrowing in high-yielding currencies to invest in low-yielding ones","Buying safe-haven currencies when interest rate spreads widen","Holding only the domestic currency to avoid exchange rate risk"],"a":0,"e":"Carry trades earn the interest differential but risk sharp unwinds."},{"id":"HF076","t":"HF","r":"6.2.6","k":"c","d":3,"q":"Carry trade returns typically exhibit:","o":["Negative skewness due to sudden crashes","Positive skewness","No tail risk","Zero correlation with risk appetite"],"a":0,"e":"Carry 'goes up by the stairs and down by the elevator'."},{"id":"HF077","t":"HF","r":"6.2.7","k":"c","d":2,"q":"Systematic strategies differ from discretionary ones in that they:","o":["Are rules-based and can be backtested","Rely only on intuition and cannot be tested on past data","Cannot be automated or executed by computer programs","Never use historical data to generate trading signals"],"a":0,"e":"Systematic models apply consistent rules, but risk overfitting in backtests."},{"id":"HF078","t":"HF","r":"6.2.8","k":"c","d":3,"q":"Backtest overfitting can be reduced by:","o":["Using out-of-sample testing and limiting parameters","Adding parameters until the backtest Sharpe is maximized","Testing over one period chosen for its strong performance","Ignoring transaction costs to keep the model simple"],"a":0,"e":"Fewer parameters, out-of-sample validation and economic rationale reduce data mining risk."},{"id":"HF079","t":"HF","r":"6.2.9","k":"c","d":2,"q":"Macro funds are generally considered:","o":["Liquid strategies with potentially low correlation to equities","Illiquid strategies with multi-year lock-ups and side pockets","Long-only equity funds with high correlation to the S&P 500","Pure credit strategies that hold loans to maturity"],"a":0,"e":"Macro trades in liquid instruments and can diversify equity-heavy portfolios."},{"id":"HF080","t":"HF","r":"6.3.1","k":"c","d":1,"q":"Event-driven hedge funds seek profits from:","o":["Corporate events such as mergers, restructurings and spin-offs","Long-term macroeconomic trends in currencies and interest rates","Mechanical rebalancing of stock indices and ETF creations","Differences between implied and realized option volatility"],"a":0,"e":"Event-driven strategies include merger arbitrage, distressed and activist investing."},{"id":"HF081","t":"HF","r":"6.3.2","k":"c","d":2,"q":"In a cash merger arbitrage, the manager typically:","o":["Buys the target's stock","Shorts the target and buys the acquirer","Shorts both companies","Buys both companies"],"a":0,"e":"In a cash deal, the arbitrageur buys the target to capture the spread to the offer price."},{"id":"HF082","t":"HF","r":"6.3.2","k":"n","d":2,"q":"A target trades at $47 with a cash offer of $50 expected to close in 6 months. What is the annualized spread (simple)?","o":["About 12.8%","About 6.4%","About 3.0%","About 25%"],"a":0,"e":"Spread = 3 / 47 = 6.38% over 6 months ≈ 12.8% annualized."},{"id":"HF083","t":"HF","r":"6.3.2","k":"n","d":3,"q":"In a stock-for-stock deal, the acquirer offers 0.5 shares per target share. The acquirer trades at $80 and target at $37. What is the arbitrage spread per target share?","o":["$3","$43","$40","$0.50"],"a":0,"e":"Deal value = 0.5 × 80 = $40; spread = 40 − 37 = $3. Hedge by shorting 0.5 acquirer shares."},{"id":"HF084","t":"HF","r":"6.3.3","k":"c","d":2,"q":"Merger arbitrage returns resemble the payoff of:","o":["Writing a put option on the market","Buying a call option on the market","Holding a long straddle position","Buying a put option on the market"],"a":0,"e":"Small steady gains with occasional large losses when deals fail—similar to short puts."},{"id":"HF085","t":"HF","r":"6.3.3","k":"n","d":3,"q":"A target trades at $45; offer is $50; if the deal fails the price falls to $35. What implied probability of success does the market price reflect?","o":["About 67%","About 90%","About 50%","About 33%"],"a":0,"e":"45 = p × 50 + (1 − p) × 35 → p = 10 / 15 ≈ 66.7%."},{"id":"HF086","t":"HF","r":"6.3.4","k":"c","d":2,"q":"Activist hedge funds seek to:","o":["Influence company management to unlock value","Hold diversified index positions and avoid boards","Short companies with weak governance practices","Lend to companies that are in financial distress"],"a":0,"e":"Activists take stakes and push for changes like buybacks, divestitures or board seats."},{"id":"HF087","t":"HF","r":"6.3.4","k":"c","d":2,"q":"In the US, an investor acquiring more than 5% of a company with activist intent must file:","o":["A Schedule 13D","A Form 10-K","A Form S-1","No filing"],"a":0,"e":"Schedule 13D discloses ownership above 5% with intent to influence."},{"id":"HF088","t":"HF","r":"6.3.5","k":"c","d":2,"q":"A spin-off event-driven strategy seeks to profit from:","o":["Mispricing as parent shareholders sell newly separated companies","Rising interest rates that reduce valuations of growth stocks","Commodity roll yield earned on newly listed futures contracts","Currency carry between the parent's and spin-off's markets"],"a":0,"e":"Forced selling by index funds and mandates can depress spin-off prices."},{"id":"HF089","t":"HF","r":"6.3.6","k":"c","d":2,"q":"Event-driven strategies generally have higher correlation with equities during:","o":["Market crises when deals break and credit tightens","Calm markets when deal volume and financing are abundant","Periods of very low M&A activity and stable credit spreads","Low volatility regimes when spreads on deals are narrow"],"a":0,"e":"Deal failures and distress rise in downturns, increasing equity correlation."},{"id":"HF090","t":"HF","r":"6.4.1","k":"c","d":2,"q":"Relative value strategies aim to profit from:","o":["Pricing discrepancies between related securities","Directional bets on the overall level of equity markets","Long-only exposure to high-dividend equities and REITs","Persistent price trends in commodity and currency futures"],"a":0,"e":"RV includes convertible arbitrage, fixed income arbitrage and volatility arbitrage."},{"id":"HF091","t":"HF","r":"6.4.2","k":"c","d":2,"q":"Convertible arbitrage typically involves:","o":["Buying convertible bonds and shorting the underlying stock","Shorting convertible bonds and buying the underlying stock","Buying the underlying stock and selling put options on it","Buying convertible bonds and holding them unhedged to maturity"],"a":0,"e":"The manager captures cheap embedded options and income while delta hedging."},{"id":"HF092","t":"HF","r":"6.4.2","k":"n","d":2,"q":"A convertible bond has a conversion ratio of 20 and the stock trades at $40. What is the conversion value?","o":["$800","$2,000","$500","$60"],"a":0,"e":"Conversion value = 20 × 40 = $800."},{"id":"HF093","t":"HF","r":"6.4.2","k":"n","d":3,"q":"That convertible (ratio 20, stock $40) trades at $1,000. What is the conversion premium?","o":["25%","20%","80%","2.5%"],"a":0,"e":"Premium = (1,000 − 800) / 800 = 25%."},{"id":"HF094","t":"HF","r":"6.4.3","k":"c","d":2,"q":"Convertible arbitrage is described as 'long volatility' because:","o":["The embedded call option gains value as volatility rises","The bond floor rises whenever implied volatility increases","The manager sells call options on the stock to earn premiums","Higher volatility always tightens the issuer's credit spread"],"a":0,"e":"Long gamma positions benefit from rebalancing when the stock moves."},{"id":"HF095","t":"HF","r":"6.4.3","k":"c","d":2,"q":"Convertible arbitrage suffered heavily in 2008 mainly due to:","o":["Forced deleveraging, short-selling bans and credit spread widening","Falling volatility, abundant liquidity and narrowing spreads","A surge in new convertible issuance at very cheap prices","Rising stock prices that pushed convertibles deep in the money"],"a":0,"e":"Funding stress and short bans hit leveraged convertible arbitrageurs."},{"id":"HF096","t":"HF","r":"6.4.4","k":"c","d":2,"q":"Fixed income arbitrage strategies typically:","o":["Exploit small mispricings between related bonds, often using high leverage","Hold unhedged high-yield bonds and avoid leverage entirely","Buy long-dated government bonds and hold them to maturity","Bet on the direction of interest rates without any hedging"],"a":0,"e":"Small spreads require leverage, making these strategies vulnerable to liquidity shocks (e.g., LTCM)."},{"id":"HF097","t":"HF","r":"6.4.4","k":"c","d":2,"q":"A swap spread trade bets on:","o":["The difference between swap rates and government bond yields","The level of equity volatility implied by index options","The roll yield between nearby and deferred oil futures","The default rates of corporate high-yield bond issuers"],"a":0,"e":"Swap spreads reflect bank credit and liquidity conditions."},{"id":"HF098","t":"HF","r":"6.4.5","k":"c","d":2,"q":"The on-the-run/off-the-run Treasury trade involves:","o":["Buying off-the-run bonds and shorting more expensive on-the-run bonds","Buying on-the-run bonds and shorting cheaper off-the-run bonds","Buying corporate bonds and shorting government bonds of equal duration","Buying off-the-run bonds and shorting equity index futures"],"a":0,"e":"Newly issued bonds carry a liquidity premium that tends to converge."},{"id":"HF099","t":"HF","r":"6.4.5","k":"c","d":3,"q":"The Treasury cash–futures basis trade profits from:","o":["Convergence between cash Treasuries and Treasury futures, typically using repo leverage","Credit spread widening on corporate bonds held unhedged","Directional bets on Treasury yields with no futures hedge","Rising equity prices in a portfolio funded with repo and hedged with Treasury options"],"a":0,"e":"Funds buy cash bonds funded via repo and short futures, earning a small spread with high leverage."},{"id":"HF100","t":"HF","r":"6.4.6","k":"c","d":2,"q":"Volatility arbitrage seeks to profit from:","o":["Differences between implied and expected realized volatility","Dividend increases announced by index constituents","Rating upgrades of companies with convertible bonds","Price trends in commodity futures across maturities"],"a":0,"e":"Managers buy or sell options when implied volatility deviates from forecasts."},{"id":"HF101","t":"HF","r":"6.4.6","k":"n","d":3,"q":"A variance swap has vega notional of $100,000 and strike volatility of 20%. Realized volatility is 25%. The variance notional = vega notional / (2 × strike). What is the payoff to the long?","o":["$562,500","$500,000","$250,000","$1,125,000"],"a":0,"e":"Variance notional = 100,000 / 40 = 2,500. Payoff = 2,500 × (25² − 20²) = 2,500 × 225 = $562,500."},{"id":"HF102","t":"HF","r":"6.4.7","k":"c","d":2,"q":"The volatility risk premium refers to:","o":["Implied volatility tending to exceed subsequently realized volatility","Realized volatility tending to exceed implied volatility","Option sellers earning nothing on average over time","Implied volatility always equal to realized volatility"],"a":0,"e":"Option sellers earn a premium on average, but face large losses in crashes."},{"id":"HF103","t":"HF","r":"6.4.7","k":"c","d":2,"q":"Selling options to harvest the volatility risk premium creates:","o":["Negatively skewed returns with tail risk","Positively skewed returns with limited downside","Symmetric, normally distributed returns","Returns with no exposure to market crashes"],"a":0,"e":"Short volatility strategies earn small steady gains with occasional large losses."},{"id":"HF104","t":"HF","r":"6.4.3","k":"c","d":3,"q":"Gamma trading in convertible arbitrage profits when:","o":["Realized volatility exceeds the volatility implied in the purchase price","Implied volatility exceeds the volatility subsequently realized","The stock price stays perfectly flat until maturity","Credit spreads widen sharply and the bond floor falls"],"a":0,"e":"Delta rebalancing locks in gains when realized volatility is high."},{"id":"HF105","t":"HF","r":"6.4.1","k":"c","d":2,"q":"Why are relative value strategies often vulnerable in liquidity crises?","o":["They use leverage and rely on spreads converging, which can widen further under stress","They hold mostly cash and avoid leverage, so they miss rebounds","They are always unhedged directional bets on equity markets","They have no counterparty exposure to prime brokers, so funding never tightens"],"a":0,"e":"Spreads can widen sharply as leveraged players are forced to unwind."},{"id":"HF106","t":"HF","r":"6.4.4","k":"c","d":2,"q":"The collapse of LTCM in 1998 illustrated:","o":["Risks of high leverage and crowded relative value trades during a liquidity shock","That diversification across bonds eliminates all liquidity risk","That high leverage reduces risk when trades are well hedged","That relative value trades always converge within weeks"],"a":0,"e":"Russia's default triggered a flight to quality and spread widening, devastating LTCM's leveraged positions."},{"id":"HF107","t":"HF","r":"6.4.6","k":"c","d":2,"q":"Dispersion trading typically involves:","o":["Selling index volatility and buying volatility on index constituents","Buying index volatility and selling constituent volatility","Buying government bonds and shorting index futures","Selling currency volatility and buying commodity options"],"a":0,"e":"It bets on correlation: index implied correlation often exceeds realized correlation."},{"id":"HF108","t":"HF","r":"6.4.5","k":"c","d":2,"q":"Capital structure arbitrage exploits:","o":["Mispricing between different securities of the same issuer, such as CDS and equity","Price differences of the same stock listed in different countries","Spreads between commodity futures with different delivery months","Differences in cap rates between similar real estate assets"],"a":0,"e":"It trades inconsistent pricing across debt, equity and derivatives of one firm."},{"id":"HF109","t":"HF","r":"6.1.6","k":"c","d":2,"q":"Hedge fund returns often show negative skewness and excess kurtosis, meaning:","o":["Large losses occur more frequently than a normal distribution predicts","Returns are normally distributed with thin tails on both sides","Large gains occur much more often than large losses","Volatility fully captures the risk of extreme losses"],"a":0,"e":"Standard deviation alone understates tail risk for many hedge fund strategies."},{"id":"HF110","t":"HF","r":"6.1.7","k":"c","d":2,"q":"Alternative risk premia (ARP) products provide:","o":["Rules-based exposure to factors like value, momentum and carry at low cost","Discretionary stock picking by star managers at high fees","Private equity exposure with long lock-up periods","Guaranteed alpha with capital protection on all strategies"],"a":0,"e":"ARP strategies systematically capture hedge-fund-like factors."},{"id":"HF111","t":"HF","r":"6.1.1","k":"c","d":2,"q":"Compared with mutual funds, hedge funds generally have:","o":["Less regulation, fewer disclosure requirements and restricted investor eligibility","More regulation, daily liquidity and open access to retail investors","Lower fees and full public disclosure of all positions","Strict leverage limits and no use of short selling"],"a":0,"e":"Hedge funds are private placements for accredited or qualified investors."},{"id":"HF112","t":"HF","r":"6.1.2","k":"c","d":2,"q":"A crystallization frequency of incentive fees refers to:","o":["How often the incentive fee is calculated and paid","How often investors may subscribe to new shares","How often the fund is audited by an external firm","How often the fund rebalances its portfolio"],"a":0,"e":"More frequent crystallization tends to increase fees paid."},{"id":"HF113","t":"HF","r":"6.1.4","k":"c","d":2,"q":"Most-favored-nation (MFN) clauses in side letters grant investors:","o":["Terms at least as favorable as those given to other comparable investors","Higher fees in exchange for more frequent liquidity than others","Exclusive rights to trade alongside the fund's manager","Control over the fund's investment strategy and staff"],"a":0,"e":"MFN clauses ensure equal treatment on fee and liquidity terms."},{"id":"HF114","t":"HF","r":"6.2.3","k":"c","d":2,"q":"CTA returns during the 2008 crisis were:","o":["Strongly positive for many trend followers","Deeply negative across the industry","Exactly zero","Unreported"],"a":0,"e":"Trend followers captured sustained declines in equities and commodities."},{"id":"HF115","t":"HF","r":"6.5.1","k":"c","d":1,"q":"An equity long/short fund typically:","o":["Buys undervalued stocks and shorts overvalued stocks, with variable net exposure","Buys a diversified basket of stocks and never sells short","Shorts all stocks in an index and holds the cash proceeds","Holds only government bonds with a long duration overlay to profit from falling rates"],"a":0,"e":"Equity L/S combines long and short positions, usually with a net long bias."},{"id":"HF116","t":"HF","r":"6.5.1","k":"n","d":2,"q":"A fund has $130m long and $70m short positions on $100m of capital. What are its gross and net exposures?","o":["200% gross, 60% net","60% gross, 200% net","130% gross, 70% net","100% gross, 0% net"],"a":0,"e":"Gross = (130 + 70)/100 = 200%; net = (130 − 70)/100 = 60%."},{"id":"HF117","t":"HF","r":"6.5.2","k":"c","d":2,"q":"An equity market neutral fund aims to:","o":["Have near-zero net market exposure (beta), earning returns from stock selection","Maximize market beta to capture the equity risk premium","Track a broad equity index with low tracking error and a beta close to one","Hold only long positions in high-quality dividend stocks"],"a":0,"e":"Market neutral strategies hedge out market and often factor exposures."},{"id":"HF118","t":"HF","r":"6.5.2","k":"n","d":3,"q":"A manager is long $100m of stocks with beta 1.2 and wants a beta-neutral position by shorting stocks with beta 0.9. How much should be shorted?","o":["About $133.3m","$100m","About $75m","$120m"],"a":0,"e":"Short = 100 × 1.2 / 0.9 ≈ $133.3m."},{"id":"HF119","t":"HF","r":"6.5.3","k":"c","d":2,"q":"Short selling exposes the investor to:","o":["Theoretically unlimited losses and short squeeze risk","Losses limited to the initial investment","No borrowing costs and no risk of recall","Guaranteed rebates"],"a":0,"e":"Prices can rise without limit; borrow costs and recalls add risk."},{"id":"HF120","t":"HF","r":"6.5.3","k":"c","d":2,"q":"The short rebate is:","o":["Interest earned on cash collateral from a short sale, net of borrowing fees","A dividend paid to the short seller by the stock's lender","A penalty charged by regulators on every short sale executed by the fund","A tax credit available on realized short-sale losses"],"a":0,"e":"For hard-to-borrow stocks, the rebate can be negative."},{"id":"HF121","t":"HF","r":"6.5.4","k":"c","d":2,"q":"A fundamental equity L/S manager's alpha comes mainly from:","o":["Stock selection based on company analysis","Market timing based on macroeconomic forecasts","Currency hedging of foreign stock positions","Commodity roll yield from futures overlays"],"a":0,"e":"Fundamental managers research businesses to identify mispriced stocks."},{"id":"HF122","t":"HF","r":"6.5.4","k":"c","d":2,"q":"Quantitative equity market neutral funds suffered in August 2007 mainly because:","o":["Crowded factor positions were rapidly unwound","Equity markets rose sharply over a few days","Short selling was suddenly allowed in all markets","Interest rates fell to zero in major economies"],"a":0,"e":"The 'quant quake' showed deleveraging of similar positions can create large losses."},{"id":"HF123","t":"HF","r":"6.5.5","k":"c","d":2,"q":"A short-biased fund is likely to perform best when:","o":["Equity markets decline","Equity markets rise steadily","Volatility is low","Interest rates fall"],"a":0,"e":"Net short exposure benefits from falling markets but has struggled in long bull markets."},{"id":"HF124","t":"HF","r":"6.5.5","k":"c","d":2,"q":"Sector-focused hedge funds (e.g., healthcare, technology) may offer:","o":["Deep specialist expertise but higher concentration risk","Full diversification across sectors","Lower volatility than market neutral funds","No idiosyncratic risk thanks to sector-level diversification"],"a":0,"e":"Specialization can add alpha but concentrates exposure."},{"id":"HF125","t":"HF","r":"6.5.6","k":"c","d":2,"q":"Multi-strategy hedge funds offer:","o":["Allocation across strategies within one fund, with dynamic capital allocation","A single strategy run by one portfolio manager without hedging","Exposure to many funds of funds, each charging a separate fee","Long-only exposure to equities with no risk management team"],"a":0,"e":"Multi-strats diversify across strategies and can shift capital quickly."},{"id":"HF126","t":"HF","r":"6.5.6","k":"c","d":2,"q":"Pass-through fee structures in multi-manager platforms mean that:","o":["Investors bear the platform's costs, including trader compensation, beyond a standard management fee","Investors pay no fees at all, as costs are absorbed by the manager","All fees are capped at 1% of assets regardless of performance","Only incentive fees are charged, with management fees waived for investors who accept longer lock-ups"],"a":0,"e":"Pass-through expenses can be large, so net returns must be evaluated carefully."},{"id":"HF127","t":"HF","r":"6.5.6","k":"c","d":3,"q":"Compared with fund-of-funds, multi-strategy funds generally:","o":["Avoid a double layer of fees and offer more control over risk across books","Charge two layers of fees on top of underlying fund expenses","Have less control over netting of risk across underlying books","Are always less leveraged than any fund of hedge funds"],"a":0,"e":"FoFs add a fee layer and face netting risk; multi-strats net incentive fees internally (but may pay pod fees)."},{"id":"HF128","t":"HF","r":"6.5.6","k":"c","d":2,"q":"Fund of hedge funds provide which benefit to investors?","o":["Diversification, manager selection and due diligence","Lower total fees than direct investing","Daily liquidity guaranteed by the fund of funds manager","Elimination of manager risk"],"a":0,"e":"FoFs add value through access and diversification but charge an extra layer of fees."},{"id":"HF129","t":"HF","r":"6.5.6","k":"n","d":3,"q":"A FoF holds two funds equally. Fund A gains 20% gross and Fund B loses 10%. Each charges 20% incentive (ignore other fees). What is the FoF return before its own fees?","o":["3.0%","5.0%","4.0%","2.0%"],"a":0,"e":"A net = 16%; B net = −10%; average = 3%. Netting risk: investors pay incentive on A despite B's losses."},{"id":"HF130","t":"HF","r":"6.1.1","k":"c","d":2,"q":"Operational due diligence (ODD) on a hedge fund primarily evaluates:","o":["Non-investment risks like valuation, custody, compliance and service providers","The manager's stock picks and their expected contribution to alpha","Expected returns and the manager's forecast of market direction","The quality of the fund's marketing materials and pitch book"],"a":0,"e":"Many hedge fund failures stem from operational issues rather than investment losses."},{"id":"HF131","t":"HF","r":"6.1.1","k":"c","d":2,"q":"Independent administrators are important for hedge funds because they:","o":["Calculate NAV independently and reduce fraud risk","Make the fund's investment decisions and set position limits","Act as prime broker and lend securities to the fund","Set management and incentive fees for each share class"],"a":0,"e":"Independent NAV calculation is a key ODD check."},{"id":"HF132","t":"HF","r":"6.1.2","k":"c","d":2,"q":"Prime brokers provide hedge funds with:","o":["Securities lending, financing (leverage), custody and trade clearing","Investment advice and portfolio management for the fund","Independent audits of the fund's financial statements","Regulatory approval for new strategies and share classes"],"a":0,"e":"Prime brokers support trading operations and leverage; counterparty risk is a key concern."},{"id":"HF133","t":"HF","r":"6.1.2","k":"c","d":3,"q":"Why did Lehman Brothers' 2008 bankruptcy harm some hedge funds?","o":["Assets held at Lehman's prime brokerage were frozen or rehypothecated","Lehman had guaranteed the returns of the funds it financed","Lehman acted as administrator and stopped calculating NAVs","The funds were Lehman's largest shareholders and lost equity"],"a":0,"e":"Rehypothecated collateral became trapped in bankruptcy, highlighting counterparty risk."},{"id":"HF134","t":"HF","r":"6.1.3","k":"c","d":2,"q":"Style drift in hedge funds refers to:","o":["A manager deviating from the stated strategy","A change in the fund's legal name","A rise in the fund's fee levels after strong performance","A move of the fund's head office"],"a":0,"e":"Style drift undermines portfolio construction and may signal risk-taking."},{"id":"HF135","t":"HF","r":"6.1.3","k":"c","d":2,"q":"Key-person risk in hedge funds arises when:","o":["Fund performance depends heavily on one or a few individuals","The fund has many analysts and portfolio managers","The fund replicates an index with low turnover","The fund is closely supervised by regulators"],"a":0,"e":"Key-person clauses may allow redemptions if the key manager leaves."},{"id":"HF136","t":"HF","r":"6.1.6","k":"n","d":2,"q":"A hedge fund returns 9% with 6% volatility; the risk-free rate is 3%. What is its Sharpe ratio?","o":["1.0","1.5","0.5","2.0"],"a":0,"e":"(9 − 3) / 6 = 1.0."},{"id":"HF137","t":"HF","r":"6.1.6","k":"c","d":3,"q":"The Sortino ratio improves on the Sharpe ratio by:","o":["Using downside deviation instead of total volatility","Ignoring the risk-free rate in the numerator","Using beta in place of total volatility","Adding fees back to the fund's return"],"a":0,"e":"Sortino penalizes only downside volatility, which matters for skewed returns."},{"id":"HF138","t":"HF","r":"6.1.7","k":"c","d":2,"q":"In a regression of hedge fund returns on factors, alpha represents:","o":["Return unexplained by the factor exposures","The fund's sensitivity to equity markets","The fees paid to the manager","The volatility of residual returns"],"a":0,"e":"Alpha is the intercept; true alpha is hard to distinguish from omitted factors."},{"id":"HF139","t":"HF","r":"6.1.7","k":"c","d":3,"q":"Hedge fund returns may appear to have high alpha when regressed only on equity indices because:","o":["Omitted factors like credit, volatility or option-like exposures are attributed to alpha","Hedge funds take no market risk, so all returns are alpha","Equity indices are smoothed by appraisals, which inflates measured fund alpha","Fees are excluded from the regression, raising the intercept"],"a":0,"e":"Including relevant alternative factors often reduces measured alpha."},{"id":"HF140","t":"HF","r":"6.5.1","k":"c","d":2,"q":"Equity L/S funds typically have historical correlation with equity markets that is:","o":["Moderately high, due to net long bias","Strongly negative, due to large short books","Exactly zero for nearly all funds","Close to 1.0, as funds track indices"],"a":0,"e":"Most L/S funds are net long, so they share part of equity market risk."},{"id":"HF141","t":"HF","r":"6.5.2","k":"c","d":2,"q":"Pairs trading involves:","o":["Buying one stock and shorting a related stock expected to converge","Buying two unrelated stocks expected to rise","Shorting both stocks in the same sector to profit from a decline","Buying an index fund and a government bond"],"a":0,"e":"Statistical arbitrage pairs bet on mean reversion of a spread."},{"id":"HF142","t":"HF","r":"6.5.2","k":"c","d":2,"q":"Statistical arbitrage strategies typically:","o":["Hold many positions for short periods using quantitative signals","Hold a few positions for many years with no models","Trade only private companies using fundamental research","Avoid quantitative signals and rely on manager judgment"],"a":0,"e":"Stat arb uses mean reversion and other signals across large portfolios."},{"id":"HF143","t":"HF","r":"6.5.4","k":"c","d":2,"q":"Factor crowding in equity hedge funds increases:","o":["Risk of correlated losses when many funds unwind similar positions","Diversification, as funds hold different positions","Liquidity during stress, as more buyers are present","Alpha permanently, as funds share their best ideas"],"a":0,"e":"Crowded trades can deleverage simultaneously."},{"id":"HF144","t":"HF","r":"6.1.4","k":"c","d":2,"q":"An audit by a reputable firm is important in hedge funds because:","o":["It verifies financial statements and asset existence","It guarantees the fund's returns to investors","It replaces the need for operational due diligence","It determines the fund's management and incentive fees"],"a":0,"e":"Audit by a known firm is a basic due diligence requirement."},{"id":"HF145","t":"HF","r":"6.1.5","k":"c","d":2,"q":"Investable hedge fund indices often underperform non-investable indices because:","o":["They include only open funds accepting capital, often excluding top closed funds","They have no fees, unlike non-investable indices","They are equally weighted across all strategies","They include more strategies and more funds, diluting the returns of the best performers"],"a":0,"e":"Investability constraints exclude many strong managers."},{"id":"HF146","t":"HF","r":"6.1.3","k":"c","d":2,"q":"Asymmetric incentive fees may lead managers who are far below their high-water mark to:","o":["Increase risk to recover, or close the fund","Reduce risk to zero","Lower management fees automatically","Return all capital immediately"],"a":0,"e":"The option-like payoff may encourage gambling or liquidating and restarting."},{"id":"HF147","t":"HF","r":"6.2.5","k":"c","d":2,"q":"Volatility targeting in managed futures means:","o":["Adjusting position sizes so each market contributes similar risk","Holding constant notional exposure in each futures market","Avoiding the most volatile markets in the portfolio","Using exactly 1x leverage across all positions"],"a":0,"e":"Risk parity-like sizing scales positions inversely to volatility."},{"id":"HF148","t":"HF","r":"6.2.9","k":"c","d":2,"q":"Which hedge fund strategy is most likely to provide diversification during a prolonged equity bear market?","o":["Trend-following managed futures","Convertible arbitrage","Merger arbitrage","Long-biased equity hedge"],"a":0,"e":"Trend followers can short falling markets; event and RV strategies often suffer in crises."},{"id":"HF149","t":"HF","r":"6.3.6","k":"c","d":2,"q":"Which risk is most relevant for merger arbitrage?","o":["Deal failure risk","Interest rate convexity","Commodity contango","Currency carry crash"],"a":0,"e":"Deal breaks (regulatory, financing, shareholder votes) drive losses."},{"id":"HF150","t":"HF","r":"6.3.2","k":"c","d":2,"q":"Antitrust review is a key risk in merger arbitrage because it can:","o":["Delay or block the deal, widening spreads","Guarantee completion","Reduce the offer to zero automatically","Increase the acquirer's stock price"],"a":0,"e":"Regulatory scrutiny is a primary source of deal break risk."},{"id":"HF151","t":"HF","r":"6.4.2","k":"c","d":2,"q":"A convertible bond's investment value (bond floor) is:","o":["The value of the bond without its conversion option","The conversion value of the bond at current prices","The market price of the underlying stock","The bond's par value regardless of credit risk"],"a":0,"e":"The bond floor provides downside protection, subject to credit risk."},{"id":"HF152","t":"HF","r":"6.4.2","k":"c","d":3,"q":"When a convertible's stock price falls far below the conversion price, the convertible behaves more like:","o":["A straight bond (busted convertible)","The underlying stock","A deep in-the-money call","Cash held in escrow by the issuer"],"a":0,"e":"Deep out-of-the-money convertibles have low delta and trade near the bond floor."},{"id":"HF153","t":"HF","r":"6.4.3","k":"n","d":3,"q":"A convertible has a delta of 0.6 and conversion ratio of 25. How many shares should be shorted per bond to delta-hedge?","o":["15","25","10","6"],"a":0,"e":"Shares to short = delta × conversion ratio = 0.6 × 25 = 15."},{"id":"HF154","t":"HF","r":"6.4.4","k":"c","d":2,"q":"Yield curve arbitrage trades:","o":["Relative value between different maturities on the curve","Equity index futures across regions","Currency carry between countries with different rates","Commodity spreads across maturities"],"a":0,"e":"Trades exploit mispricing in curve shape (steepeners, flatteners, butterflies)."},{"id":"HF155","t":"HF","r":"6.4.5","k":"c","d":2,"q":"Mortgage-backed securities arbitrage is exposed to:","o":["Prepayment risk and negative convexity","No interest rate risk at all","Equity market risk only, with no rate exposure","Commodity price risk only"],"a":0,"e":"MBS cash flows change with prepayments, requiring dynamic hedging."},{"id":"HF156","t":"HF","r":"6.4.7","k":"c","d":2,"q":"Tail-risk hedging funds typically:","o":["Buy out-of-the-money options, losing small amounts in normal times and gaining in crashes","Sell options to earn steady premiums with occasional large losses","Hold only cash and short-term bills during calm markets, then buy equities after crashes","Short volatility through variance swaps in normal markets"],"a":0,"e":"Tail hedges have positive skewness and negative carry."},{"id":"HF157","t":"HF","r":"6.5.6","k":"c","d":2,"q":"Netting risk in a fund of funds refers to:","o":["Paying incentive fees to winning managers even when the overall portfolio loses","Double counting of returns across underlying funds held through several share classes","Currency netting across share classes of the same fund","The administrator netting trades before calculating NAV"],"a":0,"e":"Investors pay incentive fees on individual winners even if losers offset gains."},{"id":"HF158","t":"HF","r":"6.1.2","k":"c","d":2,"q":"An equalization or series accounting method in hedge funds is used to:","o":["Ensure each investor pays incentive fees fairly based on their own entry point","Equalize the returns earned by all investors in the fund","Avoid annual audits for investors who joined the fund in the middle of the year","Increase leverage for investors with higher risk tolerance"],"a":0,"e":"Series accounting tracks individual high-water marks."},{"id":"HF159","t":"HF","r":"6.2.7","k":"c","d":2,"q":"Quantitative macro and CTA strategies are increasingly using machine learning, which raises concerns about:","o":["Overfitting and lack of interpretability","Too much transparency in model outputs","Zero computational and data costs","Guaranteed returns from better forecasts"],"a":0,"e":"Complex models can find spurious patterns and be hard to explain."},{"id":"HF160","t":"HF","r":"6.3.4","k":"c","d":3,"q":"Research suggests that activist campaigns, on average:","o":["Generate positive abnormal returns at announcement for target shareholders","Always destroy value for target shareholders","Have no measurable impact on stock prices at announcement or later","Lead to immediate bankruptcy of the target firm"],"a":0,"e":"Announcement returns are positive, though long-term effects are debated."},{"id":"HF161","t":"HF","r":"6.3.5","k":"c","d":2,"q":"Special situations investing focuses on:","o":["Discrete corporate events like spin-offs, recapitalizations or index changes","Long-term passive holdings in broad equity indices","Currency carry trades across emerging markets with high interest rates","Trend following in commodity and bond futures"],"a":0,"e":"Catalyst-driven opportunities across the capital structure."},{"id":"HF162","t":"HF","r":"6.4.1","k":"c","d":2,"q":"Hedge fund strategies that are 'short volatility' typically show:","o":["Steady gains with occasional large losses","Steady losses with occasional large gains","No tail risk","Positive skewness"],"a":0,"e":"Merger arbitrage, convertible arbitrage and option selling exhibit short-vol profiles."},{"id":"HF163","t":"HF","r":"6.5.1","k":"n","d":2,"q":"An equity L/S fund has 120% long and 80% short. If the long book returns +5% and the short book's stocks return +2%, what is the gross return on capital (ignoring rebate and costs)?","o":["+4.4%","+3.0%","+7.0%","+6.0%"],"a":0,"e":"120% × 5% − 80% × 2% = 6.0% − 1.6% = 4.4%."},{"id":"HF164","t":"HF","r":"6.1.4","k":"c","d":2,"q":"Notice periods in hedge funds require investors to:","o":["Inform the fund in advance (e.g., 30–90 days) before redeeming","Pay a penalty on every new subscription to the fund","Hold their shares for at least ten years","Redeem daily at the fund's closing NAV"],"a":0,"e":"Notice periods help managers plan liquidity."},{"id":"HF165","t":"HF","r":"6.1.5","k":"c","d":2,"q":"Liquidation bias arises because:","o":["Funds often stop reporting before final losses during liquidation","Funds report returns too often, adding noise to indices","Index providers exclude the best performing managers","Funds report gross returns, which overstate net results"],"a":0,"e":"Final losses go unreported, biasing averages upward."},{"id":"HF166","t":"HF","r":"6.1.6","k":"c","d":3,"q":"One way to adjust for return smoothing in hedge fund data is to:","o":["Unsmooth returns using autocorrelation (e.g., Geltner method)","Ignore autocorrelation and use reported volatility as is","Use only annual data so smoothing averages out","Add leverage to bring volatility to market levels"],"a":0,"e":"Unsmoothing removes serial correlation to estimate true volatility."},{"id":"HF167","t":"HF","r":"6.2.2","k":"c","d":2,"q":"Macro managers often express views through:","o":["Liquid derivatives such as futures, forwards, swaps and options","Private real estate holdings and farmland held for many years","Unlisted startups and venture capital funds","Physical commodities stored in warehouses"],"a":0,"e":"Liquid instruments allow quick, leveraged expression of macro views."},{"id":"DA019","t":"DA","r":"7.1.1","k":"c","d":1,"q":"A blockchain is best described as:","o":["A distributed ledger that records transactions in linked blocks","A central bank database that records all payments in real time","A type of hedge fund that invests in digital currencies","A stock exchange that lists technology companies' shares"],"a":0,"e":"Blockchains are decentralized ledgers secured by cryptography and consensus."},{"id":"DA020","t":"DA","r":"7.1.1","k":"n","d":2,"q":"The bitcoin block reward was 3.125 BTC after the 2024 halving. What will it be after the next halving?","o":["1.5625 BTC","6.25 BTC","3.125 BTC","0.78 BTC"],"a":0,"e":"Each halving cuts the reward by 50%: 3.125 / 2 = 1.5625 BTC."},{"id":"DA021","t":"DA","r":"7.1.1","k":"c","d":2,"q":"Bitcoin halvings occur approximately every:","o":["Four years (210,000 blocks)","Year (52,560 blocks)","Ten years (1,050,000 blocks)","Month (4,380 blocks)"],"a":0,"e":"The reward halves every 210,000 blocks, about every four years."},{"id":"DA022","t":"DA","r":"7.1.2","k":"n","d":2,"q":"One bitcoin equals 100 million satoshis. How many satoshis are in 0.0025 BTC?","o":["250,000","25,000","2,500,000","2,500"],"a":0,"e":"0.0025 × 100,000,000 = 250,000 sats."},{"id":"DA023","t":"DA","r":"7.1.2","k":"c","d":2,"q":"Proof of work secures a blockchain by requiring:","o":["Miners to expend computational energy to validate blocks","Validators to stake tokens that can be slashed","A central authority to approve each new block","Users to pay no fees for including transactions"],"a":0,"e":"PoW makes attacks costly via energy and hardware; bitcoin uses PoW."},{"id":"DA024","t":"DA","r":"7.1.2","k":"c","d":2,"q":"Proof of stake differs from proof of work in that validators:","o":["Lock up tokens as collateral and can be penalized (slashed) for misbehavior","Solve energy-intensive puzzles using specialized mining hardware","Need government approval before validating any transaction","Are anonymous by law and cannot be penalized for errors"],"a":0,"e":"PoS secures the network economically; Ethereum moved to PoS in 2022 (the Merge)."},{"id":"DA025","t":"DA","r":"7.1.3","k":"n","d":3,"q":"An Ethereum transfer uses 21,000 gas at a gas price of 20 gwei (1 gwei = 10⁻⁹ ETH). What is the fee?","o":["0.00042 ETH","0.0042 ETH","0.42 ETH","0.000042 ETH"],"a":0,"e":"21,000 × 20 = 420,000 gwei = 0.00042 ETH."},{"id":"DA026","t":"DA","r":"7.1.3","k":"c","d":2,"q":"Smart contracts are:","o":["Self-executing code on a blockchain that runs when conditions are met","Legal documents signed by lawyers and stored on a server","Bank guarantees issued on behalf of crypto exchanges","Paper contracts that are scanned and stored digitally"],"a":0,"e":"Smart contracts enable DeFi, tokens and automated agreements."},{"id":"DA027","t":"DA","r":"7.1.3","k":"c","d":2,"q":"Staking rewards in proof-of-stake networks are earned for:","o":["Helping validate transactions by locking tokens","Mining with GPUs","Lending to banks","Holding tokens on an exchange without staking"],"a":0,"e":"Stakers receive newly issued tokens and fees as validator rewards."},{"id":"DA028","t":"DA","r":"7.1.4","k":"c","d":2,"q":"Stablecoins are designed to:","o":["Maintain a stable value, typically pegged to a fiat currency like the US dollar","Track the price of bitcoin with lower fees than spot ownership","Pay high fixed coupons funded by the issuer's trading profits","Replace equities in portfolios as a source of long-term growth"],"a":0,"e":"Fiat-backed stablecoins hold reserves; algorithmic ones rely on mechanisms that can fail."},{"id":"DA029","t":"DA","r":"7.1.4","k":"c","d":2,"q":"The 2022 collapse of TerraUSD illustrated the risk of:","o":["Algorithmic stablecoins losing their peg","Fully reserved, fiat-backed stablecoins","Bitcoin's fixed supply of 21 million coins","Proof-of-work mining consuming energy"],"a":0,"e":"TerraUSD's algorithmic peg failed, wiping out roughly $40bn+ of value."},{"id":"DA030","t":"DA","r":"7.1.4","k":"c","d":2,"q":"Decentralized finance (DeFi) refers to:","o":["Financial services such as lending and trading via smart contracts without traditional intermediaries","Central bank digital currencies issued and controlled by monetary authorities","Bank-issued credit cards that allow purchases of crypto assets","Exchange-traded funds that hold baskets of listed bank shares and payment companies"],"a":0,"e":"DeFi protocols run on blockchains, introducing smart contract and governance risks."},{"id":"DA031","t":"DA","r":"7.1.4","k":"c","d":3,"q":"Automated market makers (AMMs) on decentralized exchanges expose liquidity providers to:","o":["Impermanent loss when relative token prices change","Guaranteed returns set by the exchange's governance token","No price risk because pools always rebalance to cash","Default of a central counterparty clearing house"],"a":0,"e":"LPs can underperform simply holding the tokens when prices diverge."},{"id":"DA032","t":"DA","r":"7.1.5","k":"c","d":2,"q":"Non-fungible tokens (NFTs) differ from cryptocurrencies in that each NFT is:","o":["Unique and not interchangeable","Identical to every other token","Pegged to the dollar","Issued by central banks"],"a":0,"e":"NFTs represent unique digital items or ownership claims."},{"id":"DA033","t":"DA","r":"7.1.5","k":"c","d":2,"q":"Tokenization of real-world assets refers to:","o":["Representing ownership of assets like bonds, funds or real estate as blockchain tokens","Converting bitcoin into dollars through a regulated exchange","Mining new coins on a proof-of-work blockchain network using specialized hardware","Printing paper certificates for digital asset holdings"],"a":0,"e":"Tokenization may improve settlement, fractional ownership and access."},{"id":"DA034","t":"DA","r":"7.1.6","k":"c","d":2,"q":"Which is a key risk of holding crypto assets on centralized exchanges?","o":["Counterparty and custody risk if the exchange fails","No volatility because exchanges fix prices","Guaranteed deposit insurance on all holdings","No cyber risk because exchanges are offline"],"a":0,"e":"The FTX collapse (2022) showed customers can lose assets held on exchanges."},{"id":"DA035","t":"DA","r":"7.1.6","k":"c","d":2,"q":"'Not your keys, not your coins' refers to:","o":["Only those who control private keys truly control crypto assets","Coins must be stored in regulated banks to be legally owned","Coins cannot be lost once they are recorded on a blockchain","Exchanges guarantee ownership of all coins held for clients"],"a":0,"e":"Self-custody gives control but introduces key-loss risk."},{"id":"DA036","t":"DA","r":"7.2.1","k":"c","d":2,"q":"Spot bitcoin ETFs were approved in the US in:","o":["January 2024","2015","2008","They have not been approved"],"a":0,"e":"The SEC approved several spot bitcoin ETFs in January 2024, broadening access."},{"id":"DA037","t":"DA","r":"7.2.1","k":"c","d":2,"q":"Compared with buying bitcoin directly, a spot bitcoin ETF offers:","o":["Regulated, brokerage-account access without managing private keys","Higher volatility than holding bitcoin directly in a wallet","Unlimited leverage on bitcoin through a margin account","No fees because the fund holds bitcoin without custody"],"a":0,"e":"ETFs simplify custody and access but charge fees."},{"id":"DA038","t":"DA","r":"7.2.1","k":"c","d":2,"q":"Bitcoin futures–based funds can underperform spot bitcoin because of:","o":["Roll costs in contango markets","Lower volat ency is used to:","o":["Sign transactions and prove ownership of assets","Publicly receive funds from other users","Mine new blocks on a proof-of-work chain","Set gas prices for Ethereum transactions"],"a":0,"e":"Public addresses receive funds; private keys authorize spending."},{"id":"DA055","t":"DA","r":"7.1.3","k":"c","d":3,"q":"Layer-2 solutions (e.g., rollups, Lightning Network) aim to:","o":["Increase transaction throughput and lower costs while relying on the base chain for security","Replace the base blockchain entirely with a centralized database","Increase mining rewards paid to proof-of-work miners by adding new blocks on a second chain","Eliminate the need for private keys when signing transactions"],"a":0,"e":"Layer 2 batches or processes transactions off-chain, settling on layer 1."}];

function qtime(q){ return QTIME[q.k] + ((q.d||2)===3 ? 20 : 0); }   // hard questions get 20 s more
function lvlOk(q,lvl){ return !lvl || lvl==='all' || String(q.d||2)===String(lvl) || (lvl==='12'&&(q.d||2)<3) || (lvl==='23'&&(q.d||2)>1); }

function avColor(id){ return AVBG[hashStr(String(id||'x'))%AVBG.length]; }

function confetti(ms=3500){
  try{ let c=document.getElementById('confetti'); if(!c){ c=document.createElement('canvas'); c.id='confetti'; document.body.appendChild(c); }
    const ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
    const cols=['#7c5cff','#21c07a','#f5a524','#e5484d','#3e7bfa','#ffd34d','#ffffff'];
    const P=[...Array(180)].map(()=>({x:c.width/2+(Math.random()-.5)*200,y:c.height*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
    const t0=performance.now();
    (function f(t){ const el=t-t0; ctx.clearRect(0,0,c.width,c.height);
      P.forEach(p=>{ p.vy+=0.35; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.globalAlpha=Math.max(0,1-el/ms); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
      if(el<ms) requestAnimationFrame(f); else ctx.clearRect(0,0,c.width,c.height); })(t0);
  }catch(e){}
}

/* ---------------- Utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function perm(seed,qid,n){return shuffle([...Array(n).keys()], mulberry32(seed ^ hashStr(qid)))}
function fmtT(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0')}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ssGet(k,d){try{const v=sessionStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function ssSet(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',ms)}
function rid(n=10){const c='abcdefghijkmnopqrstuvwxyz23456789';let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function points(ok,remainFrac){return ok?Math.round(500+500*Math.max(0,Math.min(1,remainFrac))):0}

/* Build an exam of ~minutes, weighted by CAIA topic weights, grouped by topic like the real exam */
function buildExam(topicIds,minutes,seed,lvl){
  const rng=mulberry32(seed), target=minutes*60;
  const sel=TOPICS.filter(t=>topicIds.includes(t.id));
  const wsum=sel.reduce((s,t)=>s+t.w,0);
  const pools={}; sel.forEach(t=>pools[t.id]=shuffle(BANK.filter(q=>q.t===t.id&&lvlOk(q,lvl)),rng));
  const used={}; sel.forEach(t=>used[t.id]=0);
  const picked=[]; let total=0;
  for(let guard=0;guard<400;guard++){
    let best=null,bestDef=-Infinity;
    for(const t of sel){ if(!pools[t.id].length) continue;
      const def=(t.w/wsum)*(total+90)-used[t.id]; if(def>bestDef){bestDef=def;best=t} }
    if(!best) break;
    const q=pools[best.id][0], d=qtime(q);
    if(total+d>target+20){ // try a shorter question from any topic before stopping
      if(total>=target-40) break;
      const alt=sel.map(t=>pools[t.id].findIndex(x=>total+qtime(x)<=target+20)).findIndex(i=>i>=0);
      if(alt<0) break;
      const t=sel[alt], idx=pools[t.id].findIndex(x=>total+qtime(x)<=target+20);
      const q2=pools[t.id].splice(idx,1)[0]; picked.push(q2); used[t.id]+=qtime(q2); total+=qtime(q2); continue;
    }
    pools[best.id].shift(); picked.push(q); used[best.id]+=d; total+=d;
  }
  const order=Object.fromEntries(TOPICS.map((t,i)=>[t.id,i]));
  picked.sort((a,b)=>order[a.t]-order[b.t]);
  return {qids:picked.map(q=>q.id), durs:picked.map(q=>qtime(q)), total};
}

/* ---------------- Realtime backend (Firebase Realtime Database) ---------------- */
const P = {db:null,fb:null,ready:false,off:0};
function NOW(){ return Date.now()+(P.off||0); }
const pid = ssGet('pid',null) || (()=>{const v=rid(12);ssSet('pid',v);return v})();
// encode numeric object keys (Firebase would turn them into arrays)
function enc(v){ if(Array.isArray(v)) return v.map(enc); if(v&&typeof v==='object'){const o={};for(const k in v){ if(v[k]===undefined) continue; o[/^\d+$/.test(k)?'_'+k:k]=enc(v[k]);} return o;} return v; }
function dec(v){ if(Array.isArray(v)) return v.map(dec); if(v&&typeof v==='object'){const o={};for(const k in v){o[/^_\d+$/.test(k)?k.slice(1):k]=dec(v[k]);} return o;} return v; }
function flat(o,pre,out){ out=out||{}; for(const k in o){ const v=o[k], p=pre?pre+'/'+k:k; if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length) flat(v,p,out); else out[p]=v; } return out; }
function makeDb(fdb){
  const snapOf=(id,s)=>({id,exists:s.exists(),data:()=>s.exists()?dec(s.val()):undefined});
  return {
    doc(path){ const id=path.split('/').pop(), ref=fdb.ref(path+'/_d');
      return {
        get:async()=>snapOf(id,await ref.get()),
        set:d=>ref.set(enc(d)),
        update:d=>ref.update(flat(enc(d))),
        onSnapshot(next,err){ const h=s=>next(snapOf(id,s)); ref.on('value',h,e=>err&&err(e)); return ()=>ref.off('value',h); },
        ref
      }; },
    collection(path){ const ref=fdb.ref(path);
      return { onSnapshot(next,err){ const h=s=>{ const docs=[]; s.forEach(c=>{ if(c.child('_d').exists()) docs.push({id:c.key,exists:true,data:()=>dec(c.child('_d').val())}); }); next({docs,size:docs.length,empty:!docs.length}); };
        ref.on('value',h,e=>err&&err(e)); return ()=>ref.off('value',h); } }; }
  };
}
function initPlatform(){
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(window.firebase && cfg && cfg.databaseURL){
      firebase.initializeApp(cfg);
      P.fb=firebase.database(); P.db=makeDb(P.fb);
      P.fb.ref('.info/serverTimeOffset').on('value',s=>{P.off=s.val()||0});
    }
  }catch(e){ console.warn('firebase',e); }
  P.ready=true;
  return Promise.resolve();
}

/* ---------------- Question rendering (shared) ---------------- */
function qCard({q,order,idx,n,remain,dur,chosen,locked,reveal,dist,topicTag=true,extra=''}){
  // order: displayed index -> original option index
  const opts=order.map((oi,di)=>{
    let cls=`opt o${di%4}`;
    if(reveal){ if(oi===q.a) cls+=' right'; else if(chosen===oi) cls+=' wrong'; else cls+=' dim'; }
    else if(chosen!=null){ cls+= chosen===oi?' sel':' dim'; }
    const d=dist?`<span class="dist">${dist[oi]||0}</span>`:'';
    return `<button class="${cls}" data-opt="${oi}" ${locked||reveal?'disabled':''}><span class="sh">${LETTERS[di]}</span><span>${esc(q.o[oi])}</span>${d}</button>`;
  }).join('');
  return `<div class="card">
    <div class="qhead"><div class="qmeta"><span class="pill">Question ${idx+1} / ${n}</span>${topicTag?`<span class="pill">${esc(TNAME[q.t])}</span>`:''}<span class="pill">${KLABEL[q.k]} · ${Math.round(dur)} s</span><span class="pill" title="${DLABEL[q.d||2]}">${DSTARS(q.d)} ${DLABEL[q.d||2]}</span><span class="pill">LO ${esc(q.r)}</span></div>
    ${reveal?'':`<div class="tnum" id="tnum">${fmtT(remain)}</div>`}</div>
    ${reveal?'':`<div class="timer" id="tbar"><div style="width:${Math.max(0,remain/dur*100)}%"></div></div>`}
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    ${extra}
  </div>`;
}

/* ---------------- SOLO ---------------- */
function startSolo(){
  const seed=(Math.random()*2**31)|0;
  const ex=buildExam(S.cfg.topics,S.cfg.minutes,seed,S.cfg.level);
  if(!ex.qids.length){$('#setupErr').textContent='Aucune question pour ces thèmes.';return}
  S.solo={seed,mode:S.cfg.mode,qids:ex.qids,durs:ex.durs,i:0,qStart:NOW(),answers:{},feedback:false,score:0,startedAt:NOW()};
  setView('solo');
}
function soloAnswer(choice){
  const s=S.solo; if(!s||s.feedback||s.answers[s.i]) return;
  const q=BYID[s.qids[s.i]], dur=s.durs[s.i]*1000, el=NOW()-s.qStart;
  const ok=choice===q.a, pts=points(ok,1-el/dur);
  s.answers[s.i]={c:choice,ok,ms:el,pts}; s.score+=pts;
  if(s.mode==='practice'){ s.feedback=true; render(); }
  else soloNext();
}
function soloNext(){
  const s=S.solo; s.feedback=false; s.i++; s.qStart=NOW();
  if(s.i>=s.qids.length){ s.endedAt=NOW(); setView('soloResult'); }
  else render();
}
function viewSolo(){
  const s=S.solo, q=BYID[s.qids[s.i]], dur=s.durs[s.i];
  const remain=dur-(NOW()-s.qStart)/1000, a=s.answers[s.i];
  const order=perm(s.seed,q.id,q.o.length);
  let extra='';
  if(s.feedback){
    extra=`<div class="verdict ${a&&a.ok?'ok':'bad'}">${a? (a.ok?'✓ Bonne réponse':'✗ Mauvaise réponse') : '⏱ Temps écoulé'}</div>
      <div class="expl">${esc(q.e)}</div>
      <div class="row mt"><button class="btn" id="nextBtn">${s.i+1<s.qids.length?'Question suivante →':'Voir mes résultats'}</button></div>`;
  }
  const answered=Object.keys(s.answers).length, ok=Object.values(s.answers).filter(x=>x.ok).length;
  return `<div class="two"><div>${qCard({q,order,idx:s.i,n:s.qids.length,remain,dur,chosen:a?a.c:null,locked:!!a,reveal:s.feedback,extra})}</div>
    <div class="card lb"><h3>🎯 Ta session</h3><div class="sub">${s.mode==='exam'?'Examen blanc':'Entraînement'} · ${s.qids.length} questions</div>
      <div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${s.score}</b><span>points</span></div><div class="stat"><b>${s.mode==='exam'?answered:ok+'/'+answered}</b><span>${s.mode==='exam'?'répondues':'bonnes réponses'}</span></div></div>
      <div class="strip">${s.qids.map((_,i)=>{const x=s.answers[i];return `<i class="${i===s.i?'c ':''}${x&&s.mode==='practice'?(x.ok?'g':'r'):(x?'g':'')}"></i>`}).join('')}</div>
      <div class="row mt"><button class="btn ghost sm" id="quitSolo">Terminer maintenant</button></div>
    </div></div>`;
}
function viewSoloResult(){
  const s=S.solo; const res=summarize(s.qids,s.answers);
  return resultsBlock({title:'🏁 Résultats de ta session',score:s.score,res,qids:s.qids,answers:s.answers,seed:s.seed})+
   `<div class="row mt"><button class="btn" id="againSolo">Nouvelle session</button><button class="btn ghost" data-go="home">Accueil</button></div>`;
}
function summarize(qids,answers){
  const by={}; let ok=0;
  qids.forEach((id,i)=>{const q=BYID[id];by[q.t]=by[q.t]||{n:0,ok:0};by[q.t].n++; if(answers[i]&&answers[i].ok){by[q.t].ok++;ok++}});
  return {n:qids.length,ok,pct:qids.length?Math.round(ok/qids.length*100):0,by};
}
function resultsBlock({title,score,res,qids,answers,seed,dists}){
  const tb=TOPICS.filter(t=>res.by[t.id]).map(t=>{const b=res.by[t.id],p=Math.round(b.ok/b.n*100);return `<div class="tbar"><span>${esc(t.name)}</span><div class="bar"><div style="width:${p}%;background:${p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--bad)'}"></div></div><b>${b.ok}/${b.n}</b></div>`}).join('');
  const rev=qids.map((id,i)=>{const q=BYID[id],a0=answers[i],a=(a0&&a0.c>=0)?a0:null;const order=perm(seed,q.id,q.o.length);
    return `<div class="rev"><div class="hint">Q${i+1} · ${esc(TNAME[q.t])} · LO ${esc(q.r)} · ${a?(a.ok?'<span style="color:var(--ok)">✓ correct</span>':'<span style="color:var(--bad)">✗ incorrect</span>'):'<span style="color:var(--warn)">— sans réponse</span>'}</div>
    <div class="q">${esc(q.q)}</div>
    ${order.map((oi,di)=>`<div class="o ${oi===q.a?'c':(a&&a.c===oi?'x':'')}">${LETTERS[di]}. ${esc(q.o[oi])}${dists?` <span class="hint">(${dists[i]?.[oi]||0})</span>`:''}</div>`).join('')}
    <div class="expl" style="margin-top:8px">${esc(q.e)}</div></div>`}).join('');
  return `<div class="card"><h2 style="margin-top:0">${title}</h2>
    <div class="stats"><div class="stat"><b>${res.pct}%</b><span>bonnes réponses</span></div><div class="stat"><b>${res.ok}/${res.n}</b><span>questions</span></div><div class="stat"><b>${score}</b><span>points</span></div><div class="stat"><b>${res.pct>=70?'🟢':res.pct>=60?'🟠':'🔴'}</b><span>${res.pct>=70?'Solide':res.pct>=60?'Limite':'À retravailler'}</span></div></div>
    <h3>Par thème</h3>${tb}
    <p class="hint">Repère indicatif : CAIA ne publie pas de note de passage fixe. Viser au moins 70 % en examen blanc est un bon objectif.</p>
    <details class="mt"><summary style="cursor:pointer;font-weight:600">Voir la correction détaillée (${qids.length} questions)</summary>${rev}</details></div>`;
}

function newCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function needDb(errEl){
  if(!P.ready){errEl.textContent='Connexion en cours… réessaie dans une seconde.';return false}
  if(!P.db){errEl.textContent="Le multijoueur n'est pas encore configuré (base Firebase manquante). Le mode solo fonctionne.";return false}
  return true;
}
async function createSession(){
  const err=$('#setupErr'); if(!needDb(err)) return;
  $('#startBtn').disabled=true;
  try{
    let code=newCode();
    for(let k=0;k<5;k++){const ex=await P.db.doc('sessions/'+code).get(); if(!ex.exists) break; code=newCode();}
    const seed=(Math.random()*2**31)|0, ex=buildExam(S.cfg.topics,S.cfg.minutes,seed,S.cfg.level);
    const doc={code,hostPid:pid,hostName:S.name,createdAt:NOW(),status:'lobby',pace:S.cfg.pace,minutes:S.cfg.minutes,topics:S.cfg.topics,level:S.cfg.level||'all',qids:ex.qids,durs:ex.durs,seed,cuts:{}};
    await P.db.doc('sessions/'+code).set(doc);
    S.mp={code,role:'host',plays:S.cfg.hostPlays,session:doc,players:{},peers:{},local:{},cutDone:{}};
    ssSet('caia_mp',{code,role:'host',plays:S.cfg.hostPlays});
    await subscribeMp(code);
    if(S.cfg.hostPlays) await joinAsPlayer();
    setView('lobby');
  }catch(e){ err.textContent='Impossible de créer la partie ('+(e&&(e.code||e.message)||e)+'). Vérifie ta connexion.'; $('#startBtn').disabled=false; }
}
async function joinSession(){
  const err=$('#joinErr'); const code=($('#codeInp').value||'').trim().toUpperCase(); S.joinCode=code;
  if(!saveName()){err.textContent='Entre ton nom.';return}
  if(code.length!==5){err.textContent='Le code fait 5 caractères.';return}
  if(!needDb(err)) return;
  $('#joinBtn').disabled=true;
  try{
    const snap=await P.db.doc('sessions/'+code).get();
    if(!snap.exists){err.textContent='Aucune partie avec ce code.';$('#joinBtn').disabled=false;return}
    const sess=snap.data();
    if(sess.status==='finished'){err.textContent='Cette partie est terminée.';$('#joinBtn').disabled=false;return}
    S.mp={code,role:'player',plays:true,session:sess,players:{},peers:{},local:{},cutDone:{}};
    ssSet('caia_mp',{code,role:'player',plays:true});
    await subscribeMp(code);
    await joinAsPlayer();
    setView(sess.status==='running'?'game':'lobby');
  }catch(e){err.textContent='Connexion impossible ('+(e&&e.code||e)+').';$('#joinBtn').disabled=false}
}
async function joinAsPlayer(){
  const m=S.mp; const ref=P.db.doc(`sessions/${m.code}/players/${pid}`);
  const ex=await ref.get().catch(()=>null);
  if(ex&&ex.exists){ const d=ex.data(); m.local={answers:d.answers||{},score:d.score||0}; m.writeMode='db'; queueWrite(()=>ref.update({name:S.name,avatar:S.avatar,online:true})); setOnline(); return; }
  const doc={name:S.name,avatar:S.avatar,pid,joinedAt:NOW(),answers:{},score:0,nCorrect:0,nAnswered:0,done:false,online:true};
  m.local={answers:{},score:0};
  try{ await ref.set(doc); m.writeMode='db'; }
  catch(e){ m.writeMode='none'; toast("Impossible d'enregistrer ta participation. Vérifie ta connexion.",4500); }
  setOnline();
}
let wq=Promise.resolve();
function queueWrite(fn){wq=wq.then(fn).catch(e=>{ if(S.mp&&e&&e.code==='invalid_argument'){S.mp.writeMode='presence'} console.warn('write',e)});return wq}
let unsubs=[], roomH=null;
async function subscribeMp(code){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[];
  const m=S.mp;
  unsubs.push(P.db.doc('sessions/'+code).onSnapshot(s=>{ if(!s.exists||!S.mp) return; const prev=m.session&&m.session.status; m.session=s.data();
      if(prev!=='running'&&m.session.status==='running'&&S.view==='lobby'){ m.selfStart=NOW(); setView('game'); }
      else if(m.session.status==='finished'&&S.view!=='final'){ setView('final'); }
      else if(S.view==='game'||S.view==='lobby') softRender(); },e=>console.warn(e)));
  unsubs.push(P.db.collection(`sessions/${code}/players`).onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); m.players=o; onPlayersChanged(); },e=>console.warn(e)));
}
function pushPresence(){}
function setOnline(){ const m=S.mp; if(!m||!P.fb) return; try{ const r=P.fb.ref(`sessions/${m.code}/players/${pid}/_d/online`); r.onDisconnect().set(false); r.set(true); }catch(e){} }
function leaveMp(){ unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; const m=S.mp; if(m&&m.plays&&P.fb){ try{ const r=P.fb.ref(`sessions/${m.code}/players/${pid}/_d/online`); r.onDisconnect().cancel(); r.set(false);}catch(e){} } S.mp=null; ssDel('caia_mp'); }
function allPlayers(){
  const m=S.mp; if(!m) return [];
  const o={...m.players};
  return Object.entries(o).map(([id,v])=>({id,...v}));
}
function onPlayersChanged(){
  if(S.view==='lobby') renderLobbyList();
  else if(S.view==='game'){ renderLB(); hostAutoCut(); if(S.mp.session.pace==='sync') updateDist(); maybeFinish(); }
  else if(S.view==='final'){ const ft=$('#finalTable'); if(ft) ft.innerHTML=finalTableHtml(); }
}

/* Timeline for synchronized mode */
function timeline(s){
  const out=[]; let t=s.startedAt;
  for(let i=0;i<s.qids.length;i++){
    let end=t+s.durs[i]*1000; const c=s.cuts&&s.cuts[i]; if(c&&c>t&&c<end) end=c;
    out.push({start:t,end,rev:end+REVEAL_MS}); t=end+REVEAL_MS;
  }
  return out;
}
function syncPhase(){
  const s=S.mp.session, now=NOW(), tl=timeline(s);
  for(let i=0;i<tl.length;i++){ if(now<tl[i].start) return {i,phase:'wait',tl}; if(now<tl[i].end) return {i,phase:'q',tl}; if(now<tl[i].rev) return {i,phase:'rev',tl}; }
  return {i:tl.length,phase:'done',tl};
}
/* Self-paced */
function selfIdx(){ const a=S.mp.local.answers||{}; let i=0; while(a[i]) i++; return i; }
function selfDeadline(){ const s=S.mp.session; return s.startedAt+s.durs.reduce((x,y)=>x+y,0)*1000+15000; }

async function startGame(){
  const m=S.mp; $('#goBtn').disabled=true;
  try{ await P.db.doc('sessions/'+m.code).update({status:'running',startedAt:NOW()+4000}); }
  catch(e){ toast('Erreur au démarrage'); $('#goBtn').disabled=false; }
}
async function endGame(){ const m=S.mp; if(!m) return; try{ await P.db.doc('sessions/'+m.code).update({status:'finished',endedAt:NOW()}) }catch(e){} }

function mpAnswer(choice){
  const m=S.mp, s=m.session; let i, start, dur;
  if(s.pace==='sync'){ const ph=syncPhase(); if(ph.phase!=='q') return; i=ph.i; start=ph.tl[i].start; dur=ph.tl[i].end-start; dur=s.durs[i]*1000; }
  else { i=selfIdx(); if(i>=s.qids.length) return; start=m.qStart||NOW(); dur=s.durs[i]*1000; }
  if(m.local.answers[i]) return;
  const q=BYID[s.qids[i]], el=NOW()-start, ok=choice===q.a, pts=points(ok,1-el/dur);
  recordAnswer(i,{c:choice,ok,ms:el,pts});
  if(s.pace==='self'){ m.qStart=NOW(); }
  render();
}
function recordAnswer(i,ans){
  const m=S.mp; m.local.answers={...m.local.answers,[i]:ans}; m.local.score=(m.local.score||0)+ans.pts;
  const vals=Object.values(m.local.answers); const done=vals.length>=m.session.qids.length; m.local.done=done;
  const patch={answers:{[i]:ans},score:m.local.score,nCorrect:vals.filter(x=>x.ok).length,nAnswered:vals.length,done,cur:i+1};
  if(m.writeMode==='db') queueWrite(()=>P.db.doc(`sessions/${m.code}/players/${pid}`).update(patch));
  pushPresence();
}
function hostAutoCut(){
  const m=S.mp; if(!m||m.role!=='host'||m.session.pace!=='sync'||m.session.status!=='running') return;
  const ph=syncPhase(); if(ph.phase!=='q') return; const i=ph.i;
  if(m.cutDone[i]||(m.session.cuts&&m.session.cuts[i])) return;
  const ps=allPlayers().filter(p=>p.online!==false); if(!ps.length) return;
  if(NOW()-ph.tl[i].start<1500) return;
  if(ps.every(p=>p.answers&&p.answers[i])){ m.cutDone[i]=true; P.db.doc('sessions/'+m.code).update({cuts:{[i]:NOW()}}).catch(()=>{m.cutDone[i]=false}); }
}
function maybeFinish(){
  const m=S.mp; if(!m||m.role!=='host'||m.session.status!=='running'||m.finishing) return;
  const s=m.session; let over=false;
  if(s.pace==='sync'){ over=syncPhase().phase==='done'; }
  else { const ps=allPlayers().filter(p=>p.online!==false); over=NOW()>selfDeadline() || (ps.length>0 && ps.every(p=>p.done)); }
  if(over){ m.finishing=true; endGame(); }
}
