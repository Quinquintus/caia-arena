are mainly used to:","o":["Hold LP capital commitments until the GP issues capital calls","Hold back part of the GP's carried interest to secure potential clawback obligations","Hold management fees until the fund reaches its final close","Hold portfolio company shares until an IPO lock-up expires and the shares can be sold"],"a":1,"e":"Part of the carry may be placed in escrow so that funds are available if a clawback is triggered at the end of the fund's life."},{"id":"ALT122","t":"ALT","r":"2.2.6","k":"c","d":2,"q":"Vesting of carried interest within a GP's team means that:","o":["All team members receive their full carry on the first day of the fund","Team members earn their entitlement to carry gradually over time, encouraging retention","Carry is paid only to the founding partners and never to junior staff","Team members' carry is reallocated to LPs whenever a deal loses money"],"a":1,"e":"Vesting schedules give individuals their share of carry progressively, aligning incentives and reducing departures."},{"id":"ALT123","t":"ALT","r":"2.2.7","k":"n","d":3,"q":"A hedge fund starts the year at a NAV of $100m and earns a 12% gross return. It charges 2% on starting NAV and a 20% incentive fee on returns after the management fee above a 5% hard hurdle. What is the investors' net return?","o":["8.0%","9.0%","9.6%","10.0%"],"a":1,"e":"Mgmt fee $2m → return after fee $10m (10%). Hard hurdle 5% → incentive 20% × (10% − 5%) = 1% ($1m). Net = 12% − 2% − 1% = 9.0%."},{"id":"ALT124","t":"ALT","r":"2.2.7","k":"n","d":2,"q":"A fund's high-water mark is $120m. At year-end, NAV after management fees is $126m. With a 20% incentive fee, what incentive fee is paid?","o":["$1.2 million","$5.2 million","$6.0 million","$25.2 million"],"a":0,"e":"Incentive fees apply only above the HWM: 20% × ($126m − $120m) = $1.2m."},{"id":"ALT125","t":"ALT","r":"2.2.7","k":"c","d":2,"q":"Under a modified high-water mark arrangement, after a loss the manager typically:","o":["Earns no incentive fee at all until the fund's previous peak is fully regained","Earns a reduced incentive fee until a specified multiple of the loss has been recovered","Earns a higher incentive fee to compensate for the work of recovering losses","Resets the high-water mark to the current NAV and earns full fees immediately"],"a":1,"e":"A modified HWM reduces the incentive rate (e.g., from 20% to 10%) until losses are recovered (e.g., 200%), keeping the manager motivated without encouraging excessive risk."},{"id":"ALT126","t":"ALT","r":"2.2.7","k":"c","d":2,"q":"A manager whose fund is just above its high-water mark after a strong year may become overly cautious to lock in fees. This incentive problem is called:","o":["Style drift","Excessive conservatism","Moral hazard of leverage","Backfill bias"],"a":1,"e":"Near or after large gains, managers may reduce risk excessively to protect incentive fees, a form of perverse incentive the curriculum calls excessive conservatism."},{"id":"ALT127","t":"ALT","r":"2.2.8","k":"c","d":2,"q":"The 'annuity view' of hedge fund fees emphasizes that:","o":["Fees should be viewed as a one-off payment that is independent of fund survival","A manager's expected stream of future fees gives it an incentive to avoid ruin and keep the fund alive","The manager's incentive fee is equivalent to a short put on the fund's assets","Management fees are a fixed annuity paid by the manager to the fund's investors"],"a":1,"e":"Viewing future fees as an annuity explains why managers may avoid excessive risk: blowing up the fund forfeits this valuable fee stream."},{"id":"ALT128","t":"ALT","r":"2.2.8","k":"n","d":3,"q":"Using the at-the-money approximation, what is the value of a one-year 20% incentive fee on a $500m fund with 15% annual volatility?","o":["$3.0 million","$6.0 million","$15.0 million","$30.0 million"],"a":1,"e":"0.4 × $500m × 20% × 15% × √1 = $6.0m."},{"id":"ALT129","t":"ALT","r":"2.3.1","k":"n","d":2,"q":"An asset gains 10% in year 1 and loses 10% in year 2. What is the two-year simple return and the sum of the two log returns?","o":["0% and 0%","−1.0% and −1.005%","−1.0% and 0%","+1.0% and −1.005%"],"a":1,"e":"1.10 × 0.90 − 1 = −1.0%. Log returns: ln(1.10) + ln(0.90) = 0.0953 − 0.1054 = −0.01005. Log returns add up over time."},{"id":"ALT130","t":"ALT","r":"2.3.1","k":"n","d":2,"q":"A continuously compounded annual rate of 5% is equivalent to what annual discrete (simple) rate?","o":["4.88%","5.00%","5.13%","5.25%"],"a":2,"e":"e^0.05 − 1 = 5.13%."},{"id":"ALT131","t":"ALT","r":"2.3.2","k":"n","d":2,"q":"An investment costs $100 and returns $60 at the end of each of the next two years. What is its IRR?","o":["10.0%","13.1%","15.0%","20.0%"],"a":1,"e":"Solve −100 + 60/(1+r) + 60/(1+r)² = 0 → r ≈ 13.07%."},{"id":"ALT132","t":"ALT","r":"2.3.2","k":"n","d":2,"q":"For the same project (−$100 then +$60 in years 1 and 2), what is the NPV at a 10% discount rate?","o":["−$4.13","$0","$4.13","$20.00"],"a":2,"e":"NPV = −100 + 60/1.10 + 60/1.21 = −100 + 54.55 + 49.59 = $4.13. Positive because the IRR (13.1%) exceeds 10%."},{"id":"ALT133","t":"ALT","r":"2.3.3","k":"c","d":2,"q":"Two projects have IRRs of 40% and 20%. The 40% project lasts one year on $1 million; the 20% project lasts ten years on $100 million. Which IRR problem does this illustrate?","o":["IRR always favors longer projects because they compound longer","IRR ignores scale and duration when comparing investments","IRR measures the absolute dollar profit of each investment","IRR adjusts automatically for the size of each project"],"a":1,"e":"IRR is a rate, not a measure of wealth created; it ignores the size and length of investments, so a higher IRR does not mean more value."},{"id":"ALT134","t":"ALT","r":"2.3.3","k":"c","d":3,"q":"Why can't the IRR of a portfolio of private equity funds be computed by averaging the funds' IRRs?","o":["Because IRRs of individual funds are always identical across a portfolio","Because IRR is not additive: the combined cash flows must be used to compute an aggregate IRR","Because private equity funds do not report IRRs to their investors","Because an average IRR must be weighted by each fund's vintage year"],"a":1,"e":"IRRs depend on the timing and size of each fund's flows; the portfolio IRR must be computed from the pooled cash flows."},{"id":"ALT135","t":"ALT","r":"2.3.4","k":"n","d":3,"q":"An investment pays −$100 today and +$60 at the end of years 1 and 2. Using MIRR with an 8% reinvestment rate (no further outflows), what is the MIRR?","o":["10.0%","11.7%","13.1%","24.8%"],"a":1,"e":"Terminal value = 60 × 1.08 + 60 = 124.8. MIRR = (124.8/100)^(1/2) − 1 = 11.7%, below the 13.1% IRR because reinvestment is at 8%."},{"id":"ALT136","t":"ALT","r":"2.3.4","k":"n","d":2,"q":"A fund returns +20% in year 1 and −10% in year 2. What is its two-year time-weighted cumulative return?","o":["5.0%","8.0%","10.0%","−2.0%"],"a":1,"e":"TWR = 1.20 × 0.90 − 1 = 8.0%, independent of investor cash flows."},{"id":"ALT137","t":"ALT","r":"2.3.4","k":"n","d":3,"q":"An investor puts $100 into a fund that returns +20% in year 1, adds $100 at the end of year 1, and the fund returns −10% in year 2 (ending value $198). Which statement is correct?","o":["Both returns are equal because the same fund was held throughout the two years, regardless of the timing of contributions","The time-weighted return (+8%) is positive while the dollar-weighted return is slightly negative, due to poorly timed contributions","The dollar-weighted return is higher than the time-weighted return in this case","The time-weighted return is negative while the dollar-weighted return is positive"],"a":1,"e":"TWR = 1.2 × 0.9 − 1 = 8%. The IRR solving −100 − 100/(1+r) + 198/(1+r)² = 0 is about −0.7%: more money was invested before the loss."},{"id":"ALT138","t":"ALT","r":"2.3.5","k":"n","d":2,"q":"A fund has paid-in capital of $80m, cumulative distributions of $30m and a NAV of $90m. What are its TVPI and DPI?","o":["TVPI 1.50; DPI 0.375","TVPI 1.125; DPI 0.375","TVPI 1.50; DPI 1.125","TVPI 0.375; DPI 1.50"],"a":0,"e":"TVPI = (30 + 90)/80 = 1.50. DPI = 30/80 = 0.375. RVPI = 90/80 = 1.125."},{"id":"ALT139","t":"ALT","r":"2.3.5","k":"c","d":2,"q":"Which multiple best indicates how much cash a private equity fund has actually returned to its investors?","o":["TVPI","RVPI","DPI","PME"],"a":2,"e":"DPI (distributed to paid-in) measures realized cash returned; RVPI is unrealized value; TVPI combines both."},{"id":"ALT140","t":"ALT","r":"2.3.5","k":"c","d":3,"q":"A PME ratio greater than 1.0 for a buyout fund indicates that:","o":["The fund underperformed the chosen public index after accounting for cash flow timing","The fund outperformed the chosen public index given the same timing of cash flows","The fund's IRR exceeded its hurdle rate, regardless of public market performance","The fund generated a TVPI above 1.0x, meaning investors recovered all capital"],"a":1,"e":"PME (e.g., Kaplan-Schoar) compares fund cash flows with the same flows invested in a public index; above 1 means outperformance."},{"id":"ALT141","t":"ALT","r":"2.3.6","k":"c","d":2,"q":"Which accounting practice contributes to the private equity J-curve?","o":["Writing up investments quickly to market values while delaying write-downs until exits or new rounds","Writing down troubled investments quickly while deferring write-ups until exits or new financing rounds","Reporting all investments at market prices from the first quarter of the fund","Charging management fees only on invested capital rather than on commitments"],"a":1,"e":"Conservatism recognizes losses early and gains late, so early reported returns are depressed relative to eventual outcomes."},{"id":"ALT142","t":"ALT","r":"2.3.7","k":"c","d":3,"q":"A futures position with notional value of $10m is backed by only $2m of collateral. Compared with a fully collateralized position, it is:","o":["Less risky","Leveraged five times","Unaffected by price moves","Fully hedged"],"a":1,"e":"Partial collateralization creates leverage: returns on the $2m posted are about five times the return on the notional exposure."},{"id":"ALT143","t":"ALT","r":"2.4.1","k":"c","d":1,"q":"A distribution of returns based on historical observations is called:","o":["An ex ante distribution","An ex post distribution","A risk-neutral distribution","A forecast distribution"],"a":1,"e":"Ex post refers to realized (observed) outcomes; ex ante refers to expected future outcomes."},{"id":"ALT144","t":"ALT","r":"2.4.1","k":"c","d":2,"q":"If continuously compounded returns are normally distributed, prices are:","o":["Normally distributed, symmetric around the mean and unbounded below","Lognormally distributed, bounded below by zero and right-skewed","Uniformly distributed, with equal probability over a bounded range","Lognormally distributed, bounded above and left-skewed in shape"],"a":1,"e":"Normal log returns imply lognormal prices, which cannot be negative and have a longer right tail."},{"id":"ALT145","t":"ALT","r":"2.4.2","k":"n","d":1,"q":"A return series has a kurtosis of 5. What is its excess kurtosis, and how is the distribution described?","o":["2; leptokurtic","5; platykurtic","−2; platykurtic","2; mesokurtic"],"a":0,"e":"Excess kurtosis = kurtosis − 3 = 2 > 0, so the distribution is leptokurtic (fat-tailed)."},{"id":"ALT146","t":"ALT","r":"2.4.2","k":"c","d":2,"q":"Which strategy profile is most consistent with positive skewness?","o":["Selling out-of-the-money puts that earn steady premiums but rarely lose big","Buying lottery-like options or trend following that occasionally earns very large gains","Merger arbitrage that earns small spreads and occasionally suffers deal breaks","Carry trades that earn interest differentials but crash during risk-off periods"],"a":1,"e":"Positively skewed strategies have frequent small losses and occasional large gains, like long options or trend following."},{"id":"ALT147","t":"ALT","r":"2.4.3","k":"n","d":2,"q":"A portfolio holds 60% in asset A (σ = 20%) and 40% in asset B (σ = 10%), with a correlation of 0.5. What is the portfolio standard deviation?","o":["12.0%","14.4%","16.0%","20.8%"],"a":1,"e":"σp² = 0.36×0.04 + 0.16×0.01 + 2×0.6×0.4×0.5×0.2×0.1 = 0.0144 + 0.0016 + 0.0048 = 0.0208 → σp = 14.4%."},{"id":"ALT148","t":"ALT","r":"2.4.3","k":"c","d":2,"q":"Which statement about the Pearson correlation coefficient is correct?","o":["It measures any nonlinear relationship and is insensitive to outliers","It measures the strength of a linear relationship and is sensitive to outliers","It ranges from 0 to 2 and measures the slope of the regression line","It equals the covariance of the two variables multiplied by their means"],"a":1,"e":"Pearson correlation measures linear co-movement and can be heavily influenced by outliers; Spearman rank correlation is more robust."},{"id":"ALT149","t":"ALT","r":"2.4.4","k":"n","d":2,"q":"A series has a Durbin-Watson statistic of 1.0. What is the approximate first-order autocorrelation?","o":["−0.5","0","0.5","1.0"],"a":2,"e":"DW ≈ 2(1 − ρ) → 1.0 = 2(1 − ρ) → ρ = 0.5 (positive autocorrelation)."},{"id":"ALT150","t":"ALT","r":"2.4.4","k":"c","d":2,"q":"Which return series is most likely to show positive first-order autocorrelation?","o":["Daily returns of a large-cap stock index","Quarterly appraisal-based returns of private real estate","Returns of a short-term Treasury futures contract","Returns of a currency forward"],"a":1,"e":"Appraisal smoothing and stale pricing make returns of illiquid assets positively autocorrelated."},{"id":"ALT151","t":"ALT","r":"2.4.5","k":"n","d":1,"q":"A fund's monthly return standard deviation is 3%. Assuming independent returns, what is its approximate annualized standard deviation?","o":["3.0%","8.7%","10.4%","36.0%"],"a":2,"e":"σannual ≈ 3% × √12 ≈ 10.4%."},{"id":"ALT152","t":"ALT","r":"2.4.5","k":"c","d":1,"q":"For a normal distribution, approximately what share of outcomes fall within two standard deviations of the mean?","o":["50%","68%","95%","99.7%"],"a":2,"e":"About 68% fall within ±1σ, 95% within ±2σ and 99.7% within ±3σ."},{"id":"ALT153","t":"ALT","r":"2.4.6","k":"n","d":3,"q":"A sample of 120 monthly returns has skewness of 0.3 and excess kurtosis of 1.0. With a 5% critical value of 5.99, what does the Jarque-Bera test conclude?","o":["JB = 1.8; normality not rejected","JB = 6.8; normality rejected","JB = 6.8; normality not rejected","JB = 13.6; normality rejected"],"a":1,"e":"JB = 120 × (0.09/6 + 1/24) = 120 × (0.015 + 0.0417) = 6.8 > 5.99, so normality is rejected."},{"id":"ALT154","t":"ALT","r":"2.4.6","k":"c","d":2,"q":"A strategy that sells deep out-of-the-money put options will most likely display which non-normality?","o":["Positive skew and thin tails","Negative skew and fat tails","Zero skew and zero kurtosis","Positive skew and negative kurtosis"],"a":1,"e":"Option-selling earns small premiums most of the time and suffers rare large losses, producing negative skew and excess kurtosis (nonlinearity)."},{"id":"ALT155","t":"ALT","r":"2.5.1","k":"c","d":2,"q":"If markets are weak-form efficient but not semistrong-form efficient, which analysis could still earn abnormal returns?","o":["Technical analysis of past prices","Fundamental analysis of public information","No analysis at all","Only insider trading is profitable"],"a":1,"e":"Weak-form efficiency rules out profits from past prices only; fundamental analysis of public information could still work if markets are not semistrong efficient."},{"id":"ALT156","t":"ALT","r":"2.5.1","k":"c","d":3,"q":"Why are many alternative asset markets thought to be less informationally efficient than large-cap equity markets?","o":["Lower transaction costs, daily liquidity, full transparency and easy short selling","Higher transaction and information costs, illiquidity, opacity and limits to short selling","Stronger regulation, standardized contracts and many active arbitrageurs","More analysts covering each asset and frequent public price disclosures"],"a":1,"e":"Costly information, illiquidity, lack of transparency and constraints on arbitrage allow mispricing to persist longer in alternatives."},{"id":"ALT157","t":"ALT","r":"2.5.2","k":"c","d":1,"q":"According to the Fisher relationship, the nominal interest rate is approximately equal to:","o":["The real rate minus expected inflation","The real rate plus expected inflation","Expected inflation only","The real rate times expected inflation"],"a":1,"e":"Nominal rate ≈ real rate + expected inflation."},{"id":"ALT158","t":"ALT","r":"2.5.3","k":"n","d":2,"q":"The 2-year spot rate is 4% and the 3-year spot rate is 5% (annual compounding). What is the implied one-year forward rate from year 2 to year 3?","o":["5.0%","6.0%","7.0%","9.0%"],"a":2,"e":"(1.05)³ / (1.04)² − 1 = 1.157625 / 1.0816 − 1 ≈ 7.03%."},{"id":"ALT159","t":"ALT","r":"2.5.3","k":"c","d":2,"q":"When the term structure of spot rates is upward sloping, implied forward rates are:","o":["Below spot rates","Above spot rates","Equal to spot rates","Negative"],"a":1,"e":"With an upward-sloping spot curve, forward rates lie above spot rates, since longer spot rates average in higher future forward rates."},{"id":"ALT160","t":"ALT","r":"2.5.4","k":"n","d":3,"q":"A stock at $100 will be $125 or $80 next period. The one-period riskless rate is 5% (discrete). What is the value of a call with a $100 strike?","o":["$11.11","$12.50","$13.23","$13.89"],"a":2,"e":"Risk-neutral p = (105 − 80)/(125 − 80) = 0.5556. Call = 0.5556 × 25 / 1.05 = $13.23."},{"id":"ALT161","t":"ALT","r":"2.5.4","k":"c","d":2,"q":"What is a key advantage of a recombining binomial tree?","o":["Each node has more than two branches, so the tree captures fat tails accurately","An up-then-down move leads to the same node as down-then-up, so the number of nodes grows linearly rather than exponentially","Nodes never recombine, so every price path is tracked separately in the model","It eliminates the need for risk-neutral probabilities when pricing options, so real-world probabilities can be used directly"],"a":1,"e":"Recombining trees keep the number of nodes manageable, making valuation of multi-period and American options practical."},{"id":"ALT162","t":"ALT","r":"2.5.5","k":"n","d":2,"q":"A 7-year zero-coupon bond has a yield of 5% (annual compounding). What are its Macaulay and modified durations?","o":["7.00 and 6.67","6.67 and 7.00","7.00 and 7.35","5.00 and 4.76"],"a":0,"e":"A zero's Macaulay duration equals its maturity (7). Modified duration = 7 / 1.05 = 6.67."},{"id":"ALT163","t":"ALT","r":"2.5.5","k":"n","d":2,"q":"A portfolio holds 60% in bonds with a duration of 4 and 40% in bonds with a duration of 9. What is the portfolio duration?","o":["5.0","6.0","6.5","13.0"],"a":1,"e":"Portfolio duration is the value-weighted average: 0.6 × 4 + 0.4 × 9 = 6.0."},{"id":"ALT164","t":"ALT","r":"2.5.5","k":"c","d":3,"q":"Why does simple duration perform poorly for mortgage-backed securities?","o":["Their cash flows are fixed in advance, so duration overstates their sensitivity to rates","Their cash flows are stochastic: prepayments change with rates, so cash flows themselves depend on yields","They pay no coupons until maturity, so duration equals their stated maturity date","Their prices are set by regulators, so yield changes have no effect on their value"],"a":1,"e":"Duration assumes fixed cash flows. MBS prepayments depend on rates, so effective duration and convexity measures are needed."},{"id":"ALT165","t":"ALT","r":"2.5.5","k":"c","d":2,"q":"An investor holds a long bond portfolio and shorts bonds so that the net duration is zero. Why must the hedge be rebalanced over time?","o":["Durations of long and short positions change at different speeds as time passes and yields move","Short positions always have zero duration once they are financed through repo","Duration hedges are exact for all yield changes and never need rebalancing","The short bonds earn coupons that offset all price moves in the long portfolio"],"a":0,"e":"Durations drift with time and yield changes (convexity), so an immunized position must be periodically rebalanced."},{"id":"ALT166","t":"ALT","r":"2.5.6","k":"n","d":2,"q":"A bond has an annual default probability of 3% and an expected recovery rate of 50%. Ignoring risk premiums, what credit spread approximately compensates for expected losses?","o":["0.5%","1.5%","3.0%","6.0%"],"a":1,"e":"Spread ≈ PD × LGD = 3% × (1 − 50%) = 1.5%."},{"id":"ALT167","t":"ALT","r":"2.5.6","k":"c","d":2,"q":"Calibrating a reduced-form credit model means:","o":["Selecting the default intensity from historical default tables without looking at market prices","Choosing model parameters (e.g., default intensity) so the model reproduces observed market prices such as bond spreads","Estimating a firm's asset volatility from its balance sheet and ignoring credit spreads","Fixing the recovery rate at zero so that model spreads exceed observed spreads"],"a":1,"e":"Calibration fits parameters to market prices; the implied probabilities are risk-neutral, not real-world, probabilities."},{"id":"ALT168","t":"ALT","r":"2.5.6","k":"c","d":3,"q":"Why do risk-neutral default probabilities implied from bond spreads typically exceed historical (real-world) default rates?","o":["Spreads include compensation for risk aversion, illiquidity and other premiums","Risk-neutral probabilities ignore recovery and assume total loss on default","Rating agencies require spreads to be twice historical default rates","Historical default data overstate defaults because of survivorship bias"],"a":0,"e":"Spreads reflect expected losses plus risk and liquidity premiums, so implied probabilities are higher than actual default frequencies."},{"id":"ALT169","t":"ALT","r":"2.5.7","k":"n","d":2,"q":"A stock's expected return is 11%, the riskless rate is 3% and the expected market risk premium is 5%. What beta is implied by the CAPM?","o":["1.2","1.4","1.6","2.2"],"a":2,"e":"11% = 3% + β × 5% → β = 8% / 5% = 1.6."},{"id":"ALT170","t":"ALT","r":"2.5.7","k":"c","d":2,"q":"How does the ex post version of the CAPM differ from the ex ante version?","o":["It uses expected returns and excludes beta, so alpha cannot be estimated from data","It uses realized returns and includes an error term, allowing estimation of beta and alpha","It applies only to private assets and uses appraisal-based returns as inputs","It replaces the market portfolio with the risk-free rate and assumes zero beta"],"a":1,"e":"The ex post (realized) form adds an idiosyncratic error term and is used empirically to estimate betas and alphas."},{"id":"ALT171","t":"ALT","r":"2.5.8","k":"c","d":2,"q":"In a single-factor regression of a fund's excess returns on the market's excess returns, the slope coefficient estimates:","o":["Alpha","Beta","R-squared","The residual variance"],"a":1,"e":"The slope is beta (market sensitivity); the intercept is alpha."},{"id":"ALT172","t":"ALT","r":"2.5.8","k":"c","d":1,"q":"An R-squared of 0.85 in a regression of a fund's returns on an index means that:","o":["85% of the fund's return variation is explained by the index","The fund's beta to the index equals 0.85","The fund outperformed the index 85% of months","85% of the fund's return is alpha unexplained by the index"],"a":0,"e":"R-squared (goodness of fit) is the share of variance in the dependent variable explained by the regression."},{"id":"ALT173","t":"ALT","r":"2.5.8","k":"c","d":3,"q":"A few extreme monthly returns dominate an OLS regression estimate of a hedge fund's beta. This problem is related to:","o":["Multicollinearity among the regressors used in the model","Outliers, which OLS weights heavily because it minimizes squared errors","Heteroskedasticity caused by too many observations","Autocorrelation that OLS removes automatically"],"a":1,"e":"OLS squares residuals, so outliers can strongly influence coefficient estimates."},{"id":"ALT174","t":"ALT","r":"2.5.9","k":"n","d":2,"q":"A fund's estimated beta is 1.2 with a standard error of 0.5. What is the t-statistic for testing whether beta differs from zero?","o":["0.42","0.70","2.40","6.00"],"a":2,"e":"t = (1.2 − 0) / 0.5 = 2.40, significant at about the 5% level (|t| > ~2)."},{"id":"ALT175","t":"ALT","r":"2.5.9","k":"c","d":2,"q":"Failing to identify a skilled manager because the test did not reject the null hypothesis of zero alpha is a:","o":["Type I error","Type II error","Selection bias","Survivorship bias"],"a":1,"e":"A Type II error is failing to reject a false null hypothesis."},{"id":"ALT176","t":"ALT","r":"2.5.9","k":"c","d":3,"q":"A researcher finds a p-value of 0.01 for a strategy's alpha. Which interpretation is correct?","o":["There is a 99% probability that the strategy's true alpha is positive","If the true alpha were zero, results at least this extreme would occur about 1% of the time","There is a 1% probability that the strategy's alpha will be zero next year","The strategy's alpha will be 1% per year with high statistical confidence"],"a":1,"e":"A p-value is the probability of observing results as extreme under the null; it is not the probability the hypothesis is true, nor a measure of economic significance."},{"id":"ALT177","t":"ALT","r":"2.5.9","k":"c","d":2,"q":"Which is NOT a valid step in the four-step hypothesis testing process?","o":["State the null and alternative hypotheses","Formulate an analysis plan with a significance level","Accept the null hypothesis as proven true","Analyze the sample and interpret results"],"a":2,"e":"One either rejects or fails to reject the null; a null is never 'accepted' as proven."},{"id":"ALT178","t":"ALT","r":"2.5.10","k":"c","d":2,"q":"A newsletter sends 'market up' forecasts to half its list and 'market down' to the other half, then markets only to those who received the correct call. This is:","o":["Cherry-picking","Chumming","Backfilling","Data mining"],"a":1,"e":"Chumming is a fraudulent practice of distributing varied predictions and then promoting only the subset that turned out right."},{"id":"ALT179","t":"ALT","r":"2.5.10","k":"c","d":2,"q":"A firm launches ten funds and markets only the one with the best track record. This is best described as:","o":["Chumming","Cherry-picking","Survivorship bias in an index","Heteroskedasticity"],"a":1,"e":"Cherry-picking advertises selected favorable results while ignoring the full set."},{"id":"ALT180","t":"ALT","r":"2.5.10","k":"c","d":3,"q":"Which practice best reduces the risk of overfitting when developing a quantitative trading rule?","o":["Testing many more parameter combinations on the same data","Validating the rule on out-of-sample data not used to develop it","Using only the most recent year of data","Removing losing periods from the sample"],"a":1,"e":"Out-of-sample testing checks whether a rule's performance holds on new data, mitigating data mining and overfitting."},{"id":"ALT181","t":"ALT","r":"2.6.1","k":"n","d":2,"q":"An investor is long 2 index futures contracts with a multiplier of $250. The futures price falls by 3 points. What is the change in the margin account?","o":["−$750","−$1,500","−$3,000","+$1,500"],"a":1,"e":"Loss = 2 contracts × 3 points × $250 = $1,500, debited through daily mark-to-market."},{"id":"ALT182","t":"ALT","r":"2.6.1","k":"c","d":2,"q":"Why are forward and futures prices for the same delivery date usually close but not always identical?","o":["Futures are marked to market daily, so their pricing can be affected by the correlation between the underlying and interest rates","Forwards are marked to market daily, so their prices diverge from futures whenever interest rates move","Futures prices are set by exchanges, while forward prices are set by banks with no link between them","Forwards and futures are always identical in price because both settle only at the delivery date"],"a":0,"e":"Daily settlement creates reinvestment effects; if rates correlate with the underlying, futures and forward prices can differ slightly."},{"id":"ALT183","t":"ALT","r":"2.6.2","k":"n","d":2,"q":"A stock index is at 1,000, the continuously compounded riskless rate is 4% and the dividend yield is 2%. What is the six-month forward price?","o":["1,000.00","1,010.05","1,020.20","1,030.45"],"a":1,"e":"F = S × e^((r − q)T) = 1,000 × e^(0.02 × 0.5) = 1,000 × e^0.01 = 1,010.05."},{"id":"ALT184","t":"ALT","r":"2.6.2","k":"c","d":2,"q":"If the observed forward price of a non-dividend stock is above S × e^(rT), an arbitrageur would:","o":["Buy the forward and short the stock","Sell the forward, borrow to buy the stock, and deliver it at maturity","Do nothing, since the forward is fairly priced","Buy both the stock and the forward, financing the purchase by lending cash"],"a":1,"e":"A rich forward is sold while the cheap 'synthetic forward' (borrow and buy spot) is bought: cash-and-carry arbitrage."},{"id":"ALT185","t":"ALT","r":"2.6.3","k":"c","d":2,"q":"Under risk neutrality, the forward price of an asset equals:","o":["The current spot price","The expected future spot price","The strike price of an at-the-money option","Zero"],"a":1,"e":"If investors are risk-neutral, there is no risk premium, so the forward price equals the expected spot price at delivery."},{"id":"ALT186","t":"ALT","r":"2.6.4","k":"c","d":3,"q":"Why does the cost-of-carry relationship act more as a bound than an equality for many physical commodities?","o":["Long arbitrage (buy spot, sell forward) works but reverse arbitrage requires short selling or holding inventory that may not be available","Short selling and borrowing commodities are always free, so both arbitrages work equally well","Reverse arbitrage works, but buying spot and selling forward is restricted by exchange rules","Forward prices are set by regulators within a band around spot, so the relationship cannot hold exactly in practice"],"a":0,"e":"When forwards are too low, arbitrage requires selling inventory or shorting the physical good, often impossible; hence F can stay below full carry (e.g., when convenience yields are high)."},{"id":"ALT187","t":"ALT","r":"2.6.5","k":"c","d":2,"q":"A long-only investor maintains a commodity futures exposure by selling expiring contracts and buying longer-dated ones. This process is called:","o":["Delivery","Rolling (rollover)","Marking to market","Netting"],"a":1,"e":"Rolling maintains exposure as contracts approach expiration; the term structure determines whether the roll adds to or subtracts from returns."},{"id":"ALT188","t":"ALT","r":"2.6.6","k":"n","d":2,"q":"A non-dividend stock is at $50. A one-year European put with a $50 strike is worth $3, and the continuously compounded rate is 4%. What is the call price?","o":["$1.04","$3.00","$4.96","$6.92"],"a":2,"e":"C = P + S − K·e^(−rT) = 3 + 50 − 50 × e^(−0.04) = 3 + 50 − 48.04 = $4.96."},{"id":"ALT189","t":"ALT","r":"2.6.6","k":"c","d":2,"q":"A bull call spread consists of:","o":["Buying a call with a higher strike and selling a call with a lower strike","Buying a call with a lower strike and selling a call with a higher strike","Buying a call and a put with the same strike","Selling two calls"],"a":1,"e":"The long lower-strike call gains from rises; the short higher-strike call reduces cost but caps the profit."},{"id":"ALT190","t":"ALT","r":"2.6.6","k":"c","d":2,"q":"Compared with a long straddle, a long strangle:","o":["Is more expensive because it uses in-the-money options, but profits from small moves","Is cheaper because it uses out-of-the-money options, but needs a larger move to profit","Has a lower maximum loss than a straddle because it uses only put options at one strike","Profits when the underlying stays within a narrow range until the options expire"],"a":1,"e":"Strangles combine an OTM call and an OTM put with different strikes: lower cost, wider break-evens."},{"id":"ALT191","t":"ALT","r":"2.6.6","k":"c","d":2,"q":"Owning a stock and buying a put option on it is called a:","o":["Covered call","Protective put","Naked put","Ratio spread"],"a":1,"e":"A protective put insures a long stock position against declines below the strike."},{"id":"ALT192","t":"ALT","r":"2.6.6","k":"c","d":1,"q":"Writing a call option without owning the underlying asset is known as:","o":["A covered call","A naked (uncovered) call","A protective put","A collar"],"a":1,"e":"A naked call has unlimited potential loss if the underlying rises."},{"id":"ALT193","t":"ALT","r":"2.6.7","k":"n","d":2,"q":"A lender buys a $20m interest rate floor with a 3% floor rate and semiannual settlement. The reference rate sets at 2%. What is the floor payment for the period?","o":["$50,000","$100,000","$200,000","$400,000"],"a":1,"e":"Payment = notional × (floor rate − reference rate) × period = $20m × 1% × 0.5 = $100,000."},{"id":"ALT194","t":"ALT","r":"2.6.7","k":"c","d":2,"q":"Which party typically buys an interest rate cap?","o":["A floating-rate borrower wanting protection against rising rates","A fixed-rate lender","A floating-rate lender wanting protection against falling rates","An equity investor"],"a":0,"e":"Caps pay when rates exceed the cap rate, protecting floating-rate borrowers. Floors protect floating-rate lenders."},{"id":"ALT195","t":"ALT","r":"2.6.8","k":"n","d":2,"q":"A trader is long 10 call contracts (100 shares each) with a delta of 0.6. How many shares should be shorted to be delta neutral?","o":["60","100","600","1,000"],"a":2,"e":"Delta exposure = 10 × 100 × 0.6 = 600 shares, so short 600 shares."},{"id":"ALT196","t":"ALT","r":"2.6.8","k":"n","d":3,"q":"An option has a delta of 0.5. The underlying is at $100 and the option costs $5. What is the option's lambda (elasticity)?","o":["0.5","5","10","20"],"a":2,"e":"Lambda = delta × S / option price = 0.5 × 100 / 5 = 10: the option moves about 10% per 1% move in the underlying."},{"id":"ALT197","t":"ALT","r":"2.6.8","k":"c","d":2,"q":"Which option sensitivity measures exposure to changes in credit spreads?","o":["Rho","Omicron","Theta","Gamma"],"a":1,"e":"Omicron measures sensitivity to credit spreads, relevant for convertible bonds and credit-linked instruments."},{"id":"ALT198","t":"ALT","r":"2.6.8","k":"c","d":3,"q":"Why is an option on a portfolio generally worth less than a portfolio of options on the same assets?","o":["Diversification lowers the volatility of the portfolio, and option value rises with volatility","Diversification raises the volatility of the portfolio, which lowers its option value","Options on portfolios cannot be exercised early, unlike options on single stocks","A portfolio of options pays lower premiums because of transaction cost savings"],"a":0,"e":"Imperfect correlation reduces the portfolio's volatility, so a single option on it has less time value than the sum of individual options."},{"id":"ALT199","t":"ALT","r":"2.6.8","k":"c","d":2,"q":"Which model is typically used to value options on futures contracts?","o":["The Black model","The CAPM","The Gordon growth model","The Altman Z-score"],"a":0,"e":"The Black model adapts Black-Scholes to options on forwards and futures."},{"id":"ALT200","t":"ALT","r":"2.7.1","k":"n","d":1,"q":"A fund's value rises from 100 to a peak of 150, then falls to 105 before recovering. What is the maximum drawdown?","o":["5%","30%","45%","50%"],"a":1,"e":"Drawdown from the peak = (150 − 105) / 150 = 30%."},{"id":"ALT201","t":"ALT","r":"2.7.1","k":"c","d":2,"q":"Tracking error is defined as:","o":["The average difference between a fund's return and the return of its benchmark","The standard deviation of the difference between a fund's return and its benchmark's return","The standard deviation of the fund's own returns, excluding its benchmark returns","The correlation between a fund's return and the return of its benchmark index"],"a":1,"e":"Tracking error measures the volatility of active returns relative to the benchmark."},{"id":"ALT202","t":"ALT","r":"2.7.1","k":"c","d":2,"q":"Shortfall risk refers to:","o":["The probability that the return falls below a specified target level","The maximum peak-to-trough loss over the fund's history","The standard deviation of returns below the average return","The average loss in the worst 5% of observed outcomes"],"a":0,"e":"Shortfall risk is the probability of failing to meet a target return or wealth level."},{"id":"ALT203","t":"ALT","r":"2.7.2","k":"n","d":3,"q":"A $50m portfolio has a daily standard deviation of 1%. Assuming normal returns with zero mean and independence, what is its 10-day 99% VaR (z = 2.33)?","o":["$1.17 million","$2.33 million","$3.68 million","$11.65 million"],"a":2,"e":"1-day VaR = 2.33 × 1% × $50m = $1.165m. 10-day VaR = 1.165 × √10 ≈ $3.68m."},{"id":"ALT204","t":"ALT","r":"2.7.2","k":"c","d":2,"q":"Conditional VaR (expected shortfall) measures:","o":["The maximum loss that will not be exceeded with 95% confidence","The average loss in the worst cases beyond the VaR threshold","The probability that losses exceed a specified threshold","The standard deviation of losses below the average return"],"a":1,"e":"CVaR averages losses in the tail beyond VaR, addressing VaR's silence on tail magnitude."},{"id":"ALT205","t":"ALT","r":"2.7.2","k":"c","d":2,"q":"Which VaR method simulates many hypothetical scenarios from assumed return distributions?","o":["Parametric VaR","Historical VaR","Monte Carlo VaR","Incremental VaR"],"a":2,"e":"Monte Carlo VaR generates random scenarios from a specified model; historical VaR replays past returns; parametric VaR uses distribution formulas."},{"id":"ALT206","t":"ALT","r":"2.7.3","k":"c","d":2,"q":"What is a key challenge in benchmarking hedge funds?","o":["Hedge funds publish daily holdings, which makes benchmarks unnecessary for most investors","Strategies are heterogeneous and indices suffer from biases, so finding an appropriate benchmark is difficult","Hedge fund returns are normally distributed, so any equity index provides a good benchmark","Regulators assign each hedge fund an official benchmark that cannot be changed by investors"],"a":1,"e":"Diverse strategies, peer-group biases and non-investable indices make benchmarking alternatives difficult."},{"id":"ALT207","t":"ALT","r":"2.7.4","k":"n","d":2,"q":"A fund earns 9% with a downside deviation of 4%; the target return is 3%. What is its Sortino ratio?","o":["0.75","1.50","2.25","3.00"],"a":1,"e":"Sortino = (9% − 3%) / 4% = 1.50."},{"id":"ALT208","t":"ALT","r":"2.7.4","k":"n","d":3,"q":"A fund has a Sharpe ratio of 0.5. The market's volatility is 16% and the riskless rate is 2%. What is the fund's M² (risk-adjusted return at market volatility)?","o":["8%","10%","12%","18%"],"a":1,"e":"M² = Rf + Sharpe × σmarket = 2% + 0.5 × 16% = 10%."},{"id":"ALT209","t":"ALT","r":"2.7.4","k":"c","d":2,"q":"For a fund that will be combined with many others in a well-diversified portfolio, which ratio is most appropriate?","o":["Sharpe ratio","Treynor ratio","Sortino ratio","Maximum drawdown"],"a":1,"e":"In a diversified portfolio, idiosyncratic risk is diversified away, so return per unit of systematic risk (beta) — the Treynor ratio — is relevant."},{"id":"ALT210","t":"ALT","r":"2.7.4","k":"c","d":3,"q":"Why can the Sharpe ratio overstate the attractiveness of a strategy that sells options?","o":["The Sharpe ratio ignores the risk-free rate, which overstates returns","Standard deviation understates the risk of negatively skewed, fat-tailed returns","Option sellers always have higher volatility than option buyers","The Sharpe ratio penalizes positive skewness more than negative"],"a":1,"e":"Option-selling yields steady returns with rare large losses; volatility based on normality understates this tail risk, inflating the Sharpe ratio."},{"id":"ALT211","t":"ALT","r":"2.7.4","k":"c","d":2,"q":"Return on VaR is calculated as:","o":["VaR divided by return","Return divided by VaR","Return minus VaR","Sharpe ratio times VaR"],"a":1,"e":"Return on VaR expresses the return earned per unit of VaR risk."},{"id":"ALT212","t":"ALT","r":"2.7.6","k":"n","d":2,"q":"A fund returns 8%. The riskless rate is 2%, the market returns 9% and the fund's beta is 0.8. What is Jensen's alpha?","o":["−0.4%","0.4%","1.0%","6.0%"],"a":1,"e":"Required return = 2% + 0.8 × (9% − 2%) = 7.6%. Alpha = 8% − 7.6% = 0.4%."},{"id":"ALT213","t":"ALT","r":"2.7.6","k":"c","d":2,"q":"What distinguishes ex ante alpha from ex post alpha?","o":["Ex ante alpha is the realized excess return over a period; ex post alpha is the forecast made before investing","Ex ante alpha is the expected excess return from mispricing; ex post alpha is the realized excess return, which includes luck","Ex ante alpha includes luck, while ex post alpha measures only skill after removing random variation","Both are identical measures, but ex ante alpha is reported gross of fees and ex post alpha net of fees"],"a":1,"e":"Ex ante alpha is an expectation (skill or mispricing); ex post alpha is realized and can be due to luck or mismeasured risk."},{"id":"ALT214","t":"ALT","r":"2.7.6","k":"c","d":3,"q":"A manager's apparent alpha disappears once returns are regressed on equity, credit and volatility factors. The original alpha was most likely:","o":["Genuine manager skill from security selection","Compensation for systematic (alternative) beta exposures","Luck that will persist in future periods","Fees that were excluded from the regression"],"a":1,"e":"Returns that are explained by systematic factors are beta, not alpha; alternative betas (e.g., short volatility, carry) can masquerade as alpha."},{"id":"ALT215","t":"ALT","r":"2.7.7","k":"c","d":2,"q":"A stale price is best defined as:","o":["A price that leads changes in the true market value of an asset","A price that lags changes in the true market value of an asset","A price set by a regulator for tax and reporting purposes","A price quoted by a dealer that includes a large commission"],"a":1,"e":"Stale prices reflect old information, common for illiquid assets valued infrequently."},{"id":"ALT216","t":"ALT","r":"2.7.8","k":"c","d":2,"q":"Which statement about intentional versus unintentional smoothing is correct?","o":["Intentional smoothing arises only from appraisal methods, while unintentional smoothing is deliberate manipulation by managers","Unintentional smoothing arises from appraisal methods and stale prices; intentional smoothing involves managers deliberately managing reported values","Both types of smoothing are always fraudulent and must be reported to regulators by the fund's auditor","Unintentional smoothing affects only listed assets, while intentional smoothing affects only hedge fund returns"],"a":1,"e":"Appraisals and stale prices smooth returns unintentionally; managers can also intentionally smooth valuations. Both understate risk."},{"id":"ALT217","t":"ALT","r":"2.7.8","k":"c","d":3,"q":"If an analyst ignores return smoothing when allocating to private real estate, the optimizer will most likely:","o":["Underweight the asset because its volatility and correlation appear artificially high","Overweight the asset because its volatility and correlation appear artificially low","Allocate correctly because smoothing affects only returns, not measured risk","Avoid the asset entirely because smoothed returns cannot be used in any model"],"a":1,"e":"Understated risk and correlation make smoothed assets look like excellent diversifiers, leading to excessive allocations."},{"id":"ALT218","t":"ALT","r":"2.2.5","k":"n","d":2,"q":"A GP commits 2% of a $500 million fund. How much capital does the GP commit, and why is it required?","o":["$2m; to pay the fund's legal and organizational expenses","$10m; to align the GP's interests with the LPs'","$50m; to meet the regulatory minimum for registered funds","$10m; to cover management fees during the investment period"],"a":1,"e":"2% × $500m = $10m. A meaningful GP commitment gives the manager 'skin in the game'."},{"id":"ALT219","t":"ALT","r":"2.2.6","k":"n","d":3,"q":"A fund with $100m of contributed capital distributes $150m in total. Terms: 8% preferred return (assume $8m accrued), 100% GP catch-up, then 80/20. How much carry does the GP receive?","o":["$8.4m","$10.0m","$11.6m","$30.0m"],"a":1,"e":"Profit = $50m. With full catch-up, the GP ends with 20% of total profit: 20% × $50m = $10m (LPs get capital + $40m)."},{"id":"ALT220","t":"ALT","r":"2.3.2","k":"c","d":1,"q":"What is a since-inception IRR?","o":["An IRR computed from the fund's inception to today, treating the current NAV as a final cash flow","An IRR computed only from realized distributions, ignoring the fund's current NAV","An IRR computed over the last twelve months, treating the NAV as an initial cash flow","An average of each year's annual return since the fund was launched by its manager"],"a":0,"e":"Since-inception (interim) IRRs use all cash flows to date plus the current NAV as a terminal value."},{"id":"ALT221","t":"ALT","r":"2.4.3","k":"c","d":2,"q":"Two assets with a correlation of −1 can be combined to:","o":["Create a portfolio with zero risk for appropriate weights","Double portfolio risk","Make the portfolio's risk equal to the higher of the two","Leave risk unchanged"],"a":0,"e":"With perfect negative correlation, weights can be chosen so that the variations offset exactly, eliminating risk."},{"id":"ALT222","t":"ALT","r":"2.4.4","k":"c","d":2,"q":"An asset has a correlation of 0.6 with the market, a volatility of 25% and the market volatility is 15%. What is its beta?","o":["0.36","0.60","1.00","1.67"],"a":2,"e":"β = ρ × σi / σm = 0.6 × 25% / 15% = 1.0."},{"id":"ALT223","t":"ALT","r":"2.1.4","k":"c","d":2,"q":"Which statement about active and passive management is consistent with the curriculum's view of alternatives?","o":["Most alternative strategies are passive and track indices, so skill has little effect","Most alternative strategies rely on active management, where skill and costs determine net results","Passive alternatives always beat active managers after fees in every asset class","Active management in alternatives has no costs, so gross and net returns are equal"],"a":1,"e":"Alternatives are largely actively managed; manager selection and fees are therefore central to outcomes."},{"id":"ALT224","t":"ALT","r":"2.2.3","k":"c","d":2,"q":"Which EU directive regulates investment services and trading venues and was strengthened in its second version to increase transparency?","o":["AIFMD","MiFID / MiFID II","UCITS","EMIR"],"a":1,"e":"MiFID (and MiFID II) governs investment services and markets across the EU; AIFMD regulates alternative fund managers."},{"id":"ALT225","t":"ALT","r":"2.3.1","k":"c","d":1,"q":"Why does the CAIA curriculum frequently use continuously compounded (log) returns?","o":["They are always larger than simple returns and therefore easier to interpret","They are additive over time and fit statistical models (e.g., lognormal prices) conveniently","They are required by regulators for all published performance figures","They are additive across assets in a portfolio at a single point in time"],"a":1,"e":"Log returns sum across periods and imply prices cannot become negative, simplifying multi-period analysis."},{"id":"ALT226","t":"ALT","r":"2.5.2","k":"n","d":1,"q":"What is the present value of $1,000 received in 2 years at a 6% annual discount rate?","o":["$880.00","$889.00","$890.00","$943.40"],"a":2,"e":"PV = 1,000 / 1.06² = 1,000 / 1.1236 ≈ $890.00."},{"id":"ALT227","t":"ALT","r":"2.6.6","k":"c","d":2,"q":"A risk reversal position that buys an out-of-the-money call and sells an out-of-the-money put provides:","o":["A volatility-neutral hedge with no directional exposure","Bullish directional exposure financed by the put premium","Protection against falling prices","Pure exposure to interest rates"],"a":1,"e":"Long call/short put creates a synthetic long exposure; it is also used to trade the skew between call and put implied volatilities."},{"id":"ALT228","t":"ALT","r":"2.7.1","k":"c","d":1,"q":"Semivolatility measures:","o":["Volatility of returns above the mean only","Volatility of returns below the mean only","Half of total volatility","Volatility of the benchmark"],"a":1,"e":"Semivolatility is the square root of semivariance, which uses only returns below the mean."},{"id":"ALT229","t":"ALT","r":"2.7.6","k":"c","d":2,"q":"Return attribution analysis seeks to:","o":["Rank managers by total return over the latest calendar year without any risk adjustment","Decompose returns into components explained by risk factors (beta) and a residual attributable to the manager (alpha)","Forecast next year's return by extrapolating the manager's average historical return","Compare a manager's fees with peers to determine whether the fees charged are reasonable relative to the returns"],"a":1,"e":"Attribution identifies how much performance came from factor exposures versus skill."},{"id":"RA058","t":"RA","r":"3.1.1","k":"c","d":1,"q":"Which of the following is generally classified as a natural resource real asset?","o":["Timberland","Corporate bonds","Patents","Hedge fund shares"],"a":0,"e":"Natural resources include timberland, farmland, land, and mining and energy assets."},{"id":"RA059","t":"RA","r":"3.1.1","k":"c","d":2,"q":"Why can investing in a mining company give a different return profile from holding the mined commodity?","o":["The company's value also reflects management, costs, leverage and equity market risk","Mining stocks are always fully hedged against commodity price changes","Commodity prices have no effect on the value of mining companies","Mining companies are exempt from taxes, unlike commodity holders"],"a":0,"e":"Producer equities embed operating leverage, financial leverage, management decisions and equity beta beyond commodity exposure."},{"id":"RA060","t":"RA","r":"3.1.2","k":"c","d":2,"q":"Undeveloped land is often described as a call option because the owner:","o":["Must develop it within one year or lose the land to the municipality","Has the right but not the obligation to develop it when conditions are favorable","Receives guaranteed rent from the government until it is developed","Can always sell it back to the government at its original cost"],"a":1,"e":"Raw land gives the option to develop; its value rises with volatility of development payoffs and time."},{"id":"RA061","t":"RA","r":"3.1.2","k":"a","d":3,"q":"Under real option theory, an increase in the uncertainty of future development values will, all else equal:","o":["Decrease the value of undeveloped land","Increase the value of undeveloped land","Leave land value unchanged","Force immediate development"],"a":1,"e":"Like a call option, the value of the development option increases with volatility."},{"id":"RA062","t":"RA","r":"3.1.3","k":"c","d":1,"q":"The biological growth of trees provides timberland investors with:","o":["A return driver largely independent of financial markets","A guaranteed fixed coupon paid by timber buyers","Exposure only to the equity market through timber REITs","No return until a regulator mandates the harvest"],"a":0,"e":"Biological growth increases timber volume each year regardless of market prices, a distinctive return source."},{"id":"RA063","t":"RA","r":"3.1.3","k":"a","d":2,"q":"When timber prices are depressed, a timberland manager most likely will:","o":["Clear-cut the entire forest immediately to raise cash","Delay harvesting and let trees keep growing","Sell the land at any available price to exit the position","Convert all of the land to farmland within a single season"],"a":1,"e":"Timber can be 'stored on the stump'; delaying harvest preserves value and adds growth."},{"id":"RA064","t":"RA","r":"3.1.3","k":"c","d":2,"q":"The three primary return drivers of timberland are:","o":["Biological growth, timber prices and land value changes","Coupons, dividends and share buybacks","Leverage, management fees and carried interest","Volatility, momentum and value factor premia"],"a":0,"e":"Timberland returns come from tree growth, changes in timber prices and changes in the underlying land value."},{"id":"RA065","t":"RA","r":"3.1.4","k":"c","d":2,"q":"Farmland returns are typically split into which two components?","o":["Income from crops or rent, and land value appreciation","Coupon payments and return of principal at maturity","Collateral yield and roll yield on farm futures","Dividends from farm REITs and option premiums"],"a":0,"e":"Farmland generates current income (crop sales or leases) and capital appreciation of the land."},{"id":"RA066","t":"RA","r":"3.1.4","k":"c","d":2,"q":"Which factor tends to drive long-term global farmland demand?","o":["Population growth and rising incomes increasing food demand","A falling global population and lower calorie needs","Declining protein consumption in emerging markets","Lower demand for biofuels with no other use for land"],"a":0,"e":"Growing population and higher incomes raise demand for food and arable land, which is in limited supply."},{"id":"RA067","t":"RA","r":"3.1.5","k":"c","d":2,"q":"Why are permanent crops riskier than row crops?","o":["They cannot be quickly switched to other crops and require years to mature","They are harvested monthly, so prices are more volatile","They have no exposure to weather or disease events","They are always insured by government programs, so investors bear no yield risk"],"a":0,"e":"Orchards and vineyards involve long lead times and are less flexible, increasing operational and price risk."},{"id":"RA068","t":"RA","r":"3.1.6","k":"c","d":3,"q":"Appraisal-based farmland and timberland indices tend to understate risk mainly because:","o":["Appraisals smooth valuations and lag market moves","They include too much leverage in the reported returns","They are marked to market daily using futures prices","They exclude income returns from the reported figures"],"a":0,"e":"Appraisal smoothing reduces measured volatility and correlations versus true economic risk."},{"id":"RA069","t":"RA","r":"3.1.6","k":"c","d":2,"q":"Which is a common way for institutions to access timberland directly?","o":["Through a Timberland Investment Management Organization (TIMO)","Through money market funds that hold timber receivables","Through commodity swaps on lumber futures only","Through currency forwards on timber-exporting nations"],"a":0,"e":"TIMOs manage timberland on behalf of institutional investors; timber REITs are the listed alternative."},{"id":"RA070","t":"RA","r":"3.2.1","k":"c","d":1,"q":"Which is a typical way to obtain commodity exposure?","o":["Futures contracts","Treasury bills only","Preferred stock of banks","Municipal bonds"],"a":0,"e":"Futures are the main vehicle; others include physical holdings, producer equities, ETPs and commodity-linked notes."},{"id":"RA071","t":"RA","r":"3.2.1","k":"c","d":2,"q":"Why do most investors avoid holding physical commodities?","o":["Storage, insurance, transport and spoilage costs","Physical commodities pay high coupons","Futures are illegal for institutions","Physical holdings have no price risk"],"a":0,"e":"Physical ownership requires storage and handling; precious metals are the main practical exception."},{"id":"RA072","t":"RA","r":"3.2.3","k":"c","d":1,"q":"A futures curve in which longer-dated contracts trade above nearby contracts is said to be in:","o":["Contango","Backwardation","Normal backwardation","Equilibrium"],"a":0,"e":"Upward-sloping term structure = contango."},{"id":"RA073","t":"RA","r":"3.2.3","k":"c","d":2,"q":"Under the cost-of-carry model with storage costs, the futures price equals:","o":["Spot × e^((r + storage − convenience yield) × T)","Spot × e^(−rT)","Spot minus storage costs","Expected spot price plus risk premium"],"a":0,"e":"F = S·e^((r + c − y)T), where c is storage cost and y the convenience yield."},{"id":"RA074","t":"RA","r":"3.2.3","k":"n","d":3,"q":"Spot gold is $2,000, the continuously compounded rate is 4%, storage cost is 0.5% and convenience yield is 0. What is the approximate 1-year futures price?","o":["$2,092","$2,080","$2,010","$2,000"],"a":0,"e":"F = 2,000 × e^(0.045) ≈ 2,000 × 1.0460 ≈ $2,092."},{"id":"RA075","t":"RA","r":"3.2.4","k":"c","d":2,"q":"Inventory levels and futures term structure are related because:","o":["Low inventories raise convenience yield, favoring backwardation","High inventories always cause backwardation","Inventories do not affect futures prices","Low inventories reduce convenience yield and cause contango"],"a":0,"e":"Scarce inventories make holding the physical valuable (high convenience yield), pushing nearby prices above deferred ones."},{"id":"RA076","t":"RA","r":"3.2.4","k":"a","d":2,"q":"An investor rolls a long position from a $70 expiring contract into a $73 next contract while spot stays flat. The roll yield is:","o":["Negative","Positive","Zero","Undefined"],"a":0,"e":"Rolling up an upward-sloping (contango) curve buys more expensive contracts, producing negative roll yield."},{"id":"RA077","t":"RA","r":"3.2.5","k":"c","d":2,"q":"The collateral yield on a fully collateralized futures position comes from:","o":["Interest earned on the margin and collateral, typically T-bills","Changes in the spot price of the underlying commodity","Rolling expiring contracts into longer-dated contracts","The convenience yield received in cash from producers"],"a":0,"e":"Collateral (usually T-bills) earns the risk-free rate, the collateral yield."},{"id":"RA078","t":"RA","r":"3.2.5","k":"n","d":3,"q":"Over a year, spot return is +3%, roll yield −4% and collateral yield +4%. What is the approximate total return of a collateralized long futures position?","o":["+3%","+11%","−1%","+7%"],"a":0,"e":"Total ≈ spot + roll + collateral = 3% − 4% + 4% = +3%."},{"id":"RA079","t":"RA","r":"3.2.6","k":"c","d":2,"q":"According to Keynes's normal backwardation, the risk premium in commodity futures is earned by:","o":["Speculators who are long and absorb producers' hedging pressure","Producers who are short futures to hedge their production","The exchanges that clear and settle the futures contracts","Consumers who are long futures to hedge their input costs"],"a":0,"e":"Producers hedge by selling futures below expected spot; long speculators earn the premium for bearing price risk."},{"id":"RA080","t":"RA","r":"3.2.6","k":"c","d":3,"q":"The hedging pressure hypothesis generalizes normal backwardation by stating that:","o":["Futures can be above or below expected spot depending on whether hedgers are net short or net long","Futures prices always equal the expected future spot price, whatever the position of hedgers","Hedgers never trade futures, so only speculators set prices","Speculators always lose money to hedgers in futures markets"],"a":0,"e":"If hedgers are net long (e.g., consumers), futures can trade above expected spot (normal contango)."},{"id":"RA081","t":"RA","r":"3.2.7","k":"c","d":2,"q":"Commodities are often included in portfolios because they tend to:","o":["Perform relatively well during unexpected inflation","Pay stable dividends linked to production","Have negative expected returns","Be perfectly correlated with bonds"],"a":0,"e":"Commodity prices are components of inflation, so they often hedge unexpected inflation."},{"id":"RA082","t":"RA","r":"3.2.7","k":"c","d":3,"q":"Event risk in commodities (e.g., supply disruptions) tends to produce return distributions with:","o":["Positive skewness","Negative skewness","Zero kurtosis","No fat tails"],"a":0,"e":"Supply shocks usually drive prices up sharply, giving commodities positive skewness, unlike equities."},{"id":"RA083","t":"RA","r":"3.2.8","k":"c","d":2,"q":"Why is the S&P GSCI heavily weighted toward energy?","o":["It weights commodities by world production value","It caps each commodity sector at one third of the index","It assigns equal weights to all component commodities","It weights by the market cap of commodity producers"],"a":0,"e":"Production weighting makes energy the dominant sector."},{"id":"RA084","t":"RA","r":"3.2.8","k":"c","d":2,"q":"The Bloomberg Commodity Index limits concentration by:","o":["Capping sector and single-commodity weights","Including only energy","Weighting by market capitalization of producers","Excluding agriculture"],"a":0,"e":"BCOM uses liquidity and production data with caps (e.g., about 33% per sector), making it more diversified."},{"id":"RA085","t":"RA","r":"3.2.9","k":"c","d":2,"q":"In US law, master limited partnerships (MLPs) must earn at least 90% of income from:","o":["Qualifying sources, mainly natural resource activities","Financial services such as lending and brokerage","Technology licensing and software subscriptions","Retail sales of consumer goods and services"],"a":0,"e":"MLPs are publicly traded partnerships with at least 90% of income from qualifying sources such as energy transport and storage."},{"id":"RA086","t":"RA","r":"3.2.10","k":"c","d":2,"q":"Historically, how have long-only commodity index returns behaved relative to equities?","o":["Low correlation and high volatility, with long periods of weak returns","Identical risk and return to equities over every decade","Lower volatility than Treasury bills with steady gains","Steady, bond-like returns with strong positive correlation"],"a":0,"e":"Commodities have low correlation with stocks and bonds, high volatility, and decades of mixed performance."},{"id":"RA087","t":"RA","r":"3.3.2","k":"c","d":1,"q":"Which is NOT among the typical characteristics of infrastructure assets?","o":["High barriers to entry due to large capital needs","Long useful lives often spanning several decades","Inelastic demand for essential public services","Very short-lived assets with volatile demand"],"a":3,"e":"Infrastructure is long-lived, monopolistic, with high barriers to entry, inelastic demand and stable cash flows."},{"id":"RA088","t":"RA","r":"3.3.2","k":"c","d":2,"q":"Infrastructure assets often have monopolistic characteristics. What usually limits the resulting pricing power?","o":["Regulation or concession agreements","Unlimited competition from new entrants","Daily price auctions run by exchanges","Absence of any contracts with users"],"a":0,"e":"Regulators and concession contracts cap tariffs to protect users."},{"id":"RA089","t":"RA","r":"3.3.3","k":"c","d":2,"q":"A brownfield infrastructure investment refers to:","o":["An existing, operational asset","A project not yet built","Undeveloped land","A listed infrastructure index"],"a":0,"e":"Brownfield assets are existing; greenfield assets are to be constructed."},{"id":"RA090","t":"RA","r":"3.3.3","k":"c","d":2,"q":"Social infrastructure differs from economic infrastructure mainly in that it:","o":["Serves public needs like schools and hospitals, often paid through availability payments","Always collects tolls directly from users, unlike economic assets","Is always privately owned and never involves government payments or concessions","Has the highest sensitivity to GDP growth of all infrastructure"],"a":0,"e":"Social infrastructure (schools, hospitals, prisons) is usually paid by government; economic infrastructure (toll roads, ports) by users."},{"id":"RA091","t":"RA","r":"3.3.4","k":"c","d":1,"q":"Which infrastructure style generally has the lowest risk?","o":["Core","Core-plus","Value-added","Opportunistic"],"a":0,"e":"Core assets are operational, contracted or regulated, with stable cash flows."},{"id":"RA092","t":"RA","r":"3.3.4","k":"c","d":2,"q":"An infrastructure fund building a new renewable energy plant without contracted offtake is most likely:","o":["Opportunistic or value-added","Core","Core-plus","A government bond fund"],"a":0,"e":"Development and merchant exposure (no contracted revenue) places it in higher-risk styles."},{"id":"RA093","t":"RA","r":"3.3.4","k":"c","d":3,"q":"In the CAIA 2027 curriculum, typical leverage for core infrastructure is approximately:","o":["50–80% of value","0–10% of value","95–100% of value","Exactly 30% of value"],"a":0,"e":"Stable, contracted cash flows allow high leverage, often 50–80%, with DSCR around 1.2–1.4x."},{"id":"RA094","t":"RA","r":"3.3.4","k":"c","d":3,"q":"A typical debt service coverage ratio covenant for core infrastructure debt is around:","o":["1.2–1.4x","0.5–0.8x","3.0–4.0x","10x"],"a":0,"e":"Predictable cash flows allow relatively tight DSCRs of roughly 1.2–1.4x."},{"id":"RA095","t":"RA","r":"3.3.5","k":"n","d":2,"q":"An infrastructure asset has cash flow available for debt service of $28 million and annual debt service of $20 million. What is its DSCR?","o":["1.40x","0.71x","1.25x","8.0x"],"a":0,"e":"DSCR = 28 / 20 = 1.40x."},{"id":"RA096","t":"RA","r":"3.3.5","k":"c","d":2,"q":"Which revenue model exposes an infrastructure investor to the most demand risk?","o":["User-fee (toll) revenue","Availability payments","Regulated asset base returns","Fixed-price take-or-pay contracts"],"a":0,"e":"User-fee models depend on traffic or usage volumes; availability payments do not."},{"id":"RA097","t":"RA","r":"3.3.5","k":"c","d":2,"q":"Regulated utilities typically earn returns based on:","o":["An allowed return on a regulated asset base","Unrestricted market pricing set by supply and demand","Traffic volumes multiplied by a fixed toll per vehicle","Commodity prices for the energy they distribute"],"a":0,"e":"Regulators set an allowed return on the asset base, giving stable but capped returns."},{"id":"RA098","t":"RA","r":"3.3.6","k":"c","d":2,"q":"Which risk refers to a government changing the rules or tariffs after an infrastructure investment is made?","o":["Regulatory/political risk","Construction risk","Currency risk","Prepayment risk"],"a":0,"e":"Regulatory and political risk includes changes in tariffs, taxes or concession terms."},{"id":"RA099","t":"RA","r":"3.3.6","k":"c","d":2,"q":"Construction risk is most relevant for:","o":["Greenfield projects","Operating toll roads","Regulated utilities with no capex","Listed infrastructure indices"],"a":0,"e":"Greenfield projects face cost overruns and delays before generating cash flows."},{"id":"RA100","t":"RA","r":"3.3.7","k":"c","d":2,"q":"Why might listed infrastructure behave differently from private infrastructure in the short run?","o":["Listed vehicles are marked to market and carry equity market beta","Listed infrastructure holds different physical assets by law","Private funds are priced daily","Listed infrastructure has no leverage"],"a":0,"e":"Listed infrastructure trades daily and is affected by equity sentiment; private valuations are appraisal based and smoothed."},{"id":"RA101","t":"RA","r":"3.3.9","k":"c","d":2,"q":"Infrastructure is often considered a partial inflation hedge because:","o":["Many concession tariffs are indexed to inflation","Its bonds pay fixed coupons over long periods","It has no operating costs that rise with prices","It is exempt from taxes in most countries"],"a":0,"e":"Inflation-linked tariffs and regulated returns allow revenues to rise with inflation."},{"id":"RA102","t":"RA","r":"3.3.11","k":"c","d":3,"q":"Energy transition infrastructure, such as renewables and storage, is considered growing in the curriculum mainly because:","o":["Decarbonization policies and investment needs create large capital demand","Oil prices are fixed by governments under long-term contracts","Governments ban private capital from conventional energy","It requires no capital because costs have fallen to zero"],"a":0,"e":"Net-zero commitments and grid modernization require massive private investment."},{"id":"RA103","t":"RA","r":"3.3.4","k":"c","d":2,"q":"Core-plus infrastructure assets differ from core assets in that they:","o":["Have some demand or operational risk while remaining mostly operational","Are always greenfield projects that are not yet built","Have zero leverage because of their higher demand and operating risks","Are limited to social infrastructure like hospitals"],"a":0,"e":"Core-plus assets are mostly operational but with more exposure to volume, growth or re-contracting risks."},{"id":"RA104","t":"RA","r":"3.3.6","k":"a","d":3,"q":"A toll road concession expires in 25 years with no residual value to the investor. Compared with a perpetual utility, this asset's equity value is:","o":["More like an amortizing claim that declines toward zero at expiry","A growing perpetuity whose value rises over time with traffic","A claim immune to traffic risk because tolls are indexed","A risk-free bond guaranteed by the government until expiry"],"a":0,"e":"Finite concessions mean cash flows end, so value amortizes toward zero over the life."},{"id":"RA105","t":"RA","r":"3.2.3","k":"a","d":2,"q":"Which situation is most likely to produce backwardation in crude oil futures?","o":["A sudden supply disruption with low inventories","A large inventory glut with full storage facilities","Very cheap storage and abundant shipping capacity","A falling convenience yield as stocks accumulate"],"a":0,"e":"Low inventories increase convenience yield, raising spot relative to deferred futures."},{"id":"RA106","t":"RA","r":"3.2.4","k":"c","d":2,"q":"In an extremely oversupplied market where storage becomes scarce, the futures curve typically shows:","o":["Steep contango","Steep backwardation","A flat curve","Negative interest rates"],"a":0,"e":"When storage is costly or full, nearby prices fall relative to deferred prices, creating steep contango."},{"id":"RA107","t":"RA","r":"3.2.6","k":"c","d":2,"q":"Spot return in a commodity futures position is driven by:","o":["Changes in the underlying spot price","Interest earned on collateral","The term structure only","Management fees and expenses"],"a":0,"e":"Spot return reflects movement in the underlying commodity's spot price."},{"id":"RA108","t":"RA","r":"3.2.9","k":"c","d":2,"q":"Midstream MLP cash flows are relatively stable because they:","o":["Earn fee-based revenues for transporting and storing energy","Own oil reserves and sell production at spot prices","Trade commodities speculatively using futures","Depend mainly on refining margins and crack spreads"],"a":0,"e":"Pipelines and storage charge volume-based fees, limiting direct commodity price exposure."},{"id":"RA109","t":"RA","r":"3.2.1","k":"c","d":2,"q":"A key disadvantage of using commodity producer equities to gain commodity exposure is:","o":["Exposure to equity market and company-specific risks","They cannot be traded by institutional investors","They have perfect commodity correlation","They require physical storage"],"a":0,"e":"Producer stocks reflect equity beta, hedging policies and management, diluting commodity exposure."},{"id":"RA110","t":"RA","r":"3.1.3","k":"c","d":2,"q":"Timber REITs differ from TIMOs mainly in that timber REITs:","o":["Are listed and offer liquidity, while TIMOs manage private holdings","Cannot own land and only hold timber cutting rights","Operate only in Europe under special tax regimes","Do not benefit from any favorable tax treatment, while TIMOs are tax-exempt"],"a":0,"e":"Timber REITs are public companies; TIMOs manage private timberland for institutions."},{"id":"RA111","t":"RA","r":"3.1.4","k":"c","d":2,"q":"Farmland is often viewed as a hedge against inflation because:","o":["Food prices and land values tend to rise with inflation","Farm income is fixed by law and indexed to wages","Farmland pays a fixed coupon set by governments","Land values are marked to market daily on exchanges"],"a":0,"e":"Crop prices and land values historically track or exceed inflation."},{"id":"RA112","t":"RA","r":"3.2.8","k":"c","d":2,"q":"Which feature makes a commodity index 'investable'?","o":["Its returns can be replicated with tradable futures positions","Its returns are based on spot prices of physical goods","It includes commodities that are not exchange listed","Its returns are reported only once a year"],"a":0,"e":"Investable indices are based on liquid futures that can be held and rolled."},{"id":"RA113","t":"RA","r":"3.2.7","k":"c","d":2,"q":"Which statement about commodities and equity drawdowns is most consistent with the curriculum?","o":["Commodities have sometimes, but not always, provided diversification during equity sell-offs","Commodities have always risen whenever equities have fallen sharply","Commodities and equities have been perfectly correlated over time","Commodities have never provided any diversification to equities in any market environment"],"a":0,"e":"Diversification benefits are real but unreliable, e.g., commodities fell with equities in 2008."},{"id":"RA114","t":"RA","r":"3.3.2","k":"c","d":2,"q":"High barriers to entry in infrastructure mainly result from:","o":["Large capital requirements and regulatory approvals","Low construction costs and quick approvals","Absence of regulation in most markets","Short asset lives and frequent replacement"],"a":0,"e":"Huge upfront costs and permits deter competitors, supporting monopolistic positions."},{"id":"RA115","t":"RA","r":"3.3.5","k":"c","d":2,"q":"Under an availability payment PPP, the government typically retains:","o":["Demand (usage) risk","Construction risk","Operating cost risk","All financing risk"],"a":0,"e":"The operator is paid for availability, so the public sector keeps usage risk."},{"id":"RA116","t":"RA","r":"3.4.1","k":"c","d":1,"q":"Which real estate investment style typically uses the least leverage?","o":["Core","Value-added","Opportunistic","Development"],"a":0,"e":"Core real estate uses low leverage (often below ~30%) and stable, income-producing properties."},{"id":"RA117","t":"RA","r":"3.4.1","k":"c","d":2,"q":"Value-added real estate typically involves:","o":["Repositioning, renovation or lease-up of properties with moderate leverage","Only fully leased trophy buildings held with very low leverage","Raw land speculation financed with very high leverage","Government bonds held alongside a small real estate sleeve"],"a":0,"e":"Value-added strategies improve properties through capex, repositioning or re-leasing, with moderate leverage."},{"id":"RA118","t":"RA","r":"3.4.1","k":"c","d":2,"q":"Most of an opportunistic real estate fund's return is expected to come from:","o":["Appreciation","Current income","Interest income","Management fees"],"a":0,"e":"Opportunistic strategies rely primarily on capital appreciation; core relies mainly on income."},{"id":"RA119","t":"RA","r":"3.4.2","k":"c","d":2,"q":"The NCREIF style boxes classify property strategies according to:","o":["Risk and return characteristics such as leverage, income share and lease-up","Geographic region of the properties held in each fund","The industry of the largest tenant in each property","The age of the buildings, from newly built to functionally obsolete"],"a":0,"e":"NCREIF defines core, value-added and opportunistic based on characteristics like leverage and income versus appreciation."},{"id":"RA120","t":"RA","r":"3.4.3","k":"c","d":2,"q":"A disadvantage of direct ownership of commercial real estate is:","o":["Large lot sizes and concentration risk","High liquidity and quick sales","Low transaction costs and fees","Daily pricing on public exchanges"],"a":0,"e":"Direct real estate requires large capital per property, creating concentration and illiquidity."},{"id":"RA121","t":"RA","r":"3.4.3","k":"c","d":2,"q":"Which property type is most exposed to economic cycles because of very short lease terms?","o":["Hotels","Offices with 10-year leases","Net-leased retail","Ground leases"],"a":0,"e":"Hotel 'leases' are effectively nightly, so revenue reprices immediately with demand."},{"id":"RA122","t":"RA","r":"3.4.4","k":"c","d":2,"q":"Compared with office buildings, multifamily (apartment) properties generally have:","o":["Shorter leases and lower capital expenditure per tenant","Longer leases and higher tenant improvement costs","Fewer tenants and more concentrated credit risk","Higher capital expenditure per tenant at each renewal"],"a":0,"e":"Apartments have short (often 1-year) leases, many tenants and relatively low re-leasing costs."},{"id":"RA123","t":"RA","r":"3.4.4","k":"c","d":2,"q":"Which structural trend has weighed on demand for office properties?","o":["Remote and hybrid work","Growth of e-commerce logistics","Aging populations in senior housing","Data storage needs"],"a":0,"e":"Hybrid work reduced space demand, increasing office vacancies."},{"id":"RA124","t":"RA","r":"3.4.5","k":"n","d":1,"q":"A property is purchased for $20 million with a $13 million loan. What is the loan-to-value ratio?","o":["65%","35%","154%","13%"],"a":0,"e":"LTV = 13 / 20 = 65%."},{"id":"RA125","t":"RA","r":"3.4.5","k":"n","d":2,"q":"An unlevered property returns 8%. It is financed 60% with debt at 5%. Ignoring taxes and fees, what is the levered equity return?","o":["12.5%","8.0%","9.8%","15.0%"],"a":0,"e":"r_E = r_A + (D/E)(r_A − r_D) = 8% + 1.5 × 3% = 12.5%."},{"id":"RA126","t":"RA","r":"3.4.5","k":"n","d":3,"q":"Using the previous structure (60% LTV at 5%), what levered equity return results if the unlevered return falls to 2%?","o":["−2.5%","2.0%","0.5%","−5.0%"],"a":0,"e":"r_E = 2% + 1.5 × (2% − 5%) = 2% − 4.5% = −2.5%. Leverage magnifies losses."},{"id":"RA127","t":"RA","r":"3.4.6","k":"c","d":2,"q":"In a gross lease, operating expenses are generally paid by:","o":["The landlord","The tenant","The lender","The government"],"a":0,"e":"Under a gross lease the landlord pays operating expenses; under a net lease the tenant does."},{"id":"RA128","t":"RA","r":"3.4.6","k":"n","d":2,"q":"A property has NOI of $2.4 million and annual debt service of $1.6 million. What is the DSCR?","o":["1.50x","0.67x","1.20x","2.40x"],"a":0,"e":"DSCR = 2.4 / 1.6 = 1.50x."},{"id":"RA129","t":"RA","r":"3.4.6","k":"n","d":3,"q":"A lender requires a minimum debt yield of 10%. NOI is $3 million. What is the maximum loan size?","o":["$30 million","$3 million","$10 million","$33 million"],"a":0,"e":"Debt yield = NOI / Loan → Loan = 3 / 0.10 = $30 million."},{"id":"RA130","t":"RA","r":"3.5.1","k":"c","d":2,"q":"Commercial mortgages that require only interest payments until a balloon payment at maturity:","o":["Create refinancing risk at maturity","Fully amortize the principal","Have no default risk","Are prohibited for commercial property"],"a":0,"e":"Interest-only loans leave the full principal due at maturity, creating refinancing risk."},{"id":"RA131","t":"RA","r":"3.5.1","k":"c","d":2,"q":"A participating mortgage gives the lender:","o":["A share of property income or appreciation in exchange for a lower rate","No interest payments until the property is sold or refinanced","Full ownership of the property if rents fall below a threshold","Unlimited recourse to all of the borrower's other assets"],"a":0,"e":"Participating mortgages share upside with the lender in exchange for a lower contract rate."},{"id":"RA132","t":"RA","r":"3.5.2","k":"c","d":2,"q":"Mezzanine real estate financing is typically secured by:","o":["A pledge of the equity interests in the property-owning entity","A first lien on the property ranking ahead of the senior mortgage","Nothing at all, as mezzanine loans are always unsecured","A guarantee from the government's housing finance agency"],"a":0,"e":"Mezzanine loans are secured by ownership interests, ranking behind the senior mortgage."},{"id":"RA133","t":"RA","r":"3.5.3","k":"c","d":2,"q":"Preferred equity in a real estate capital structure:","o":["Ranks ahead of common equity but behind all debt","Ranks ahead of the senior mortgage","Has no priority over common equity","Is always secured by a first lien on the property"],"a":0,"e":"Preferred equity sits between debt (including mezzanine) and common equity."},{"id":"RA134","t":"RA","r":"3.5.4","k":"c","d":2,"q":"Commercial mortgage-backed securities (CMBS) pool:","o":["Commercial real estate loans and tranche their cash flows","Residential mortgages and pay investors pro rata","Corporate bonds of real estate developers","Credit card receivables of retail tenants"],"a":0,"e":"CMBS securitize commercial mortgages into senior and subordinated tranches."},{"id":"RA135","t":"RA","r":"3.5.4","k":"c","d":2,"q":"In a CMBS
