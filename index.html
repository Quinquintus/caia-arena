":1,"e":"Event strategies collect a premium for bearing event risk; returns resemble short options with negative skewness.","d":1},{"id":"HF018","t":"HF","r":"6.3.2","k":"c","q":"Activist investors typically seek to:","o":["Remain passive shareholders, voting with management on all proposals to avoid conflicts with boards","Influence management and boards (e.g., strategy, capital allocation, governance) to unlock value","Short sell the company's bonds while holding its equity, profiting from widening credit spreads","Invest only in private companies, where they can gain full control without engaging boards"],"a":1,"e":"Activists take significant stakes and push for changes such as board seats, buybacks, divestitures or governance reforms.","d":1},{"id":"HF019","t":"HF","r":"6.3.3","k":"c","q":"Which is a common goal of shareholder activism?","o":["Increasing executive pay unconditionally to retain management, regardless of performance","Returning excess cash, improving governance, or a divestiture or sale","Delisting the company to reduce disclosure, even if it lowers value for minority shareholders","Increasing leverage as much as possible, regardless of the effect on the company's credit risk"],"a":1,"e":"Activist demands often include capital returns, cost reductions, board changes, spinoffs or sale of the company.","d":1},{"id":"HF020","t":"HF","r":"6.3.4","k":"n","q":"In an all-cash deal, an acquirer offers $50 per share for a target that trades at $48 after the announcement. What is the gross merger arbitrage spread (return if the deal closes)?","o":["2.00%","4.00%","4.17%","4.35%"],"a":2,"e":"Spread = (50 − 48) / 48 = 4.17%. The arbitrageur bears the risk that the deal fails and the target falls.","d":2},{"id":"HF021","t":"HF","r":"6.3.4","k":"c","q":"In a stock-for-stock merger, a typical merger arbitrage position is:","o":["Long the acquirer and short the target in proportion to the exchange ratio","Long the target and short the acquirer in proportion to the exchange ratio","Long both the target and the acquirer, to benefit from expected synergies after the merger","Short both the target and the acquirer, expecting both stocks to fall when the deal closes"],"a":1,"e":"The arbitrageur buys the target and shorts the acquirer per the exchange ratio, locking in the spread and hedging the acquirer's price risk.","d":1},{"id":"HF022","t":"HF","r":"6.3.4","k":"c","q":"The largest risk in merger arbitrage is typically:","o":["Interest rate risk: rising rates reduce the present value of the deal consideration","Deal (event) risk: the merger fails or terms change","Currency risk: exchange rate moves change the value of the consideration in cross-border deals","Inflation risk: higher inflation erodes the real value of the fixed cash offer price"],"a":1,"e":"If a deal breaks, the target usually falls sharply, producing large losses relative to the small spread, hence negative skewness.","d":1},{"id":"HF023","t":"HF","r":"6.3.5","k":"c","q":"Distressed securities funds tend to have returns that are:","o":["Highly liquid and low risk, since distressed securities trade on major exchanges in large volumes","Exposed to credit and liquidity risk, with performance tied to the credit cycle","Largely uncorrelated with the economy, because bankruptcy outcomes depend only on court decisions","Negatively correlated with high-yield bonds, as distressed debt rallies when credit spreads widen"],"a":1,"e":"Distressed investing earns compensation for illiquidity, complexity and credit risk; returns are cyclical and suffer in credit crises.","d":1},{"id":"HF024","t":"HF","r":"6.3.6","k":"c","q":"Event-driven multistrategy funds:","o":["Invest only in merger arbitrage, holding long positions in targets and short positions in acquirers","Combine several event strategies (merger arb, distressed, activism, special situations) and allocate dynamically among them","Avoid all corporate events, trading only index futures to keep market exposure close to zero","Are always market neutral, with zero beta and no exposure to credit or equity markets"],"a":1,"e":"They diversify across event types and shift capital toward the most attractive opportunities as the cycle evolves.","d":1},{"id":"HF025","t":"HF","r":"6.4.1","k":"c","q":"Why do relative value hedge funds typically use substantial leverage?","o":["Because their spreads are typically large, so leverage further increases already high returns","Because the return from convergence trades is typically small, so leverage is needed to reach acceptable returns","Because leverage increases market beta, which is the main source of relative value returns","Because regulation requires relative value funds to hold leveraged positions in government bonds"],"a":1,"e":"Convergence returns are small, so leverage amplifies them, exposing funds to forced deleveraging in crises when spreads widen.","d":1},{"id":"HF026","t":"HF","r":"6.4.2","k":"c","q":"A classic convertible bond arbitrage position consists of:","o":["Short the convertible bond and long the underlying stock in a delta-hedged ratio","Long the convertible bond and short the underlying stock in a delta-hedged ratio","Long the underlying stock only, using the convertible as collateral for margin borrowing","Long a put option on the issuer's stock and short the issuer's straight bonds"],"a":1,"e":"Convertible arbitrageurs buy cheap convertibles and short the stock (delta hedge), profiting from undervaluation, volatility (gamma) and carry.","d":1},{"id":"HF027","t":"HF","r":"6.4.2","k":"n","q":"A convertible bond can be converted into 20 shares. The stock trades at $40. What is the conversion value?","o":["$40","$500","$800","$1,000"],"a":2,"e":"Conversion value = conversion ratio × stock price = 20 × $40 = $800.","d":2},{"id":"HF028","t":"HF","r":"6.4.3","k":"n","q":"A convertible bond converts into 20 shares and has a delta of 0.6. How many shares should a convertible arbitrageur short per bond to be delta neutral?","o":["6","12","20","33"],"a":1,"e":"Shares to short = delta × conversion ratio = 0.6 × 20 = 12 shares.","d":2},{"id":"HF029","t":"HF","r":"6.4.3","k":"c","q":"Which is a major source of return for a delta-hedged long convertible position?","o":["Short volatility: the position gains when the stock is stable and loses when it moves sharply","Long gamma: rebalancing the hedge gains from large stock moves, plus carry from coupon and short rebate","Short interest rate exposure: the position gains mainly when government bond yields rise","Dividends received on the shorted stock, which are paid to the arbitrageur by the stock lender"],"a":1,"e":"Long convertible + short stock is long gamma/volatility: rehedging after moves locks in gains. Carry comes from the coupon and interest on short proceeds, less dividends on the shorted stock.","d":1},{"id":"HF030","t":"HF","r":"6.4.4","k":"c","q":"Volatility arbitrage strategies generally attempt to profit from:","o":["Directional moves in stock prices, buying calls before rallies and puts before declines","Gaps between implied and expected realized volatility, or relative volatility mispricing","Dividend capture, buying stocks just before ex-dividend dates and selling them just after","Changes in credit spreads only, trading CDS on companies whose ratings are expected to change"],"a":1,"e":"Volatility arbitrageurs trade the spread between implied and realized volatility, often delta-hedging options so that the position is mainly a bet on volatility.","d":1},{"id":"HF031","t":"HF","r":"6.4.5","k":"c","q":"Selling options and delta hedging has historically tended to earn a positive return because:","o":["Realized volatility has usually exceeded the implied volatility priced into options","Implied volatility has tended to exceed subsequently realized volatility (volatility risk premium)","Options are always underpriced by the market, so option sellers receive an excess premium","Delta hedging is free of transaction costs, so the hedged option seller bears no risk"],"a":1,"e":"Option sellers earn the volatility risk premium on average, but face large losses when volatility spikes, giving negatively skewed returns.","d":2},{"id":"HF032","t":"HF","r":"6.4.5","k":"c","q":"A variance swap pays the holder of the long position:","o":["The difference between realized variance and the strike variance, times a notional","A fixed coupon set at inception, regardless of how volatile the underlying asset turns out to be","The dividend yield of the underlying asset over the life of the swap, times a notional","A payment only if the underlying stock falls below the strike level at maturity"],"a":0,"e":"A long variance swap pays (realized variance − strike variance) × variance notional, providing pure exposure to realized volatility.","d":1},{"id":"HF033","t":"HF","r":"6.4.6","k":"c","q":"Fixed-income arbitrage trades often involve:","o":["Directional bets on equity indices using futures, with little exposure to interest rates","Leveraged bets on small mispricings between related instruments, e.g. on-the-run vs off-the-run Treasuries","Buying physical gold and shorting gold mining equities to capture the commodity basis","Investing in early-stage startups through convertible notes issued by venture capital funds"],"a":1,"e":"Examples include on-the-run/off-the-run trades, yield curve trades, swap spread trades and basis trades, generally leveraged convergence bets.","d":1},{"id":"HF034","t":"HF","r":"6.4.6","k":"c","q":"In an on-the-run versus off-the-run Treasury trade, the arbitrageur typically:","o":["Buys the more expensive on-the-run bond and shorts the cheaper off-the-run bond, expecting the spread to widen","Buys the cheaper off-the-run bond and shorts the more expensive on-the-run bond, expecting the liquidity premium to converge","Buys both bonds outright, expecting yields on all Treasuries to fall over the holding period","Shorts both bonds, expecting a rise in Treasury yields after the next auction"],"a":1,"e":"On-the-run bonds are more liquid and trade at a premium; the trade bets that the spread narrows as the on-the-run issue ages.","d":1},{"id":"HF035","t":"HF","r":"6.4.7","k":"c","q":"What is a major risk for relative value funds during market crises?","o":["Spreads tend to narrow quickly in crises, so convergence trades realize their profits early","Liquidity shocks and widening spreads can force deleveraging and large losses","Volatility usually falls in crises, reducing the hedging costs of relative value positions","Funds accumulate excess cash in crises because lenders increase the leverage available to them"],"a":1,"e":"When liquidity dries up, spreads can widen sharply and lenders cut leverage, forcing sales at the worst time (e.g., LTCM in 1998).","d":1},{"id":"HF036","t":"HF","r":"6.5.1","k":"c","q":"What do equity hedge fund strategies have in common?","o":["They hold only long positions in equities and rely on cash to reduce market exposure","They take long and short positions primarily in equities, with varying net exposures","They never use leverage and always keep net market exposure at exactly zero","They invest primarily in fixed income and use equities only for hedging purposes"],"a":1,"e":"Equity hedge strategies (short bias, long/short, market neutral) are distinguished largely by their net market exposure and use of short selling.","d":1},{"id":"HF037","t":"HF","r":"6.5.2","k":"c","q":"The return of an equity long/short fund can be decomposed into:","o":["Only market beta, since stock selection effects cancel out between long and short positions","A beta component from net market exposure plus alpha from stock selection on longs and shorts","Only interest income earned on the cash proceeds from short sales","Only dividends received on long positions minus dividends paid on short positions"],"a":1,"e":"Long/short funds earn returns from net market exposure (beta) and from security selection (alpha), plus interest on short proceeds.","d":1},{"id":"HF038","t":"HF","r":"6.5.3","k":"c","q":"Which is an example of a well-documented equity market anomaly exploited by hedge funds?","o":["The risk-free rate earned on cash collateral held against short positions","Momentum, value, or post-earnings-announcement drift","Put-call parity between listed options and the underlying stock","The time value of money reflected in discounting future cash flows"],"a":1,"e":"Anomalies such as value, momentum, size, accruals and post-earnings-announcement drift have been documented and used by quantitative equity managers.","d":2},{"id":"HF039","t":"HF","r":"6.5.4","k":"c","q":"A key challenge when implementing anomaly-based strategies is that:","o":["Anomalies never persist beyond a few days, so they can only be traded at high frequency","Returns may decline after publication and trading costs, crowding and shorting constraints can erode profits","Anomaly strategies require no data or models, so many managers can implement them cheaply","Anomaly strategies are risk-free once published, since their returns are fully explained by beta"],"a":1,"e":"Published anomalies often weaken as capital arrives; costs, capacity and short-sale constraints further reduce implementable returns.","d":1},{"id":"HF040","t":"HF","r":"6.5.5","k":"c","q":"Why might equity hedge funds short stocks in addition to hedging market exposure?","o":["To increase the fund's beta and leverage its exposure to rising equity markets","To express negative views on overvalued companies and earn alpha from identifying losers","Because short positions offer unlimited upside while their potential losses are capped","To avoid paying borrowing costs, since short sellers receive interest from stock lenders"],"a":1,"e":"Shorts serve both as hedges and as alpha sources by targeting overvalued firms, accounting problems or deteriorating fundamentals.","d":1},{"id":"HF041","t":"HF","r":"6.5.6","k":"c","q":"Which are the three major types of equity hedge funds discussed in the curriculum?","o":["Short-bias, equity long/short, and equity market neutral","Merger arbitrage, activist, distressed","Global macro, CTA, volatility","Convertible, fixed income, volatility arbitrage"],"a":0,"e":"The three equity strategies are short-bias funds, equity long/short funds and equity market-neutral funds, framed in the CAPM context.","d":1},{"id":"HF042","t":"HF","r":"6.5.6","k":"c","q":"An equity market-neutral fund that targets 'beta neutrality' aims to:","o":["Hold equal dollar amounts long and short regardless of the betas of the positions","Set the portfolio's overall beta to approximately zero so returns are independent of market moves","Maintain a beta of about one so that the fund tracks the market with lower volatility","Avoid any short selling, using only cash to reduce the portfolio's market exposure"],"a":1,"e":"Market-neutral funds aim for zero beta (and sometimes dollar, sector or factor neutrality) so that performance comes from stock selection.","d":1},{"id":"HF043","t":"HF","r":"6.5.6","k":"c","q":"Historically, short-bias hedge funds have tended to:","o":["Earn high returns in bull markets, because their long positions are levered several times","Have negative beta, performing well in bear markets but generally poorly over long periods with rising markets","Have zero correlation with equities, since their returns come only from interest on cash","Show positive beta, rising with the market but with lower volatility than long-only funds"],"a":1,"e":"Short-bias funds provide negative equity exposure; they can hedge crashes but have struggled over long periods given the positive equity risk premium.","d":1},{"id":"HF044","t":"HF","r":"6.5.6","k":"c","q":"The 'uptick rule' restricts:","o":["Buying stocks after a price decrease, to prevent investors from accelerating market rebounds","Short selling unless the last price change was an increase (or under certain price decline conditions)","Margin borrowing by investors whose accounts fall below the maintenance requirement","Dividend payments by companies whose share price has fallen for several consecutive days"],"a":1,"e":"Uptick rules limit short selling in falling markets, intended to reduce downward price pressure from short sellers.","d":1},{"id":"HF045","t":"HF","r":"6.5.6","k":"n","q":"A long/short equity fund is long $150 million of stocks with an average beta of 1.2 and short $100 million with an average beta of 1.0, with $100 million of capital. What is the fund's approximate net beta?","o":["0.20","0.50","0.80","1.80"],"a":2,"e":"Beta-weighted exposure = (150 × 1.2 − 100 × 1.0) / 100 = (180 − 100) / 100 = 0.80.","d":2},{"id":"HF046","t":"HF","r":"6.1.6","k":"c","q":"Research on hedge funds' impact on financial markets generally suggests they:","o":["Have no measurable effect on prices, because their trades are too small relative to market volume","Can improve price discovery and liquidity, but can also amplify stress when they deleverage","Always destabilize markets, since their short selling consistently drives prices below fair value","Only trade in private markets, so they have no impact on public price discovery or liquidity"],"a":1,"e":"Hedge funds often provide liquidity and correct mispricing, but crowded trades and forced deleveraging can exacerbate stress.","d":1},{"id":"HF047","t":"HF","r":"6.2.6","k":"c","q":"Which is a core dimension along which managed futures strategies differ?","o":["Data used (price vs fundamental), trading horizon, and degree of systematization","Whether they hold real estate assets directly or through listed REIT shares","Whether they pay dividends to investors or reinvest trading profits in the fund","Their tax status as REITs, MLPs or C corporations under US law"],"a":0,"e":"Strategies differ in data inputs (technical vs fundamental), time horizon (short to long-term), discretionary versus systematic implementation and markets traded.","d":1},{"id":"HF048","t":"HF","r":"6.2.9","k":"c","q":"Empirical evidence on managed futures returns has generally shown:","o":["Very high correlation with equities, so they add little diversification to a stock portfolio","Low correlation with stocks and bonds and relatively strong performance in some extended equity drawdowns","Consistently negative returns after fees in every decade since the 1980s","Returns identical to those of long-only commodity indices such as the S&P GSCI"],"a":1,"e":"Managed futures have historically offered diversification, though returns vary substantially over time and across managers.","d":1},{"id":"HF049","t":"HF","r":"6.1.3","k":"c","q":"Arbitrage-free pricing models are useful to hedge fund managers mainly because they:","o":["They predict the future direction of markets, allowing managers to time their exposure","Identify relative mispricings between related securities that should be eliminated by arbitrage","They guarantee riskless profits regardless of transaction costs, funding or margin constraints","They replace the need for risk management, since arbitrage positions carry no risk"],"a":1,"e":"No-arbitrage relationships (e.g., put-call parity, cost of carry) define relative values; deviations signal trading opportunities, subject to costs and limits to arbitrage.","d":1},{"id":"HF050","t":"HF","r":"6.4.4","k":"c","q":"Implied volatility is:","o":["The historical standard deviation of the underlying asset's returns over the past year","The volatility that, when entered into an option pricing model, gives the observed market price","A volatility level that is always lower than subsequently realized volatility","A single volatility that is constant across all strikes and maturities for a given asset"],"a":1,"e":"Implied volatility is backed out from option prices. It often varies across strikes (skew/smile) and maturities.","d":1},{"id":"HF051","t":"HF","r":"6.1.4","k":"c","q":"Which statement about hedge fund return distributions is generally correct?","o":["They are normally distributed, so standard deviation fully captures their risk","Many show negative skew and excess kurtosis, so standard deviation may understate risk","They always have positive skewness, because managers cut losses quickly","They show no autocorrelation, even for strategies holding illiquid assets"],"a":1,"e":"Strategies like merger arbitrage, credit and relative value often show negative skew and fat tails; illiquid strategies show autocorrelation.","d":1},{"id":"HF052","t":"HF","r":"6.3.5","k":"c","q":"A distressed fund that buys the bonds of a company expected to emerge from Chapter 11 and receive new equity is betting mainly on:","o":["A decline in interest rates that raises the value of all fixed-rate bonds","The outcome of the restructuring and the post-reorganization value of the company","Favorable currency movements that increase the value of foreign-denominated claims","A rally in broad equity indices, independent of the company's restructuring"],"a":1,"e":"Returns depend on the recovery value and the terms of reorganization; the bonds may be converted into equity of the reorganized company.","d":2},{"id":"DA001","t":"DA","r":"7.1.1","k":"c","q":"What is the main property that blockchains provide on a decentralized network?","o":["Centralized control by a trusted operator who can reverse transactions when needed","Trustless immutability, where no single entity can take full control of the system","Guaranteed price stability of the native token through algorithmic monetary policy","Anonymous central banking, where a hidden authority sets interest rates for users"],"a":1,"e":"Blockchains provide trustless immutability on decentralized networks of nodes, so records cannot be altered by a single party.","d":1},{"id":"DA002","t":"DA","r":"7.1.1","k":"c","q":"A permissioned blockchain differs from a public blockchain in that:","o":["Anyone can join, read the ledger and validate transactions without permission","Participation rights are granted or revoked by a central party or consortium","It has no shared ledger, as each participant keeps an independent private database","It cannot run smart contracts, since code execution requires a public network"],"a":1,"e":"Permissioned blockchains restrict participation and are mainly used in enterprise settings where operators require more control.","d":1},{"id":"DA003","t":"DA","r":"7.1.1","k":"c","q":"Bitcoin's Proof of Work consensus mechanism secures the network by requiring miners to:","o":["Lock up tokens as collateral, which can be slashed if they validate invalid blocks","Expend computational effort to find a valid hash for a new block","Obtain approval from a central bank before adding each new block of transactions","Vote on each transaction, with the majority of registered users deciding which block is valid"],"a":1,"e":"In PoW, miners compete to solve a computationally costly hashing puzzle (SHA-256 for Bitcoin); the winner adds the block and earns the reward.","d":2},{"id":"DA004","t":"DA","r":"7.1.2","k":"c","q":"A smart contract is best described as:","o":["A legal contract signed electronically and enforced by courts in the event of a dispute","Self-executing code on a blockchain that runs automatically when predefined conditions are met","A paper contract stored by a bank that holds the assets until both parties perform","A futures contract on a cryptocurrency traded on a regulated derivatives exchange"],"a":1,"e":"Smart contracts are programs deployed on blockchains (e.g., Ethereum) that execute automatically, enabling DeFi applications without intermediaries.","d":1},{"id":"DA005","t":"DA","r":"7.1.3","k":"c","q":"What is the maximum supply of bitcoin?","o":["Unlimited","18 million","21 million","100 million"],"a":2,"e":"Bitcoin's monetary policy fixes total supply at 21 million coins, released gradually through block rewards.","d":1},{"id":"DA006","t":"DA","r":"7.1.3","k":"c","q":"How often does the Bitcoin block reward halve?","o":["Every year, on the anniversary of the Bitcoin network's launch in January","Every 210,000 blocks, approximately every four years","Every 1 million blocks, approximately every nineteen years","Whenever miners vote to reduce issuance by a majority of hash power"],"a":1,"e":"The reward halves every 210,000 blocks (~4 years at ~10 minutes per block): 50 → 25 (2012) → 12.5 (2016) → 6.25 (2020) → 3.125 (2024).","d":1},{"id":"DA007","t":"DA","r":"7.1.4","k":"c","q":"Ether (ETH) is the native token of Ethereum. Tokens such as ERC-20 stablecoins are called 'non-native' because they:","o":["Exist on another blockchain and are bridged to Ethereum only when they are traded","Are deployed as smart contracts, with balances stored in the contract's data","Have no market value, since only native tokens can be used as a medium of exchange","Cannot be transferred between wallets without the approval of the Ethereum Foundation"],"a":1,"e":"Native tokens are built into the protocol (used, e.g., to pay gas). Non-native tokens are created by smart contracts on top of the chain (ERC-20, ERC-721).","d":2},{"id":"DA008","t":"DA","r":"7.1.4","k":"c","q":"ERC-20 and ERC-721 are standards for, respectively:","o":["Non-fungible and fungible tokens","Fungible tokens and non-fungible tokens (NFTs)","Stablecoins and Bitcoin","Mining and staking"],"a":1,"e":"ERC-20 defines fungible tokens (each unit identical); ERC-721 defines non-fungible tokens with unique identifiers.","d":1},{"id":"DA009","t":"DA","r":"7.1.4","k":"c","q":"In Ethereum's Proof of Stake consensus mechanism, blocks are validated by:","o":["Miners who solve computational hash puzzles and earn newly issued ETH as a block reward","Validators who stake ETH as collateral and can be penalized (slashed) for misbehavior","The Ethereum Foundation, which approves each block before it is added to the chain","Bitcoin miners, who validate Ethereum blocks through a cross-chain merged mining agreement"],"a":1,"e":"Ethereum moved from PoW to PoS (2022). Validators stake ETH, propose and attest to blocks, earn rewards, and risk slashing, greatly reducing energy use.","d":1},{"id":"DA010","t":"DA","r":"7.1.4","k":"c","q":"On Ethereum, 'gas' refers to:","o":["A commodity-backed token whose value is pegged to the price of natural gas","The fee, paid in ETH (quoted in gwei), for computation needed to execute transactions","The fixed block reward paid to validators for each new block that they propose","A stablecoin issued by the Ethereum Foundation to pay for network services"],"a":1,"e":"Gas measures computational effort; users pay gas fees in ETH (denominated in gwei) to have transactions processed.","d":1},{"id":"DA011","t":"DA","r":"7.1.5","k":"c","q":"Stablecoins are tokens designed to:","o":["Maximize volatility in order to attract speculative traders to decentralized exchanges","Maintain a stable value, typically pegged to a fiat currency such as the US dollar","Replace all other blockchains by becoming the native token of every network","Pay mining rewards to Bitcoin miners in place of newly issued bitcoins"],"a":1,"e":"Stablecoins peg to assets like the USD, either backed by fiat reserves, by crypto collateral (overcollateralized) or via algorithmic mechanisms.","d":1},{"id":"DA012","t":"DA","r":"7.1.6","k":"c","q":"In DeFi, oracles are used to:","o":["Mine new tokens by solving hash puzzles on behalf of decentralized applications","Bring off-chain data (e.g., asset prices) onto the blockchain for smart contracts","Store users' private keys so that lost wallets can be recovered by the protocol","Replace consensus mechanisms by deciding which blocks are added to the chain"],"a":1,"e":"Smart contracts cannot access external data directly; oracle networks feed off-chain information such as prices on-chain.","d":1},{"id":"DA013","t":"DA","r":"7.1.6","k":"c","q":"In a DeFi lending protocol, a borrower's position that falls below the required collateralization is typically:","o":["Ignored until the loan matures, at which point the borrower must repay in full","Subject to automatic liquidation, similar to a margin call in traditional finance","Converted automatically into a stablecoin so that the borrower's position becomes riskless","Guaranteed by a central bank, which posts additional collateral on the borrower's behalf"],"a":1,"e":"DeFi loans are overcollateralized; if collateral value falls below a threshold, the position is liquidated by the protocol.","d":2},{"id":"DA014","t":"DA","r":"7.2.1","k":"c","q":"Which feature of bitcoin has historically made it potentially attractive for diversified institutional portfolios?","o":["Low volatility and stable returns comparable to those of investment-grade bonds","High returns (with high risk) combined with low correlation to public equities historically","A guaranteed income stream from staking rewards paid by the Bitcoin protocol","Government backing that protects holders against losses in market crises"],"a":1,"e":"Bitcoin has historically delivered high but volatile returns with low correlation to equities, though correlations can rise in stress periods.","d":2},{"id":"DA015","t":"DA","r":"7.2.2","k":"c","q":"According to the analysis discussed in the curriculum, what crypto allocation could help maximize risk-adjusted returns for an investor otherwise holding a balanced stock/bond portfolio?","o":["About 0.1%","About 5%","About 25%","About 50%"],"a":1,"e":"The analysis suggests an allocation of roughly 5% could help maximize risk-adjusted returns, while also increasing total portfolio risk.","d":2},{"id":"DA016","t":"DA","r":"7.2.2","k":"c","q":"A Monte Carlo approach to modeling a bitcoin allocation within a 60/40 portfolio involves:","o":["Using a single historical scenario, such as the 2020–2021 period, to project returns","Simulating many return paths from assumed distributions to see the range of outcomes","Ignoring volatility and focusing only on average historical returns of bitcoin","Assuming bitcoin returns are constant each year and equal to their historical mean"],"a":1,"e":"Monte Carlo simulation generates many randomized scenarios to evaluate the distribution of outcomes (returns, drawdowns) for different allocations.","d":2},{"id":"DA017","t":"DA","r":"7.2.3","k":"c","q":"Which is a key risk specific to digital asset investing?","o":["An absence of volatility, which makes digital assets unsuitable as diversifiers","Custody risk (loss or theft of private keys), smart contract bugs, and regulatory uncertainty","Government deposit insurance, which removes the incentive to monitor custodians","Low technology risk, since blockchain software cannot contain coding errors"],"a":1,"e":"Digital asset investors face custody/key management risk, hacks and smart contract vulnerabilities, regulatory changes, high volatility and market integrity concerns.","d":1},{"id":"DA018","t":"DA","r":"7.2.3","k":"c","q":"Why is safekeeping of private keys critical in digital assets?","o":["Private keys can be reset by the blockchain if the owner proves their identity to the network","Whoever controls the private key controls the assets, and lost or stolen keys usually cannot be recovered","Private keys are publicly visible on the blockchain, so safekeeping them is not necessary","Banks hold all private keys on behalf of users and reimburse any assets that are stolen"],"a":1,"e":"Control of the private key equals control of the asset. Institutional investors therefore use qualified custodians, multi-signature or MPC solutions.","d":1},{"id":"ETH033","t":"ETH","r":"1.1.1","k":"c","d":1,"q":"In the curriculum, who is the 'principal' in the investment value chain?","o":["The asset manager who makes investment decisions","The end saver or beneficiary who owns the money","The regulator that supervises market participants","The consultant who advises on manager selection"],"a":1,"e":"The principal is the ultimate owner of the savings; agents (managers, consultants, brokers) act on the principal's behalf."},{"id":"ETH034","t":"ETH","r":"1.1.1","k":"c","d":2,"q":"Why does a longer investment value chain tend to increase the risk of conflicts of interest?","o":["Because each additional agent may pursue its own interests, multiplying principal–agent problems","Because regulators stop supervising chains with more than three links, leaving later agents unmonitored","Because fees fall as chains lengthen, reducing agents' incentives to act","Because principals gain more direct control over each agent in the chain"],"a":0,"e":"Each layer of agents adds potential misalignment between the agent's incentives and the principal's interests."},{"id":"ETH035","t":"ETH","r":"1.1.1","k":"c","d":2,"q":"Which of the following is NOT one of the purposes of the investment industry described in the curriculum?","o":["Allocating capital from savers to productive uses","Managing wealth and risk for savers","Contributing to the wealth and well-being of society","Maximizing trading volume on exchanges"],"a":3,"e":"The industry's purposes are capital allocation, wealth and risk management, and contributing to society's wealth and well-being. Trading volume is not a purpose."},{"id":"ETH036","t":"ETH","r":"1.1.1","k":"c","d":3,"q":"The curriculum notes that in developed markets, buybacks and cash acquisitions often exceed money raised through IPOs. What does this suggest?","o":["Public equity markets allocate more new capital today than at any time before","Pure capital allocation through public equity markets is smaller than commonly assumed","IPOs have been banned in most developed markets since the global crisis","Share buybacks are illegal in most developed markets and rarely occur"],"a":1,"e":"Net equity issuance is often negative, so the industry's 'capital allocation' role via public markets is weaker than often believed."},{"id":"ETH037","t":"ETH","r":"1.1.2","k":"c","d":1,"q":"Stewardship, as discussed in the curriculum, refers to:","o":["Replicating an index passively at the lowest possible cost with no engagement","Investors acting as responsible owners, engaging with companies and voting to protect long-term value","Outsourcing all voting decisions to proxy advisers to avoid conflicts of interest","Holding only government bonds to avoid exposure to corporate governance issues"],"a":1,"e":"Stewardship is the responsible allocation, management and oversight of capital, including engagement and voting."},{"id":"ETH038","t":"ETH","r":"1.1.2","k":"c","d":2,"q":"The 'triple bottom line' evaluates performance along which three dimensions?","o":["Return, risk and liquidity","Economic, social and environmental","Alpha, beta and gamma","Revenue, cost and tax"],"a":1,"e":"The triple bottom line measures economic, social and environmental outcomes, often summarized as profit, people and planet."},{"id":"ETH039","t":"ETH","r":"1.1.3","k":"c","d":2,"q":"Which US law, enacted in 1974, governs fiduciary standards for most private pension plans?","o":["Dodd-Frank Act","ERISA","Sarbanes-Oxley Act","Investment Company Act of 1940"],"a":1,"e":"The Employee Retirement Income Security Act (ERISA) sets fiduciary standards for US private pension plans."},{"id":"ETH040","t":"ETH","r":"1.1.3","k":"c","d":2,"q":"According to the curriculum, fiduciary duty should be interpreted primarily through:","o":["A single global legal definition applied uniformly by all regulators","Accepted investment theory and the practices of peers, recognizing it evolves over time","The investment manager's own preferences and personal values","Short-term performance rankings relative to the fund's peers"],"a":1,"e":"Because there is no objective definition, practice follows accepted theory and peer practice, and interpretation changes over time."},{"id":"ETH041","t":"ETH","r":"1.1.3","k":"c","d":3,"q":"How has recent legal opinion addressed sustainability within fiduciary duty?","o":["Sustainability considerations are always prohibited because they reduce returns for beneficiaries","Sustainability impact may be pursued when it is instrumental to financial outcomes, and in some views as a goal in its own right","Fiduciaries must ignore ESG data entirely and focus only on short-term financial performance, as courts have ruled","Only government-owned funds may consider sustainability, and only when beneficiaries vote for it"],"a":1,"e":"The curriculum notes opinions allowing sustainability factors when they serve financial outcomes, and debate over pursuing impact as an objective."},{"id":"ETH042","t":"ETH","r":"1.1.3","k":"c","d":1,"q":"In the curriculum, professionalism is described as the combination of:","o":["A mindset and a skill set","Licenses and fees","Regulation and enforcement","Performance and marketing"],"a":0,"e":"Professionalism combines a values-driven mindset with the skills needed to deliver on obligations to clients."},{"id":"ETH043","t":"ETH","r":"1.1.3","k":"c","d":2,"q":"Which of the following belongs to the professional skill set described in the curriculum?","o":["Maximizing assets under management to spread fixed costs","Being diligent, competent and objective, and judging risks holistically","Avoiding all investment risk regardless of client objectives","Delegating every decision to consultants and committees"],"a":1,"e":"The skill set includes best practice standards, continuous learning, diligence, competence, objectivity and holistic risk judgment."},{"id":"ETH044","t":"ETH","r":"1.1.3","k":"c","d":2,"q":"The 'social license compact' refers to:","o":["A contract between an asset manager and a single client","Society granting privileges to a profession in exchange for responsible behavior","A regulatory licensing exam that all new industry entrants must pass before advising clients","An agreement among competitors to fix management fees"],"a":1,"e":"Society grants the profession privileges and trust; in return the profession commits to responsible conduct, supporting its license to operate."},{"id":"ETH045","t":"ETH","r":"1.1.3","k":"c","d":2,"q":"Who primarily shapes an organization's culture according to the curriculum?","o":["Regulators, through rules and inspections","Its leaders, through shared values and behaviors","External auditors, through annual reviews","Clients, through their mandates and fees"],"a":1,"e":"Culture is a collective influence on how a group thinks and acts, grounded in shared values and largely set by leadership."},{"id":"ETH046","t":"ETH","r":"1.1.4","k":"c","d":2,"q":"Which of the following is one of the three categories in which the 'right' choice may not be obvious?","o":["Choosing office locations that are convenient for employees","Trading off benefits and costs that fall on different stakeholders","Selecting the font and layout used in client reports","Picking a fund name that appeals to retail investors"],"a":1,"e":"The three categories are conflicts of interest, trading off benefits and costs among stakeholders, and insufficient knowledge of the client."},{"id":"ETH047","t":"ETH","r":"1.1.4","k":"c","d":2,"q":"In the curriculum's description of industry states, an industry that benefits itself in the short term but not society is called:","o":["A professional industry","A misaligned industry","An unnecessary industry","A regulated industry"],"a":1,"e":"A misaligned industry captures value for itself without delivering for society; clients lose trust and move to passive, low-cost products."},{"id":"ETH048","t":"ETH","r":"1.1.4","k":"c","d":3,"q":"What does the curriculum predict for an 'unnecessary' investment industry?","o":["Rapid growth in active management fees as clients seek returns","Costs pushed down by technology, but without the trust needed to finance long-term projects","Higher net returns for all clients thanks to lower trading costs","More regulation-free innovation as supervisors step back and let technology firms lead"],"a":1,"e":"In an unnecessary industry, technology lowers costs but the industry lacks the trust to support long-term capital formation."},{"id":"ETH049","t":"ETH","r":"1.1.4","k":"c","d":2,"q":"A professional industry that puts clients first is expected to charge fees that are:","o":["As high as the market will bear","Fair and reflect the value delivered","Zero","Fixed by regulation"],"a":1,"e":"Fair fees aligned with delivered value are a hallmark of a client-first, trusted profession."},{"id":"ETH050","t":"ETH","r":"1.2.1","k":"c","d":1,"q":"With which organization did CAIA develop the CAIA Ethical Principles?","o":["The SEC","The Thinking Ahead Institute","The IMF","The Financial Stability Board"],"a":1,"e":"The principles were developed with the Thinking Ahead Institute."},{"id":"ETH051","t":"ETH","r":"1.2.1","k":"c","d":2,"q":"Principle 1, Ethical and Professional Behavior, states that firms should place clients first, but not at the expense of:","o":["Shareholders' dividends","Other stakeholders","Employee bonuses","Market share"],"a":1,"e":"Principle 1 emphasizes a public responsibility: putting clients first should not come at the expense of other stakeholders."},{"id":"ETH052","t":"ETH","r":"1.2.1","k":"c","d":2,"q":"Which principle calls for clear, timely, accurate and authentic communication with all stakeholders?","o":["Principle 2: Partnership (know your client and align interests and values)","Principle 4: High Standards of Conduct (transparency, integrity and accountability)","Principle 7: Continued Learning (growth mindset)","Principle 8: Collaboration (support the ecosystem)"],"a":1,"e":"Principle 4 centers on transparency, integrity and accountability in communications."},{"id":"ETH053","t":"ETH","r":"1.2.1","k":"c","d":2,"q":"Which principle emphasizes precise, evidence-based skills consistent with best practice?","o":["Principle 5: High Standards of Practice","Principle 1: Ethical and Professional Behavior","Principle 3: Client-First Mindset","Principle 2: Partnership"],"a":0,"e":"Principle 5 covers standards of practice: evidence-based skills and competencies aligned with best practice."},{"id":"ETH054","t":"ETH","r":"1.2.1","k":"c","d":2,"q":"Which principle covers the quality of research and due diligence and a holistic understanding of risk?","o":["Principle 6: Professional Work","Principle 8: Collaboration","Principle 2: Partnership","Principle 4: High Standards of Conduct"],"a":0,"e":"Principle 6 (Professional Work) addresses research and due diligence quality and a holistic view of risk."},{"id":"ETH055","t":"ETH","r":"1.2.2","k":"c","d":2,"q":"In the curriculum's definitions, 'values' and 'ethics' differ in that:","o":["Values are collective standards; ethics are individual beliefs","Values are individual beliefs motivating action; ethics are a collective definition of right and wrong","They are identical terms used interchangeably by practitioners","Ethics are set only by law, while values are set by employers through internal codes of conduct"],"a":1,"e":"Values are personal beliefs; ethics represent a shared, collective standard of right and wrong."},{"id":"ETH056","t":"ETH","r":"1.2.2","k":"c","d":2,"q":"Why does the curriculum argue that regulatory compliance alone is insufficient to earn trust?","o":["Regulation is always outdated, so firms can ignore it","Trust requires a culture of integrity that goes beyond legal minimums","Compliance is optional for professional investors who serve institutions","Regulators themselves cannot be trusted by clients"],"a":1,"e":"Rules set minimum standards; trust is earned through a culture of integrity and professional conduct beyond the law."},{"id":"ETH057","t":"ETH","r":"1.2.2","k":"c","d":3,"q":"In the organizational value chain, strategy flows from four models connected by a system model. To which model is professionalism most directly linked?","o":["Business model","Investment model","People model","Change model"],"a":2,"e":"Professionalism connects most directly to the people model (culture, incentives, behaviors)."},{"id":"ETH058","t":"ETH","r":"1.2.2","k":"c","d":2,"q":"Why is professionalism especially important in investment management according to the curriculum?","o":["Clients depend on a provider, in a risky domain, over a long period","Investment products are physically dangerous to clients","Investment managers are always licensed by the state","Fees in the industry are fixed by regulators"],"a":0,"e":"Dependence, risk and long duration make trust and professionalism crucial in client relationships."},{"id":"ETH059","t":"ETH","r":"1.2.2","k":"c","d":2,"q":"Which feature is NOT listed as a characteristic of a profession in the curriculum?","o":["Credentials","An accepted body of knowledge","Ongoing education and sanctions","Guaranteed investment returns"],"a":3,"e":"Professions have credentials, a body of knowledge, fair practices, continuing education, sanctions and public accountability, not guaranteed outcomes."},{"id":"ETH060","t":"ETH","r":"1.2.2","k":"c","d":3,"q":"According to the trust model, how is value measured from the saver's perspective?","o":["By absolute returns only","By outcomes relative to expectations","By the provider's brand","By the number of products used"],"a":1,"e":"Savers judge value by comparing outcomes with their expectations, which is why setting realistic expectations matters."},{"id":"ETH061","t":"ETH","r":"1.2.2","k":"c","d":2,"q":"According to the curriculum's trust model, what is the role of technology in building trust?","o":["Technology alone can build full trust without personal contact","Technology helps but usually needs to be complemented by a personal touch","Technology always destroys trust between clients and providers","Technology is irrelevant to building trust with savers"],"a":1,"e":"Technology supports trust-building, but personal interaction usually remains necessary."},{"id":"ETH062","t":"ETH","r":"1.2.2","k":"c","d":3,"q":"A conflict of interest that has both positive and negative effects for a client should, according to the curriculum, be assessed by:","o":["Ignoring the positive effects and treating it as purely harmful","Weighing the net effect on the client and managing it with transparency","Automatically terminating the relationship with the client","Reporting it to the regulator without informing the client"],"a":1,"e":"Some conflicts have mixed effects; professionals assess the net impact and manage it through process and disclosure."},{"id":"ETH063","t":"ETH","r":"1.2.3","k":"a","d":2,"q":"A junior analyst notices a colleague manipulating performance data. Under Principle 1, what should the analyst do?","o":["Ignore it to avoid conflict with a senior colleague and protect the team's reputation","Voice concerns through appropriate channels such as managers, compliance or whistleblowing procedures","Confront the client directly and disclose the colleague's actions without checking facts","Copy the colleague's method so that the team's reported figures remain consistent"],"a":1,"e":"Principle 1 includes 'voice concerns': raising issues with colleagues, managers, compliance or through whistleblowing."},{"id":"ETH064","t":"ETH","r":"1.2.3","k":"a","d":2,"q":"A firm's values conflict sharply with a prospective client's demand to invest in a way the firm considers unethical. Under Principle 2, the most appropriate response is to:","o":["Accept the mandate to keep the revenue and the client relationship","Not act against its values and allow the client to seek another provider","Pretend to comply while managing the portfolio differently in practice","Accept the mandate but charge a higher fee to compensate for the risk"],"a":1,"e":"If alignment of interests and values is impossible, the professional should not compromise its values and may let the client go elsewhere."},{"id":"ETH065","t":"ETH","r":"1.2.3","k":"a","d":2,"q":"A manager runs two products whose investment opportunities overlap. Which component of Principle 3 is most relevant?","o":["Manage conflicts within multiple products through process and transparency","Embrace adjacent learning in related investment disciplines","Seek professional accreditation for each product's managers","Support the professional community through volunteering"],"a":0,"e":"Principle 3 includes managing conflicts across multiple products and clients through fair allocation processes and transparency."},{"id":"ETH066","t":"ETH","r":"1.2.3","k":"a","d":2,"q":"A firm's fee disclosure omits performance-related expenses charged to the fund. Which principle is breached?","o":["Principle 4: disclose costs","Principle 7: continued learning","Principle 8: collaboration","Principle 5: adaptability"],"a":0,"e":"Principle 4 requires fees to be fair relative to value and fully disclosed."},{"id":"ETH067","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Under Principle 5, what should a professional do when facing an ethical dilemma?","o":["Decide quickly on instinct so the issue does not delay the business","Use a structured ethical framework: gather facts and context, consult others, then reflect on the outcome","Wait for regulators to publish guidance before taking any action","Follow whatever the majority of competitors are currently doing to stay aligned with market practice"],"a":1,"e":"Operating under an ethical framework means following a structured process rather than ad hoc decisions."},{"id":"ETH068","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Which statement about soft skills is consistent with Principle 5?","o":["Only technical skills matter for professional standards","Competencies include soft skills such as leadership and communication","Soft skills are covered only by Principle 8 on collaboration","Soft skills should be outsourced to external consultants"],"a":1,"e":"Defining competencies and the body of knowledge includes soft skills like leadership."},{"id":"ETH069","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Under Principle 6, a professional presenting a model's forecast should:","o":["Present it with full certainty so clients feel reassured","Document assumptions, qualify uncertainties and disclose limitations and risks","Hide the model's methodology to protect intellectual property","Use only historical averages, which need no assumptions"],"a":1,"e":"Showing professional work means documenting assumptions, qualifying uncertainty and disclosing limitations."},{"id":"ETH070","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"During a market crisis, Principle 6 asks professionals to:","o":["Respond with calm, proportionate and diligent action","Liquidate all positions immediately","Stop communicating with clients until markets calm down","Increase leverage to recover losses"],"a":0,"e":"Behaving with diligence and professionalism under stress means measured, proportionate responses."},{"id":"ETH071","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"The growth mindset cycle described under Principle 7 is:","o":["Plan, execute, celebrate, repeat","Self-assess, fill gaps, practice, reflect","Hire, train, promote, retain","Research, trade, report, review"],"a":1,"e":"Applying growth mindset principles follows a cycle of self-assessment, filling gaps, practicing and reflecting."},{"id":"ETH072","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Which component of Principle 8 addresses the risk of free riding in the profession?","o":["Support the professional community (e.g., volunteering and mentoring)","Disclose errors promptly to clients and colleagues","Know your client through deep discovery of needs and wants","Comply with local laws and regulations in all markets"],"a":0,"e":"Supporting the professional community counters free riding, which would weaken the profession."},{"id":"ETH073","t":"ETH","r":"1.2.3","k":"c","d":3,"q":"Seeking peer review of one's ethics code, under Principle 8, mainly helps to:","o":["Reduce agency conflicts by exposing blind spots to outside scrutiny","Lower audit fees by sharing the work with other firms","Increase the firm's marketing reach among prospects","Avoid regulation by showing self-governance to supervisors"],"a":0,"e":"Peer review of the ethics code helps counter agency conflicts and blind spots by inviting external challenge."},{"id":"ETH074","t":"ETH","r":"1.2.3","k":"c","d":3,"q":"Advocating for effective regulation that benefits the investment ecosystem falls under which principle?","o":["Principle 8: Collaboration (support the investment ecosystem)","Principle 3: Client-First Mindset (support governance)","Principle 6: Professional Work (quality of research)","Principle 2: Partnership (co-creation with clients)"],"a":0,"e":"Supporting the investment ecosystem, including advocating for effective regulation, is part of Collaboration."},{"id":"ETH075","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Which is a disadvantage of a purely rules-based approach to ethics?","o":["Rules are easy to enforce and apply consistently across firms","Rules can quickly become outdated and cannot anticipate every situation","Rules give clarity about what is and is not permitted","Rules are applied consistently to all market participants"],"a":1,"e":"Rules provide clarity and consistency but become outdated and miss novel situations, so judgment-based principles are needed."},{"id":"ETH076","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"In the MF Global case, what governance failure occurred around risk management?","o":["The board hired too many risk officers, creating conflicting views on exposures","The CEO overrode and eventually replaced the chief risk officer who warned about sovereign debt exposure","Risk limits were set by regulators rather than by the firm's own risk function","The firm operated without a CEO for most of the period before its collapse, so no one could approve risk limits"],"a":1,"e":"The CEO (also chairman) dismissed the CRO's warnings and replaced him, removing checks on the risky positions."},{"id":"ETH077","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"Approximately how large was the shortfall in MF Global customer funds after its collapse?","o":["About $16 million","About $1.6 billion","About $160 billion","There was no shortfall"],"a":1,"e":"Customer accounts were short by up to roughly $1.6 billion after funds were improperly used."},{"id":"ETH078","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"What triggered the collapse of Archegos Capital Management in 2021?","o":["A cyberattack that froze the firm's trading systems for several days, preventing it from managing its positions","A sharp fall in concentrated, highly leveraged positions such as ViacomCBS, leading to margin calls it could not meet","A new regulation banning family offices from using total return swaps","Rising interest rates that caused large losses on its government bond holdings"],"a":1,"e":"ViacomCBS fell sharply; banks issued margin calls, Archegos defaulted and banks lost roughly $10 billion unwinding positions."},{"id":"ETH079","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"What was the outcome for Archegos founder Bill Hwang?","o":["He was acquitted on all charges after a jury trial","He was convicted of fraud and sentenced to 18 years in prison","He received a fine only and was barred from trading","He was appointed to a regulatory advisory committee"],"a":1,"e":"Hwang was convicted of fraud and market manipulation and sentenced to 18 years."},{"id":"ETH080","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"Which principles did Archegos most clearly violate through deception and lack of independent risk oversight?","o":["Principles 1 and 4, plus 5 and 6","Only Principle 7","Only Principle 2","None, since it was a family office"],"a":0,"e":"Deception and manipulation violate Principles 1 and 4; absent governance and risk management breach Principles 5 and 6."},{"id":"ETH081","t":"ETH","r":"1.2.4","k":"c","d":3,"q":"The Bear Stearns hedge funds told investors subprime exposure was below 10%. What was it actually?","o":["About 6%","About 25%","Close to 60%","Zero"],"a":2,"e":"Actual subprime exposure was close to 60%, a major misrepresentation that violated transparency and honesty principles."},{"id":"ETH082","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"Roughly how much leverage did the Bear Stearns hedge funds use?","o":["None; the funds were unlevered","Up to about 10 times","About 100 times","Exactly 2 times"],"a":1,"e":"The funds used leverage of up to about 10x on mortgage-related securities, magnifying losses of more than $2 billion."},{"id":"ETH083","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"Which reform followed the New York State Common Retirement Fund scandal?","o":["The fund banned placement agents and lobbyists and added independent oversight","The fund doubled its allocation to hedge funds managed by placement agents","Placement agents became mandatory for all managers seeking public mandates","The comptroller gained more unilateral power over all investment decisions"],"a":0,"e":"New York banned placement agents and lobbyists for the fund and strengthened oversight."},{"id":"ETH084","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"What did the SEC adopt after the pay-to-play scandals involving public pension funds?","o":["Rules restricting political contributions by managers working with public funds","A complete ban on public pension investments in alternatives","Mandatory caps on management fees charged to public plans","Daily NAV reporting requirements for all private funds that manage pension money"],"a":0,"e":"The SEC limited political contributions by investment advisers seeking business from public pension plans."},{"id":"ETH085","t":"ETH","r":"1.2.4","k":"c","d":2,"q":"In the CalPERS case, the former CEO received bribes from a former board member who had become a:","o":["Prime broker","Placement agent","Custodian","Auditor"],"a":1,"e":"Alfred Villalobos, a former board member turned placement agent, bribed CEO Federico Buenrostro, who also falsified disclosure letters."},{"id":"ETH086","t":"ETH","r":"1.2.4","k":"c","d":3,"q":"Which reform did CalPERS implement after its placement agent scandal?","o":["Mandatory disclosure of placement agent use and limits on gifts","Elimination of all external managers in favor of in-house teams","A ban on investing in private equity funds of any kind","Abolition of the board and transfer of power to the CEO"],"a":0,"e":"CalPERS required disclosure of placement agents and restricted gifts to staff and board members."},{"id":"ETH087","t":"ETH","r":"1.2.4","k":"a","d":3,"q":"A pension CIO steers allocations to managers that hire a friend as placement agent, without disclosure. Which principles are most directly violated?","o":["Principles 1 and 3 (ethical behavior and client-first), plus Principle 4 (transparency)","Only Principle 7 (continued learning), since the CIO lacked training","Only Principle 8 (collaboration), since peers were not consulted first","No principle at all, as long as the selected managers deliver good returns"],"a":0,"e":"Undisclosed self-interest violates ethical behavior, the duty to put beneficiaries first and transparency, regardless of outcomes."},{"id":"ETH088","t":"ETH","r":"1.1.2","k":"c","d":2,"q":"The 'social-license principle' suggests that a firm or industry:","o":["Needs only a government license and can then ignore public opinion","Must maintain society's acceptance of its activities to keep operating","Can disregard stakeholders other than shareholders and clients","Should maximize short-term profits to secure its future"],"a":1,"e":"The social license depends on society's ongoing acceptance; losing it threatens the industry's ability to operate."},{"id":"ETH089","t":"ETH","r":"1.2.3","k":"c","d":1,"q":"Which principle includes 'Know your client'?","o":["Principle 2: Partnership","Principle 6: Professional Work","Principle 7: Continued Learning","Principle 5: High Standards of Practice"],"a":0,"e":"Know your client — deep discovery of the client's situation, wants and needs — is part of Partnership."},{"id":"ETH090","t":"ETH","r":"1.2.3","k":"c","d":1,"q":"Which principle includes 'Seek professional accreditation', citing designations such as CAIA?","o":["Principle 5: High Standards of Practice","Principle 1: Ethical and Professional Behavior","Principle 3: Client-First Mindset","Principle 8: Collaboration"],"a":0,"e":"Seeking professional accreditation is part of High Standards of Practice."},{"id":"ETH091","t":"ETH","r":"1.2.3","k":"c","d":1,"q":"Which principle includes 'Understand the impact of technology', such as artificial intelligence?","o":["Principle 7: Continued Learning","Principle 4: High Standards of Conduct","Principle 2: Partnership","Principle 6: Professional Work"],"a":0,"e":"Understanding the impact of technology is a component of Continued Learning."},{"id":"ETH092","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Which principle includes 'Ensure appropriate risk assumptions and models'?","o":["Principle 6: Professional Work","Principle 3: Client-First Mindset","Principle 8: Collaboration","Principle 1: Ethical and Professional Behavior"],"a":0,"e":"Professional Work requires tested, controlled models and appropriate risk assumptions."},{"id":"ETH093","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Which principle includes 'Support governance and culture'?","o":["Principle 3: Client-First Mindset","Principle 7: Continued Learning","Principle 5: High Standards of Practice","Principle 6: Professional Work"],"a":0,"e":"Supporting governance and culture is part of operating with a client-first mindset."},{"id":"ETH094","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Which principle includes 'Exercise adaptability and responsiveness'?","o":["Principle 5: High Standards of Practice","Principle 2: Partnership","Principle 4: High Standards of Conduct","Principle 8: Collaboration"],"a":0,"e":"Adaptability and responsiveness are components of High Standards of Practice."},{"id":"ETH095","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Which principle includes 'Take accountability', including the courage to speak truth to power?","o":["Principle 4: High Standards of Conduct","Principle 7: Continued Learning","Principle 2: Partnership","Principle 5: High Standards of Practice"],"a":0,"e":"Taking accountability is part of Principle 4 (transparency, integrity and accountability)."},{"id":"ETH096","t":"ETH","r":"1.2.3","k":"c","d":2,"q":"Which principle includes 'Embrace co-creation and collaboration' with the client?","o":["Principle 2: Partnership","Principle 8: Collaboration","Principle 6: Professional Work","Principle 3: Client-First Mindset"],"a":0,"e":"Co-creation with clients is part of Partnership; Principle 8 covers collaboration within the profession and ecosystem."},{"id":"ALT088","t":"ALT","r":"2.1.1","k":"c","d":1,"q":"Which investment is LEAST likely to be described as institutional quality in the CAIA curriculum?","o":["A diversified core real estate fund","A collection of rare stamps","A senior secured direct lending fund","A diversified commodity futures index fund"],"a":1,"e":"Institutional-quality investments offer a reasonable expected return for acceptable risk and could be held by pensions, endowments or sovereign funds. Collectibles and very small speculative projects are typically excluded."},{"id":"ALT089","t":"ALT","r":"2.1.1","k":"c","d":1,"q":"Which of the following is classified as a real asset in the CAIA curriculum, even though it is intangible?","o":["A corporate bond secured by a factory","A patent generating royalty income","A share of a listed bank","A money market fund"],"a":1,"e":"Real assets directly facilitate production and include intangible assets such as patents, copyrights and royalties. Bonds, shares and money market funds are financial assets."},{"id":"ALT090","t":"ALT","r":"2.1.1","k":"c","d":2,"q":"Why does the curriculum consider defining alternative investments as 'everything that is not traditional' to be unsatisfactory?","o":["Because it excludes hedge funds and private equity from the alternative universe","Because it is too broad and would include many non-institutional assets","Because it is too narrow and excludes private equity","Because traditional assets cannot be defined"],"a":1,"e":"Defining alternatives by exclusion is too broad: it would sweep in collectibles and other non-institutional assets. CAIA instead focuses on institutional-quality alternatives in four categories."},{"id":"ALT091","t":"ALT","r":"2.1.2","k":"c","d":1,"q":"Which four broad categories of alternative investments structure the CAIA Level I curriculum (Topics 3 to 6)?","o":["Real assets, hedge funds, private equity and private debt","Equities, bonds, cash and commodities","Hedge funds, mutual funds, ETFs and REITs","Venture capital, buyouts, real estate and collectibles"],"a":0,"e":"Topics 3 to 6 cover real assets, private equity, private debt and hedge funds (with digital assets in Topic 7)."},{"id":"ALT092","t":"ALT","r":"2.1.3","k":"c","d":1,"q":"A 'lumpy asset' is best described as an asset that:","o":["Trades in very small units on exchanges, such as a share of a large-cap stock","Cannot be easily divided into small units, such as a single office building","Pays its returns in irregular lumps, such as a zero-coupon government bond","Has highly volatile prices but can be divided freely, such as a gold ETF"],"a":1,"e":"Lumpy assets come in large indivisible units, which makes diversification and liquidity harder, as is typical of direct real estate and infrastructure."},{"id":"ALT093","t":"ALT","r":"2.1.3","k":"c","d":2,"q":"Which statement about illiquidity in alternative investments is most accurate?","o":["Illiquidity always raises returns, so investors should maximize illiquid holdings regardless of needs","Illiquidity can offer a premium to long-horizon investors but also prevents rebalancing and adds valuation uncertainty","Illiquidity has no effect on valuation because appraisals capture true market prices each quarter","Illiquid assets are easy to rebalance because managers can sell them quickly at appraised values"],"a":1,"e":"Long-term investors may earn an illiquidity premium, but illiquidity also limits rebalancing, increases transaction costs and makes valuations uncertain."},{"id":"ALT094","t":"ALT","r":"2.1.3","k":"c","d":2,"q":"Which two conditions most promote informational market efficiency?","o":["High transaction costs and few participants","Intense competition among participants and low transaction costs","Regulatory price controls and short-sale bans","Illiquidity, infrequent trading and high barriers to obtaining information"],"a":1,"e":"Competition to exploit information and low costs of trading on it push prices toward efficient levels. Barriers such as high costs or short-sale restrictions reduce efficiency."},{"id":"ALT095","t":"ALT","r":"2.1.4","k":"c","d":1,"q":"A product evaluated against a fixed target such as 'cash + 4%' rather than against a market index follows:","o":["A relative return standard","An absolute return standard","A benchmark tracking mandate","A passive management approach"],"a":1,"e":"Absolute return standards judge performance against targets independent of market movements; relative return standards compare with a benchmark."},{"id":"ALT096","t":"ALT","r":"2.1.4","k":"c","d":2,"q":"An investment primarily used to reduce the overall risk of a portfolio through low correlation with its other holdings is called:","o":["A return enhancer","A diversifier","A beta replicator","A leveraged product"],"a":1,"e":"A diversifier is valued mainly for its low correlation with the rest of the portfolio, which lowers total portfolio risk."},{"id":"ALT097","t":"ALT","r":"2.1.7","k":"c","d":1,"q":"In a defined benefit (DB) pension plan, who bears the investment risk?","o":["The plan participants (employees)","The plan sponsor (employer)","The government pension regulator","The plan's investment consultant"],"a":1,"e":"In a DB plan the employer promises a benefit and bears the investment risk. In a defined contribution (DC) plan, employees bear it."},{"id":"ALT098","t":"ALT","r":"2.1.7","k":"c","d":2,"q":"Why have defined benefit plans and endowments historically allocated more to alternatives than defined contribution plans?","o":["They are required by law to hold at least half of their assets in alternatives","They have long horizons, professional staff and pooled assets able to tolerate illiquidity","They face daily redemptions and need assets with stable reported prices","They pay higher taxes on public securities than on private investments"],"a":1,"e":"Long horizons, scale and professional management let DB plans and endowments bear illiquidity and complexity. DC plans need daily liquidity and simplicity for individual participants."},{"id":"ALT099","t":"ALT","r":"2.1.7","k":"c","d":1,"q":"Which entity is an example of a buy-side institution that manages a country's surplus wealth?","o":["A prime broker","A sovereign wealth fund","A clearinghouse","A fund administrator"],"a":1,"e":"Sovereign wealth funds invest national surpluses (e.g., from commodity revenues) and are buy-side participants."},{"id":"ALT100","t":"ALT","r":"2.1.8","k":"c","d":1,"q":"Which service provider typically calculates a hedge fund's net asset value and handles investor subscriptions and redemptions?","o":["The prime broker","The fund administrator","The custodian bank only","The placement agent"],"a":1,"e":"The fund administrator computes NAV, keeps investor records and processes subscriptions and redemptions, providing independent oversight."},{"id":"ALT101","t":"ALT","r":"2.1.8","k":"c","d":2,"q":"What is the prime broker's most powerful tool for protecting itself against a hedge fund's losses?","o":["Calling the regulator to suspend the fund's trading until losses are covered","Issuing margin calls and, if unmet, seizing and liquidating collateral","Charging higher management fees to the fund when its performance declines","Requiring the fund's investors to guarantee the prime broker's exposure"],"a":1,"e":"Prime brokers finance positions against collateral; when the account falls short they issue margin calls and can liquidate collateral."},{"id":"ALT102","t":"ALT","r":"2.1.8","k":"c","d":1,"q":"In a financial firm, which area typically handles trade settlement and accounting?","o":["Front office","Middle office","Back office","Investor relations"],"a":2,"e":"Front office: trading and sales. Middle office: risk management and control. Back office: settlement, clearing and accounting."},{"id":"ALT103","t":"ALT","r":"2.2.1","k":"c","d":1,"q":"What does limited liability mean for a limited partner?","o":["The LP's losses are limited to the fees it has paid to the general partner","The LP's losses are limited to the capital it has invested or committed","The LP cannot lose money because the general partner guarantees its capital","The LP is liable for fund debts only up to the value of its other assets"],"a":1,"e":"Limited liability caps an investor's potential loss at its investment, which is why passive investors use LP interests or shares."},{"id":"ALT104","t":"ALT","r":"2.2.1","k":"a","d":2,"q":"A US manager has taxable US investors and tax-exempt and non-US investors who want the same strategy. Which structure is most appropriate?","o":["A single onshore limited partnership open to all investor types without feeders","A master-feeder structure with onshore and offshore feeders investing in one master fund","Separate, unrelated funds for each investor type, each trading its own portfolio","A listed closed-end fund with a single share class for all types of investors"],"a":1,"e":"Feeders tailored to each investor group's tax situation invest in a common master fund, so one portfolio is managed efficiently."},{"id":"ALT105","t":"ALT","r":"2.2.1","k":"c","d":2,"q":"Why is a special purpose vehicle used in securitization designed to be 'bankruptcy remote'?","o":["So that the bank can reclaim the assets whenever it needs extra liquidity","So that the assets transferred to it are protected if the sponsoring bank fails","So that investors are paid only if the sponsoring bank remains solvent","So that the vehicle can borrow unlimited amounts from the sponsoring bank"],"a":1,"e":"Bankruptcy remoteness isolates the securitized assets from the sponsor's creditors, so investors rely on the assets' cash flows."},{"id":"ALT106","t":"ALT","r":"2.2.2","k":"c","d":1,"q":"An 'evergreen' fund is another name for:","o":["A fund with a fixed ten-year life","An open-end fund with an indefinite life","A fund investing only in forestry","A fund that never pays distributions"],"a":1,"e":"Evergreen (open-end) funds have no fixed termination date and allow periodic subscriptions and redemptions."},{"id":"ALT107","t":"ALT","r":"2.2.2","k":"c","d":2,"q":"An LP in a drawdown fund worries that it may not have enough cash available when the GP calls capital. This is:","o":["Valuation (appraisal) risk","Commitment (funding) risk","Key-person risk","Style drift risk"],"a":1,"e":"Commitment or funding risk is the risk that an LP cannot meet capital calls, which can lead to severe default penalties."},{"id":"ALT108","t":"ALT","r":"2.2.2","k":"c","d":2,"q":"Uncertainty about the timing and value of exits from a private equity fund's investments is called:","o":["Realization risk","Basis risk","Rollover risk","Commitment risk"],"a":0,"e":"Realization risk refers to the uncertainty over when and at what prices portfolio investments can be exited and cash returned."},{"id":"ALT109","t":"ALT","r":"2.2.2","k":"c","d":2,"q":"Which is an advantage of an interval fund over a traditional drawdown fund?","o":["Higher expected returns because all capital is invested in illiquid assets","Lower minimums, simpler tax reporting and no J-curve from capital calls","Daily liquidity at NAV with no limits on the size of redemptions","Exchange listing that allows intraday trading at market prices"],"a":1,"e":"Interval funds accept subscriptions easily, have lower minimums and simpler tax reporting and avoid the J-curve, but redemptions are limited and a liquidity sleeve is needed."},{"id":"ALT110","t":"ALT","r":"2.2.2","k":"c","d":2,"q":"What is a key disadvantage of interval funds?","o":["Shares trade at large discounts on exchanges because they are listed","Redemptions are limited to periodic windows and a cash sleeve can dilute returns","Investors must meet capital calls and face a deep J-curve from fees","Investors may redeem all of their shares daily, which forces asset sales"],"a":1,"e":"Interval funds offer only limited periodic liquidity and must hold liquid assets to meet redemptions, which can drag on returns."},{"id":"ALT111","t":"ALT","r":"2.2.3","k":"c","d":1,"q":"Which document is the primary marketing and disclosure document describing a private fund's strategy, risks and terms?","o":["The subscription agreement","The private placement memorandum (PPM)","The management company operating agreement","The custody agreement"],"a":1,"e":"The PPM presents the strategy, team, risks and key terms to prospective investors."},{"id":"ALT112","t":"ALT","r":"2.2.3","k":"c","d":2,"q":"Which document sets out the legally binding relationship between the GP and LPs, including fees, term and governance?","o":["The private placement memorandum (PPM)","The limited partnership agreement (LPA)","The subscription agreement","The audit report"],"a":1,"e":"The LPA is the governing contract of the fund, specifying economics, governance, term, investment restrictions and LP rights."},{"id":"ALT113","t":"ALT","r":"2.2.3","k":"c","d":3,"q":"Which situation best illustrates adverse selection rather than moral hazard?","o":["A manager with a seed investor's capital takes excessive risk after the deal closes","The managers most eager to accept a seed investor's terms are disproportionately those unable to raise capital elsewhere","A manager reduces effort after receiving a large performance fee from investors, knowing they cannot monitor it closely","A seeded manager shifts its strategy once it has locked in the investor's capital"],"a":1,"e":"Adverse selection stems from hidden information before contracting (lower-quality managers self-select). The other options involve hidden actions after contracting (moral hazard)."},{"id":"ALT114","t":"ALT","r":"2.2.3","k":"c","d":2,"q":"Which EU legal forms are commonly used for alternative funds in Luxembourg?","o":["SICAV and SICAF","LLC and LLP","REIT and MLP","ICAV and OEIC only"],"a":0,"e":"Luxembourg funds often use SICAV (variable capital) or SICAF (fixed capital) forms. Ireland uses the ICAV."},{"id":"ALT115","t":"ALT","r":"2.2.3","k":"c","d":1,"q":"What role does an LP advisory committee typically play?","o":["It makes the fund's investment decisions and approves each new deal","It advises on conflicts of interest, valuation questions and other governance matters","It sets the GP's carried interest and management fee each year","It manages portfolio companies on behalf of all limited partners"],"a":1,"e":"LPACs, composed of LP representatives, review conflicts of interest, valuations and certain waivers, supporting fund governance."},{"id":"ALT116","t":"ALT","r":"2.2.4","k":"a","d":2,"q":"Two founding partners named in a PE fund's LPA leave the firm during the investment period. Which provision most likely allows LPs to suspend new investments?","o":["Clawback provision","Key-person provision","Catch-up provision","Hurdle rate provision"],"a":1,"e":"Key-person clauses protect LPs who committed based on specific professionals; departure typically suspends the investment period."},{"id":"ALT117","t":"ALT","r":"2.2.4","k":"c","d":2,"q":"How does removal of a GP 'for cause' differ from a no-fault divorce?","o":["For cause requires LPs to show misconduct such as fraud; no-fault requires only a supermajority vote","For cause requires a unanimous LP vote; no-fault requires a court order","No-fault requires proof of fraud; for cause requires only a simple majority","Both require proof of misconduct such as fraud, but no-fault removal carries lower penalties and a shorter notice period"],"a":0,"e":"For-cause removal follows proven misconduct, while a no-fault divorce lets a supermajority of LPs remove the GP or end the investment period without demonstrating wrongdoing."},{"id":"ALT118","t":"ALT","r":"2.2.5","k":"n","d":2,"q":"A PE fund has $500 million of commitments and $300 million invested. After the investment period, the management fee becomes 1.5% of invested capital. What is the annual fee?","o":["$3.0 million","$4.5 million","$7.5 million","$10.0 million"],"a":1,"e":"After the investment period, fees often switch to invested (or net invested) capital: 1.5% × $300m = $4.5m."},{"id":"ALT119","t":"ALT","r":"2.2.5","k":"c","d":2,"q":"In a whole-of-fund waterfall with a preferred return and full catch-up, what is the correct order of distributions?","o":["Carry to GP, then return of capital, then preferred return","Return of LP capital, preferred return to LPs, GP catch-up, then the 80/20 split","Preferred return, GP catch-up, return of capital, then 80/20","An 80/20 split from the first dollar of profit, then return of LP capital"],"a":1,"e":"LPs first get their contributed capital back, then the preferred return; the GP then catches up until it holds its carry share, and remaining profits are split (e.g., 80/20)."},{"id":"ALT120","t":"ALT","r":"2.2.5","k":"c","d":2,"q":"Why are deal-by-deal (American) waterfalls generally considered more favorable to the GP than whole-of-fund waterfalls?","o":["LPs recover all contributed capital and the hurdle before the GP receives any carry","The GP can receive carried interest earlier, on individual profitable exits, before LPs recover all capital","The GP receives carry only after the fund has been fully liquidated and audited","LPs receive a catch-up that gives them all profits until the hurdle is reached"],"a":1,"e":"Earlier carry improves the GP's time value; losses on later deals may mean the GP was overpaid, hence the need for clawback and escrow."},{"id":"ALT121","t":"ALT","r":"2.2.6","k":"c","d":1,"q":"Escrow accounts in private equity funds
