<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>CAIA Level I Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1226; --bg2:#171b36; --card:#1e2344; --line:#2c3260; --ink:#f3f4fb; --mute:#a3a8cc; --dim:#6f75a3;
  --acc:#7c5cff; --acc2:#a48bff; --ok:#21c07a; --bad:#ff5a6e; --warn:#ffb020;
  --a0:#e5484d; --a1:#3e7bfa; --a2:#f5a524; --a3:#20b26b;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a1f6b 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#123a5e 0%,transparent 55%),var(--bg);min-height:100vh}
h1,h2,h3,.brand{font-family:"Space Grotesk",Inter,system-ui,sans-serif,Inter,sans-serif;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
input,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#33c3ff);display:grid;place-items:center;font-size:15px;font-weight:700}
.who{color:var(--mute);font-size:14px;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.grid3{grid-template-columns:1fr}}
.hero h1{font-size:40px;margin:6px 0 8px;line-height:1.05}
.hero p{color:var(--mute);margin:0 0 22px;max-width:640px;line-height:1.5}
.mode{cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:8px;min-height:170px}
.mode:hover{transform:translateY(-3px);border-color:var(--acc)}
.mode .ic{font-size:28px}
.mode h3{margin:4px 0 0;font-size:20px}
.mode p{margin:0;color:var(--mute);font-size:14px;line-height:1.45}
.btn{background:var(--acc);color:#fff;padding:12px 20px;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 14px;font-size:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.inp{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;outline:none;width:100%}
.inp:focus{border-color:var(--acc)}
.code-inp{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:28px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;background:transparent;color:var(--mute);padding:9px 12px;border-radius:9px;font-weight:600;font-size:14px;min-width:90px}
.seg button.on{background:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--mute);font-size:13px;font-weight:600}
.chip.on{border-color:var(--acc);color:#fff;background:rgba(124,92,255,.22)}
.hint{color:var(--dim);font-size:13px;line-height:1.45}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.note{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);color:#ffd791;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:960px){.two{grid-template-columns:1fr}}
.shareFab{position:fixed;right:22px;bottom:22px;z-index:60;width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 30px rgba(124,92,255,.55);animation:fabPulse 2.2s infinite}
.shareFab:hover{transform:scale(1.07)}
@keyframes fabPulse{0%,100%{box-shadow:0 10px 30px rgba(124,92,255,.55),0 0 0 0 rgba(124,92,255,.5)}50%{box-shadow:0 10px 30px rgba(124,92,255,.55),0 0 0 14px rgba(124,92,255,0)}}
.shareFab .lbl{position:absolute;right:74px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;font-weight:600;background:#1d1b3a;border:1px solid rgba(255,255,255,.15);padding:6px 10px;border-radius:999px}
.sharePop{position:fixed;right:22px;bottom:98px;z-index:61;width:min(340px,calc(100vw - 44px));max-height:calc(100vh - 120px);overflow:auto;background:#1a1936;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .18s ease-out;text-align:left}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.sharePop h4{margin:0 0 4px}.sharePop .code{font-family:"Space Grotesk",Inter,sans-serif;font-size:28px;font-weight:700;letter-spacing:.15em}
.sharePop .link{width:100%;box-sizing:border-box;margin:8px 0;padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);color:#fff;font-size:13px}
.shGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.shGrid a,.shGrid button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}
.shGrid .main{grid-column:1/-1;background:linear-gradient(135deg,var(--acc),var(--acc2));border:0}
.sharePop .qr{display:block;margin:10px auto 0;background:#fff;padding:8px;border-radius:12px;width:156px;height:156px}
.bigcode{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:64px;font-weight:700;letter-spacing:.18em;text-align:center;background:linear-gradient(90deg,#fff,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.plist{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.pchip{background:var(--bg2);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:600;animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
/* Question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qmeta{display:flex;gap:8px;flex-wrap:wrap}
.timer{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:6px 0 18px;border:1px solid var(--line)}
.timer>div{height:100%;background:linear-gradient(90deg,var(--ok),var(--warn));transition:width .25s linear}
.timer.low>div{background:var(--bad)}
.tnum{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:700;font-size:22px;min-width:64px;text-align:right}
.qtext{font-size:21px;line-height:1.45;margin:4px 0 20px;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.opts{grid-template-columns:1fr}.qtext{font-size:18px}.hero h1{font-size:30px}.bigcode{font-size:44px}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;color:#fff;padding:16px 16px;border-radius:14px;font-size:16px;line-height:1.4;min-height:72px;font-weight:500;border:2px solid transparent;transition:transform .1s,opacity .2s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt .sh{flex:0 0 30px;height:30px;border-radius:8px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;font-family:"Space Grotesk",Inter,system-ui,sans-serif}
.o0{background:var(--a0)}.o1{background:var(--a1)}.o2{background:var(--a2)}.o3{background:var(--a3)}
.opt.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.opt.dim{opacity:.32}
.opt.right{border-color:#fff;box-shadow:0 0 0 4px var(--ok)}
.opt.wrong{opacity:.5;box-shadow:0 0 0 3px var(--bad)}
.opt:disabled{cursor:default}
.dist{font-family:"Space Grotesk",Inter,system-ui,sans-serif;margin-left:auto;font-weight:700;padding-left:8px}
.expl{margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:14px 16px;line-height:1.5;color:#dfe1f5}
.verdict{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:22px;font-weight:700;margin-top:14px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.waitbox{text-align:center;padding:30px 10px;color:var(--mute)}
/* Leaderboard */
.lb h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(255,90,110,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,90,110,0)}100%{box-shadow:0 0 0 0 rgba(255,90,110,0)}}
.lbrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lbrow:last-child{border-bottom:0}
.rk{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:700;color:var(--mute);text-align:center}
.lbrow.me .nm{color:var(--acc2)}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
.sc{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:700;font-size:17px;text-align:right}
.strip{display:flex;gap:2px;margin-top:5px;flex-wrap:wrap}
.strip i{width:7px;height:7px;border-radius:2px;background:#353b6b}
.strip i.g{background:var(--ok)}.strip i.r{background:var(--bad)}.strip i.c{outline:1px solid #fff}
.ans{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(33,192,122,.18);color:var(--ok);font-weight:700;margin-left:6px}
/* Results */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:28px}
.stat span{color:var(--mute);font-size:13px}
.tbar{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
@media(max-width:600px){.tbar{grid-template-columns:120px 1fr 50px}}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--acc)}
.rev{border-top:1px solid var(--line);padding:16px 0}
.rev .q{font-weight:500;line-height:1.45;margin-bottom:8px}
.rev .o{font-size:14px;padding:6px 10px;border-radius:8px;margin:4px 0;background:var(--bg2);color:var(--mute)}
.rev .o.c{background:rgba(33,192,122,.15);color:#bff5d9}
.rev .o.x{background:rgba(255,90,110,.15);color:#ffc2ca}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:20px 0 10px;min-height:300px}
.pod .pwho{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) + .6s)}
.pod .blk{transform-origin:bottom;animation:rise .8s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d)}
.pod.first .pwho .av{animation:winner 1.6s ease-in-out infinite;animation-delay:calc(var(--d) + 1.4s)}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes winner{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-6deg)}75%{transform:translateY(-8px) rotate(6deg)}}
.reveal-late{animation:fadeUp .7s both;animation-delay:var(--d)}
.drum{font-family:"Space Grotesk",Inter,system-ui,sans-serif;color:var(--mute);font-size:18px;min-height:26px}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:20px;flex:0 0 auto;line-height:1}
.av.big{width:64px;height:64px;font-size:38px;margin:0 auto 6px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.av.md{width:44px;height:44px;font-size:26px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-width:520px}
.avbtn{background:var(--bg2);border:2px solid var(--line);border-radius:14px;font-size:26px;height:46px;transition:transform .12s,border-color .12s}
.avbtn:hover{transform:scale(1.12) rotate(-4deg)}
.avbtn.on{border-color:var(--acc);background:rgba(124,92,255,.25);transform:scale(1.08)}
.pchip{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px}
.pchip.new{animation:bounceIn .6s cubic-bezier(.2,.9,.3,1.4)}
.pchip .av{animation:bob 2.4s ease-in-out infinite}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.lbrow{grid-template-columns:22px 34px minmax(0,1fr) auto}
.opt.sel{animation:press .25s ease}
@keyframes press{50%{transform:scale(.96)}}
.opt.right{animation:glow 1s ease 2}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(33,192,122,.55)}}
.opt.wrong{animation:shake .45s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.verdict{animation:fadeUp .5s both}
.ptsfly{display:inline-block;margin-left:10px;color:var(--ok);animation:fly 1.4s ease both}
@keyframes fly{0%{opacity:0;transform:translateY(14px) scale(.6)}30%{opacity:1;transform:translateY(-4px) scale(1.25)}100%{opacity:1;transform:none}}
#cd{animation:tickPulse 1s ease infinite}
@keyframes tickPulse{0%{transform:scale(1.25)}100%{transform:scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.pod{text-align:center;width:150px}
.pod .blk{border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:700;font-size:30px;margin-top:8px}
.pod .p1{height:130px;background:linear-gradient(#ffd34d,#d49b00)}
.pod .p2{height:95px;background:linear-gradient(#d9dbe8,#9aa0bf)}
.pod .p3{height:70px;background:linear-gradient(#f0a46b,#b8652a)}
.heat{overflow-x:auto}
.heat table{border-collapse:collapse;font-size:13px}
.heat td,.heat th{padding:4px 5px;text-align:center;border-bottom:1px solid var(--line)}
.heat th{color:var(--dim);font-weight:600}
.heat td.n{text-align:left;font-weight:600;white-space:nowrap;padding-right:12px}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;background:#353b6b}
.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}
.bank-q{border-bottom:1px solid var(--line);padding:14px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;display:none}
.center{text-align:center}
.mt{margin-top:16px}.mb{margin-bottom:16px}
a{color:var(--acc2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="homeLink"><div class="logo">AI</div>CAIA Level I Arena</div>
    <div class="who" id="who"></div>
  </div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
const BANK = [{"id":"ETH001","t":"ETH","r":"1.1.3","k":"c","q":"Which of the following is NOT one of the four areas generally encompassed by fiduciary obligations in the CAIA curriculum?","o":["Loyalty","Prudence and care","Impartiality","Profitability"],"a":3,"e":"Fiduciary obligations generally encompass four areas: loyalty, prudence and care, diversification, and impartiality. Profitability is not one of them.","d":2},{"id":"ETH002","t":"ETH","r":"1.1.3","k":"c","q":"A pension trustee consistently favors the interests of retired members over active members when setting investment strategy. Which fiduciary obligation is most directly at risk?","o":["Diversification","Impartiality","Prudence and care","Loyalty to the sponsor"],"a":1,"e":"Impartiality means taking care not to favor the interests of a particular beneficiary or class of beneficiaries over others.","d":2},{"id":"ETH003","t":"ETH","r":"1.1.3","k":"c","q":"Which statement best describes how the curriculum characterizes the interpretation of fiduciary duty?","o":["It is fixed by law and identical across major jurisdictions","It is a spectrum that evolves as investment principles, practice and circumstances change","It applies only to asset owners and never to asset managers","It requires that non-financial interests always be ranked above financial interests"],"a":1,"e":"Interpretation of fiduciary duty is hard to pin down objectively, differs across jurisdictions, and is expected to evolve over time (e.g., with sustainable investing).","d":2},{"id":"ETH004","t":"ETH","r":"1.1.3","k":"c","q":"According to the curriculum, culture influences organizations through three main channels. Which of the following is one of them?","o":["Minimizing headcount and layers of management to reduce agency costs and speed up decisions","Aligning values and beliefs, establishing expectations and trust, and reducing uncertainty","Replacing broad principles with detailed compliance rules that leave little room for judgment","Maximizing short-term revenue per client to fund investment in talent and technology"],"a":1,"e":"The three channels are: aligning values and beliefs (expectations, trust, reduced uncertainty); building focus on the things that matter; and capturing the power of strong communication and engagement.","d":2},{"id":"ETH005","t":"ETH","r":"1.1.4","k":"c","q":"Why does the curriculum argue that, in practice, 'putting the client first' becomes 'treating all clients fairly'?","o":["Because regulators prohibit firms from giving any priority to one client's interests over another's","Because once a firm has more than one client it cannot guarantee that each client is put first at all times","Because fairness is easier to measure and audit than loyalty to an individual client","Because most clients prefer identical fees and products to customized service"],"a":1,"e":"The only way to guarantee putting the client first would be to have a single client. With multiple clients (and products), the realistic goal is treating all clients fairly.","d":2},{"id":"ETH006","t":"ETH","r":"1.1.4","k":"c","q":"The 'virtuous circle' of the fiduciary and professional mindset links benefits to three parties. Which set is correct?","o":["The regulator, the auditor and the client","The portfolio, the client and the asset manager","The board, the CEO and shareholders","The custodian, the broker and the client"],"a":1,"e":"The portfolio gets the highest-grade skill and attention; the client gets better performance reinforced by trust; the asset manager gets a sustainable, commercially successful relationship.","d":2},{"id":"ETH007","t":"ETH","r":"1.2.1","k":"c","q":"The CAIA Ethical Principles are grouped into principles that guide 'doing the right things' and those that guide 'doing things right'. Which principle belongs to 'doing things right'?","o":["Partnership","Client-first mindset","Continued learning","Ethical and professional behavior"],"a":2,"e":"Doing the right things: (1) ethical and professional behavior, (2) partnership, (3) client-first mindset, (4) high standards of conduct. Doing things right: (5) high standards of practice, (6) professional work, (7) continued learning, (8) collaboration.","d":2},{"id":"ETH008","t":"ETH","r":"1.2.1","k":"c","q":"How many CAIA Ethical Principles are there?","o":["Four","Six","Eight","Ten"],"a":2,"e":"There are eight principles: four on 'doing the right things' and four on 'doing things right'.","d":1},{"id":"ETH009","t":"ETH","r":"1.2.1","k":"c","q":"Which principle is described as the firm and its professionals seeking to act as a peer of the client, recognizing that specialist skills are not a source of superiority over the client?","o":["Collaboration","Partnership","Professional work","High standards of practice"],"a":1,"e":"Principle 2, Partnership: aligning with the client and acting as a peer and partner, built on deep trust, empathy and honest conversations about realistic expectations.","d":2},{"id":"ETH010","t":"ETH","r":"1.2.2","k":"c","q":"The 'assurance of quality' that underpins professionalism has four parts. Which list is correct?","o":["Fiduciary duty, license to operate, trust, and management of conflicts of interest","Compliance, audit, risk management, and performance","Loyalty, prudence, diversification, and impartiality","Transparency, integrity, accountability, and disclosure"],"a":0,"e":"The four components of assurance of quality are fiduciary duty, license to operate, trust, and management of conflicts of interest.","d":2},{"id":"ETH011","t":"ETH","r":"1.2.2","k":"c","q":"How does the curriculum distinguish 'license to operate' from 'fiduciary duty'?","o":["License to operate is a legal construct; fiduciary duty is a social construct","License to operate is a social construct; fiduciary duty is a legal construct","Both are purely regulatory requirements enforced by securities regulators","License to operate applies only to banks, fiduciary duty only to pension funds"],"a":1,"e":"Fiduciary duty is a legal construct ensuring those managing others' money act in beneficiaries' interests. License to operate is a social construct reflecting a covenant from society that legitimizes the pursuit of commercial goals.","d":1},{"id":"ETH012","t":"ETH","r":"1.2.2","k":"c","q":"Which of the following statements about trust is consistent with the trust model in the curriculum?","o":["Trust tends to build quickly with good results and to erode only slowly after a breach","The value of trust declines as the level of risk and the time horizon of the relationship increase","Trust is a two-sided construct: trust willingness from the client and trustworthiness from the provider","Technology alone is generally sufficient to build trust, so personal contact adds little value"],"a":2,"e":"Trust is two-sided, grows slowly but can erode quickly, becomes more valuable as risk and duration increase, and usually needs a personal touch in addition to technology.","d":2},{"id":"ETH013","t":"ETH","r":"1.2.2","k":"c","q":"Which statement about conflicts of interest best reflects the curriculum's conflict-of-interest model?","o":["All conflicts can and must be avoided","Unavoidable conflicts should be managed through process and full, fair disclosure","Conflicts arising from personal considerations are outside the scope of professional ethics","Disclosure is unnecessary when a conflict benefits the client overall"],"a":1,"e":"Certain conflicts can be avoided, others cannot; some are manageable with appropriate process. Full and fair disclosure, transparency, governance and culture all help mitigate them.","d":2},{"id":"ETH014","t":"ETH","r":"1.2.2","k":"c","q":"In the curriculum, professionalism is placed at the center of which framework?","o":["The capital asset pricing model","The value creation equation","The Jarque-Bera test","The cash waterfall"],"a":1,"e":"Professionalism is at the center of the value creation equation: it is how purpose and vision are implemented, and when backed by assurance, value creation can flow.","d":1},{"id":"ETH015","t":"ETH","r":"1.2.3","k":"a","q":"A portfolio manager discovers that a trade was booked in the wrong client account, causing a small loss. Under the CAIA Ethical Principles, what is the most appropriate response?","o":["Correct it quietly in the next period since the amount is immaterial","Disclose the error to the client, with its circumstances and the remedy","Allocate the loss pro rata across all clients","Wait until the client asks about the performance difference"],"a":1,"e":"Principle 4 (High Standards of Conduct) stresses transparency, specifically disclosing errors, including their circumstances and any mitigating responses.","d":2},{"id":"ETH016","t":"ETH","r":"1.2.3","k":"a","q":"An analyst is asked to approve a deal outside her expertise and with incomplete information. Which behavior best reflects Principle 7 (Continued Learning)?","o":["Approve it to avoid delaying the team","Reach out to experts for input rather than judge on incomplete knowledge","Decline all deals outside her current skill set permanently","Rely solely on the sponsor's marketing materials"],"a":1,"e":"Principle 7 asks for humility and curiosity: in the short term, reach out to experts rather than make judgments on incomplete knowledge; in the long term, fill knowledge gaps.","d":2},{"id":"ETH017","t":"ETH","r":"1.2.3","k":"c","q":"Under Principle 6 (Professional Work), which statement about compliance with local laws is correct?","o":["If an action is legal, it is automatically appropriate for an investment professional","Professionals must comply with applicable laws, but an action being legal does not guarantee it is appropriate","Local law always overrides the ethical principles","Professionals are only responsible for their own compliance, not that of people they supervise"],"a":1,"e":"Individuals must ensure that they and those under their supervision comply with laws, rules and codes, but legality alone does not make an action appropriate.","d":2},{"id":"ETH018","t":"ETH","r":"1.2.3","k":"c","q":"The ability to deliberately follow ethical principles even in difficult circumstances, where the outcome may appear negative, is described as:","o":["Accountability","Moral courage","Impartiality","Adjacent learning"],"a":1,"e":"Principle 1 includes acting with moral courage: deliberately following ethical principles even when the situation is uncomfortable or the outcome may appear negative.","d":2},{"id":"ETH019","t":"ETH","r":"1.2.3","k":"c","q":"Which principle includes the components 'Disclose costs' and 'Disclose errors'?","o":["Principle 2: Partnership","Principle 4: High Standards of Conduct","Principle 5: High Standards of Practice","Principle 8: Collaboration"],"a":1,"e":"Principle 4 (Transparency, Integrity and Accountability) includes: be transparent and set goals, disclose errors, disclose costs, act with integrity, take accountability, support ethical cultural values.","d":1},{"id":"ETH020","t":"ETH","r":"1.2.3","k":"c","q":"Which component belongs to Principle 8 (Collaboration)?","o":["Seek professional accreditation","Utilize peer review in your work","Disclose costs","Know your client"],"a":1,"e":"Collaboration includes valuing diversity and teamwork, utilizing peer review in your work and ethics code, and supporting the investment ecosystem and the professional community.","d":1},{"id":"ETH021","t":"ETH","r":"1.2.3","k":"c","q":"Under Principle 2, what is suggested when a client's demands present a conflict with Principle 1 (Ethical and Professional Behavior)?","o":["Follow the client's instructions since the client comes first","It may be suitable to disengage with the client","Report the client to the regulator in all cases","Charge a higher fee to compensate for the risk"],"a":1,"e":"Under 'Know your client', the curriculum notes that should a client present a conflict with Principle 1, it may be suitable to disengage with the client.","d":2},{"id":"ETH022","t":"ETH","r":"1.2.3","k":"c","q":"Which is the best description of the curriculum's view on principles-based versus rules-based approaches?","o":["Rules should replace principles because they are easier to enforce","Principles and rules are mutually exclusive","A mix of both, weighted substantially toward principles, is ideal","Principles are only appropriate for small firms"],"a":2,"e":"Professionalism cannot be satisfactorily codified through rules alone; the ideal combination uses both but is weighted substantially toward principles for flexibility, with rules setting minimum standards.","d":2},{"id":"ETH023","t":"ETH","r":"1.2.3","k":"c","q":"An advantage of rules relative to principles, as acknowledged in the curriculum, is that rules:","o":["Adapt quickly as markets evolve","Are generally easier to enforce and simplify monitoring and auditing","Encourage critical thinking and professional judgment","Allow nuanced, case-specific decisions"],"a":1,"e":"Rules offer clarity, reduce ambiguity, are easier to enforce and support consistency. Principles offer flexibility and rely on professional judgment.","d":2},{"id":"ETH024","t":"ETH","r":"1.2.3","k":"a","q":"A firm pays its traders bonuses based solely on monthly trading volume. Which component of Principle 5 (High Standards of Practice) is most directly undermined?","o":["Work within an appropriate reward system","Undertake adjacent learning","Seek alignment of values","Support the professional community"],"a":0,"e":"Principle 5 requires working within a reward system that aligns with high standards of professional work and does not incentivize potential abuses.","d":2},{"id":"ETH025","t":"ETH","r":"1.2.3","k":"c","q":"Awareness of developments such as distributed ledger technology, AI, biodiversity loss and climate change is described under Principle 7 as:","o":["Embrace humility","Adjacent learning","Co-creation","Stewardship"],"a":1,"e":"Undertaking adjacent learning means maintaining awareness of wider developments that could impact the investment ecosystem and integrating them into one's thinking.","d":2},{"id":"ETH026","t":"ETH","r":"1.2.4","k":"c","q":"In the MF Global case, which action most directly violated Principle 6 (Professional Work)?","o":["Taking a directional view on European sovereign debt","Using customer funds in breach of segregation laws","Replacing the CEO with an outside chair","Disclosing the trading losses too early"],"a":1,"e":"Taking a view is not unethical per se. Transferring customer funds in violation of segregation rules breached the duty to comply with applicable laws (Principle 6), alongside violations of Principles 1, 3 and 4.","d":2},{"id":"ETH027","t":"ETH","r":"1.2.4","k":"c","q":"Which feature of Archegos Capital Management allowed it to hide its total exposure from counterparties?","o":["It was a registered mutual fund whose daily disclosures were too complex for banks to analyze","As a lightly regulated family office, it spread total return swaps across several banks","It held only physical commodities in private vaults, which counterparties could not value","It was listed on a stock exchange, so its exposures were spread across thousands of shareholders"],"a":1,"e":"As a family office, Archegos faced lighter regulation and used total return swaps with multiple banks, masking its aggregate leveraged exposure from each counterparty.","d":2},{"id":"ETH028","t":"ETH","r":"1.2.4","k":"c","q":"In the Bear Stearns hedge fund case, what was a key breach of integrity by the portfolio managers?","o":["They refused to use leverage, which forced them to sell assets at depressed prices during redemptions","They reassured investors and solicited new money while one manager redeemed part of his own investment","They disclosed subprime exposure of nearly 60% but continued to market the funds as low risk","They hedged the portfolio with short positions without informing the funds' board of directors"],"a":1,"e":"The managers downplayed problems and said they were adding personal money, while Cioffi redeemed about one-third of his investment, violating Principles 1, 3 and 4.","d":2},{"id":"ETH029","t":"ETH","r":"1.2.4","k":"c","q":"The New York State Common Retirement Fund and CalPERS scandals both mainly involved:","o":["Excessive leverage in derivatives that pension staff did not understand or report to trustees","Pay-to-play and bribery involving placement agents and officials steering pension allocations","Misvaluation of real estate appraisals used to inflate reported pension fund returns","Front-running of client orders by internal traders managing the pension funds' equity portfolios"],"a":1,"e":"Both cases involved bribes, kickbacks and placement agents influencing which managers received pension capital, enabled by weak governance and oversight.","d":1},{"id":"ETH030","t":"ETH","r":"1.2.4","k":"c","q":"What common theme does the curriculum identify across the five case studies of ethical breaches?","o":["Excessive diversification, which made it impossible for boards to monitor all positions","A lack of appropriate checks and balances for those with power over investment decisions","Overreliance on passive investing, which removed accountability for investment decisions","Too much regulatory oversight, which pushed decision makers into opaque structures"],"a":1,"e":"A common theme is the lack of appropriate checks and balances (governance) for those with decision-making power, affecting both GPs and LPs.","d":2},{"id":"ETH031","t":"ETH","r":"1.1.2","k":"c","q":"The Brundtland Report's definition of sustainability, cited in the curriculum, refers to development that:","o":["Maximizes current GDP growth while compensating future generations through technological progress","Meets the needs of the present without compromising the ability of future generations to meet their own needs","Eliminates all carbon emissions immediately, regardless of the economic cost to current generations","Prioritizes shareholder returns, on the basis that wealth creation benefits all stakeholders over time"],"a":1,"e":"Sustainability, per the Brundtland Report (1987), meets the needs of the present without compromising the ability of future generations to meet their own needs.","d":2},{"id":"ETH032","t":"ETH","r":"1.1.1","k":"c","q":"Which group lists key participants of the investment industry identified in the curriculum?","o":["Asset owners, asset managers, consultants, brokers, investment banks, service providers and regulators","Only asset owners and asset managers, since other parties are outside the investment industry","Central banks, insurers and retail banks, which together control the allocation of savings","Corporations and governments that issue securities, along with the households that buy them"],"a":0,"e":"The key participants are asset owners, asset managers, consultants, brokers, investment banks, service providers and regulators, interacting in an ecosystem.","d":2},{"id":"ALT001","t":"ALT","r":"2.1.1","k":"c","q":"In the CAIA curriculum, what is the opposite of a real asset?","o":["An intangible asset","A financial asset","A liquid asset","A traditional asset"],"a":1,"e":"Real assets include tangible and intangible assets (e.g., patents, royalties) that directly facilitate production. The opposite of a real asset is a financial asset, i.e., a claim on cash flows such as a stock or bond.","d":1},{"id":"ALT002","t":"ALT","r":"2.1.1","k":"c","q":"According to the curriculum, a hedge fund is ultimately best described as:","o":["Any investment fund that charges a 2% management fee and a 20% incentive fee","A privately organized, less regulated legal structure distinct from traditional vehicles","A fund that always hedges its market risk so that returns are independent of equity markets","A publicly traded fund that uses leverage and derivatives to enhance returns for retail investors"],"a":1,"e":"Hedge funds are often associated with fees or risk levels, but ultimately a hedge fund is a legal structure: a privately organized, less regulated investment vehicle.","d":1},{"id":"ALT003","t":"ALT","r":"2.1.2","k":"c","q":"What is the key characteristic that differentiates private equity (alternative) from listed equities (traditional)?","o":["Private equity has higher expected returns, which is the defining feature of alternative investments","Listed equities trade on major exchanges and are available to the full range of investors; private equity is not","Private equity has no correlation with public equity, so it belongs to a separate asset class","Private equity always uses leverage, whereas listed equities are always financed with equity only"],"a":1,"e":"Traditional equities are listed on major stock exchanges and publicly available to all investors, whereas private equity is not.","d":2},{"id":"ALT004","t":"ALT","r":"2.1.3","k":"c","q":"Which of the following is generally considered an advantage of illiquid investments for long-horizon investors?","o":["Immediate access to capital","The potential to earn an illiquidity premium","Daily mark-to-market pricing","Lower due diligence costs"],"a":1,"e":"Investors with long horizons and limited liquidity needs can potentially earn a premium for bearing illiquidity, though illiquidity also brings risks (inability to rebalance, valuation uncertainty).","d":2},{"id":"ALT005","t":"ALT","r":"2.1.3","k":"c","q":"In the curriculum, a market is described as informationally efficient when:","o":["Transaction costs are zero, so that investors can trade instantly on any new information","Prices reflect available information so that abnormal returns cannot be consistently earned","All participants hold identical portfolios because they agree on the value of each security","Prices never change, because all relevant information was already known in the past"],"a":1,"e":"Informational efficiency means prices rapidly and fully reflect available information. Competition among participants and low transaction costs drive efficiency.","d":1},{"id":"ALT006","t":"ALT","r":"2.1.4","k":"c","q":"Which statement best describes an absolute return standard?","o":["Performance judged relative to a market benchmark, such as excess return over an equity index","Performance judged against a target that does not depend on market movements","Performance measured only in rising markets, ignoring periods in which the market declines","Returns measured before fees, so that the manager's skill can be isolated from costs"],"a":1,"e":"An absolute return standard evaluates performance against a target independent of markets. A relative return standard compares returns with a benchmark.","d":1},{"id":"ALT007","t":"ALT","r":"2.1.4","k":"c","q":"In its pure form, arbitrage is best defined as:","o":["A high-return, high-risk directional bet on the convergence of two unrelated asset prices","Buying and selling equivalent assets to earn a riskless profit from price differences","Any strategy whose returns show low volatility and low correlation with the equity market","Buying an asset and holding it until maturity in order to earn its yield without trading"],"a":1,"e":"Pure arbitrage is the simultaneous purchase and sale of equivalent assets to earn a riskless profit. Most 'arbitrage' strategies in practice carry some risk.","d":1},{"id":"ALT008","t":"ALT","r":"2.1.7","k":"c","q":"Which of the following is a sell-side participant?","o":["A university endowment","A large dealer bank","A defined benefit pension plan","A sovereign wealth fund"],"a":1,"e":"Sell-side participants (large dealer banks, brokers) facilitate trading and offer products. Plan sponsors, endowments, foundations and sovereign wealth funds are buy-side.","d":1},{"id":"ALT009","t":"ALT","r":"2.1.8","k":"c","q":"Which outside service provider typically offers hedge funds custody, securities lending, financing and trade clearing?","o":["Fund administrator","Prime broker","Auditor","Placement agent"],"a":1,"e":"Prime brokers provide clearing, custody, financing (margin), securities lending for short selling and reporting. Administrators handle NAV calculation and investor services.","d":2},{"id":"ALT010","t":"ALT","r":"2.2.1","k":"c","q":"What is the primary purpose of a master-feeder structure?","o":["To increase the fund's leverage by allowing the master fund to borrow against feeder fund assets","To pool investors with different tax situations into a single master portfolio","To avoid hiring a prime broker by settling all trades directly between feeder funds","To allow daily liquidity for all investors by listing the feeder funds on a stock exchange"],"a":1,"e":"Feeder funds organized for different investor tax profiles invest into a single master fund, allowing one portfolio to be managed efficiently.","d":1},{"id":"ALT011","t":"ALT","r":"2.2.1","k":"c","q":"A bankruptcy-remote special purpose vehicle (SPV) is designed mainly to:","o":["Increase the sponsor's credit rating by consolidating more assets on its balance sheet","Isolate assets so they are protected if the sponsor goes bankrupt","Allow investors to redeem their interests daily at the net asset value of the assets","Avoid all taxation on the income generated by the assets held in the vehicle"],"a":1,"e":"An SPV is a legal entity set up so its assets are insulated from the bankruptcy of the sponsor, which is key in securitization.","d":1},{"id":"ALT012","t":"ALT","r":"2.2.1","k":"c","q":"In a limited partnership, which party typically has unlimited liability and manages the fund?","o":["The limited partners","The general partner","The custodian","The auditor"],"a":1,"e":"The GP manages the partnership and bears unlimited liability (often through a limited liability entity), while LPs are passive investors with liability limited to their investment.","d":2},{"id":"ALT013","t":"ALT","r":"2.2.2","k":"c","q":"Which feature is characteristic of a drawdown (PE-style, closed-end) fund rather than an open-end fund?","o":["Investors can subscribe and redeem periodically at NAV","Investors make commitments that are called over time, with a finite fund life","Incentive fees are subject to a high-water mark","Management fees are always based on NAV"],"a":1,"e":"Drawdown funds use capital commitments called over an investment period and have a finite life (often ~10 years). Open-end (evergreen) funds allow periodic subscriptions and redemptions.","d":2},{"id":"ALT014","t":"ALT","r":"2.2.2","k":"c","q":"In an open-end hedge fund, the high-water mark ensures that:","o":["Management fees are waived in years in which the fund produces a negative return","Incentive fees are only paid on profits that bring NAV above its previous highest level","Investors cannot redeem their shares while the NAV is below the high-water mark","Leverage is capped once the fund's NAV reaches its previous highest level"],"a":1,"e":"The high-water mark prevents a manager from earning incentive fees twice on the same gains: losses must be recovered before new incentive fees are earned.","d":1},{"id":"ALT015","t":"ALT","r":"2.2.3","k":"c","q":"Which of the following is NOT one of the four key documents used to establish and maintain a private fund?","o":["Private placement memorandum","Limited partnership agreement","Subscription agreement","Form 10-K annual report"],"a":3,"e":"The four documents are the private placement memorandum, the partnership agreement, the subscription agreement, and the management company operating agreement.","d":2},{"id":"ALT016","t":"ALT","r":"2.2.3","k":"c","q":"In the context of private funds, adverse selection refers to:","o":["The risk that a manager takes more risk after receiving capital because its actions are unobservable","Lower-quality managers being disproportionately available because of hidden information","Investors selling their fund stakes in the secondary market at a discount to net asset value","A fund manager deliberately selecting assets with high correlation to the investor's other holdings"],"a":1,"e":"Adverse selection arises before contracting due to hidden information (e.g., lower-quality managers being more eager to raise capital). Moral hazard arises after contracting due to hidden actions.","d":1},{"id":"ALT017","t":"ALT","r":"2.2.3","k":"c","q":"A GP increases portfolio risk after the fund is raised because its carried interest behaves like a call option. This is an example of:","o":["Adverse selection","Moral hazard","Survivorship bias","Free riding"],"a":1,"e":"Moral hazard is the risk that a party changes behavior after an agreement, in ways that harm the other party, because its actions are not fully observable.","d":2},{"id":"ALT018","t":"ALT","r":"2.2.3","k":"c","q":"The EU framework that regulates managers of alternative investment funds (including marketing passports) is:","o":["MiFID","AIFMD","UCITS IV only","Dodd-Frank"],"a":1,"e":"The Alternative Investment Fund Managers Directive (AIFMD) regulates AIF managers in the EU. MiFID/MiFID II cover investment services and markets more broadly.","d":2},{"id":"ALT019","t":"ALT","r":"2.2.4","k":"c","q":"A key-person provision in a limited partnership agreement typically:","o":["Guarantees LPs a minimum return if named investment professionals stay with the fund until its end","Gives LPs rights (e.g., suspending investments) if named professionals leave","Sets the GP's management fee according to the number of senior professionals on the team","Prohibits LPs from transferring their interests while the key investment professionals remain"],"a":1,"e":"If named key persons leave, the investment period may be suspended or LPs may gain rights, protecting LPs who committed based on the team.","d":1},{"id":"ALT020","t":"ALT","r":"2.2.4","k":"c","q":"A 'no-fault divorce' clause in a PE-style fund allows:","o":["The GP to terminate LP commitments at will, without paying any compensation to the LPs","LPs, by a supermajority vote, to remove the GP or terminate the fund without proving cause","Investors to redeem their interests quarterly at NAV, without the GP's consent","The GP to extend the fund life indefinitely when market conditions are unfavorable for exits"],"a":1,"e":"A no-fault divorce clause lets LPs (usually with a supermajority) remove the GP or end the investment period without having to demonstrate misconduct.","d":1},{"id":"ALT021","t":"ALT","r":"2.2.5","k":"n","q":"A VC fund has $200 million of committed capital and charges a 2% annual management fee on committed capital. Only $80 million has been called so far. What is the annual management fee?","o":["$1.6 million","$2.0 million","$4.0 million","$5.0 million"],"a":2,"e":"Management fees in drawdown funds are typically charged on committed capital during the investment period: 2% × $200m = $4.0m, regardless of how much has been called.","d":2},{"id":"ALT022","t":"ALT","r":"2.2.5","k":"n","q":"A fund grows from $200 million to $300 million NAV over its life. With no hurdle rate and an 80/20 carried interest split, how much carried interest does the GP receive?","o":["$20 million","$40 million","$60 million","$100 million"],"a":0,"e":"Profit = $300m − $200m = $100m. Carried interest = 20% × $100m = $20m.","d":2},{"id":"ALT023","t":"ALT","r":"2.2.5","k":"c","q":"Compared with a deal-by-deal (American) waterfall, a fund-as-a-whole (European) waterfall:","o":["Lets the GP receive carried interest earlier, as soon as each individual deal is profitable","Returns all contributed capital (and usually the preferred return) to LPs before the GP receives carried interest","Removes the need for a hurdle rate, since LPs are repaid only at the end of the fund's life","Pays carried interest only on deals with losses, to compensate the GP for managing failures"],"a":1,"e":"In a whole-of-fund waterfall, LPs receive all contributed capital plus preferred return before carry. Deal-by-deal waterfalls pay carry earlier, increasing the need for clawback provisions.","d":2},{"id":"ALT024","t":"ALT","r":"2.2.5","k":"c","q":"What is the purpose of a catch-up provision in a private equity waterfall?","o":["To let LPs recover the management fees they paid before any carried interest is paid to the GP","After the preferred return is paid, to give the GP most distributions until it holds its full carry share of total profits","To return the GP's capital commitment first, before LPs receive any distributions from the fund","To penalize the GP when capital calls are late by reducing its share of future distributions"],"a":1,"e":"The catch-up lets the GP 'catch up' after the hurdle is met so that, in the end, the GP holds its full share (e.g., 20%) of total profits.","d":1},{"id":"ALT025","t":"ALT","r":"2.2.6","k":"n","q":"A fund invests $100 million and is worth $130 million one year later. Carried interest is 20% with an 8% hurdle. What is the carry under a HARD hurdle versus a SOFT hurdle (with full catch-up)?","o":["Hard: $6.0m; Soft: $4.4m","Hard: $4.4m; Soft: $6.0m","Hard: $4.4m; Soft: $4.4m","Hard: $6.0m; Soft: $6.0m"],"a":1,"e":"Hard hurdle: carry only on profit above the hurdle: 20% × ($30m − $8m) = $4.4m. Soft hurdle: once the hurdle is met, carry on all profits: 20% × $30m = $6.0m.","d":2},{"id":"ALT026","t":"ALT","r":"2.2.6","k":"n","q":"Over a fund's life, a GP received $10 million of carried interest from early deals. At final liquidation, the GP is entitled to only $6 million based on total fund performance. Under a clawback provision, how much must the GP return?","o":["$0","$4 million","$6 million","$10 million"],"a":1,"e":"The clawback requires the GP to return excess carry: $10m − $6m = $4m. Escrow accounts are often used to secure clawbacks.","d":2},{"id":"ALT027","t":"ALT","r":"2.2.7","k":"n","q":"A hedge fund with a starting NAV of $100 million earns a 15% gross return. It charges a 2% management fee on starting NAV and a 20% incentive fee on profits after the management fee (no hurdle, no prior losses). What is the investors' net return?","o":["10.4%","11.0%","12.0%","13.0%"],"a":0,"e":"Management fee = $2m. Profit after management fee = $15m − $2m = $13m. Incentive fee = 20% × $13m = $2.6m. Net to investors = $15m − $2m − $2.6m = $10.4m, i.e., 10.4%.","d":2},{"id":"ALT028","t":"ALT","r":"2.2.7","k":"n","q":"A fund's high-water mark is $100 million. NAV (after management fees) fell to $90 million last year and rose to $105 million this year. With a 20% incentive fee, what incentive fee is earned this year?","o":["$0","$1 million","$3 million","$4 million"],"a":1,"e":"Incentive fees apply only to gains above the high-water mark: 20% × ($105m − $100m) = $1m.","d":2},{"id":"ALT029","t":"ALT","r":"2.2.7","k":"c","q":"When a hedge fund falls far below its high-water mark, which behavior is a commonly cited concern?","o":["The manager becomes excessively conservative in all cases","The manager may increase risk to recover the HWM, or close the fund and restart","Management fees automatically stop","Investors are prohibited from redeeming"],"a":1,"e":"Deep below the HWM, the incentive fee option is far out of the money, creating incentives to raise volatility or to close the fund and launch a new one (resetting the HWM).","d":2},{"id":"ALT030","t":"ALT","r":"2.2.8","k":"n","q":"Using the at-the-money approximation, what is the value of a one-year 20% incentive fee on a $200 million hedge fund whose asset volatility is 10% per year?","o":["$0.8 million","$1.6 million","$4.0 million","$8.0 million"],"a":1,"e":"Approximate value ≈ 0.4 × NAV × incentive fee % × σ√T = 0.4 × $200m × 0.20 × 0.10 = $1.6m.","d":2},{"id":"ALT031","t":"ALT","r":"2.2.8","k":"c","q":"Under the option view of incentive fees, increasing the volatility of a fund's assets, all else equal:","o":["Decreases the value of the incentive fee","Increases the value of the incentive fee to the manager","Has no effect on the incentive fee","Eliminates the high-water mark"],"a":1,"e":"The incentive fee resembles a call option on fund assets; like any call, its value rises with volatility, creating a potential incentive for managers to take more risk.","d":2},{"id":"ALT032","t":"ALT","r":"2.3.1","k":"n","q":"An asset's price rises from 100 to 110 in one year. What is the continuously compounded (log) return?","o":["9.53%","10.00%","10.52%","11.00%"],"a":0,"e":"Log return = ln(110/100) = ln(1.10) = 9.53%. The discrete (simple) return is 10%.","d":2},{"id":"ALT033","t":"ALT","r":"2.3.2","k":"n","q":"An investor pays $100 for an investment that returns a single cash flow of $121 two years later. What is the IRR?","o":["5.0%","10.0%","10.5%","21.0%"],"a":1,"e":"Solve 100 = 121 / (1+IRR)^2 → (1+IRR)^2 = 1.21 → IRR = 10%.","d":2},{"id":"ALT034","t":"ALT","r":"2.3.3","k":"c","q":"Which of the following is a recognized problem with IRR?","o":["It ignores the time value of money, since cash flows are not discounted","Cash flow patterns with multiple sign changes can produce multiple IRRs or none","It cannot be computed for private equity funds, because they have no market prices","It always understates performance compared with time-weighted returns"],"a":1,"e":"Non-conventional cash flows (multiple sign changes) can produce multiple or no IRRs. IRR also assumes reinvestment at the IRR, is scale-insensitive and is hard to aggregate.","d":1},{"id":"ALT035","t":"ALT","r":"2.3.3","k":"c","q":"The IRR method implicitly assumes that interim cash flows are reinvested at:","o":["The risk-free rate","The cost of capital","The IRR itself","Zero"],"a":2,"e":"IRR implicitly assumes reinvestment of interim cash flows at the IRR, which may be unrealistic for very high IRRs. MIRR addresses this with an explicit reinvestment rate.","d":1},{"id":"ALT036","t":"ALT","r":"2.3.4","k":"c","q":"Which statement about time-weighted versus dollar-weighted returns is correct?","o":["Time-weighted returns are affected by the timing of investor cash flows and are used in private equity","Dollar-weighted returns suit cases where the manager controls cash flows, as in PE","Both measures always give the same answer when the fund's cash flows are known with certainty","Dollar-weighted returns are used for mutual funds because investors, not managers, control flows"],"a":1,"e":"Dollar-weighted returns (IRR) are influenced by cash-flow timing, appropriate when the manager controls them (PE). Time-weighted returns remove the effect of investor flows, appropriate for funds where investors control flows.","d":1},{"id":"ALT037","t":"ALT","r":"2.3.5","k":"n","q":"A PE fund has paid-in capital of $50m, has distributed $40m, and has a residual NAV of $35m. What are its DPI and TVPI?","o":["DPI 0.70; TVPI 1.50","DPI 0.80; TVPI 1.50","DPI 0.80; TVPI 0.70","DPI 1.50; TVPI 0.80"],"a":1,"e":"DPI = distributions / paid-in = 40/50 = 0.80. RVPI = 35/50 = 0.70. TVPI = DPI + RVPI = 1.50.","d":2},{"id":"ALT038","t":"ALT","r":"2.3.5","k":"c","q":"The Public Market Equivalent (PME) method is used to:","o":["Value a private company using only the trading multiples of comparable public companies","Compare private fund performance with what the same cash flows would have earned if invested in a public index","Estimate the fund's management fee as a percentage of the value of an equivalent public index","Convert private equity IRRs into time-weighted returns comparable to hedge fund returns"],"a":1,"e":"PME compares private fund cash flows against a public index by hypothetically investing contributions and withdrawing distributions in the index.","d":1},{"id":"ALT039","t":"ALT","r":"2.3.6","k":"c","q":"Why do private equity funds typically exhibit a J-curve?","o":["Early distributions are high because the best investments are exited first, followed by losses","Fees and conservative accounting cause early losses before investments mature","Leverage is used only at the end of the fund's life, which increases returns in later years","All commitments are called at once on day one, so early returns are diluted by idle cash"],"a":1,"e":"Fees and expenses, plus accounting conservatism (recognizing losses quickly and deferring gains), make early returns negative before value creation and exits lift returns.","d":1},{"id":"ALT040","t":"ALT","r":"2.3.7","k":"c","q":"A fully collateralized futures position means that:","o":["The position requires no margin because the clearinghouse guarantees both sides of the trade","Cash equal to the notional principal is held as collateral, so the return can be computed on a non-zero base","The futures contract must be settled by physical delivery rather than in cash at expiration","The position is fully hedged with an offsetting futures contract on the same underlying asset"],"a":1,"e":"Since a forward/futures contract has zero initial value, returns are computed by assuming full collateralization: cash equal to the notional value earns the riskless rate plus the derivative's price change.","d":1},{"id":"ALT041","t":"ALT","r":"2.4.2","k":"c","q":"A distribution with excess kurtosis greater than zero is called:","o":["Platykurtic","Mesokurtic","Leptokurtic","Symmetric"],"a":2,"e":"Leptokurtic distributions (positive excess kurtosis) have fat tails relative to the normal distribution. Mesokurtic has excess kurtosis of 0; platykurtic is negative.","d":1},{"id":"ALT042","t":"ALT","r":"2.4.2","k":"c","q":"A return distribution with a long left tail (large infrequent losses) has:","o":["Positive skewness","Negative skewness","Zero kurtosis","Zero variance"],"a":1,"e":"Negative skewness means the left tail is longer: occasional large losses, typical of strategies like merger arbitrage or selling options.","d":1},{"id":"ALT043","t":"ALT","r":"2.4.2","k":"c","q":"The third and fourth moments of a return distribution are, respectively:","o":["Variance and skewness","Skewness and kurtosis","Mean and variance","Kurtosis and covariance"],"a":1,"e":"The first four moments are mean, variance, skewness and kurtosis.","d":1},{"id":"ALT044","t":"ALT","r":"2.4.3","k":"n","q":"Asset A has a standard deviation of 20%, asset B of 15%, and their covariance is 0.012. What is their correlation?","o":["0.30","0.40","0.60","0.80"],"a":1,"e":"Correlation = Cov / (σA × σB) = 0.012 / (0.20 × 0.15) = 0.012 / 0.03 = 0.40.","d":2},{"id":"ALT045","t":"ALT","r":"2.4.3","k":"c","q":"The Spearman rank correlation coefficient is particularly useful because it:","o":["Requires normally distributed data, which makes it more precise than the Pearson coefficient","Is based on ranks and is therefore less sensitive to outliers and captures monotonic, non-linear relationships","Always equals the Pearson correlation coefficient when the sample contains more than 30 observations","Measures the volatility of each variable rather than the strength of their relationship"],"a":1,"e":"Spearman's coefficient correlates the ranks of observations, reducing the influence of outliers and capturing monotonic relationships.","d":1},{"id":"ALT046","t":"ALT","r":"2.4.4","k":"n","q":"The covariance between a fund's returns and the market is 0.018 and the market's standard deviation is 15%. What is the fund's beta?","o":["0.12","0.80","1.20","1.25"],"a":1,"e":"Beta = Cov(i,m) / Var(m) = 0.018 / 0.15² = 0.018 / 0.0225 = 0.80.","d":2},{"id":"ALT047","t":"ALT","r":"2.4.4","k":"n","q":"A return series has a first-order autocorrelation of 0.30. What is the approximate Durbin-Watson statistic?","o":["0.60","1.40","2.00","2.60"],"a":1,"e":"DW ≈ 2 × (1 − ρ) = 2 × 0.70 = 1.40. Values near 2 indicate no autocorrelation; below 2 indicate positive autocorrelation.","d":2},{"id":"ALT048","t":"ALT","r":"2.4.5","k":"a","q":"A portfolio has an expected annual return of 8% and a standard deviation of 10%. Assuming normality, approximately two-thirds of annual returns should fall between:","o":["−2% and 18%","−12% and 28%","3% and 13%","0% and 16%"],"a":0,"e":"About 68% of outcomes fall within ±1 standard deviation of the mean: 8% ± 10% → −2% to 18%.","d":2},{"id":"ALT049","t":"ALT","r":"2.4.5","k":"c","q":"If returns are independent over time, how does the standard deviation scale with the time horizon T?","o":["Linearly with T","With the square root of T","With T squared","It does not change"],"a":1,"e":"Variance scales with T for independent returns, so standard deviation scales with √T (e.g., annual σ ≈ monthly σ × √12).","d":2},{"id":"ALT050","t":"ALT","r":"2.4.6","k":"n","q":"A sample of 60 monthly returns has skewness of −0.5 and excess kurtosis of 2.0. What is the Jarque-Bera statistic, and is normality rejected at the 5% level (critical value ≈ 5.99)?","o":["2.5; not rejected","12.5; rejected","12.5; not rejected","25.0; rejected"],"a":1,"e":"JB = n × [S²/6 + K²/24] = 60 × [0.25/6 + 4/24] = 60 × 0.2083 = 12.5 > 5.99, so normality is rejected.","d":2},{"id":"ALT051","t":"ALT","r":"2.4.6","k":"c","q":"Which of the following is one of the three main reasons cited for non-normality in alternative investment returns?","o":["Low transaction costs, frequent trading and deep, liquid markets","Autocorrelation, illiquidity or nonlinearity (e.g., options)","High market efficiency, diversification and the moderate use of leverage","Daily pricing, stable volatility and linear exposures (e.g., futures)"],"a":1,"e":"The three main causes are autocorrelation, illiquidity and nonlinearity (option-like payoffs).","d":2},{"id":"ALT052","t":"ALT","r":"2.5.1","k":"c","q":"Which form of informational market efficiency states that prices reflect all publicly available information?","o":["Weak form","Semistrong form","Strong form","Efficient inefficiency"],"a":1,"e":"Weak form: past prices. Semistrong form: all public information. Strong form: all information, including private information.","d":2},{"id":"ALT053","t":"ALT","r":"2.5.1","k":"c","q":"The concept of 'efficient inefficiency' suggests that markets are:","o":["Perfectly efficient, so no manager can earn returns that cover the costs of research","Inefficient just enough to reward skilled managers for their costs, but no more","Completely inefficient, so any investor can earn abnormal returns without special skill","Efficient only in alternative asset classes, where information is widely available"],"a":1,"e":"Efficient inefficiency: competition drives prices close to efficient, but enough inefficiency remains to reward those who incur costs to gather and act on information.","d":1},{"id":"ALT054","t":"ALT","r":"2.5.2","k":"n","q":"What is the price of a 3-year zero-coupon bond with a $100 face value if the 3-year annually compounded spot rate is 5%?","o":["$85.00","$86.38","$95.24","$115.76"],"a":1,"e":"Price = 100 / 1.05³ = 100 / 1.157625 = $86.38.","d":2},{"id":"ALT055","t":"ALT","r":"2.5.3","k":"n","q":"The 1-year spot rate is 4% and the 2-year spot rate is 5% (annual compounding). What is the implied 1-year forward rate one year from now?","o":["4.50%","5.00%","6.01%","9.20%"],"a":2,"e":"(1.05)² / (1.04) − 1 = 1.1025 / 1.04 − 1 = 6.01%.","d":2},{"id":"ALT056","t":"ALT","r":"2.5.4","k":"n","q":"A stock trades at $100 and in one period will be either $120 or $80. Interest rates are zero. What is the value of a one-period call with a $100 strike using risk-neutral valuation?","o":["$5","$10","$15","$20"],"a":1,"e":"Risk-neutral probability of up: p = (100 − 80)/(120 − 80) = 0.5. Call payoffs: 20 (up), 0 (down). Value = 0.5 × 20 = $10.","d":2},{"id":"ALT057","t":"ALT","r":"2.5.5","k":"n","q":"A bond portfolio has a modified duration of 5. If yields rise by 1%, the approximate change in value is:","o":["−1%","−5%","+5%","−0.5%"],"a":1,"e":"%ΔP ≈ −Modified duration × Δy = −5 × 1% = −5%.","d":2},{"id":"ALT058","t":"ALT","r":"2.5.5","k":"c","q":"The duration of a floating-rate note that resets to market rates is approximately:","o":["Equal to its maturity","The time until the next coupon reset","Zero at all times regardless of reset","Equal to that of a fixed-rate bond of the same maturity"],"a":1,"e":"A floater's price returns to par at each reset, so its interest rate sensitivity is approximately that of a zero-coupon bond maturing at the next reset date.","d":1},{"id":"ALT059","t":"ALT","r":"2.5.6","k":"n","q":"An exposure of $10 million has a 2% probability of default and a 60% loss given default. What is the expected credit loss?","o":["$40,000","$120,000","$200,000","$600,000"],"a":1,"e":"Expected loss = PD × LGD × exposure = 0.02 × 0.60 × $10m = $120,000.","d":2},{"id":"ALT060","t":"ALT","r":"2.5.6","k":"c","q":"How do reduced-form credit models differ from structural models?","o":["Reduced-form models derive default from the firm's asset value falling below its liabilities","Reduced-form models treat default as a random event whose intensity is calibrated to market prices","Reduced-form models ignore credit spreads and rely only on historical default rates","The two approaches are identical, since both model the firm's capital structure explicitly"],"a":1,"e":"Structural models (e.g., Merton) model default via the firm's assets relative to liabilities. Reduced-form models model default probability directly, calibrated to observed prices.","d":1},{"id":"ALT061","t":"ALT","r":"2.5.7","k":"n","q":"The risk-free rate is 3%, the expected market risk premium is 6%, and a stock's beta is 1.5. What is its expected return under the CAPM?","o":["9.0%","10.5%","12.0%","13.5%"],"a":2,"e":"E(R) = Rf + β × (E(Rm) − Rf) = 3% + 1.5 × 6% = 12.0%.","d":2},{"id":"ALT062","t":"ALT","r":"2.5.8","k":"c","q":"Heteroskedasticity in a regression refers to:","o":["Correlation of residuals over time, so that each error is related to the previous one","Residuals whose variance is not constant across observations","The use of multiple independent variables that are highly correlated with each other","A regression that perfectly fits the data, with an R-squared equal to one"],"a":1,"e":"Heteroskedasticity means the variance of the error term changes across observations, which can make standard errors and significance tests unreliable. Autocorrelation is correlation of residuals over time.","d":1},{"id":"ALT063","t":"ALT","r":"2.5.9","k":"c","q":"A Type I error occurs when a researcher:","o":["Fails to reject a false null hypothesis","Rejects a true null hypothesis","Accepts a true alternative hypothesis","Uses too large a sample"],"a":1,"e":"Type I error: rejecting a true null (e.g., concluding a manager has alpha when they do not). Type II error: failing to reject a false null.","d":1},{"id":"ALT064","t":"ALT","r":"2.5.9","k":"n","q":"A manager's estimated monthly alpha is 0.5% with a standard error of 0.2%. Using a critical value of about 2, what do you conclude?","o":["t = 0.4; alpha is not significant","t = 2.5; alpha is statistically significant","t = 2.5; alpha is not significant","t = 0.1; alpha is significant"],"a":1,"e":"t = 0.5% / 0.2% = 2.5, which exceeds ≈2, so the null of zero alpha is rejected at about the 5% level.","d":2},{"id":"ALT065","t":"ALT","r":"2.5.10","k":"c","q":"A hedge fund database includes only funds that are still reporting, excluding those that closed after poor performance. This creates:","o":["Backfill bias","Survivorship bias","Data dredging","Chumming"],"a":1,"e":"Survivorship bias arises when failed funds drop out of the sample, overstating average performance. Backfill bias comes from adding a fund's favorable historical returns when it joins a database.","d":2},{"id":"ALT066","t":"ALT","r":"2.5.10","k":"c","q":"Testing many trading rules on the same data set until one appears profitable is best described as:","o":["Cherry-picking","Data dredging (data mining)","Survivorship bias","Appraisal smoothing"],"a":1,"e":"Data dredging/mining searches extensively through data for patterns, producing spurious results that are unlikely to persist out of sample.","d":2},{"id":"ALT067","t":"ALT","r":"2.6.1","k":"c","q":"Which of the following is a key difference between futures and forward contracts?","o":["Forwards are standardized and exchange-traded, while futures are customized over-the-counter contracts","Futures are marked to market daily through a clearinghouse, reducing counterparty risk","Futures cannot be cash-settled and always require physical delivery of the underlying asset","Forwards require daily variation margin, while futures are settled only at expiration"],"a":1,"e":"Futures are standardized, exchange-traded and marked to market daily with margin, reducing counterparty risk. Forwards are customized OTC contracts settled at maturity.","d":1},{"id":"ALT068","t":"ALT","r":"2.6.1","k":"n","q":"A trader posts $5,000 initial margin on a futures position with a $4,000 maintenance margin. The position loses $1,500. What is the variation margin call?","o":["$0","$500","$1,000","$1,500"],"a":3,"e":"The account falls to $3,500, below the $4,000 maintenance margin, so the trader must restore it to the initial margin of $5,000: a call of $1,500.","d":2},{"id":"ALT069","t":"ALT","r":"2.6.4","k":"n","q":"A commodity's spot price is $50. The continuously compounded riskless rate is 4%, storage costs are 2% and the convenience yield is 1% (all annual, continuous). What is the 1-year forward price?","o":["$51.51","$52.56","$53.09","$55.26"],"a":1,"e":"F = S × e^((r + c − y)T) = 50 × e^(0.04 + 0.02 − 0.01) = 50 × e^0.05 = $52.56.","d":2},{"id":"ALT070","t":"ALT","r":"2.6.4","k":"c","q":"Why is the cost-of-carry formula less reliable for physical commodities than for financial assets?","o":["Physical commodities have no storage costs, so the formula overstates forward prices","Shorting physical commodities is hard, and storage costs and convenience yields are hard to measure","Forward contracts on commodities cannot be settled in cash or by physical delivery","Interest rates have no effect on commodity forward prices, unlike financial forwards"],"a":1,"e":"Physical assets face difficult short selling, non-tradable convenience yields and hard-to-measure storage costs, so arbitrage bounds are looser than for financial assets.","d":2},{"id":"ALT071","t":"ALT","r":"2.6.6","k":"n","q":"A non-dividend stock trades at $100. A 1-year European call with a $100 strike is worth $10 and the continuously compounded riskless rate is 5%. What is the value of the put with the same strike and maturity?","o":["$4.88","$5.12","$10.00","$14.88"],"a":1,"e":"Put-call parity: C − P = S − K·e^(−rT). P = 10 − 100 + 100·e^(−0.05) = 10 − 100 + 95.12 = $5.12.","d":2},{"id":"ALT072","t":"ALT","r":"2.6.6","k":"c","q":"A long straddle (long call and long put with the same strike and expiration) profits mainly when:","o":["The underlying price stays near the strike while implied volatility falls","The underlying makes a large move in either direction or volatility rises","Interest rates fall, increasing the value of both the call and the put","The underlying drifts slowly upward and volatility declines steadily"],"a":1,"e":"A straddle is long volatility: it gains from large moves either way and loses time value if the price stays near the strike.","d":2},{"id":"ALT073","t":"ALT","r":"2.6.6","k":"c","q":"A collar on a long stock position combines:","o":["A long call and a short put","A long put and a short call","Two long calls","A short straddle"],"a":1,"e":"A collar buys a protective put and finances it by selling an out-of-the-money call, limiting both downside and upside.","d":1},{"id":"ALT074","t":"ALT","r":"2.6.7","k":"n","q":"A borrower holds a $10 million interest rate cap with a 4% cap rate and quarterly settlement. The reference rate sets at 5%. What is the cap payment for the quarter (ignore day count adjustments)?","o":["$10,000","$25,000","$50,000","$100,000"],"a":1,"e":"Payment = notional × (rate − cap rate) × period = $10m × 1% × 0.25 = $25,000.","d":2},{"id":"ALT075","t":"ALT","r":"2.6.8","k":"c","q":"Which option sensitivity measures the change in delta for a change in the underlying price?","o":["Vega","Theta","Gamma","Rho"],"a":2,"e":"Gamma is the second derivative of option value with respect to the underlying, i.e., the rate of change of delta.","d":2},{"id":"ALT076","t":"ALT","r":"2.6.8","k":"c","q":"Vega measures an option's sensitivity to changes in:","o":["Time to expiration","Volatility of the underlying","Interest rates","The underlying price"],"a":1,"e":"Vega is the sensitivity to volatility. Theta: time; rho: interest rates; delta: underlying price.","d":1},{"id":"ALT077","t":"ALT","r":"2.7.1","k":"c","q":"Which risk measure focuses only on returns below a target, such as zero or the mean?","o":["Standard deviation of all returns around the mean","Semivariance / downside deviation","Beta of returns relative to the market portfolio","R-squared from a regression of returns on a benchmark"],"a":1,"e":"Semivariance and downside deviation consider only outcomes below a target, appropriate when investors care mostly about downside risk.","d":1},{"id":"ALT078","t":"ALT","r":"2.7.1","k":"c","q":"Maximum drawdown measures:","o":["The average monthly loss","The largest peak-to-trough decline in value over a period","The standard deviation of negative returns","The worst daily return"],"a":1,"e":"Maximum drawdown is the largest cumulative loss from a peak to a subsequent trough, a key risk measure for hedge funds and CTAs.","d":1},{"id":"ALT079","t":"ALT","r":"2.7.2","k":"n","q":"A $100 million portfolio has an annual standard deviation of 10% and an expected return of zero. Assuming normality, what is the one-year 95% VaR (z = 1.645)?","o":["$10.00 million","$16.45 million","$19.60 million","$23.30 million"],"a":1,"e":"VaR = z × σ × value = 1.645 × 10% × $100m = $16.45m.","d":2},{"id":"ALT080","t":"ALT","r":"2.7.2","k":"c","q":"A key limitation of parametric VaR is that it:","o":["Cannot be computed for portfolios of several assets, only for individual securities","Says nothing about the size of losses beyond the VaR threshold and may understate fat-tailed risks","Requires that all assets in the portfolio be traded daily on organized exchanges","Always overstates risk because it assumes that returns follow a fat-tailed distribution"],"a":1,"e":"VaR gives a threshold loss at a confidence level but not the magnitude of tail losses; with fat tails, normal-based VaR understates risk. Conditional VaR addresses tail size.","d":1},{"id":"ALT081","t":"ALT","r":"2.7.4","k":"n","q":"A fund earns 12% with a 20% standard deviation; the riskless rate is 2%. What is its Sharpe ratio?","o":["0.40","0.50","0.60","1.00"],"a":1,"e":"Sharpe = (Rp − Rf) / σ = (12% − 2%) / 20% = 0.50.","d":2},{"id":"ALT082","t":"ALT","r":"2.7.4","k":"n","q":"A fund earns 12%, the riskless rate is 2% and its beta is 1.25. What is the Treynor ratio?","o":["6.0%","8.0%","9.6%","12.5%"],"a":1,"e":"Treynor = (Rp − Rf) / β = 10% / 1.25 = 8.0%.","d":2},{"id":"ALT083","t":"ALT","r":"2.7.4","k":"n","q":"A fund outperforms its benchmark by 3% per year with a tracking error of 6%. What is its information ratio?","o":["0.18","0.50","2.00","3.00"],"a":1,"e":"Information ratio = active return / tracking error = 3% / 6% = 0.50.","d":2},{"id":"ALT084","t":"ALT","r":"2.7.4","k":"c","q":"The Sortino ratio differs from the Sharpe ratio in that it:","o":["Uses beta in place of standard deviation, measuring only systematic risk","Uses downside deviation below a target instead of total standard deviation","Ignores the risk-free rate and divides the total return by standard deviation","Is used only for bond portfolios, where returns are measured relative to a yield"],"a":1,"e":"Sortino = (Rp − target) / downside deviation, penalizing only harmful volatility.","d":1},{"id":"ALT085","t":"ALT","r":"2.7.6","k":"n","q":"A fund returns 12%. The riskless rate is 2%, the market returns 9%, and the fund's beta is 1.2. What is Jensen's alpha?","o":["0.0%","1.6%","3.0%","4.4%"],"a":1,"e":"Required return = 2% + 1.2 × (9% − 2%) = 10.4%. Alpha = 12% − 10.4% = 1.6%.","d":2},{"id":"ALT086","t":"ALT","r":"2.7.8","k":"c","q":"Timberland and farmland indices are based on appraisals and show very low volatility and tiny drawdowns. What should an analyst do before using them in an asset allocation model?","o":["Use the reported volatility as is, since appraisals are performed by independent experts","Adjust the risk estimates upward, since smoothing makes reported volatility artificially low","Reduce the reported volatility further to reflect the long holding periods of these assets","Replace the returns with those of an equity index, since real assets track equities closely"],"a":1,"e":"Appraisal-based returns are smoothed and autocorrelated, so they understate true volatility and correlations. Analysts should adjust for this artificially low volatility before using the estimates in allocation models.","d":2},{"id":"ALT087","t":"ALT","r":"2.7.8","k":"c","q":"Price smoothing in appraisal-based returns tends to:","o":["Overstate volatility and understate correlation with public markets","Understate volatility and correlation with public markets and create positive autocorrelation","Have no effect on measured risk","Create negative autocorrelation"],"a":1,"e":"Smoothing lags true values, dampening measured volatility and correlations and inducing positive autocorrelation, making assets look less risky than they are.","d":1},{"id":"RA001","t":"RA","r":"3.1.1","k":"c","q":"Why do equities of natural resource producers often provide imperfect exposure to the underlying commodity?","o":["They are always fully hedged with futures, so their returns track only interest rates","Their returns also reflect operating, management, extraction and equity market risks","They pay no dividends, so investors receive only the commodity's price appreciation","They are not traded on exchanges, so their prices are based on infrequent appraisals"],"a":1,"e":"Producer equities carry firm-specific operational risks and broad equity market beta, so their returns can diverge substantially from the underlying commodity price.","d":2},{"id":"RA002","t":"RA","r":"3.1.2","k":"c","q":"Undeveloped land is often analyzed as which type of instrument?","o":["A fix
